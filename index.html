<title>Siegelrolle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a hand scroll (makimono). Roster rail of hanko seals on the left, the open scroll on the right.
   Section names run vertically in kanji beside their German label. */
:root{
  --washi:#f1ece1; --washi-2:#e8e0cf; --paper:#faf7f0;
  --sumi:#1d1a17; --sumi-2:#4a443d; --sumi-3:#7b7268;
  --shu:#b8321f; --shu-soft:#b8321f1f;
  --ai:#24365c; --ai-soft:#24365c14;
  --kin:#9b7a2f;
  --line:#1d1a1726;
  --ok:#3f6b3a; --warn:#a0641a;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --washi:#121522; --washi-2:#1a1f31; --paper:#181c2c;
  --sumi:#ece6d8; --sumi-2:#c3bbaa; --sumi-3:#8d8676;
  --shu:#e0553d; --shu-soft:#e0553d26; --ai:#9fb4e0; --ai-soft:#9fb4e01c; --kin:#cfae5e;
  --line:#ece6d826; --ok:#8fbd84; --warn:#e0a85a; color-scheme:dark}}
:root[data-theme="dark"]{
  --washi:#121522; --washi-2:#1a1f31; --paper:#181c2c;
  --sumi:#ece6d8; --sumi-2:#c3bbaa; --sumi-3:#8d8676;
  --shu:#e0553d; --shu-soft:#e0553d26; --ai:#9fb4e0; --ai-soft:#9fb4e01c; --kin:#cfae5e;
  --line:#ece6d826; --ok:#8fbd84; --warn:#e0a85a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--washi);color:var(--sumi);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 20% 10%,var(--ai-soft),transparent 40%),radial-gradient(circle at 90% 80%,var(--shu-soft),transparent 35%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;font-weight:700}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px;padding-block:24px}
/* roster rail */
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{writing-mode:vertical-rl;font-family:var(--f-disp);font-size:26px;font-weight:800;letter-spacing:.08em;line-height:1;color:var(--shu)}
.brand .t{font-family:var(--f-disp);font-size:20px;font-weight:800;line-height:1.1}
.brand .s{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sumi-3)}
.roster{display:flex;flex-direction:column;gap:6px}
.rbtn{display:flex;align-items:center;gap:10px;padding:8px 8px;border:1px solid transparent;border-radius:var(--r);background:none;cursor:pointer;text-align:left;width:100%}
.rbtn:hover{background:var(--paper)}
.rbtn[aria-current="true"]{background:var(--paper);border-color:var(--line)}
.rbtn .nm{font-weight:700;display:block;line-height:1.2}
.rbtn .sub{font-size:12px;color:var(--sumi-3)}
.hanko{flex:none;display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--shu);color:var(--shu);border-radius:6px;font-family:var(--f-disp);font-weight:800;font-size:15px;line-height:1;transform:rotate(-3deg);background:var(--paper)}
.hanko.big{width:88px;height:88px;font-size:30px;border-width:3px;border-radius:10px}
.hanko.v{writing-mode:vertical-rl}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:var(--r);border:1px solid var(--sumi);background:var(--sumi);color:var(--washi);cursor:pointer;font-weight:700;letter-spacing:.02em}
.btn:hover{background:var(--shu);border-color:var(--shu)}
.btn.ghost{background:transparent;color:var(--sumi)}
.btn.ghost:hover{border-color:var(--shu);color:var(--shu);background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.status{font-size:12px;color:var(--sumi-3)}
.status b{color:var(--sumi-2)}
/* main scroll */
.scroll{background:var(--paper);border:1px solid var(--line);border-radius:4px;min-width:0;position:relative;
  box-shadow:0 1px 0 var(--line),0 18px 40px -28px #0006}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:10px;background:var(--ai);border-radius:5px;opacity:.85}
.scroll::before{top:-5px}.scroll::after{bottom:-5px}
.inner{padding:30px clamp(16px,4vw,44px) 40px}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}
.head h1{font-size:clamp(28px,4vw,40px);line-height:1.1}
.head .meta{color:var(--sumi-2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sumi-2);background:var(--washi)}
.chip.shu{border-color:var(--shu);color:var(--shu);background:transparent}
.lvl{text-align:center}
.lvl .n{font-family:var(--f-disp);font-size:44px;font-weight:800;line-height:1;color:var(--shu)}
.lvl .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sumi-3)}
.tabs{display:flex;gap:2px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--sumi-3);font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.tab .k{font-family:var(--f-disp);font-size:13px;color:var(--sumi-3)}
.tab[aria-selected="true"]{color:var(--sumi);border-bottom-color:var(--shu)}
.tab[aria-selected="true"] .k{color:var(--shu)}
.panel{padding-top:24px}
.sec{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;margin-bottom:28px}
.sec>.vt{writing-mode:vertical-rl;font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--shu);letter-spacing:.2em;border-right:1px solid var(--shu);padding-right:8px;justify-self:end}
.sec h2{font-size:20px;margin-bottom:10px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sumi-3);font-weight:700}
/* abilities */
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ab{border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 8px;text-align:center;background:var(--washi)}
.ab .a{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--sumi-3)}
.ab .m{font-family:var(--f-disp);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ab .s{font-size:13px;color:var(--sumi-2);font-variant-numeric:tabular-nums}
.ab.save{border-color:var(--shu)}
.ab .sv{font-size:11px;color:var(--shu);font-weight:700}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.vital{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--washi)}
.vital .big{font-family:var(--f-disp);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.vital .big small{font-size:15px;color:var(--sumi-3);font-weight:500}
.vital .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--shu)}
.bar.ai>i{background:var(--ai)}
.num{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.skills{columns:2;column-gap:22px}
.sk{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line);break-inside:avoid;font-size:14px}
.sk.p{font-weight:700}
.sk.p span:first-child::before{content:"●";color:var(--shu);font-size:9px;margin-right:6px;vertical-align:2px}
.sk span:last-child{font-variant-numeric:tabular-nums;color:var(--sumi-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--sumi-3);font-weight:700}
.kv dd{margin:0}
/* features */
.feat{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:12px}
.feat .lv{font-family:var(--f-disp);font-weight:800;color:var(--shu)}
.feat .src{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sumi-3);margin-left:8px}
.feat p{margin:4px 0;max-width:72ch}
.feat.new{border-left-color:var(--shu)}
.txt p{margin:6px 0;max-width:74ch}
.txt h4{font-family:var(--f-disp);font-size:16px;margin:16px 0 4px}
.tblw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sumi-3)}
details{border-top:1px solid var(--line);padding:10px 0}
details>summary{cursor:pointer;font-family:var(--f-disp);font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details>summary::after{content:"＋";color:var(--shu)}
details[open]>summary::after{content:"－"}
/* inventory */
.inv{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.it .n{font-weight:700}
.it .d{font-size:12.5px;color:var(--sumi-3)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.iconb{border:0;background:none;cursor:pointer;color:var(--sumi-3);font-size:16px;padding:4px 6px}
.iconb:hover{color:var(--shu)}
.eq{font-size:12px;display:flex;gap:4px;align-items:center;color:var(--sumi-2)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.addrow input,.addrow select,.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);min-width:0}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.catb{border:1px solid var(--line);border-radius:var(--r);background:var(--washi);padding:8px 10px;text-align:left;cursor:pointer}
.catb:hover{border-color:var(--shu)}
.catb b{display:block}
.catb small{color:var(--sumi-3)}
.gold{display:flex;align-items:center;gap:10px}
.coin{width:30px;height:30px;border-radius:50%;border:2px solid var(--kin);display:grid;place-items:center;color:var(--kin);font-family:var(--f-disp);font-weight:800;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:min(960px,100%);max-height:100%;overflow:auto;padding:26px clamp(16px,3vw,32px)}
.dlg h2{font-size:24px}
.steps{display:flex;gap:16px;margin:8px 0 18px;font-size:13px;color:var(--sumi-3);flex-wrap:wrap}
.steps .on{color:var(--shu);font-weight:700}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.choice{border:1px solid var(--line);border-radius:var(--r);background:var(--washi);padding:14px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.choice .kj{font-family:var(--f-disp);font-size:30px;font-weight:800;line-height:1.1}
.choice .nm{font-weight:700}
.choice .sm{font-size:12px;color:var(--sumi-3)}
.choice[aria-pressed="true"]{border-color:var(--shu);box-shadow:inset 0 0 0 1px var(--shu)}
.choice[aria-pressed="true"] .kj{color:var(--shu)}
.choice:disabled{opacity:.35;cursor:not-allowed}
.grp{font-family:var(--f-disp);font-size:15px;color:var(--sumi-3);margin:18px 0 8px;display:flex;gap:10px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.preview{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--sumi-2)}
.abin{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.abin .field input{width:100%;text-align:center;font-variant-numeric:tabular-nums}
.abin .tot{font-size:12px;color:var(--sumi-3);text-align:center}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--washi);cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.note{font-size:13px;color:var(--sumi-3);max-width:70ch}
.warn{color:var(--warn)}
.empty{display:grid;place-items:center;text-align:center;padding:60px 16px;gap:18px}
.empty h1{font-size:clamp(28px,5vw,46px)}
.seals{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:620px}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pc{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--washi);display:flex;gap:12px}
.pc .who{font-size:12px;color:var(--sumi-3)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:8px 16px;border-radius:99px;font-size:13px;z-index:60}
.pbleft{display:inline-flex;gap:8px;align-items:baseline;margin:4px 0 10px;font-size:14px;color:var(--sumi-2)}
.pbleft .n{font-family:var(--f-disp);font-size:30px;font-weight:800;color:var(--shu);font-variant-numeric:tabular-nums}
.pbleft.done .n{color:var(--ok)}
.pbrow{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--washi);padding:4px}
.pbb{width:30px;height:30px;border:0;border-radius:var(--r);background:var(--paper);cursor:pointer;font-weight:700}
.pbb:disabled{opacity:.3;cursor:not-allowed}
.pbv{font-family:var(--f-disp);font-size:22px;font-weight:800;min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.catb .wt{display:flex;justify-content:space-between;gap:6px;margin-top:4px;font-size:12px;color:var(--sumi-2);font-variant-numeric:tabular-nums}
.src{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--sumi-3)}
.src.s-doc{border-color:var(--ok);color:var(--ok)}.src.s-vorschlag{border-color:var(--warn);color:var(--warn)}
.iw{font-size:13px;color:var(--sumi-2);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.vital.over{border-color:var(--shu)}
.lrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:8px 0;border-bottom:1px solid var(--line)}
.lf{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--sumi-3);font-weight:700;flex:0 1 auto;min-width:0}
.lf.wide{flex:1 1 200px}
.lf input,.lf select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-size:14px;font-weight:400;color:var(--sumi);min-width:0}
.wheelwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:center;margin:8px 0 18px}
.wheel{position:relative;width:220px;height:220px;max-width:100%;border-radius:50%;border:1px dashed var(--line)}
.wheel .el{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:52px;padding:4px 0;border-radius:6px;border:1px solid var(--line);background:var(--washi)}
.wheel .el b{font-family:var(--f-disp);font-size:20px;line-height:1.1}
.wheel .el small{font-size:10px;color:var(--sumi-3)}
.wheel .el.on{border-color:var(--shu);background:var(--shu);color:var(--paper)}
.wheel .el.on small{color:var(--paper)}
.wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.wheel .hub b{font-family:var(--f-disp);font-size:30px;color:var(--ai);display:block;line-height:1}
.wheel .hub small{font-size:11px;color:var(--sumi-3)}
@media (max-width:560px){.wheelwrap{grid-template-columns:minmax(0,1fr)}.wheel{margin:0 auto}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px}
  .rail{position:static}
  .roster{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .rbtn{width:auto;flex:none}
  .abil{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vitals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .head{grid-template-columns:auto minmax(0,1fr)}
  .head .lvl{grid-column:1/-1;text-align:left;display:flex;gap:10px;align-items:baseline}
  .abin{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:480px){.skills{columns:1}.sec{grid-template-columns:minmax(0,1fr)}.sec>.vt{display:none}.it{grid-template-columns:minmax(0,1fr) auto auto auto}.it .eq{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.hanko{transition:transform .2s}.rbtn:hover .hanko{transform:rotate(0)}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark">巻物</span><div><div class="t">Siegelrolle</div><div class="s">Das gebrochene Siegel</div></div></div>
    <button class="btn" id="newBtn" type="button">＋ Neuer Charakter</button>
    <nav class="roster" id="roster" aria-label="Deine Charaktere"></nav>
    <button class="btn ghost small" id="partyBtn" type="button">団 Gruppe ansehen</button>
    <button class="btn ghost small" id="importBtn" type="button">⇪ Charakter aus PDF importieren</button>
    <div class="status" id="status">Lädt …</div>
  </aside>
  <main class="scroll"><div class="inner" id="main"></div></main>
</div>
<div id="modalRoot"></div>
<script type="application/json" id="data">{"races": [{"id": "mensch", "name": "Mensch", "kanji": "人", "group": "Mensch", "attr": "Attribute: +1 auf zwei Attribute deiner Wahl. · Mittelgroß, 30 ft.", "bonus": {}, "choose": 2, "levels": {"1": [{"t": "Erbe der Eskorte. Du gehörst einem der beiden Clans an. Du erhältst Proficiency mit einem Skill oder einem Werkzeug deiner Wahl, das zu deinem Clan passt."}, {"t": "Unverdächtig. Izanamis Ruf erreicht dich nicht, und du bist in Akt II keinem Generalverdacht ausgesetzt."}, {"t": "Zäh. Deine Hit Point Maximum steigt um 1 pro Charakterstufe."}, {"t": "Indomitable Human Spirit. Fallen deine Hit Points auf 0, während du noch mindestens 1 Soul HP hast, kannst du einmal pro Long Rest sofort mit 1 Hit Point zurückkehren, ohne dass es dich eine Action kostet. Dabei wählst du einen Gegner, der noch im Combat steht. Solange er im Combat bleibt, fallen deine Hit Points nie unter 1, und bei dir pausiert die periodische Soul-HP-Drainage durch Corruption — Corruption selbst bleibt bestehen und geht weiterhin nur an einem echten Schrein weg. Verlässt der Gegner das Combat (flieht oder stirbt), kollabierst du: Du wirst unconscious und beginnst deine Death Saving Throws mit bereits zwei fehlgeschlagenen Würfen."}, {"t": "Gruppen-Deckel: In einer Gruppe von bis zu drei Charakteren kann höchstens EIN Indomitable Human Spirit gleichzeitig aktiv sein; ab vier Charakteren höchstens ZWEI. Greift die Fähigkeit deswegen nicht, bleibt der Mensch unconscious und würfelt normale Death Saving Throws."}], "5": [{"t": "Indomitable Human Spirit — Zweites Ziel. Du wählst jetzt bis zu zwei Gegner statt einem. Der Schutz hält, solange mindestens einer von ihnen im Combat bleibt."}], "10": [{"t": "Indomitable Human Spirit — Ein Fehlschlag weniger. Kollabierst du, beginnst du deine Death Saving Throws jetzt mit nur noch einem bereits fehlgeschlagenen Wurf, statt zwei."}], "11": [{"t": "Indomitable Human Spirit — Ohne Soul HP. Du brauchst kein verbleibendes Soul HP mehr, um diese Fähigkeit auszulösen."}], "15": [{"t": "Indomitable Human Spirit — Drittes Ziel. Du wählst jetzt bis zu drei Gegner."}], "20": [{"t": "Indomitable Human Spirit — Ohne Furcht vor dem Tod. Kollabierst du, beginnst du deine Death Saving Throws ohne einen bereits fehlgeschlagenen Wurf."}]}}, {"id": "kitsune", "name": "Kitsune", "kanji": "狐", "group": "Wandler", "attr": "Attribute: +2 CHA, +1 DEX. · Mittelgroß, 30 ft.", "bonus": {"cha": 2, "dex": 1}, "choose": 0, "levels": {"1": [{"t": "Fuchsfeuer. Du kennst den Cantrip Produce Flame; er verursacht bei dir psychischen statt Feuerschaden. CHA ist dein Zauberattribut."}, {"t": "Trugbild. Als Bonus Action erschaffst du ein flüchtiges Trugbild deiner selbst in 15 ft. Der nächste Angriff gegen dich hat Disadvantage. Einmal pro Short Rest."}, {"t": "Fuchsblut. Advantage auf Saving Throws gegen Illusionen. Deine Schwänze — einer zu Beginn — verraten dich in Menschengestalt nur, wenn du unachtsam bist."}], "4": [{"t": "Zwillingstrugbild. Einmal pro Long Rest erschaffst du als Action zwei Klone deiner selbst. Sie folgen deinen Befehlen, teilen deine aktuellen Hit Points als eigenen Pool, deine Werte und jede deiner Fähigkeiten, die nicht an eine bestimmte Schwanzzahl gebunden ist. Sie lösen sich nach 30 Minuten auf, am Ende eines Kampfes oder wenn ihre Hit Points auf 0 fallen."}, {"t": "Geteilter Vorrat: Klone haben KEINE eigenen Ressourcen. Was ein Klon ausgibt, fehlt dir."}], "7": [{"t": "Flammenmeisterung. Jeder Zauber, den du wirkst und der Fire Damage verursacht — Fuchsfeuer eingeschlossen — verursacht insgesamt einmal zusätzlich 3d6 Fire Damage, unabhängig davon, wie viele Kreaturen der Zauber trifft."}, {"h": "Die Flamme wird echt"}, {"t": "Zauberattribut, DC, Angriffswurf: CHA. Saving-Throw-DC ist 8 + Proficiency Bonus + CHA-Modifier, Angriffswurf ist Proficiency Bonus + CHA-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung, jeder Zauber wirkt auf seiner Grundstufe."}, {"t": "| Ab Stufe | Zauber | Nutzung |"}, {"t": "| 7 | Burning Hands | 1× pro Short Rest |"}, {"t": "| 7 | Scorching Ray | 1× pro Long Rest |"}, {"t": "| 11 | Fireball | 1× pro Long Rest |"}, {"t": "| 15 | Wall of Fire | 1× pro Long Rest |"}, {"t": "| 19 | Delayed Blast Fireball | 1× pro Long Rest |"}], "10": [{"t": "Seelenfalle. Einmal pro Long Rest versuchst du als Action, eine Kreatur, die dich sehen und hören kann, in eine Illusion einzusperren — eine Trugwelt, die genau das zeigt, was sie sich am meisten wünscht oder am meisten fürchtet."}, {"t": "Saving Throw: WIS-Saving Throw gegen 8 + Proficiency Bonus + CHA-Modifier. Bei Erfolg durchschaut sie den Betrug sofort und ist 24 Stunden immun gegen einen erneuten Versuch von dir."}, {"t": "Bei Misserfolg: Sie ist in der Illusion gefangen, bis der DM entscheidet, dass ihr Geist bricht. Dann wird sie zu einer geistlosen Hülle — bewusstlos, willenlos, 1 Hit Point, unfähig zu handeln oder sich zu wehren."}], "13": [{"t": "Kitsune-Grausamkeit. Bringt einer deiner Angriffe eine Kreatur auf 0 Hit Points und verursachst du dabei mehr Schaden, als ihre verbliebenen Hit Points betrugen, absorbierst du 1d4 ihrer Soul HP — sofern sie welche hat. Du heilst dich selbst um dieselbe Zahl Soul HP, bis zu deinem Maximum."}], "15": [{"t": "Meisterin der Illusion. Trugbild lädt sich jetzt dreimal pro Short Rest auf statt einmal. Zwillingstrugbild und Seelenfalle sind jetzt je dreimal pro Long Rest nutzbar statt einmal."}], "18": [{"t": "Schwanzgeborene. Einmal pro Kampf machst du als Bonus Action einen deiner Schwänze zu einem vollständigen, unabhängigen Klon deiner selbst — mit deinen aktuellen Hit Points als eigenem Pool, deinen Werten und allen Fähigkeiten, die nicht an eine Schwanzzahl gebunden sind. Er handelt auf deiner Initiative, direkt nach dir, und bleibt aktiv, bis der Kampf endet, du ihn zurückziehst oder seine Hit Points auf 0 fallen."}], "19": [{"t": "Göttliche Illusionistin. Seelenfalle kannst du jetzt an bis zu 40 Kreaturen gleichzeitig versuchen — die Begrenzung auf einmal pro Long Rest entfällt für diese Fähigkeit. Als Action erschaffst du bis zu 10 Trugbilder gleichzeitig statt eines."}, {"t": "Vergeltung. Verfehlt dich ein Angriff, darfst du als Reaction einen Angriff gegen den Angreifer ausführen. Du darfst auf diese Weise höchstens 9 zusätzliche Angriffe pro Runde ausführen."}], "20": [{"t": "Kyubi. Einmal pro Long Rest rufst du als Action verbündete Kitsune herbei. Sie erscheinen in 30 ft. um dich und handeln auf deiner Initiative. Die Summe ihrer Schwänze darf höchstens 9 betragen; keine der herbeigerufenen Kitsune darf selbst neun Schwänze haben. Sie bleiben, bis der Kampf endet oder eine Stunde vergeht."}]}}, {"id": "tanuki", "name": "Tanuki", "kanji": "狸", "group": "Wandler", "attr": "Attribute: +2 CHA, +1 CON. · Mittelgroß, 30 ft.", "bonus": {"cha": 2, "con": 1}, "choose": 0, "levels": {"1": [{"t": "Blätterwandel. Als Action nimmst du für eine Stunde die Gestalt einer beliebigen humanoiden Person an, die du gesehen hast, oder eines gewöhnlichen Gegenstands deiner Größe. Zweimal pro Long Rest."}, {"t": "Glücksbauch. Einmal pro Long Rest darfst du einen Wurf wiederholen, den du gerade misslungen hast."}, {"t": "Unbekümmert. Proficiency mit Deception oder Performance, deine Wahl."}], "3": [{"t": "Instinkt des Tanuki. Betrittst du zum ersten Mal einen Ort mit Menschen, darfst du den DM fragen, ob es dort Menschen mit Sorgen gibt. Der DM nennt dir alle in 100 ft. Umkreis — nicht was ihre Sorge ist, nur dass es sie gibt und ungefähr wo."}], "5": [{"t": "Glücksbringer. Einmal pro Long Rest gilt: Landest du einen Critical Hit gegen eine kleine oder mittelgroße Kreatur, vervierfacht sich dein Schaden — statt der üblichen Verdopplung bei einem Critical Hit."}], "7": [{"t": "Unbekümmertes Leben. Schließt die Gruppe eine Quest ab, würfelst du einen d20. Das Ergebnis bestimmt eine zusätzliche Belohnung, die nur du erhältst."}, {"t": "| Wurf | Belohnung |"}, {"t": "| 1 | Nichts. |"}, {"t": "| 2–5 | 2d10 gp, gefunden oder zugesteckt. |"}, {"t": "| 6–8 | Ein Kontakt: ein NPC, der dir ab jetzt einen Gefallen schuldet. |"}, {"t": "| 9–11 | Ein Gerücht, das später wichtig wird. |"}, {"t": "| 12–14 | Ein kleiner magischer Gegenstand oder gleichwertiges Werkzeug (Common). |"}, {"t": "| 15–17 | Ein besserer magischer Gegenstand (Uncommon) oder ein handfester Vorteil. |"}, {"t": "| 18–19 | Ein seltener magischer Gegenstand (Rare) oder eine Verbindung zu Macht. |"}, {"t": "| 20 | Der DM entscheidet frei — etwas, das die Kampagne wirklich verschiebt. |"}], "9": [{"t": "Tanukis Haste. Deine Speed steigt auf 60 ft."}, {"h": "Der Wind trägt dich"}, {"t": "Zauberattribut, DC, Angriffswurf: CHA. Saving-Throw-DC ist 8 + Proficiency Bonus + CHA-Modifier, Angriffswurf ist Proficiency Bonus + CHA-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Ab Stufe | Zauber | Nutzung |"}, {"t": "| 9 | Feather Fall | 1× pro Short Rest |"}, {"t": "| 9 | Gust of Wind | 1× pro Long Rest |"}, {"t": "| 15 | Wind Wall | 1× pro Long Rest |"}, {"t": "| 19 | Control Winds | 1× pro Long Rest |"}], "11": [{"t": "Glücksgriff. Machst du einen Long Rest, würfle bei dessen Beginn einen d20. Wachst du auf, erhältst du Gold Pieces in Höhe des Ergebnisses."}], "13": [{"t": "Luck Boost. Du erhältst +2 CHA und +2 CON (üblicher Deckel bei 20)."}], "15": [{"t": "Hundert Gestalten. Blätterwandel hält jetzt bis zu 8 Stunden statt einer Stunde. Zusätzlich darfst du dabei einen mitgeführten Gegenstand passend mitverwandeln."}], "17": [{"t": "Verteiltes Glück. Glücksbauch ist jetzt zweimal pro Long Rest nutzbar. Du darfst eine der beiden Anwendungen an einen Verbündeten in 30 ft. abtreten, um dessen misslungenen Wurf zu wiederholen, statt deinen eigenen."}], "20": [{"t": "Der Glücklichste. Dein Critical-Hit-Bereich erweitert sich auf 18–20."}, {"t": "Stapelt es mit Klassenfeatures? Nein — hat deine Klasse selbst einen erweiterten Crit-Bereich, gilt der jeweils größere der beiden Bereiche, nicht die Summe."}]}}, {"id": "oni", "name": "Oni", "kanji": "鬼", "group": "Wandler", "attr": "Attribute: +2 STR, +1 CON. · Mittelgroß (aber schwer), 30 ft.", "bonus": {"str": 2, "con": 1}, "choose": 0, "levels": {"1": [{"t": "Oni ni Kanabō. Deine unbewaffneten Schläge verursachen 1d6 Bludgeoning Damage. Deine Trageleistung verdoppelt sich. Du hast Proficiency mit dem Kanabō, und sein Nachteil gegen kleine Kreaturen gilt für dich nicht."}, {"t": "Riesenblut. Advantage auf Saving Throws gegen grappled und prone. Du kannst Waffen für große Kreaturen ohne Nachteil führen."}, {"t": "Wächter der Hölle. Proficiency mit Intimidation. Eine Kreatur, die du frightened gemacht hast, kann sich dir nicht freiwillig nähern."}], "3": [{"t": "Monströse Stärke. Du zählst als eine Größenkategorie größer, wenn es um Tragen, Schieben, Ziehen, Heben und Grapple geht. Zusätzlich erhältst du +1 auf Attack Rolls mit Waffen und unbewaffneten Angriffen, die Slashing oder Bludgeoning Damage verursachen."}], "5": [{"t": "Hannya-Zorn. 1× pro Long Rest, Bonus Action: Dein Gesicht wird zur Hannya-Fratze, und du gerätst in Zorn."}, {"t": "Zorn. Dauer: 3 deiner Züge, gezählt ab dem Zug, in dem du ihn auslöst. Dreifacher Schlag: Dein erster Waffen- oder unbewaffneter Treffer im Zorn verursacht dreifachen Schaden (würfle normal, verdreifache das Ergebnis) — einmal pro Zorn, nicht für Strength of Many oder Oni Trajectory. Zwang: Zu Beginn jedes deiner Züge im Zorn musst du dich der nächsten Kreatur nähern und sie angreifen, ausgenommen Kreaturen, die du beim Auslösen benennst; ist niemand erreichbar, handelst du frei. Ende: nach 3 Zügen, wenn keine Kreatur mehr erreichbar ist, oder wenn du bewusstlos wirst."}], "7": [{"t": "Gozu und Mezu. Trifft eine Kreatur in deiner Reichweite einen Verbündeten in 5 ft. von dir, kannst du als Reaction einen Melee-Angriff gegen sie ausführen. Proficiency-Bonus-mal pro Long Rest."}], "9": [{"t": "Monströse Wut. Solange du im Zorn bist, verursachen deine Angriffe zusätzlich 1d20 Schaden vom selben Typ. Einmal pro deinem Zug im Zorn nimmst du dafür 3d10 Rückstoßschaden — nicht pro Angriff. Deine Hit Points können dadurch nicht unter 1 fallen. Hannya-Zorn kannst du ab jetzt 2× pro Long Rest auslösen."}], "11": [{"t": "Strength of Many. Du kannst eine Kreatur in 10 ft. greifen, die höchstens eine Größe größer ist als du (Grapple-Contest: dein STR (Athletics) gegen ihr STR (Athletics) oder DEX (Acrobatics)). Gelingt es, führst du sie als improvisierte Waffe. Bis zu dreimal pro Short Rest darfst du damit als Melee Attack (STR) ein Ziel angreifen: Bei einem Treffer verursacht sie 2d20 + STR-Modifier Bludgeoning Damage am Ziel; die geschwungene Kreatur nimmt die Hälfte davon."}], "13": [{"t": "Bringer des Unheils. 1× pro Short Rest, Action: Jede Kreatur deiner Wahl in 30 ft. macht einen WIS-Saving Throw gegen DC 8 + Proficiency Bonus + STR-Modifier oder ist 1 Minute lang frightened (Save am Ende jedes ihrer Züge). Deine Treffer gegen frightened Kreaturen verursachen zusätzlich 1d8 Psychic Damage."}], "15": [{"t": "Oni Trajectory. Du kannst eine mit Strength of Many ergriffene Kreatur als Wurfgeschoss verwenden, mit einer Reichweite von 2 × deine STR (als Score) in ft. Bis zu dreimal pro Short Rest darfst du damit als Ranged Attack (STR) ein Ziel angreifen: Bei einem Treffer verursacht sie 2d20 + STR-Modifier Bludgeoning Damage am Ziel; die geworfene Kreatur nimmt dabei unabhängig vom Ausgang 1d20 Bludgeoning Damage und liegt danach prone."}], "17": [{"t": "Raijins Trommel. 1× pro Short Rest, Action: Jede Kreatur deiner Wahl in 20 ft. macht einen CON-Saving Throw gegen DC 8 + Proficiency Bonus + STR-Modifier: bei Misserfolg 4d10 Thunder Damage und prone, bei Erfolg halber Schaden."}], "19": [{"t": "Hannyas Klauen. Solange du im Zorn bist, nimmt ein Ziel, das du triffst, zusätzlich Necrotic Damage in Höhe deines STR-Modifiers."}], "20": [{"t": "Strength Beyond Reason. Deine STR und CON steigen je um 4, der Deckel liegt für dich bei 24. Hannya-Zorn lädt sich bei jedem Short Rest auf. Strength of Many und Oni Trajectory funktionieren gegen Kreaturen bis Huge."}]}}, {"id": "tengu", "name": "Tengu", "kanji": "天狗", "group": "Wandler", "attr": "Attribute: +2 DEX, +1 WIS. · Mittelgroß, 30 ft.", "bonus": {"dex": 2, "wis": 1}, "choose": 0, "levels": {"1": [{"t": "Schwingen. Du hast Federn an Armen oder Rücken. Du fällst nie schneller als 60 ft. pro Runde und nimmst keinen Fallschaden. Ab Stufe 5 erhältst du eine Flugbewegungsrate von 30 ft., solange du keine schwere Rüstung trägst."}, {"t": "Bergschule. Proficiency mit einer Waffe deiner Wahl."}, {"t": "Scharfer Blick. Proficiency mit Perception."}], "3": [{"t": "Schüler der Waffen. Du erhältst Proficiency mit einer weiteren Waffe deiner Wahl, zusätzlich zu der aus Bergschule."}], "5": [{"t": "Federschlag. Während du fliegst, kannst du als Bonus Action eine Feder werfen: Ranged Attack (Proficiency Bonus + DEX-Modifier) gegen eine Kreatur in 10 ft. um den Punkt am Boden direkt unter dir. Bei einem Treffer 1d8 Piercing Damage."}], "7": [{"t": "Schule der Gerechten. Greifst du eine Kreatur mit Evil Alignment an, verursachst du 1d6 zusätzlichen Schaden vom selben Typ wie dein Angriff."}], "9": [{"t": "Waffengelehrter. Du erhältst Proficiency mit einer weiteren Waffe deiner Wahl."}], "11": [{"t": "Krieger der Lüfte. Verfehlst du mit einem Angriff, darfst du sofort — ohne weitere Action oder Bonus Action — zu einer anderen Waffe wechseln, mit der du Proficiency hast, und den Angriff einmal wiederholen. Einmal pro Kampf."}], "13": [{"t": "Scharfsinniger Blick. Advantage auf Perception Checks."}], "15": [{"t": "Master Flyer. Deine Flugbewegungsrate steigt auf 90 ft. Du fliegst jetzt auch in Heavy Armor."}], "17": [{"t": "Meister der Berge. In bergigem Gelände hast du Advantage auf Attack Rolls gegen Kreaturen, die nicht fliegen können."}], "19": [{"t": "Waffenmeister. Du hast Proficiency mit allen Waffen."}], "20": [{"t": "Schwingenmeister. Der Radius von Federschlag steigt von 10 ft. auf 100 ft. Krieger der Lüfte ist jetzt fünfmal pro Kampf nutzbar statt einmal. Deine Flugbewegungsrate steigt auf 120 ft."}]}}, {"id": "kappa", "name": "Kappa", "kanji": "河童", "group": "Wandler", "attr": "Attribute: +2 CON, +1 STR. · Klein oder mittelgroß, 30 ft., Schwimmen 30 ft.", "bonus": {"con": 2, "str": 1}, "choose": 0, "levels": {"1": [{"t": "Die Schale. Auf deinem Kopf sitzt eine Schale mit Wasser. Solange sie gefüllt ist, kannst du unter Wasser atmen und hast Advantage auf STR-Würfe. Wird sie geleert (Action eines Gegners, der dich grappled hat), verlierst du beides bis du sie neu füllst."}, {"t": "Ringkämpfer. Advantage auf Würfe, um jemanden zu grappeln oder zu Boden zu werfen."}, {"t": "Unbedingte Höflichkeit. Verbeugt sich jemand vor dir, musst du dich zurückverbeugen — auch mitten im Kampf. Der DM darf das erzwingen."}], "3": [{"t": "Zauberattribut, DC, Angriffswurf: CON. Saving-Throw-DC ist 8 + Proficiency Bonus + CON-Modifier, Angriffswurf ist Proficiency Bonus + CON-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Ab Stufe | Zauber | Nutzung |"}, {"t": "| 3 | Fog Cloud | 1× pro Short Rest |"}, {"t": "| 3 | Water Walk | 1× pro Long Rest |"}, {"t": "| 9 | Wall of Water (Xanathar’s Guide) | 1× pro Long Rest |"}, {"t": "| 13 | Control Water | 1× pro Long Rest |"}, {"t": "| 19 | Tsunami | 1× pro Long Rest |"}], "5": [{"t": "Bewegung des Wassers. Deine Schwimmbewegungsrate steigt auf 60 ft."}], "7": [{"t": "Nicht unbedingte Höflichkeit. Einmal pro Long Rest darfst du dich weigern, dich zurückzuverbeugen, wenn sich jemand vor dir verbeugt."}], "9": [{"t": "Unfairer Kampf. Grappelst du eine Kreatur, darfst du als Bonus Action mit deinen Fäusten zuschlagen: dein normaler unbewaffneter Schlag plus 1d8 zusätzlicher Schaden. Zusätzlich hat die Kreatur Disadvantage auf Würfe, sich aus diesem Grapple zu befreien."}], "11": [{"t": "Tarnung. Im Wasser hast du Advantage auf Stealth Checks. Bist du dabei unentdeckt und grappelst als deine erste Handlung im Kampf eine Kreatur in der Nähe von Wasser, gilt sie als surprised."}], "13": [{"t": "Schalenwacht. Versucht ein Gegner, deine Schale von deinem Kopf zu entfernen, muss er einen CON-Saving Throw gegen DC 16 bestehen. Bei Misserfolg erleidet er 1d10 Psychic Damage, und du darfst sofort eine Opportunity Attack gegen ihn ausführen."}], "15": [{"t": "Doppelgriff. Du kannst gleichzeitig bis zu zwei kleine oder mittelgroße Kreaturen grappeln. Behandle jeden Grapple für alle Zwecke separat."}], "17": [{"t": "Quelle der Schale. Deine Wassermagie benötigt keine externe Wasserquelle mehr, falls ein Zauber normalerweise eine verlangt."}], "19": [{"t": "Schalengeysir. Als Action entlädst du deine Schale wie einen Decanter of Water auf Stufe „Geysir\": In einem Umkreis von 5 ft. um einen Punkt in 30 ft. schießt eine Wasserfontäne hoch. Jede Kreatur darin macht einen STR-Saving Throw gegen 8 + Proficiency Bonus + CON-Modifier. Bei Misserfolg 2d6 Bludgeoning Damage und die Kreatur ist prone; bei Erfolg kein Schaden und nicht prone."}, {"t": "Kosten: Die Fähigkeit verbraucht das Wasser deiner Schale vollständig."}], "20": [{"t": "Meister des Wassers und Ringens. Selbst wenn deine Schale leer ist, hast du weiterhin Advantage auf STR Checks. Du musst dich nicht mehr zurückverbeugen, wenn sich jemand vor dir verbeugt. Grappelst du eine Kreatur, verursachen deine Angriffe gegen sie zusätzlich 1d20 Schaden."}]}}, {"id": "bakeneko", "name": "Bakeneko", "kanji": "化け猫", "group": "Wandler", "attr": "Attribute: +2 DEX, +1 CHA. · Klein oder mittelgroß, 40 ft., Klettern 30 ft.", "bonus": {"dex": 2, "cha": 1}, "choose": 0, "levels": {"1": [{"t": "Katzensinn. Darkvision 60 ft. Proficiency mit Stealth oder Acrobatics."}, {"t": "Totennähe. Du spürst, ob in 30 ft. jemand innerhalb des letzten Tages gestorben ist, und wo. Du siehst Geister, die sich verbergen, als wären sie sichtbar."}, {"t": "Neun Leben (1/Long Rest). Fällst du auf 0 Hit Points, bleibst du stattdessen bei 1 stehen."}], "3": [{"t": "Katzenglück. Fällst du, machst du automatisch einen DEX-Saving Throw gegen DC 15 — keine Action nötig. Bei Erfolg landest du auf den Füßen und nimmst keinen Fallschaden."}], "5": [{"t": "Katzenform. Einmal pro Long Rest nimmst du als Action die Gestalt einer gewöhnlichen Katze an, für bis zu 8 Stunden oder bis du die Form freiwillig aufgibst. Du wirst Tiny, erhältst eine Speed von 40 ft. und eine Klettern-Speed von 30 ft. Deine eigenen Werte, Hit Points, Sprache und Fähigkeiten bleiben unverändert."}], "7": [{"t": "Krallen. Einmal pro Kampf kannst du als Action mit Katzenkrallen angreifen: Melee Attack (Proficiency Bonus + DEX-Modifier), bei einem Treffer 5d4 Slashing Damage."}], "9": [{"t": "Katzensprache. Du verstehst gewöhnliche Katzen, und sie verstehen dich. Das reicht für einfache Mitteilungen — nicht für Befehle."}], "11": [{"t": "Geisterzunge. Geister, die du durch Totennähe siehst, kannst du auch verstehen und mit ihnen sprechen."}], "13": [{"t": "Zweites Leben. Neun Leben ist jetzt zweimal pro Long Rest nutzbar. Beim zweiten Mal in derselben Rast erhältst du zusätzlich die Hälfte deines Hit Point Maximums zurück, statt nur bei 1 Hit Point stehen zu bleiben."}], "15": [{"t": "Krallenhagel. Krallen ist jetzt dreimal pro Kampf nutzbar, statt einmal."}], "17": [{"t": "Verwandtenblick. Du erkennst andere Bakeneko instinktiv — auch in Menschengestalt, auch wenn sie sich verstecken. Das erfordert keinen Wurf."}], "19": [{"t": "Katzenbefehl. Gewöhnliche Katzen befolgen einfache, kurze Bitten von dir, sofern die Bitte sie nicht in Gefahr bringt."}], "20": [{"t": "Queen of the Cats — Nachtsicht und Dauerform. Nachts hast du Advantage auf Stealth Checks. Katzenform hält jetzt, solange du willst, ohne Zeitlimit, und ist beliebig oft nutzbar."}, {"t": "Queen of the Cats — Krallen. Krallen ist jetzt zehnmal pro Kampf nutzbar."}, {"t": "Queen of the Cats — Katzenvolk. Du verstehst gewöhnliche Katzen vollständig und kannst sie für dich Dinge sammeln lassen."}, {"t": "Queen of the Cats — Die Glöckchen. Begegnest du einem Bakeneko mit niedrigerer Stufe als du, kannst du es fragen, sich dir als Verbündeter zu binden. Stimmt es zu, formst du ein Glöckchen aus seinem Halsband; du kannst bis zu 10 solcher Glöckchen gleichzeitig tragen. Als Action läutest du eines: Das gebundene Bakeneko erscheint in 10 ft. um dich und handelt auf deiner Initiative, bis du es zurückrufst oder es auf 0 Hit Points fällt — dann kehrt es unverletzt zu seinem Glöckchen zurück und braucht einen Long Rest, bevor es erneut gerufen werden kann. Es zählt zu jeder Zeit höchstens EIN gerufenes Bakeneko gleichzeitig."}]}}, {"id": "yukionna", "name": "Yuki-onna", "kanji": "雪女", "group": "Wandler", "attr": "Attribute: +2 CHA, +1 WIS. · Mittelgroß, 30 ft.", "bonus": {"cha": 2, "wis": 1}, "choose": 0, "levels": {"1": [{"t": "Kalt. Resistance gegen Cold Damage. Kälte und Wetter setzen dir nicht zu; du brauchst keine warme Kleidung und hinterlässt keine Spuren im Schnee."}, {"t": "Frostatem. Du kennst den Cantrip Ray of Frost. CHA ist dein Zauberattribut."}, {"t": "Das gegebene Wort. Wenn du jemandem etwas versprichst und es hältst, gewinnst du 1 Soul HP zurück. Brichst du es, verlierst du 2. Nur einmal pro Long Rest."}], "3": [{"t": "DC, Angriffswurf: Saving-Throw-DC ist 8 + Proficiency Bonus + CHA-Modifier, Angriffswurf ist Proficiency Bonus + CHA-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Ab Stufe | Zauber | Nutzung |"}, {"t": "| 3 | Armor of Agathys | 1× pro Short Rest |"}, {"t": "| 3 | Ice Knife (Xanathar’s Guide) | 1× pro Long Rest |"}, {"t": "| 9 | Sleet Storm | 1× pro Long Rest |"}, {"t": "| 13 | Ice Storm | 1× pro Long Rest |"}, {"t": "| 19 | Cone of Cold | 1× pro Long Rest |"}], "5": [{"t": "Bergschritt. In schneebedecktem Bergland ignorierst du Difficult Terrain durch Schnee und Eis, und deine Speed steigt dort um 50 ft."}, {"t": "Lawinenruf (1/Long Rest). In demselben Gelände kannst du als Action eine kleine Lawine auslösen und sofort absorbieren. Dein nächster Zauber aus Eismagie oder Frostatem in derselben Stunde verursacht zusätzlich 3d6 Cold Damage."}], "7": [{"t": "Schneeillusion. Als Action manifestierst du Schnee in einem 50-ft-Radius um dich, für 1 Minute. Betritt eine Kreatur den Bereich zum ersten Mal oder beginnt ihren Zug dort, macht sie einen CON-Saving Throw gegen DC 15. Bei Misserfolg gilt der Bereich für sie als Difficult Terrain, und sie erleidet 1d4 Cold Damage zu Beginn ihres Zuges, solange sie darin steht."}], "9": [{"t": "Eiswaffe (1/Short Rest). Als Bonus Action conjurierst du eine Waffe aus Schnee und Eis, die 1 Minute hält oder bis du sie auflöst. Melee Attack (Proficiency Bonus + CHA-Modifier); bei einem Treffer verursacht sie CHA-Modifier in d6 Cold Damage (mindestens 1d6)."}], "11": [{"t": "Snowgrave. Als Action versuchst du, eine Kreatur, die du sehen kannst, einzufrieren. Sie macht einen CON-Saving Throw. Ist ihr Ergebnis kleiner als 8, stirbt sie. Ist ihr Ergebnis 8 oder höher, ist sie für 1d4 ihrer Züge eingefroren: restrained, Speed 0, kann keine Actions oder Reactions ausführen."}, {"t": "Ausnahme — Menschen: Bei einer menschlichen Kreatur ersetzt „stirbt sie\" durch „fällt auf 0 Soul HP und bricht\" (Kegare). Der Eisfrost-Ausgang bei Ergebnis 8+ bleibt für Menschen unverändert."}], "13": [{"t": "Eisige Gegenwart. Jeder Cold Damage, den du verursachst, erhöht sich insgesamt einmal um 3d6 — unabhängig davon, wie viele Kreaturen der Angriff oder Zauber trifft."}], "15": [{"t": "Schneemonstrosität (1/Long Rest). Als Action beschwörst du eine Schneemonstrosität in 10 ft. um dich: AC 14, 50 Hit Points. Sie ist 1d6 Züge lang aktiv. Solange sie aktiv ist, wird jeder Angriff, der dich träfe, automatisch stattdessen gegen sie umgeleitet."}, {"t": "Wenn sie endet. Fallen ihre Hit Points auf 0, oder läuft ihre Dauer ab, entlädt sie sofort den gesamten umgeleiteten Schaden als Cold Damage auf die nächste feindliche Kreatur in 30 ft."}], "17": [{"t": "Eisiges Herz. Cold Damage, den du erleiden würdest, fügt dir stattdessen keinen Schaden zu — du heilst dich um denselben Betrag, bis zu deinem Hit Point Maximum."}], "19": [{"t": "Der eisige Schwur. Das gegebene Wort ist jetzt fünfmal pro Long Rest nutzbar. Hältst du ein Versprechen, gewinnst du 2 Soul HP zurück statt 1. Der Verlust beim Brechen bleibt bei 2 Soul HP."}], "20": [{"t": "Königin der Berge — Kälte. Eisige Gegenwart erhöht sich um weitere 6d6, macht insgesamt +9d6 Cold Damage."}, {"t": "Königin der Berge — Die Schneemonstrosität. Deine Schneemonstrosität ist jetzt dauerhaft beschworen, ohne erneutes Wirken. Sie entlädt ihren umgeleiteten Schaden nach jeder ihrer eigenen Actions, kann dich damit aber nur noch zweimal pro Kampf schützen. Jedes Mal, wenn eine Kreatur durch Snowgrave stirbt, steigt ihr Maximum an Hit Points dauerhaft um 10."}, {"t": "Königin der Berge — Eiswaffe. Eiswaffe ist jetzt zehnmal pro Kampf nutzbar."}, {"t": "Königin der Berge — Winterhauch. Verfehlt ein Angriff gegen dich, erleidet der Angreifer 1d6 Psychic Damage."}]}}, {"id": "rokurokubi", "name": "Rokurokubi", "kanji": "ろくろ首", "group": "Wandler", "attr": "Attribute: +2 WIS, +1 DEX. · Mittelgroß, 30 ft.", "bonus": {"wis": 2, "dex": 1}, "choose": 0, "levels": {"1": [{"t": "Der lange Hals. Als Bonus Action dehnt sich dein Hals: Bis zum Ende deines Zuges reicht deine Sicht und dein Gehör bis 60 ft. um Ecken, über Mauern und durch schmale Öffnungen. Dein Körper bleibt, wo er ist."}, {"t": "Nachtwandler. Darkvision 60 ft. Proficiency mit Perception oder Investigation."}, {"t": "Ahnungslos. Manche Rokurokubi wissen nicht, was sie sind."}], "3": [{"t": "Verwirrende Form. Wann immer dich eine Kreatur mit einem Angriffswurf angreift, macht sie statt eines normalen Angriffswurfs automatisch einen Intelligence-Saving-Throw gegen DC 8 + Proficiency Bonus + WIS-Modifier. Ist ihr Ergebnis niedriger als die DC, verfehlt der Angriff automatisch. Ist ihr Ergebnis gleich der DC oder höher, trifft der Angriff automatisch, und du kannst als Reaction eine Opportunity Attack gegen sie ausführen."}], "5": [{"t": "Weitere Verwirrung. Du hast zwei weitere Arme. Dadurch kannst du bis zu vier einhändige Waffen oder Schilde gleichzeitig tragen und griffbereit halten, statt der üblichen zwei."}], "7": [{"t": "Warum existiere ich. Würfelst du bei einem Angriffswurf oder einem Saving Throw eine natürliche 20, regenerierst du 1 Soul HP. Bist du bereits bei deinem Soul-HP-Maximum, erhältst du stattdessen 1 Goldstück."}], "9": [{"t": "Paradoxische Existenz. Einmal pro Long Rest kannst du als Action einen deiner Körperteile abtrennen — sogar deinen eigenen Kopf. Das kostet dich weder Hit Points noch Soul HP; der Körperteil wächst sofort nach. Das abgetrennte Teil wird zu einer eigenständigen Waffe, die du oder jede andere Kreatur wie eine gewöhnliche Waffe führen kann."}, {"t": "Kopf. Ranged Weapon Attack (Proficiency Bonus + WIS-Modifier), Reichweite 60 ft., bei einem Treffer 1d4 Piercing Damage."}, {"t": "Arm. Melee Weapon Attack (Proficiency Bonus + WIS-Modifier), einhändig, bei einem Treffer 2d6 Bludgeoning Damage."}, {"t": "Bein. Melee Weapon Attack (Proficiency Bonus + WIS-Modifier), zweihändig, bei einem Treffer 2d8 Bludgeoning Damage."}, {"t": "Rückkehr. Das abgetrennte Teil bleibt bis zu deinem nächsten Long Rest eine funktionsfähige Waffe; dann wächst es zurück an deinen Körper."}], "11": [{"t": "Bissiger Hals. Nutzt du Der lange Hals, kannst du deine Action nutzen, um mit deinem Kopf am Ende der gestreckten Reichweite anzugreifen: Melee Weapon Attack (Proficiency Bonus + WIS-Modifier), Reichweite bis zu 60 ft., bei einem Treffer 1d6 + WIS-Modifier Piercing Damage."}], "13": [{"t": "Vielfache Sinne. Solange Der lange Hals aktiv ist, hast du Advantage auf Perception Checks. Versuchst du, eine Illusion zu durchschauen, die nur dein Sehen oder Hören täuscht, hast du zusätzlich Advantage auf den Intelligence (Investigation) Check."}], "15": [{"t": "Nukekubi-Erwachen. Einmal pro Long Rest kannst du als Action deinen Kopf vollständig lösen. Er fliegt mit einer Fly Speed von 30 ft. eigenständig umher, für bis zu 1 Minute oder bis du ihn freiwillig zurückkehren lässt. Solange dein Kopf gelöst ist, bleibt dein zurückgelassener Körper liegen: prone, unconscious, unfähig zu handeln. Du siehst, hörst und handelst ausschließlich durch deinen Kopf."}], "17": [{"t": "Geteiltes Bewusstsein. Nukekubi-Erwachen ist jetzt zweimal pro Long Rest nutzbar, und die Dauer steigt von 1 Minute auf 10 Minuten."}], "19": [{"t": "Ständige Wachsamkeit. Dein zurückgelassener Körper gilt für die Zwecke von Angriffswürfen nicht länger als unconscious oder hilflos — Angriffe gegen ihn aus 5 ft. sind nicht mehr automatisch Critical Hits."}], "20": [{"t": "Der Kopf, der nicht ruht — Nukekubi jederzeit. Nukekubi-Erwachen ist jetzt beliebig oft nutzbar, ohne Beschränkung durch Long Rest, und ohne Zeitlimit."}, {"t": "Der Kopf, der nicht ruht — Tödlicher Biss. Dein gelöster Kopf erhält eine Fly Speed von 40 ft. und AC 14. Bissiger Hals und dein Angriff während Nukekubi-Erwachen richten jetzt 2d6 + WIS-Modifier Piercing Damage an."}, {"t": "Der Kopf, der nicht ruht — Ungebrochene Form. Verwirrende Form wirkt jetzt zuverlässiger: Auch wenn eine angreifende Kreatur ihren Save besteht, trifft ihr Angriff nicht mehr automatisch — sie macht stattdessen einen ganz normalen Angriffswurf gegen deine AC. Die Opportunity Attack bleibt dir in jedem Fall erhalten."}]}}, {"id": "kodama", "name": "Kodama", "kanji": "木霊", "group": "Naturgeister", "attr": "Attribute: +2 WIS, +1 CON. · Klein oder mittelgroß, 30 ft. · Ort: ein Baum oder Hain", "bonus": {"wis": 2, "con": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Blüte. Einmal pro Long Rest heilst du dich oder eine berührte Kreatur um 1d8 plus deine Charakterstufe."}, {"t": "Rindenhaut. Deine Armor Class beträgt mindestens 13 + DEX-Modifier, wenn du keine Rüstung trägst."}, {"t": "Waldstille. Advantage auf Stealth in Wäldern."}], "3": [{"t": "Segen: Wurzel. Deine Wurzeln versorgen dich mit allem Nährstoff, den du brauchst — du benötigst keinen Proviant mehr."}], "5": [{"t": "Segen: Stamm. Deine Armor Class beträgt jetzt mindestens 16 + DEX-Modifier, wenn du keine Rüstung trägst."}], "7": [{"t": "Stille im Hain. Triffst du mit einem Angriff eine Kreatur, die surprised ist, kannst du dich unmittelbar danach zusätzlich bis zu 30 ft. bewegen, ohne dass das eine Action kostet. Das gilt für Nahkampf-, Fernkampf- und Zauberangriffe."}], "9": [{"t": "Kodamas Reach. Befindest du dich in einem Wald, erhöht sich die Reichweite deiner Ranged Weapon Attacks und deiner Zaubersprüche mit einer Reichweitenangabe um 30 ft."}], "11": [{"t": "Treestep. Einmal pro Long Rest kannst du dich als Action zu deinem Ursprung teleportieren. Innerhalb der folgenden 30 Minuten kannst du dich zurück an den Ort teleportieren, von dem aus du losgereist bist."}], "13": [{"t": "Indomitable. Du hast Advantage auf Checks und Saving Throws, mit denen du versuchst, einer erzwungenen Bewegung zu widerstehen oder sie zu verringern."}], "15": [{"t": "Tree Guide. Fünfmal pro Long Rest kannst du dich mit einem Baum in deiner Umgebung unterhalten, ähnlich wie beim Zauber Speak with Dead: Das Gespräch dauert bis zu 10 Minuten, mit bis zu 5 Fragen."}], "17": [{"t": "Ecosystem — Pilzgeflecht. Ein Pilzgeflecht wächst dauerhaft mit dir zusammen. Es verstärkt Segen: Blüte: Die Heilung verdreifacht sich, von 1d8 + Charakterstufe auf (1d8 + Charakterstufe) × 3."}, {"t": "Ecosystem — Pflanzenmagie. Du erlernst fünf pflanzenbasierte Zauber als Innate Spellcasting: kein Spell Slot, keine Vorbereitung nötig. Dein Spellcasting-Modifier ist WIS."}, {"t": "| Zauber | Nutzung |"}, {"t": "| Druidcraft | beliebig oft |"}, {"t": "| Entangle | 1×/Short Rest |"}, {"t": "| Barkskin | 1×/Long Rest |"}, {"t": "| Plant Growth | 1×/Long Rest |"}, {"t": "| Grasping Vine | 1×/Long Rest |"}], "19": [{"t": "Blättersturm. Einmal pro Long Rest beschwörst du als Action einen Sturm aus Blättern und Splittern in einem 120-ft-Cone vor dir. Jede Kreatur darin macht einen DEX-Saving-Throw gegen DC 8 + Proficiency Bonus + WIS-Modifier. Bei einem Fehlschlag nimmt sie 9d6 Slashing Damage, bei einem Erfolg die Hälfte."}], "20": [{"t": "Wise Old Tree — Alter Baum. Deine WIS steigt um 5, bis zum üblichen Deckel von 20."}, {"t": "Wise Old Tree — Tieferer Wurzelgriff. Treestep ist jetzt dreimal pro Long Rest nutzbar."}, {"t": "Wise Old Tree — Der sichere Ursprung. Der Ort deines Ursprungs ist gegen die Flächen-Corruption, die sich in Akt II ausbreiten kann, vollständig resistent, und dient dir und deinen Verbündeten dort als sicherer Rückzugsort für einen Long Rest."}]}}, {"id": "zashikiwarashi", "name": "Zashiki-warashi", "kanji": "座敷童子", "group": "Naturgeister", "attr": "Attribute: +2 CHA, +1 DEX. · Klein, 30 ft. · Ort: ein Haus", "bonus": {"cha": 2, "dex": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Wohlstand. Verbündete in 30 ft. dürfen einmal pro Long Rest einen misslungenen Wurf wiederholen. Du selbst nicht."}, {"t": "Kindsgestalt. Du siehst aus wie ein Kind und wirst behandelt wie eins. Advantage auf Persuasion gegenüber jenen, die dich unterschätzen."}, {"t": "Der Preis des Gehens. Verlässt du dein Haus, verfällt es langsam. Nach je einem Monat Abwesenheit steigt eine Zählung; ab drei ist es unbewohnbar und gilt als verlassen."}], "3": [{"t": "Häuslicher Segen. Ist dein Haus im besten Zustand (Zählung 0), hast du Advantage auf alle Insight Checks. Befindest du dich zusätzlich in oder direkt bei deinem Haus, hast du auch Advantage auf Angriffswürfe. Ist dein Haus nur leicht verfallen (Zählung 1), hast du nur die Advantage auf Insight Checks."}], "5": [{"t": "Kindestraum. Ist dein Haus im besten Zustand, kannst du einmal pro Long Rest als Action die Gedanken einer Kreatur lesen, die dich unterschätzt — ihre unmittelbaren, oberflächlichen Gedanken, für bis zu 1 Minute, ohne Saving Throw."}], "7": [{"t": "Bleibender Glanz. Die Zählung aus Der Preis des Gehens steigt jetzt erst nach zwei Monaten Abwesenheit um 1, statt nach einem."}], "9": [{"t": "Ich vermisse Zuhause. Einmal pro Long Rest kannst du als Action dich selbst und jede einverstandene Kreatur in 30 ft. zu deinem Haus teleportieren. Innerhalb der folgenden 30 Minuten könnt ihr euch zurück an den Ort teleportieren, von dem aus ihr losgereist seid."}], "11": [{"t": "Häuslicher Zorn. Gilt dein Haus als verlassen (Zählung 3), kannst du einmal pro Long Rest Advantage auf einen Intimidation Check erhalten."}], "13": [{"t": "Hausentwicklung. Für Goldstücke kannst du deinem Haus feste Möbelstücke mit eigener Wirkung hinzufügen."}, {"t": "Schreinimitat (1.000 gp). Ein Kami-kagari, der hier einen Long Rest nimmt, kann den Social Link EINES seiner Götter um einen Rang steigern. Divinity Points auffüllen und Tabus rehabilitieren bleiben ausschließlich echten Schreinen vorbehalten."}, {"t": "Schmiedeofen (1.000 gp). Materialkosten und benötigte Zeit für Crafting sinken hier um 50%."}, {"t": "Betten (100 gp, je Stück). So viele Partymitglieder, wie du Betten besitzt, regenerieren während eines Long Rest im Haus zusätzlich einmal ihre Short-Rest-Ressourcen."}, {"t": "Kochtopf (2.000 gp). Ein Yokai Hunter im Haus stellt beim Brauen die doppelte Anzahl Gegenmittel her."}, {"t": "Onsen (500 gp). Ein Bad im Onsen während eines Long Rest im Haus entfernt automatisch einen Grad Exhaustion."}, {"t": "Bibliothek (1.500 gp). Die Downtime-Aktivität Research dauert bei Nutzung dieser Bibliothek nur halb so lange."}], "15": [{"t": "Wir sind sicher. Unabhängig vom Zustand deines Hauses kann es nicht durch gewöhnliche Mittel gefunden oder unbemerkt betreten werden, solange du das nicht erlaubst. Diese Sicherheit endet, sobald das Haus corrupted wird, und kehrt zurück, sobald die Corruption dort beseitigt ist."}], "17": [{"t": "Komm zu Besuch. Ich vermisse Zuhause ist jetzt dreimal pro Long Rest nutzbar, und das Rückkehrfenster steigt auf 90 Minuten."}], "19": [{"t": "Weites Zuhause. Ist dein Haus im besten Zustand, gilt die Ortsbedingung aus Häuslicher Segen jetzt für einen Umkreis von 1 Meile um dein Haus."}], "20": [{"t": "Meisterhaus — Immer perfekt. Dein Haus gilt von jetzt an immer als im besten Zustand."}, {"t": "Meisterhaus — Häuslicher Zorn. Häuslicher Zorn ist jetzt viermal pro Long Rest nutzbar, und du brauchst dafür nicht mehr, dass dein Haus als verlassen gilt."}, {"t": "Meisterhaus — Doppelte Möbel. Der Effekt jedes Möbelstücks verdoppelt sich: Schreinimitat steigert pro Aufenthalt zwei Ränge; Betten versorgen doppelt so viele Partymitglieder; Kochtopf vervierfacht die Gegenmittel-Produktion; Onsen entfernt zwei Grade Exhaustion. Schmiedeofen und Bibliothek steigen von 50% auf 75% Ersparnis."}]}, "extra": ["Der Zustand des Hauses: Zählung 0 = bester/perfekter Zustand, 1 = leicht verfallen, 2 = stark verfallen, 3 = verlassen."]}, {"id": "yamabiko", "name": "Yamabiko", "kanji": "山彦", "group": "Naturgeister", "attr": "Attribute: +2 CHA, +1 WIS. · Klein oder mittelgroß, 30 ft. · Ort: ein Berg oder eine Schlucht", "bonus": {"cha": 2, "wis": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Widerhall. Als Bonus Action wirfst du eine Stimme oder ein Geräusch bis zu 120 ft. weit an eine Stelle, die du sehen kannst."}, {"t": "Nachsprechen. Advantage auf Würfe, eine Stimme oder einen Tonfall nachzuahmen, den du eben gehört hast."}, {"t": "Gehör des Tals. Proficiency mit Perception. Du hörst doppelt so weit wie andere im Freien."}], "3": [{"t": "Stoneforge. Einmal pro Long Rest kannst du als Bonus Action Stein aus deiner unmittelbaren Umgebung in eine Waffe umformen, die du in einer Hand führst: eine einfache Nahkampfwaffe, die 1d6 Bludgeoning Damage verursacht. Sie hält bis zu deinem nächsten Long Rest."}], "5": [{"t": "Mountain Hiding. Einmal pro Long Rest kannst du dich, solange du dich in bergigem Gelände befindest, als Action unsichtbar machen. Die Invisibility hält bis zu 10 Minuten und endet sofort, wenn du angreifst oder einen Zauber wirkst. Bewegst du dich währenddessen, muss jede Kreatur, die dich sehen will, einen Intelligence Saving Throw gegen DC 8 + Proficiency Bonus + CHA-Modifier bestehen."}], "7": [{"t": "Roar of the Mountain. Bis zu dreimal pro Long Rest kannst du als Action einen ohrenbetäubenden Schrei ausstoßen. Jede Kreatur in 30 ft. macht einen Constitution Saving Throw gegen DC 8 + Proficiency Bonus + CHA-Modifier. Bei einem Fehlschlag nimmt sie 2d12 Thunder Damage und ist stunned bis zum Ende ihres nächsten Zuges; bei einem Erfolg nur die Hälfte. Verbündete haben Advantage auf diesen Save."}], "9": [{"t": "Artificial Terrain. Mountain Hiding darfst du jetzt insgesamt dreimal pro Long Rest einsetzen. Eine dieser drei Nutzungen darfst du auch außerhalb von bergigem Gelände einsetzen."}], "11": [{"t": "Zauberattribut, DC, Angriffswurf: CHA. Saving-Throw-DC ist 8 + Proficiency Bonus + CHA-Modifier, Angriffswurf ist Proficiency Bonus + CHA-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Zauber | Nutzung |"}, {"t": "| Meld into Stone | 1× pro Long Rest |"}, {"t": "| Maximilian’s Earthen Grasp (Xanathar’s Guide) | 1× pro Short Rest |"}, {"t": "| Erupting Earth (Xanathar’s Guide) | 1× pro Long Rest |"}, {"t": "| Stone Shape | 1× pro Long Rest |"}, {"t": "| Wall of Stone | 1× pro Long Rest |"}], "13": [{"t": "Mountain Rage. Befindest du dich in einem bergigen Gebiet, einer Schlucht oder einem Tal, kannst du einmal pro Long Rest als Action eine Lawine auslösen, passend zur Umgebung. Jede Kreatur macht einen Dexterity Saving Throw gegen DC 8 + Proficiency Bonus + CHA-Modifier. Bei einem Fehlschlag nimmt sie 8d6 Schaden — Cold Damage bei einer Schneelawine, Bludgeoning Damage bei einer Steinlawine, Necrotic Damage bei einer Drecklawine — und bei einem Erfolg nur die Hälfte."}], "15": [{"t": "Lawinenmeister. Mountain Rage darfst du jetzt auch außerhalb von Bergen, Schluchten und Tälern einsetzen und insgesamt dreimal pro Long Rest, statt einmal."}], "17": [{"t": "Magma Punch. Einmal pro Long Rest kannst du als Bonus Action das Magma unter den Bergen in deine Faust channeln. Bis zum Ende dieses Kampfes hast du einen Bonus von + CHA-Modifier auf Angriffswürfe mit unbewaffneten Schlägen, und diese Schläge verursachen zusätzlich 9d6 Fire Damage."}], "19": [{"t": "Magma Eruption. Einmal pro Long Rest kannst du als Action Magma in einem Cone-Shape von 150 ft. vor dir ausspeien. Der getroffene Bereich wird für 1 Minute zu Difficult Terrain. Jede Kreatur nimmt 3d6 Fire Damage für jedes Feld dieses Bereichs, das sie durchquert, und weitere 4d6 Fire Damage, wenn sie ihren Zug dort beendet."}], "20": [{"t": "Mountainous King — Rückkehr zum Ursprung. Einmal pro Long Rest kannst du dich als Action zu deinem Ort teleportieren. Innerhalb der nächsten 1,5 Stunden kannst du zu der Stelle zurückkehren, an der du diese Fähigkeit ausgelöst hast."}, {"t": "Mountainous King — Herr der Berge. Stoneforge, Mountain Hiding, Roar of the Mountain, Mountain Rage, Magma Punch und Magma Eruption erhalten jeweils vier zusätzliche Nutzungen pro Long Rest."}, {"t": "Mountainous King — Herrschaft über den Fels. Mit Erlaubnis deines DM kannst du die Geografie in deiner unmittelbaren Umgebung dauerhaft verändern."}]}}, {"id": "mizuchi", "name": "Mizuchi", "kanji": "蛟", "group": "Naturgeister", "attr": "Attribute: +2 CON, +1 WIS. · Mittelgroß, 30 ft., Schwimmen 40 ft. · Ort: ein Fluss oder See", "bonus": {"con": 2, "wis": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Fließen. Du atmest unter Wasser. Einmal pro Short Rest bewegst du dich als Bonus Action bis zu 30 ft., ohne Opportunity Attacks auszulösen."}, {"t": "Schuppenhaut. Resistance gegen Cold Damage."}, {"t": "Verschmutztes Wasser. Du spürst am Wasser, ob stromaufwärts etwas verdorben ist. In verdorbenem Wasser zu stehen, kostet dich zu Beginn deines Zuges 1 Soul HP."}], "3": [{"t": "Zauberattribut, DC, Angriffswurf: WIS. Saving-Throw-DC ist 8 + Proficiency Bonus + WIS-Modifier, Angriffswurf ist Proficiency Bonus + WIS-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Zauber | Nutzung |"}, {"t": "| Create or Destroy Water | 1× pro Short Rest |"}, {"t": "| Sleet Storm | 1× pro Long Rest |"}, {"t": "| Watery Sphere (Xanathar’s Guide) | 1× pro Long Rest |"}, {"t": "| Ice Storm | 1× pro Long Rest |"}, {"t": "| Maelstrom (Xanathar’s Guide) | 1× pro Long Rest |"}], "5": [{"t": "Minor Cleansing. Einmal pro Schreinbesuch (an einem echten, nicht-corrupten Schrein) erhältst du eine Ladung dieser Fähigkeit. Als Action errichtest du damit eine unsichtbare Zone von 100 ft. Radius um dich, die dich begleitet und bis zu 1 Stunde hält oder bis du sie freiwillig auflöst. Wasser, das sich beim Errichten bereits in der Zone befindet, wird sofort von Corruption befreit."}], "7": [{"t": "Healing Springs. Solange du selbst in nicht-corruptem Wasser stehst, heilt zu Beginn deines Zuges jeder Verbündete, der sich in einem Radius von 5 ft. um dich herum im Wasser befindet, um 2d6 Hit Points."}], "9": [{"t": "Raging River. Bis zu zweimal pro Long Rest kannst du als Action für eine Runde 125 ft³ Wasser nach deinem Willen bewegen und damit zwei oder mehr Gegner treffen. Jeder getroffene Gegner macht einen Dexterity Saving Throw gegen DC 10. Bei einem Erfolg nimmt er keinen Schaden, bei einem Fehlschlag 5d6 Cold Damage."}], "11": [{"t": "Segen: fließendes Leben. Segen: Fließen kannst du jetzt dreimal pro Short Rest einsetzen. Bei jeder dieser Nutzungen kannst du dich stattdessen entscheiden, als Bonus Action bis zu 90 ft. in gerader Linie zu dashen, ohne Opportunity Attacks auszulösen."}], "13": [{"t": "Greater Cleansing. Solange deine Minor-Cleansing-Zone aktiv ist, wird Wasser, das neu in ihren Radius hineinfließt, automatisch von Corruption befreit. Verlässt dieses Wasser die Zone wieder, wird es erneut corrupiert — es sei denn, du opferst alle deine aktuellen Soul HP. Tust du das, bleibt dieses Wasser dauerhaft rein, und deine Soul HP regenerieren nicht, bevor du einen echten Schrein aufsuchst."}], "15": [{"t": "Greater Healing Spring. Verbündete in deinem 5-ft.-Radius müssen nicht mehr selbst im Wasser stehen, um geheilt zu werden. Die Heilung steigt von 2d6 auf 6d6 Hit Points."}], "17": [{"t": "Rampaging River. Raging River kostet jetzt eine Bonus Action statt einer Action. Der Schaden bei einem Fehlschlag steigt von 5d6 auf 12d6 Cold Damage."}], "19": [{"t": "Water Armor. Einmal pro Long Rest kannst du dich als Action aus dem Kampf zurückziehen und selbst zur Rüstung eines Verbündeten in bis zu 30 ft. Entfernung werden. Du bist an diesen Verbündeten gebunden, solange er lebt oder bis das Combat endet, und gibst ihm dabei +8 auf seine Armor Class. Während du gebunden bist, bist du kein eigenständiges Ziel mehr und handelst nicht auf eigene Initiative."}], "20": [{"t": "Wassermonarchin — Fließende Macht. Water Magic, Minor Cleansing (inklusive Greater Cleansing), Raging River (Rampaging River) und Segen: fließendes Leben dürfen jetzt jeweils dreimal zusätzlich pro ihrer jeweiligen Rast-Einheit eingesetzt werden."}, {"t": "Wassermonarchin — Tiefere Heilung. Healing Springs bzw. Greater Healing Spring heilen jetzt 9d6 statt 6d6 Hit Points."}, {"t": "Wassermonarchin — Kurzes Auftauchen. Während du die Water Armor eines Verbündeten bist, kannst du als Reaction, sobald dieser Verbündete erfolgreich einen Gegner trifft, dich kurz lösen und sofort deinen eigenen vollen Zug nehmen. Direkt danach kehrst du automatisch in die Water-Armor-Bindung zurück."}, {"t": "Wassermonarchin — Ungebrochener Fluss. Greater Cleansing kostet dich nicht mehr deine Soul HP, um eine Reinigung dauerhaft zu machen."}]}}, {"id": "iwanosei", "name": "Iwa-no-sei", "kanji": "岩の精", "group": "Naturgeister", "attr": "Attribute: +2 CON, +1 STR. · Mittelgroß, 25 ft. · Ort: ein Fels, ein Berghang, ein Steinbruch", "bonus": {"con": 2, "str": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Geduld. Advantage auf Saving Throws gegen Effekte, die dich bewegen, zu Boden werfen oder festsetzen wollen. Du kannst nicht erschöpft werden vom Marschieren."}, {"t": "Steinleib. Resistance gegen nichtmagischen Bludgeoning, Piercing und Slashing Damage, solange du dich in deinem Zug nicht bewegt hast."}, {"t": "Zeit in Jahrzehnten. Du hast Disadvantage auf Initiative."}], "3": [{"t": "Mienensicht. Einmal pro Long Rest kannst du als Action erfahren, wo sich in einem Radius von 100 ft. um dich herum Erze und Edelsteine befinden. Umgebendes Gestein blockiert diese Wahrnehmung nicht."}], "5": [{"t": "Gemstone Punch. Bis zu dreimal pro Combat kannst du, als Teil eines unbewaffneten Schlags (Proficiency Bonus + STR-Modifier), einen Edelstein in deinem Besitz verbrauchen. Bei einem Treffer verursacht dein Schlag zusätzlich 5d6 Schaden vom Typ des verwendeten Edelsteins."}, {"t": "| Edelstein | Schadenstyp |"}, {"t": "| Diamant | Piercing |"}, {"t": "| Saphir | Cold |"}, {"t": "| Rubin | Fire |"}, {"t": "| Topas | Lightning |"}], "7": [{"t": "Erz Regen. Bis zu einmal pro Short Rest kannst du als Action ein Erz in deinem Besitz verbrauchen und mit voller Kraft zu Splittern zerschlagen. Jede Kreatur in 30 ft. macht einen Dexterity Saving Throw gegen DC 8 + Proficiency Bonus + CON-Modifier. Bei einem Fehlschlag nimmt sie 4d8 Bludgeoning Damage, bei einem Erfolg nur die Hälfte."}], "9": [{"t": "Mining Expert. Jedes Mal, wenn du Erz oder Edelsteine findest und abbaust, wirf einen d20: Bei 1–10 erhältst du die übliche 1 Einheit, bei 11–19 erhältst du 2, bei einer natürlichen 20 erhältst du 3."}], "11": [{"t": "No Haste. Hast du in diesem Combat bereits sowohl Gemstone Punch als auch Erz Regen eingesetzt, kannst du einmal pro Combat als Bonus Action eine defensive Position einnehmen: Speed sinkt auf 10 ft., du erhältst +3 Armor Class, und in jedem deiner Züge kannst du ein Erz verbrauchen, um 1d6 Hit Points zu regenerieren."}], "13": [{"t": "Gemstone Sight. Der Radius von Mienensicht steigt um 50 ft. auf 150 ft. Zusätzlich erkennst du innerhalb dieses Radius auch eingestürzte Höhlen und Minen."}], "15": [{"t": "Miners Greed. Verkaufst du Erze oder Edelsteine, hast du Advantage auf den Charisma (Persuasion) Check, um einen besseren Preis auszuhandeln."}], "17": [{"t": "Miners Delight. Solange du dich in einer Mine oder natürlichen Höhle befindest, steigt deine Speed auf 60 ft., und du hast Darkvision in 120 ft."}], "19": [{"t": "Peace and Quiet. Befindet sich zu Beginn deines Zuges keine andere Kreatur innerhalb von 10 ft. um dich herum, regenerierst du 4d6 Hit Points."}], "20": [{"t": "Meister der Mine — Eigene Mine. An jedem sicheren Ort kannst du eine eigene Mine erschaffen. Tust du das mit Zeugen, sind dir die Menschen in der Umgebung sehr dankbar: Das zählt als eine Tat nach Nigimitama und verschiebt deine Mitama-Waage entsprechend."}, {"t": "Meister der Mine — Tiefer Vorrat. Gemstone Punch und Erz Regen darfst du jetzt jeweils bis zu neunmal pro Short Rest einsetzen."}, {"t": "Meister der Mine — Geschärfter Sinn. Der Radius von Mienensicht steigt um weitere 50 ft. auf 200 ft."}, {"t": "Meister der Mine — Unbeirrbare Wache. Der Armor-Class-Bonus von No Haste steigt um weitere 5, auf insgesamt +8."}]}}, {"id": "hitodama", "name": "Hitodama", "kanji": "人魂", "group": "Naturgeister", "attr": "Attribute: +2 WIS, +1 CHA. · Klein oder mittelgroß, 30 ft. · Ort: ein Grab, eine Brandstelle, ein Schlachtfeld", "bonus": {"wis": 2, "cha": 1}, "choose": 0, "levels": {"1": [{"t": "Segen: Irrlicht. Du leuchtest nach Belieben (schwaches Licht in 15 ft.) und kannst dieses Licht als Bonus Action bis zu 60 ft. von dir wegwandern lassen."}, {"t": "Leib aus Licht und Asche. Du kannst dich durch Öffnungen von 1 Zoll Breite zwängen. Resistance gegen Necrotic Damage."}, {"t": "Am nächsten an den Toten. Du verstehst die Sprache der Toten und Geister, auch wenn du sie nicht sprichst."}], "3": [{"t": "Spirituelle Adaption. Corruption zieht bei dir nur ein Achtel deiner maximalen Soul HP ab (aufgerundet, mindestens 1), statt einem Viertel."}], "5": [{"t": "Ashes to Ashes, Dust to Dust. Du hast Advantage auf Charisma Saving Throws und auf Skill Checks, die Charisma verwenden."}], "7": [{"t": "Death’s Grasp. Bis zu dreimal pro Short Rest kannst du als Action die Macht der Toten durch deine Hand fließen lassen und eine Kreatur berühren: Melee Spell Attack (Proficiency Bonus + WIS-Modifier). Bei einem Treffer nimmt sie 3d6 Necrotic Damage."}], "9": [{"t": "Minor Necromancy. Einmal pro Long Rest kannst du als Action eine Seele mit 0 Hit Points und 10 Soul HP beschwören. Sie bleibt aktiv, bis sie auf 0 Soul HP fällt oder das Combat endet. Du kannst die Seele anweisen, im Austausch für alle ihre verbleibenden Soul HP zu versuchen, den Körper einer anderen Kreatur zu übernehmen — ein einmaliger Versuch, der die Seele danach auflöst. Die Zielkreatur macht einen Constitution Saving Throw gegen DC 8 + Proficiency Bonus + WIS-Modifier. Bei einem Fehlschlag führt sie für 1d4 Züge deine Befehle aus. Am Ende jedes ihrer eigenen Züge darf sie den Save wiederholen."}], "11": [{"t": "Zauberattribut, DC, Angriffswurf: WIS. Saving-Throw-DC ist 8 + Proficiency Bonus + WIS-Modifier, Angriffswurf ist Proficiency Bonus + WIS-Modifier. Innate Spellcasting: keine Spell Slots, keine Vorbereitung."}, {"t": "| Zauber | Nutzung |"}, {"t": "| Chill Touch | beliebig oft (Cantrip) |"}, {"t": "| Speak with Dead | 1× pro Long Rest |"}, {"t": "| Vampiric Touch | 1× pro Long Rest |"}, {"t": "| Enervation (Xanathar’s Guide) | 1× pro Long Rest |"}, {"t": "| Danse Macabre (Xanathar’s Guide) | 1× pro Long Rest |"}], "13": [{"t": "Stärkeres Licht. Dein Irrlicht leuchtet jetzt helles Licht in 30 ft. und kann als Bonus Action bis zu 120 ft. von dir wegwandern."}], "15": [{"t": "Segen: Memory Surge. Bis zu zweimal pro Long Rest kannst du als Action eine Kreatur berühren oder in 30 ft. anvisieren. Sie macht einen Wisdom Saving Throw gegen DC 8 + Proficiency Bonus + WIS-Modifier. Bei einem Fehlschlag kannst du für die nächste Minute durch ihre Erinnerungen blättern und so nach Informationen suchen."}], "17": [{"t": "Ruf der Ruhelosen. Death’s Grasp musst du nicht mehr durch Berührung wirken: Es wird zu einem Ranged Spell Attack mit einer Reichweite von 30 ft. Zusätzlich kann eine getroffene Kreatur bis zum Beginn ihres nächsten Zuges keine Hit Points mehr regenerieren."}], "19": [{"t": "Wandelnder Geist. Du hast Resistance gegen nichtmagischen Bludgeoning, Piercing und Slashing Damage, und Advantage auf Saving Throws gegen Effekte, die dich grappled, restrained oder prone machen wollen."}], "20": [{"t": "Meister der Toten — Ewiges Licht. Der Radius deines Irrlichts steigt um weitere 30 ft. auf 60 ft. helles Licht, und es kann als Bonus Action um weitere 60 ft. wegwandern, auf insgesamt 180 ft."}, {"t": "Meister der Toten — Herr der Seelen. Minor Necromancy darfst du jetzt bis zu zehnmal pro Long Rest einsetzen."}, {"t": "Meister der Toten — Tiefe Erinnerung. Segen: Memory Surge darfst du jetzt bis zu sechsmal pro Long Rest einsetzen."}, {"t": "Meister der Toten — Griff ohne Ende. Death’s Grasp erhält eine Reichweite von 120 ft., verursacht jetzt 8d6 Necrotic Damage, und du darfst es bis zu fünfzehnmal pro Short Rest einsetzen."}]}}], "classes": [{"id": "samurai", "name": "Samurai", "kanji": "侍", "hd": 10, "saves": ["dex", "wis"], "skills": {"n": 2, "from": ["Acrobatics", "Athletics", "History", "Insight", "Intimidation", "Perception"]}, "basics": {"Ressourcen": "Ruhe (Kampfressource), Haltung (Ittō oder Nitō), Eide (Ehre und Seele), die eigene Schwertkunst (Kernidentität).", "Primärattribut": "Strength oder Dexterity für das Schwert; Weisheit bestimmt den Saving Throw DC seiner Techniken.", "Hit Die": "1d10", "Saving Throws": "DEX, WIS", "Weapon Proficiencies": "Simple, Martial", "Armor Proficiencies": "Light oder Medium (deine Wahl)", "Skills": "2 aus: Acrobatics, Athletics, History, Insight, Intimidation, Perception", "Tools": "Calligrapher's Supplies", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1."}, "start": [{"k": "Waffen", "v": "Katana und Wakizashi, wenn du mit Nitō beginnst — oder Katana und ein Tantō, wenn du mit Ittō beginnst (siehe Waffen-der-Inseln.docx)."}, {"k": "Rüstung", "v": "Leichte oder mittlere Rüstung, deine Wahl."}, {"k": "Zusätzlich", "v": "Ein leeres Schulbuch für deine Katas, Reisegewand deines Clans."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Ruhe; Haltung wählen (Ittō oder Nitō); Eide (einer); Schwertkunst gründen (3 Bewegungen)", "2": "Haltungstechnik: Iaijutsu (Ittō) bzw. Zweiter Himmel und Wakizashi-Parade (Nitō)", "3": "Vierte Bewegung", "4": "Ability Score Improvement", "5": "Mu-shin; zusätzlicher Angriff", "6": "Fünfte Bewegung", "7": "Zweiter Eid gleichzeitig", "8": "Ability Score Improvement", "9": "Sechste Bewegung", "10": "Erfüllte Eide geben doppelte Soul HP zurück", "11": "Siebte Bewegung; Ittō: Iaijutsu-Würfel steigen auf d12 · Nitō: Zweiter Himmel kostet nur 1 Ruhe", "12": "Ability Score Improvement", "13": "Achte Bewegung", "14": "Ein gebrochener Eid kostet nur die Hälfte, wenn du im selben Kampf einen neuen schwörst", "15": "Dritter Eid gleichzeitig", "16": "Ability Score Improvement", "17": "Neunte Bewegung", "18": "Ruhe-Höchstwert +2", "19": "Ability Score Improvement", "20": "Vollendete Schule: Eine Kata deiner Wahl braucht keine Verbindungen mehr — sie zählt stets als mit drei Verbindungen ausgeführt."}, "msnotes": [], "rules": [{"h": "Säule 1 — Eide", "body": ["Ein Eid ist ein Vertrag mit klarer Bedingung, klarem Lohn und klarem Preis. Du sprichst ihn laut aus, und der Tisch hört mit.", "Schwören: Bonus Action. Solange der Eid hält, wirkt sein Segen.", "Erfüllen: Du gewinnst Soul HP zurück und erhältst 1 Ruhe.", "Brechen: Du verlierst Soul HP, und der Segen erlischt bis zum nächsten Long Rest.", "Gleichzeitig: Ein Eid ab Stufe 1, zwei ab Stufe 7, drei ab Stufe 15. Mehrere Eide zugleich zu halten ist der eigentliche Meistergrad.", "| Stufe des Eids | Beispiel | Segen | Preis bei Bruch |", "| Klein | „Ich weiche keinen Schritt.\" | +2 AC; Advantage gegen Effekte, die dich bewegen wollen. | 2 Soul HP |", "| Groß | „Ich schlage ihren Anführer zuerst.\" | +2d8 Schaden gegen dieses Ziel. | 5 Soul HP |", "| Todeseid | „Ich verlasse diesen Ort nicht lebend, wenn ich versage.\" | Advantage auf alle Würfe gegen das Ziel des Eids. | Soul HP auf 0 und Kegare |"]}, {"h": "Säule 2 — Ruhe und Haltung", "body": ["Höchstwert: Deine Ruhe kann höchstens deinem Proficiency Bonus entsprechen.", "Immer: Einen Eid zu schwören oder zu erfüllen gibt 1 Ruhe.", "## Deine Haltung", "Auf Stufe 1 wählst du, wie du das Schwert führst. Die Haltung bestimmt, wie du Ruhe gewinnst und was du damit tust. Du kannst sie während einer kurzen oder langen Rast wechseln — im Kampf kostet das Wegstecken beider Klingen und das Anlegen der Scheide eine Action.", "| | Ittō — Ein Schwert | Nitō — Zwei Schwerter |", "| Sinnbild | Der Duellant. Reglos, bis der Augenblick kommt. | Niten Ichi-ryū, Zwei Himmel als einer. Kein Augenblick, sondern kein Ende. |", "| Ruhe gewinnen | Verzichtest du in deinem Zug auf Angriff und Bewegung, gewinnst du 1 Ruhe. | Triffst du in deinem Zug mit beiden Klingen dieselbe Kreatur, gewinnst du 1 Ruhe. |", "| Ruhe ausgeben | Iaijutsu: Du gibst deine gesamte Ruhe aus. Dein Angriff verursacht pro ausgegebener Ruhe einen zusätzlichen Weapon Die Schaden. | Zweiter Himmel: Du gibst 2 Ruhe aus, um eine Verbindung deiner Kata als Bonus Action auszuführen. Deine Katas laufen doppelt so schnell. |", "| Wehr | Bei vollem Vorrat: Mu-shin (siehe unten). | Wakizashi-Parade (Reaction): +3 auf die Armor Class gegen einen Angriff. Kostet 1 Ruhe. |", "| Angriffe | Wie üblich. | Als Bonus Action ein zusätzlicher Angriff
