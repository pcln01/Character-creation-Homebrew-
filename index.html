ully. For every 1 foot a creature moves through the wall, it must spend 4 feet of movement. Furthermore, the first time a creature enters a space in the wall on a turn or ends its turn there, the creature makes a Dexterity saving throw, taking 7d8 Slashing damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.\n\nHöherer Grad: Both types of damage increase by 1d8 for each spell slot level above 6.", ["Druid"]], ["Wind Walk", 6, "Transmutation", "1 minute", "30 feet", "8 hours", "V, S, M (a candle)", "", "", "", "You and up to ten willing creatures of your choice within range assume gaseous forms for the duration, appearing as wisps of cloud. While in this cloud form, a target has a Fly Speed of 300 feet and can hover; it has Immunity to the Prone condition; and it has Resistance to Bludgeoning, Piercing, and Slashing damage. The only actions a target can take in this form are the Dash action or a Magic action to begin reverting to its normal form. Reverting takes 1 minute, during which the target has the Stunned condition. Until the spell ends, the target can revert to cloud form, which also requires a Magic action followed by a 1-minute transformation.\n  If a target is in cloud form and flying when the effect ends, the target descends 60 feet per round for 1 minute until it lands, which it does safely. If it can't land after 1 minute, it falls the remaining distance.", ["Druid"]], ["Word of Recall", 6, "Conjuration", "Action", "5 feet", "Instantaneous", "V", "", "", "", "You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect.\n  You must designate a location, such as a temple, as a sanctuary by casting this spell there.", ["Cleric"]]], "wbForge": [{"r": "1–20", "t": "Fluch. Statt einer Verzauberung erhält der Gegenstand einen Fluch — der Spielleiter würfelt oder legt fest, welchen (Sesshō-seki, 8_Items/Wondrous Item/Legendaere-Artefakte/, ist das Vorbild für einen Fluchgegenstand in dieser Welt)."}, {"r": "21–40", "t": "Fehlgriff. Der Gegenstand erhält einen zufälligen, unpassenden Wondrous Effect oder nur einen +1 Enhancement Bonus — der Spielleiter entscheidet, was aus der Absicht geworden ist, unabhängig davon, was du eigentlich wolltest."}, {"r": "41–60", "t": "Die Verzauberung gelingt genau wie mit dem Spielleiter abgesprochen (Enhancement Bonus oder Wondrous Effect)."}, {"r": "61–80", "t": "Überschuss. Die Verzauberung gelingt wie abgesprochen, und der Gegenstand erhält zusätzlich einen +1 Enhancement Bonus obendrauf."}, {"r": "81–99", "t": "Vollgriff. Die Verzauberung gelingt in doppelter Stärke — ein Enhancement Bonus fällt um 1 höher aus, ein Wondrous Effect wirkt, als wäre er eine Stufe mächtiger."}, {"r": "100", "t": "Vollkommener Zufall. Der Gegenstand erhält sowohl einen kräftigen Enhancement Bonus als auch einen mächtigen Wondrous Effect — die stärkste Verzauberung, die dieses Projekt kennt."}], "opferText": {"Ein Auge": "Disadvantage auf Ranged Attacks und auf Perception, die auf Sehen beruht.", "Ein Arm": "Du kannst keine zweihändigen Waffen führen und hast Disadvantage auf Athletics und Griffe.", "Deine Stimme": "Du kannst nicht sprechen — keine verbalen Komponenten und keine Charisma-Würfe, die Sprache erfordern (Deception, Persuasion, verbale Intimidation). Wortlose Einschüchterung, Performance ohne Worte und Schrift bleiben dir.", "Dein Schatten": "Du kannst dich nicht verstecken; Stealth misslingt automatisch, solange du gesehen werden könntest.", "Dein Schmerzempfinden": "Du bemerkst nicht, wie schwer du verletzt bist: Der Spielleiter führt deine Hit Points verdeckt.", "Lebenskraft": "Deine maximalen Hit Points sinken um das Fünffache deines Levels.", "Seele": "Deine maximalen Soul HP sinken um 5 — und damit auch dein Yōki-Höchstwert."}, "gradText": ["Deine Augen spiegeln im Dunkeln. Du siehst 60 ft. weit in Dunkelheit.", "Deine Zähne und Klauen wachsen sichtbar. +1 auf Damage Rolls mit natürlichen Waffen. Menschen weichen dir aus; Disadvantage auf Persuasion gegenüber Fremden.", "Dein Yokai-Blut siegt sichtbar. +2 auf Damage Rolls, du benötigst keine Nahrung mehr — aber Schreinpriester und Yokai Hunter erkennen dich als Yokai, und geweihter Boden brennt unter deinen Füßen (1d6 pro Runde).", "Du bist kaum noch Mensch. +3 auf Damage Rolls, Resistenz gegen Necrotic Damage — und wenn deine Soul HP in diesem Condition jemals auf 0 fallen, übernimmt der Spielleiter deinen Charakter dauerhaft als Yokai."], "backText": ["Du hast bewiesen, dass du zurücknehmen kannst, was dir gehört. Einmal pro Long Rest darfst du einen misslungenen Saving Throw gegen frightened oder charmed wiederholen.", "+1 auf einen Ability Score deiner Wahl, dauerhaft (bis zum Maximum von 20). Das kommt zusätzlich zu deinen regulären Ability Score Improvements.", "Bei einem Short Rest darfst du zusätzlich einen Hit Die auswürfeln, ohne einen deiner eigenen Hit Dice dafür auszugeben, und die Hit Points sofort gutschreiben.", "Kein sichtbares Yokai-Zeichen mehr, gleich wie viele Pakte du je offen hattest oder noch hast — du siehst vollständig menschlich aus. Das nimmt die Erkennungs- und Brand-Klauseln der Offene-Pakte-Tabelle für die Außenwirkung, ändert aber nichts an tatsächlich noch offenen Pakten selbst."], "sub": {"moonfolk": {"name": "Moonfolk", "race": "kitsune", "intro": "Zusätzlich zu deinen gewöhnlichen Kitsune-Fähigkeiten schaltest du Tsukuyomis Social-Link-Ränge frei — dieselben Fähigkeiten, unverändert aus dem Kami-kagari-Dokument —, aber ohne Divinity Points: Jede Fähigkeit ist stattdessen 1× pro Long Rest nutzbar.", "mond": "Die Mondphase bleibt für diese Fähigkeiten real. Du hast keinen Ewigen Vollmond, bis du Rang 9 erreichst (Stufe 18).", "ranks": [[1, 5, "Kaltes Mondlicht"], [2, 6, "Der Zähler der Monde (passiv)"], [3, 8, "Kaltes Mondlicht kostet ohnehin nichts — keine Änderung"], [4, 9, "Die Gezeiten"], [5, 11, "Der Mord an Uke Mochi"], [6, 12, "Mantel des Mondlichts"], [7, 14, "Mondfinsternis"], [8, 16, "Der Verstoßene (passiv)"], [9, 18, "Ewiger Vollmond (passiv)"], [10, 20, "Herr der drei Phasen (passiv)"]]}, "gashadokuro": {"name": "Gashadokuro", "race": "hitodama", "intro": "Die Körper-Fähigkeit entwickelt sich weiter, bis die Hitodama bzw. Gashadokuro die Knochen am Ende vollkommen absorbiert und wiederaufbaut.", "stufen": [["I — Knochenleib", "Die Flamme brennt in einem Gerüst aus fremden Knochen", "Natürliche Rüstung 13 + DEX. Solange die Knochen getragen werden, entfällt das Zwängen durch 1-Zoll-Öffnungen aus „Leib aus Licht und Asche“."], ["II — Verwachsen", "Die Knochen werden Teil der Flamme", "Als Action die Knochen ablegen oder wieder annehmen; als reine Flamme wieder durch enge Öffnungen zwängen."], ["III — Wiederaufgebaut", "Die Knochen sind vollkommen absorbiert, der Leib baut sich selbst neu", "1× pro Long Rest als Bonus Action: Knochen neu formen. Du dematerialisierst deine Knochen, zwängst dich durch enge Öffnungen und baust sie danach wieder auf."]], "stufenNote": "Körperstufen und Gestaltwahl stehen in deinem Dokument als „Vorschlag, noch nicht bestätigt“.", "gestalt": "Wer die Gashadokuro erreicht hat, darf ihre Gestalt wählen: menschlich oder eher wie ein Yokai, von Menschengröße bis zu 15 ft. groß.", "gestaltRegel": [["Menschlich", "Menschengroß und menschlich: Der Charakter gilt äußerlich als Mensch."], ["Groß und yokaihaft", "Bis 15 ft. (nach 5e-Regeln Huge, 3×3 Felder): zeitlich begrenzt pro Long Rest, +5 ft. Reach, Advantage auf STR-Checks, Disadvantage auf Stealth, passt nicht in Häuser."]], "gestaltWann": "Gewählt wird bei einem Long Rest.", "verst": [[1, "Irrlicht", "Licht in der Augenhöhle", "Du siehst durch dein Irrlicht, als stündest du an seiner Stelle — auch wenn du es als Bonus Action wegschickst."], [1, "Am nächsten an den Toten", "Was die Knochen wissen", "Berührst du Knochen oder einen Schädel, erkennst du, wie die Kreatur gestorben ist und ungefähr wie lange das her ist."], [7, "Death’s Grasp", "Knochenhand", "Trifft Death’s Grasp eine Kreatur in 5 ft., ist sie zusätzlich grappled (Escape DC 8 + Proficiency Bonus + WIS-Modifier)."], [9, "Minor Necromancy", "Ein Gerippe als Gefäß", "Statt einen Körper zu übernehmen, kann die beschworene Seele in Knochen fahren, die du bei dir trägst oder die in 30 ft. liegen. Sie erhebt sich als Skeleton (Monster Manual) unter deiner Kontrolle, bis der Kampf endet oder es auf 0 Hit Points fällt."], [11, "Necrotic Spells", "Gebeine rufen", "Animate Dead kommt zur Zauberliste hinzu: 1× pro Long Rest, nur Skelette, WIS als Zauberattribut wie bei den übrigen Necrotic Spells."], [15, "Memory Surge", "Erinnerung im Schädel", "Du kannst Memory Surge auch auf den Schädel oder die Gebeine einer toten Kreatur wirken. Ein Saving Throw entfällt; du blätterst durch ihre letzten Erinnerungen aus Lebzeiten. Der DM entscheidet, was du findest."], [19, "Wandelnder Geist", "Panzer aus Gebein", "Die Resistance gegen nichtmagischen Bludgeoning, Piercing und Slashing Damage gilt auch, solange du Knochen trägst. In der großen Gestalt kannst du nicht prone werden."], [20, "Meister der Toten", "Der volle Riese", "Die große Gestalt hält ohne Zeitbegrenzung. Jedes Skeleton aus „Ein Gerippe als Gefäß“ kann einmal als Reaction in dich zurückkehren: Du heilst Hit Points in Höhe seiner verbliebenen Hit Points."]], "ohne": "Spirituelle Adaption (3), Ashes to Ashes, Dust to Dust (5), Stärkeres Licht (13) und Ruf der Ruhelosen (17) bleiben unverändert."}}}</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const AB=['str','dex','con','int','wis','cha'];
const ABN={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const ABK={str:'力',dex:'敏',con:'体',int:'知',wis:'賢',cha:'魅'};
const SKILLAB={'Acrobatics':'dex','Animal Handling':'wis','Arcana':'int','Athletics':'str','Deception':'cha','History':'int','Insight':'wis','Intimidation':'cha','Investigation':'int','Medicine':'wis','Nature':'int','Perception':'wis','Performance':'cha','Persuasion':'cha','Religion':'int','Sleight of Hand':'dex','Stealth':'dex','Survival':'wis'};
const R=Object.fromEntries(DATA.races.map(r=>[r.id,r]));
const C=Object.fromEntries(DATA.classes.map(c=>[c.id,c]));
const $=s=>document.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const mod=s=>Math.floor((s-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
const prof=l=>2+Math.floor((l-1)/4);

/* ---------- state ---------- */
let S={chars:[],sel:null,tab:'sheet',party:false,dm:false,dmSel:null};
let store={mode:'local',db:null,user:null,uid:null,ref:null,writing:false,dirty:false,timer:null,others:{}};

function score(c,a){let s=(+c.base[a]||0)+(R[c.raceId].bonus[a]||0);if((c.raceChoice||[]).includes(a))s+=1;for(const L of c.levels||[])s+=(L.asi&&L.asi[a])||0;if(c.classId==='hanyo'&&c.dec?.backAsi===a&&hanyoGrad(c).back>=2)s=Math.min(20,s+1);return s}
function mods(c){return Object.fromEntries(AB.map(a=>[a,mod(score(c,a))]))}
function lehren(c){return (c.bonds||[]).map(b=>b.lehre).filter(Boolean)}
function hpMax(c){const cl=C[c.classId];const m=mods(c).con;let hp=cl.hd;for(const L of c.levels||[])hp+=+L.hp||0;hp+=c.level*m;if(c.raceId==='mensch')hp+=c.level;if(lehren(c).includes('Der ungebrochene Leib'))hp+=2*c.level;if(c.classId==='hanyo')hp-=5*c.level*hanyoGrad(c).leb;return Math.max(1,hp)*(c.nio?Math.pow(2,c.nio):1)}
function soulMax(c){const m=mods(c);return Math.max(1,2+c.level+AB.reduce((t,a)=>t+m[a],0)-(c.classId==='hanyo'?5*hanyoGrad(c).seele:0))*(c.nio?Math.pow(2,c.nio):1)}
function acOf(c){const d=mods(c).dex;const eq=(c.inv||[]).filter(i=>i.equipped&&i.armor);let body=eq.find(i=>['light','medium','heavy'].includes(i.armor.type));let ac;
  if(body){const a=body.armor;ac=a.type==='light'?a.base+d:a.type==='medium'?a.base+Math.min(d,2):a.base}
  else if(eq.find(i=>i.armor.type==='clothes'))ac=11+d;else ac=10+d;if(!body&&gashaArmor(c))ac=Math.max(ac,13+d);
  if(eq.find(i=>i.armor.type==='shield'))ac+=2;if(c.classId==='samurai'&&(c.dec?.eide||[]).some(e=>e.status==='aktiv'&&(e.stufe||'Klein')==='Klein'))ac+=2;if(c.nio)return 0;return ac}
function isYokai(c){return c.raceId!=='mensch'}

/* ---------- persistence ---------- */
function setStatus(t){$('#status').innerHTML=t}
function lsLoad(){try{const v=localStorage.getItem('siegelrolle');return v?JSON.parse(v):[]}catch(e){return[]}}
function lsSave(){try{localStorage.setItem('siegelrolle',JSON.stringify(S.chars))}catch(e){}}
function save(){lsSave();if(store.mode==='drive'){driveSave();return}if(store.mode!=='db')return;store.dirty=true;clearTimeout(store.timer);store.timer=setTimeout(flush,700);setStatus('Speichert …')}
async function flush(){if(store.writing||!store.dirty)return;store.writing=true;store.dirty=false;
  try{await store.ref.set({chars:JSON.parse(JSON.stringify(S.chars)),updated:Date.now()});setStatus('<b>Gespeichert</b> · für dich und deine Gruppe sichtbar')}
  catch(e){if(e&&e.code==='invalid_argument'){store.mode='local';setStatus('Nur in diesem Browser gespeichert: du hast keine Schreibrechte für die Rolle. Bitte den Spielleiter, dich als Contributor einzuladen.')}else if(e&&e.code==='quota_exceeded'){setStatus('<span class="warn">Speicher voll.</span> Lösche alte Charaktere.')}else{setStatus('Speichern fehlgeschlagen, neuer Versuch …');store.dirty=true;setTimeout(flush,1500+Math.random()*1000)}}
  finally{store.writing=false;if(store.dirty)flush()}}
async function initStore(){
  S.chars=lsLoad();if(S.chars.length)S.sel=S.chars[0].id;render();
  const api=window.claude;if(!api||!api.use){if(DRIVE_URL)driveInit();else setStatus('Gespeichert in diesem Browser.');return}
  const [db,user]=await Promise.all([api.use('db'),api.use('user')]);
  store.db=db;store.user=user;store.uid=user?await user.id():null;
  if(!db||!store.uid){setStatus('Gespeichert nur in diesem Browser (nicht angemeldet).');return}
  store.ref=db.doc('characters/'+store.uid);store.mode='db';try{store.owner=user?await user.isOwner():false}catch(e){store.owner=false}
  db.doc('forced/all').onSnapshot(s=>{store.forced=(s.exists&&s.data()&&s.data().chars)||{};deliverDm();render()},()=>{});
  let got=false;const t=setTimeout(()=>{if(!got)setStatus('Die gemeinsame Rolle antwortet noch nicht. Änderungen bleiben vorerst in diesem Browser.')},10000);
  store.ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(t)}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.exists?snap.data():null;
    if(d&&Array.isArray(d.chars)){if(!store.dirty&&!store.writing){S.chars=JSON.parse(JSON.stringify(d.chars));if(!S.chars.find(c=>c.id===S.sel))S.sel=S.chars[0]?.id||null;lsSave();render()}}
    else if(!snap.metadata.fromCache&&S.chars.length){store.dirty=true;flush()}
    if(!snap.metadata.fromCache)setStatus('<b>Verbunden</b> · Charaktere werden für die Gruppe gespeichert');
  },e=>{clearTimeout(t);store.mode='local';setStatus('Gemeinsame Rolle nicht erreichbar. Gespeichert in diesem Browser.')});
  db.collection('characters').onSnapshot(snap=>{store.others={};for(const d of snap.docs){const v=d.data();if(v&&Array.isArray(v.chars))store.others[d.id]=v.chars}if(S.party)render()},()=>{});
}
function upd(fn){const c=cur();if(!c)return;fn(c);save();render()}
function cur(){return S.chars.find(c=>c.id===S.sel)}
function toast(t){const e=h('div',{class:'toast',role:'status'},t);document.body.append(e);setTimeout(()=>e.remove(),2200)}

/* ---------- text rendering of doc lines ---------- */
function renderLines(lines){const out=h('div',{class:'txt'});let tb=null;
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(l.startsWith('|')){const cells=l.replace(/^\||\|$/g,'').split(' | ').map(s=>s.replace(/\\\*/g,'').trim());if(!tb){tb=h('table');out.append(h('div',{class:'tblw'},tb));const tr=h('tr');cells.forEach(c=>tr.append(h('th',{},c)));tb.append(tr)}else{const tr=h('tr');cells.forEach(c=>tr.append(h('td',{},c)));tb.append(tr)}continue}
    tb=null;
    if(l.startsWith('## ')){out.append(h('h4',{},l.slice(3)));continue}
    const m=l.match(/^([^.:!?]{2,48}?)([.:]) (.+)$/);
    if(m&&!/\d$/.test(m[1])&&m[1].split(' ').length<=5&&!/^(Du|Dein|Deine|Er|Sie|Es|Wenn|Als|Wer|Ein|Eine|Der|Die|Das|Jede|Jeder|Bei|Auf|Im|In|Solange|Nur|Mit|Für|Nach|Kein|Keine)\b/.test(m[1])){out.append(h('p',{},h('b',{},m[1]+m[2]+' '),m[3]))}else out.append(h('p',{},l))}
  return out}

/* ---------- views ---------- */
function render(){renderRoster();const m=$('#main');m.textContent='';
  if(S.dm){m.append(viewDm());return}
  if(S.party){m.append(viewParty());return}
  const c=cur();if(!c){m.append(viewEmpty());return}
  m.append(viewHead(c));
  const tabs=[['sheet','Bogen','書'],['fight','Kampf','戦'],['class','Klasse','流'],['grow','Aufstieg','成長'],['inv','Inventar','持物'],['rules','Regeln','巻']];
  const tl=h('div',{class:'tabs',role:'tablist'});
  for(const[k,l,kj]of tabs)tl.append(h('button',{class:'tab',role:'tab','aria-selected':String(S.tab===k),type:'button',onclick:()=>{S.tab=k;render()}},h('span',{class:'k'},kj),l));
  m.append(tl);
  const p=h('div',{class:'panel',role:'tabpanel'});
  p.append(S.tab==='sheet'?viewSheet(c):S.tab==='fight'?viewCombat(c):S.tab==='class'?viewClass(c):S.tab==='grow'?viewGrow(c):S.tab==='inv'?viewInv(c):viewRules(c));m.append(p)}

  for(const c of S.chars){const cl=C[c.classId];r.append(h('button',{class:'rbtn',type:'button','aria-current':String(!S.party&&!S.dm&&c.id===S.sel),onclick:()=>{S.sel=c.id;S.party=false;S.dm=false;render()}},

function classStepValid(st){const D=st.dec;switch(st.classId){
  case 'samurai':return D.haltung&&['Auftakt','Verbindung','Abschluss'].every(a=>(D.moves||{})[a]);
  case 'yokaihunter':return D.fokus&&['Anschlag','Hetze','Riss'].every(a=>(D.griffe||{})[a]);
  case 'sohei':return !!D.weg;case 'schreinpriester':return !!D.talisman;case 'kamikagari':return !!D.gott;case 'onmyoji':return !!D.schule;
  case 'biwahoshi':return (D.strophen||[]).length===2;case 'ninja':return (D.nprof||[]).length===2;default:return true}}
function classStepApply(c,st){const D=st.dec;const o={};switch(c.classId){
  case 'samurai':Object.assign(o,{haltung:D.haltung,schule:D.schule||'',bewegungen:['Auftakt','Verbindung','Abschluss'].map(a=>D.moves[a])});break;

  case 'sohei':if(D.weg==='Option B')o.optB=1;else o.weg=[D.weg];break;
  case 'schreinpriester':o.talismane=[{name:D.talisman,verb:0}];break;
  case 'kamikagari':o.goetter=[{gott:D.gott,rang:1}];o.kanal=D.gott;break;
  case 'onmyoji':o.schule=D.schule;if(D.schule==='Wheelbreaker'&&D.fremd1)o.fremd={1:D.fremd1};break;
  case 'hanyo':if(D.pate)o.pakte=[{pate:D.pate,tiefe:1,opfer:D.opfer||'',status:'offen'}];break;
  case 'biwahoshi':o.strophen=[...D.strophen];break;
  case 'ninja':o.nprof=[...D.nprof];break}
  c.dec=o;c.res={}}
