al-Link-Rang): XW6 Schaden an allen Gegnern in 50 ft., X = Seelen. Du erleidest XW4 Rückstoßschaden. |", "| 8 | passiv | Corruption Feast: Tötest du einen verdorbenen Gegner, erhältst du eine zusätzliche Seele. Du kannst Seelen verzehren für je 1d4 temporäre Hit Points und 1d4 temporäre Soul HP. |", "| 9 | 3 gef. DP | Wesen der Korruption: Deine max. TP werden zu Soul HP, du verlierst deinen Körper und wirst ein Korruptions-Elementar. Corruption erhöht in dieser Form deine Soul HP; fallen sie auf 0, endet die Form. Endet am Ende deines nächsten Zuges. |", "| 10 | alle gef. DP | Verdirb alle Götter, die du je kanalisiert hast, und nutze all ihre Fähigkeiten ohne Divinity-Point-Kosten für X Runden (X = ausgegebene gefallene DP). Ausnahme: Ame-no-Minakanushi (Der Jester) und der über sein Rang 10 gleichzeitig kanalisierte Domänen-Kami bleiben unverdorben — ihre Fähigkeiten kosten in diesem Fenster weiterhin normale Divinity Points. |"]}], "intro": []}, {"id": "onmyoji", "name": "Onmyōji", "kanji": "陰陽師", "hd": 6, "saves": ["int", "wis"], "skills": {"n": 2, "from": ["Arcana", "History", "Insight", "Investigation", "Nature", "Religion"]}, "basics": {"Ressourcen": "Das Rad (was er gerade wirken kann), Fluss (Belohnung fürs Folgen), Siegel (Notgroschen für alles andere).", "Primärattribut": "Intelligenz. Sie bestimmt den DC seiner Formeln und die Zahl seiner Siegel.", "Hit Die": "1d6", "Saving Throws": "INT, WIS", "Weapon Proficiencies": "Simple", "Armor Proficiencies": "Keine", "Skills": "2 aus: Arcana, History, Insight, Investigation, Nature, Religion", "Tools": "Calligrapher's Supplies, Divinationswerkzeug", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Formel-DC": "8 + Proficiency Bonus + INT-Modifier."}, "start": [{"k": "Waffe", "v": "Ein Bō (siehe Waffen-der-Inseln.docx) — der Rokkan no Shakujō ist kein Startgegenstand, den verdienst du dir erst."}, {"k": "Rüstung", "v": "Keine."}, {"k": "Zusätzlich", "v": "Ofuda (Papierstreifen) und Tusche für deine Formeln, ein Divinationswerkzeug."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Das Rad (drei Züge); Formeln aller sechs Elemente; Siegel; Fluss bis 2", "2": "Shikigami falten", "3": "Fluss bis 3", "4": "Ability Score Improvement", "5": "Formeln steigen: alle Schadenswürfel +1d (z. B. Flammenwurf 6d6)", "6": "Späher: Shikigami-Reichweite 1 Meile", "7": "Fluss bis 4", "8": "Ability Score Improvement", "9": "Formeln steigen: alle Schadenswürfel +1d", "10": "Zweiter Zug: Einmal pro Kampf darfst du den Zeiger ein zweites Mal bewegen (auch ein Sprung — dann fällt der Fluss)", "11": "Fluss bis 5 (Vollendeter Kreis)", "12": "Ability Score Improvement", "13": "Formeln steigen: alle Schadenswürfel +1d", "14": "Doppelte Shikigami; sie erhalten Hit Points gleich deinem doppelten Level", "15": "Der Kreislauf gibt 2 Fluss statt 1, wenn du dreimal in Folge gefolgt bist", "16": "Ability Score Improvement", "17": "Formeln steigen: alle Schadenswürfel +1d", "18": "Siegel kehren auch bei einer Short Rest zur Hälfte zurück; Corruption sperrt deine Gegenüber-Sprünge nicht mehr", "19": "Ability Score Improvement", "20": "Das stille Rad: Einmal pro Long Rest darfst du in deinem Zug NICHT ziehen. Dein Fluss bleibt bestehen, und du wirkst dein aktuelles Element ein zweites Mal."}, "msnotes": [], "rules": [{"h": "Säule 1 — Das Rad", "body": ["Sechs Elemente stehen im Kreis: Chi (Erde), Sui (Wasser), Ka (Feuer), Fū (Wind), Kū (Leere), Shiki (Form) — und wieder Chi. Ein Zeiger steht auf einem davon. Zu Beginn deines ersten Kampfzuges steht er auf Kū, der Leere, aus der alles hervorgeht.", "## Ziehen", "Pflicht: Zu Beginn jedes deiner Züge MUSST du den Zeiger bewegen. Stehenbleiben ist nicht möglich.", "Drei Ziele: Von jedem Element aus stehen dir genau drei Felder offen.", "| Zug | Bewegung | Von Chi aus | Von Fū aus |", "| Kreislauf | ein Feld weiter | Sui | Kū |", "| Gegenüber | drei Felder | Fū | Chi |", "| Dreieck | zwei Felder zurück | Kū | Sui |", "Vollständig: Kreislauf Chi → Sui → Ka → Fū → Kū → Shiki → Chi. Gegenüber: Chi↔Fū, Sui↔Kū, Ka↔Shiki. Dreiecke: Chi–Kū–Ka und Sui–Shiki–Fū (jeweils zwei Felder zurück).", "Das Godai-Rad: graue Ringlinien sind der Kreislauf, violette Linien die Gegenüber, gestrichelte grüne die Dreiecke.", "## Corruption bricht das Rad", "Verdorbene Mitte: Solange du den Corruption-Debuff trägst, sind die Gegenüber-Sprünge gesperrt. Ihre Linien laufen durch die Mitte des Rades, und die ist unrein. Dir bleiben Kreislauf und Dreieck.", "Gerissener Fluss: Trifft dich ein Angriff, der Corruption überträgt, machst du wie üblich deinen CON-Saving Throw. Misslingt er, fällt dein Fluss zusätzlich sofort auf 0.", "## Wirken", "Auf deinem Feld: Die Formeln des Elements, auf dem der Zeiger steht, wirkst du frei — so oft du Actions dafür hast.", "Abseits: Eine Formel eines anderen Elements kostet 1 Siegel. Der Zeiger bleibt dabei stehen, wo er ist.", "Siegel: Du hast INT-Modifier + halbes Level (abgerundet) Siegel, mindestens 1. Sie kehren beim Long Rest zurück."]}, {"h": "Säule 2 — Fluss", "body": ["Gewinnen: Ziehst du im Kreislauf (ein Feld weiter), gewinnst du 1 Fluss.", "Verlieren: Ziehst du einen Sprung — Gegenüber oder Dreieck —, fällt dein Fluss sofort auf 0.", "Höchstwert: 5 — also fünf Kreislauf-Züge in Folge, ohne dazwischen zu springen.", "| Fluss | Nachhall |", "| 1 | Deine Formeln verursachen +1 Schaden je Würfel. |", "| 2 | Der DC deiner Formeln steigt um 1. |", "| 3 | Einmal pro Runde wirkst du eine Formel eines anderen Elements ohne Siegel. |", "| 4 | Deine Formeln ignorieren Resistance gegen ihren Schadenstyp. |", "| 5 | Vollendeter Kreis: Einmal, während du auf 5 stehst, wirkst du in einem Zug je eine Formel ALLER sechs Elemente als eine einzige Action. Danach fällt dein Fluss auf 0. |"]}, {"h": "Eine andere Schule: Der Wheelbreaker", "body": ["Diese Wahl triffst du EINMAL, auf Stufe 1, und für immer: Der Wheelbreaker ersetzt Säule 1 (Das Rad) und Säule 2 (Fluss) vollständig. Alles andere — Formel-DC, Startausrüstung, die sechs Elemente selbst und ihr Wachstum auf den Stufen 5/9/13/17 — bleibt unverändert.", "## Ressourcen", "Spell Slots: Du hast eine Anzahl Spell Slots gleich deinem Charakterlevel. Sie kehren bei einem Long Rest vollständig zurück.", "Voller Zugriff: Du kennst und kannst jede der achtzehn Formeln aller sechs Elemente wirken — kein Rad, kein Feld, keine Pflicht zu ziehen. Shikigami falten und befehligen kannst du jederzeit, nicht nur auf einem bestimmten Feld.", "## Wirken auf gut Glück", "Wirkst du eine Formel, zahlst du 1 Spell Slot und würfelst sofort 1d100.", "| Wurf | Ergebnis |", "| 1–20 | Fehlschlag. Die Formel verpufft wirkungslos. Der Spell Slot ist trotzdem verbraucht. |", "| 21–40 | Falscher Griff. Statt deiner Formel wirkt eine zufällige — würfle 1d6 für das Element (1 Chi, 2 Sui, 3 Ka, 4 Fū, 5 Kū, 6 Shiki) und 1d3 für welche der drei Formeln darin (in der Reihenfolge aus der Tabelle „Die sechs Elemente\"). |", "| 41–60 | Die Formel wirkt genau wie beabsichtigt. |", "| 61–80 | Überschuss. Die Formel wirkt wie beabsichtigt, und du darfst im selben Zug sofort eine zweite Formel deiner Wahl wirken, ohne einen weiteren Spell Slot zu zahlen — das kostet dich keine zusätzliche Action, genau wie beim Vollendeten Kreis, der ebenfalls mehrere Formeln als eine einzige Action zählt. |", "| 81–99 | Vollgriff. Die Formel wirkt, als hättest du vier Kreislauf-Züge in Folge gemacht: +1 Schaden je Würfel, DC +1, und sie ignoriert Resistance gegen ihren Schadenstyp (siehe Fluss-Tabelle oben, Stufen 1, 2 und 4). |", "| 100 | Vollkommener Zufall. Wie 61–80 und 81–99 zusammen: Du wirkst deine Formel plus zwei weitere Formeln deiner Wahl, ohne weitere Spell Slots zu zahlen — und alle drei wirken als Vollgriff. |", "## Fremde Zauber", "Von den acht Stufen, an denen die Stufenübersicht ihm nichts gibt (1, 3, 7, 10, 11, 15, 18, 20), macht der Wheelbreaker etwas Eigenes: An jeder davon darfst du wählen, einen zusätzlichen Zauber aus der offiziellen D&D-Zauberliste zu lernen — vorausgesetzt, der Spielleiter erlaubt ihn in dieser Kampagnenwelt.", "| Stufe | Höchster Zaubergrad |", "| 1 | 1. Grad |", "| 3 | 1. Grad |", "| 7 | 2. Grad |", "| 10 | 3. Grad |", "| 11 | 3. Grad |", "| 15 | 4. Grad |", "| 18 | 5. Grad |", "| 20 | 6. Grad |", "Wirken: Ein gelernter Zauber kostet wie jede Formel 1 Spell Slot und durchläuft dieselbe Wirken-auf-gut-Glück-Tabelle oben — auch ein geliehener Zauber ist eine Wette, kein sicherer Griff.", "## Schmieden auf gut Glück", "Einmal pro Long Rest, während ein Gegenstand geschmiedet wird (siehe Handwerk-und-Sammeln.docx, „Vertiefungen\"), darfst du versuchen, ihn zu verzaubern — ohne dass der Spielleiter dafür zusätzliches Material verlangt, aber mit demselben Risiko wie jede deiner Formeln. Würfle 1d100.", "| Wurf | Ergebnis |", "| 1–20 | Fluch. Statt einer Verzauberung erhält der Gegenstand einen Fluch — der Spielleiter würfelt oder legt fest, welchen (Sesshō-seki, 8_Items/Wondrous Item/Legendaere-Artefakte/, ist das Vorbild für einen Fluchgegenstand in dieser Welt). |", "| 21–40 | Fehlgriff. Der Gegenstand erhält einen zufälligen, unpassenden Wondrous Effect oder nur einen +1 Enhancement Bonus — der Spielleiter entscheidet, was aus der Absicht geworden ist, unabhängig davon, was du eigentlich wolltest. |", "| 41–60 | Die Verzauberung gelingt genau wie mit dem Spielleiter abgesprochen (Enhancement Bonus oder Wondrous Effect). |", "| 61–80 | Überschuss. Die Verzauberung gelingt wie abgesprochen, und der Gegenstand erhält zusätzlich einen +1 Enhancement Bonus obendrauf. |", "| 81–99 | Vollgriff. Die Verzauberung gelingt in doppelter Stärke — ein Enhancement Bonus fällt um 1 höher aus, ein Wondrous Effect wirkt, als wäre er eine Stufe mächtiger. |", "| 100 | Vollkommener Zufall. Der Gegenstand erhält sowohl einen kräftigen Enhancement Bonus als auch einen mächtigen Wondrous Effect — die stärkste Verzauberung, die dieses Projekt kennt. |"]}, {"h": "Eine dritte Schule: Der Enchanter", "body": ["Ein Enchanter bleibt beim Rad — Säule 1 und Säule 2 gelten für ihn unverändert wie bei jedem Onmyōji. Der Unterschied zeigt sich erst auf Stufe 5, und dann bei jeder weiteren „Formeln steigen\"-Stufe (9, 13, 17): Statt seine eigenen Formeln stärker zu machen, legt er diese Kraft in die Gegenstände anderer.", "Die Wahl: Auf jeder dieser vier Stufen entscheidest du dich neu: den normalen +1d-Schadenswürfel-Bonus behalten, oder ihn gegen die passende Verzauberungsstufe unten eintauschen.", "| Stufe | Verzauberung statt +1d Schaden |", "| 5 | Ein Gegenstand, der gerade während eines Long Rests geschmiedet wird (siehe Handwerk-und-Sammeln.docx, „Vertiefungen\"), erhält einen +1 Enhancement Bonus, ohne dass der Spielleiter dafür zusätzliches Material verlangt. |", "| 9 | Wie Stufe 5, aber +2 Enhancement Bonus ODER ein einfacher Wondrous Effect nach Wahl des Spielleiters. |", "| 13 | Wie Stufe 5, aber +3 Enhancement Bonus ODER ein stärkerer Wondrous Effect nach Wahl des Spielleiters. |", "| 17 | Derselbe Gegenstand erhält einen +3 Enhancement Bonus UND einen Wondrous Effect gleichzeitig — was auf Stufe 9 und 13 noch eine Wahl war, ist jetzt beides zugleich. |", "Häufigkeit: Einmal pro Long Rest — dieselbe Grenze, die Handwerk-und-Sammeln.docx ohnehin fürs Schmieden setzt: ein Gegenstand pro Long Rest."]}, {"h": "Die sechs Elemente", "body": ["Die folgenden Formeln sind der Bestand, aus dem der Onmyōji schöpft; auf höheren Stufen werden sie stärker (siehe Stufentabelle).", "| Element | Wesen | Formeln |", "| 地 Chi — Erde | Standhalten, versperren, festhalten | Steinwall (Aktion): Eine Wand aus Erde, 30 ft. lang, 10 ft. hoch, blockiert Sicht und Bewegung, 1 Minute. · Wurzelgriff (Aktion): Ein Ziel in 60 ft. macht einen STR-Saving Throw oder ist restrained. · Standfest (Reaction): Du oder ein Verbündeter in 30 ft. kann nicht bewegt oder prone geworfen werden. |", "| 水 Sui — Wasser | Fließen, lösen, kühlen | Flutstoß (Aktion): 30-ft-Linie, 4d6 Bludgeoning Damage, DEX-Saving Throw halbiert, bei Misserfolg 10 ft. weggeschoben. · Lösende Woge (Aktion): Entferne eine Condition von einem Verbündeten in 30 ft. · Frostgriff (Aktion): 3d8 Cold Damage auf ein Ziel in 60 ft., halbierte Speed bis zum Ende seines nächsten Zuges. |", "| 火 Ka — Feuer | Verzehren, treiben, vernichten | Flammenwurf (Aktion): 20-ft-Kegel, 5d6 Fire Damage, DEX-Saving Throw halbiert. · Zündung (Aktion): Ein Ziel in 60 ft. macht einen DEX-Saving Throw oder brennt: 2d6 Fire Damage zu Beginn jedes seiner Züge, bis es die Flammen löscht. · Aschesicht (Bonus Action): Du siehst durch Rauch, Nebel und Dunkelheit auf 60 ft. |", "| 風 Fū — Wind | Bewegen, verschieben, tragen | Sturmstoß (Aktion): Alle Gegner in 15 ft. machen einen STR-Saving Throw oder werden 15 ft. weggeschleudert. · Windschritt (Bonus Action): Du bewegst dich bis zu 30 ft., ohne Opportunity Attacks auszulösen. · Tragende Böe (Aktion): Ein Verbündeter in 30 ft. erhält für 1 Minute eine Flugbewegungsrate von 30 ft. |", "| 空 Kū — Leere | Auflösen, verneinen, entleeren | Verneinung (Reaction): Eine Formel oder ein Zauber, den du siehst, wird aufgehoben, wenn sein Grad höchstens dein halbes Level beträgt. · Leerer Griff (Aktion): Ein Ziel in 60 ft. macht einen WIS-Saving Throw oder verliert Soul HP in Höhe deines INT-Modifiers. · Ungeschehen (Aktion): Ein Effekt in 30 ft., der eine Fläche belegt, endet. |", "| 式 Shiki — Form | Binden, befehlen, deuten | Shikigami falten (Aktion): siehe unten. · Bannkreis (Aktion): Ein 15-ft-Ring; Yokai und Untote müssen einen WIS-Saving Throw bestehen, um ihn zu betreten. · Die nächste Stunde lesen (Aktion, außerhalb des Kampfes): Der Spielleiter nennt dir eine Gefahr, die in der nächsten Stunde eintreten wird — nicht ihre Ursache und nicht ihren Ausgang. |", "## Shikigami", "Papierdiener, gefaltet und mit einem Namen beschriftet. Nur auf dem Feld Shiki kann er sie falten und befehligen.", "Falten: Aktion auf dem Feld Shiki. Du erschaffst einen Shikigami, der 1 Stunde besteht oder bis er zerstört wird. Du kannst gleichzeitig so viele haben, wie dein INT-Modifier beträgt (mindestens 1).", "Werte: AC 13, Hit Points gleich deinem Level, Speed 30 ft. (fliegend). Er handelt auf deiner Initiative. Angriff: +deinen Formel-Angriffsbonus, 1d6 + INT-Modifier Slashing Damage (Papierschnitt).", "Befehlen: Auf dem Feld Shiki befehligst du alle Shikigami frei. Auf jedem anderen Feld führen sie nur den letzten Befehl weiter aus.", "Späher: Ein Shikigami kann statt zu kämpfen bis zu 1 Meile weit auskundschaften. Du siehst und hörst durch ihn, während du dich nicht bewegst."]}], "intro": []}, {"id": "hanyo", "name": "Hanyō", "kanji": "半妖", "hd": 8, "saves": ["con", "dex"], "skills": {"n": 2, "from": ["Acrobatics", "Athletics", "Deception", "Intimidation", "Perception", "Stealth", "Survival"]}, "basics": {"Ressourcen": "Yōki (Kampfressource), Pakte (dauerhafte Macht gegen Opfer), Corruption als Treibstoff.", "Primärattribut": "Konstitution (bestimmt den Saving Throw DC seiner Fähigkeiten). Klauenangriffe nutzen Strength oder Dexterity.", "Hit Die": "1d8", "Saving Throws": "CON, DEX", "Weapon Proficiencies": "Simple, natürliche Waffen (Klauen und Biss)", "Armor Proficiencies": "Light oder keine (deine Wahl), sofern sie die Klauen nicht behindert", "Skills": "2 aus: Acrobatics, Athletics, Deception, Intimidation, Perception, Stealth, Survival", "Tools": "Keine", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Rasse": "NUR MENSCH. Ein Yokai kann kein Hanyō sein — er hätte nichts zu leihen, was er nicht schon besitzt. Diese Klasse ist der Weg eines Menschen, der Stücke von sich verkauft und dadurch wird, was er handelt.", "Izanamis Ruf": "Als Mensch geboren erreicht dich Izanamis Ruf zunächst nicht. Ab Yokai-Grad 3 — wenn geweihter Boden unter dir brennt und Priester dich als Yokai erkennen — kann er dich in deinen Träumen erreichen. Du bist der einzige Charakter am Tisch, der im Lauf der Kampagne verdächtig WIRD."}, "start": [{"k": "Waffen", "v": "Keine nötig — Klauen und Biss sind immer verfügbar. Optional ein Tantō, um als Mensch unauffällig bewaffnet zu wirken."}, {"k": "Rüstung", "v": "Keine oder leichte Rüstung, sofern sie die Klauen nicht behindert."}, {"k": "Zusätzlich", "v": "Unauffällige Alltagskleidung, um als Mensch durchzugehen."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Yōki; Verderbnis annehmen; Klauen und Zähne (1d6); Erster Pakt-Platz", "2": "Verderbnis abstoßen", "3": "Witterung; Yokai-Grad beginnt zu wirken", "4": "Ability Score Improvement", "5": "Klauen 1d8", "6": "Zweiter Pakt-Platz; Zäher Leib", "7": "—", "8": "Ability Score Improvement", "9": "Zusätzlicher Klauenangriff pro Zug", "10": "Yōki-Aufladung steigt um 1 pro Zug", "11": "Dritter Pakt-Platz; Klauen 1d10", "12": "Ability Score Improvement", "13": "—", "14": "Zäher Leib heilt doppelten Proficiency Bonus", "15": "—", "16": "Vierter Pakt-Platz; Ability Score Improvement", "17": "Klauen 2d6", "18": "Witterung reicht 300 ft. und du erkennst die Art des Yokai", "19": "Ability Score Improvement", "20": "Kapstein (siehe oben)"}, "msnotes": [], "rules": [{"h": "Yōki — die Maschine", "body": ["Pool: Dein Yōki-Höchstwert entspricht deinen maximalen Soul HP.", "Verderbnis annehmen (Bonus Action): Du nimmst den Corruption-Debuff willentlich an — überall, jederzeit, ohne Quelle. Du trägst deine eigene Verdammnis mit dir.", "Aufladen: Solange du Corruption trägst, gewinnst du zu Beginn jedes deiner Züge im Kampf Yōki in genau der Höhe, die dich der Debuff sonst an Soul HP gekostet hätte (ein Viertel deines Maximums, aufgerundet). Du verlierst dabei keine Soul HP.", "Überlauf: Ist dein Pool voll und du gewinnst weiter Yōki, schlägt der Überschuss doch auf deine Soul HP durch. Wer randvoll ist, blutet wie alle anderen.", "Abstoßen (Action): Du wirfst den Corruption-Debuff ab — als Einziger im Spiel ohne Schrein und ohne Talisman. Dabei verlierst du deinen gesamten Yōki-Vorrat."]}, {"h": "Klauen und Zähne", "body": ["Seine Grundausstattung, immer verfügbar, ohne Yōki-Kosten.", "Natürliche Waffen: Klauen und Biss gelten als magische Waffen. Klauen 1d6 Slashing Damage (Stufe 5: 1d8, Stufe 11: 1d10, Stufe 17: 2d6), Biss 1d8 Piercing Damage.", "Zäher Leib (ab Stufe 6): Solange du Corruption trägst, gewinnst du zu Beginn deines Zuges Hit Points in Höhe deines Proficiency Bonus zurück, sofern du über 0 TP bist.", "Witterung (ab Stufe 3): Du riechst Corruption. Du spürst verdorbene Wesen und Orte im Umkreis von 60 ft."]}, {"h": "Die Pakte", "body": ["Er bietet einem Yokai ein Stück von sich an — ein Auge, einen Arm, seine Stimme, seinen Schatten. Er erhält dessen Macht dauerhaft und trägt dafür einen dauerhaften Malus. Tötet er später genau diesen Yokai, bekommt er das Stück zurück: Der Malus fällt weg, die Macht bleibt.", "Pakt-Plätze: Vier insgesamt, freigeschaltet auf den Stufen 1, 6, 11 und 16.", "Pakt schließen: Erfordert einen willigen Yokai und eine Stunde. Der Spielleiter setzt diesen Yokai als benannte Kreatur in die Welt — er existiert, er hat einen Namen, und er trägt ein Stück deines Körpers.", "Zurückfordern: Tötest du den Yokai, mit dem du den Pakt geschlossen hast, bekommst du ALLES zurück, was du ihm je gezahlt hast — Körperteile, Hit Points, Seele. Die Fähigkeiten dieses Pakts behältst du für immer. Der Pakt-Platz wird NICHT frei; die Macht bleibt gebunden, nur der Preis entfällt.", "## Pakt-Tiefen", "Du zahlst dich Stufe für Stufe hinein — jede Tiefe kostet ein weiteres Opfer an denselben Yokai.", "| Tiefe | Gesamtkosten | Was du erhältst |", "| 1 | ein Opfer | Die dauerhafte Eigenschaft des Yokai und seine erste Fähigkeit. |", "| 2 | ein weiteres Opfer | Zusätzlich seine zweite Fähigkeit. |", "| 3 | ein weiteres Opfer | Zusätzlich seine dritte Fähigkeit. |", "## Womit du bezahlst", "Jedes Opfer zählt gleich viel — aber Körperteile sind endlich, Lebenskraft und Seele nicht.", "| Opfer | Malus, bis du ihn zurückholst | Wiederholbar |", "| Ein Auge | Disadvantage auf Ranged Attacks und auf Perception, die auf Sehen beruht. | zweimal |", "| Ein Arm | Du kannst keine zweihändigen Waffen führen und hast Disadvantage auf Athletics und Griffe. | zweimal |", "| Deine Stimme | Du kannst nicht sprechen — keine verbalen Komponenten und keine Charisma-Würfe, die Sprache erfordern (Deception, Persuasion, verbale Intimidation). Wortlose Einschüchterung, Performance ohne Worte und Schrift bleiben dir. | einmal |", "| Dein Schatten | Du kannst dich nicht verstecken; Stealth misslingt automatisch, solange du gesehen werden könntest. | einmal |", "| Dein Schmerzempfinden | Du bemerkst nicht, wie schwer du verletzt bist: Der Spielleiter führt deine Hit Points verdeckt. | einmal |", "| Lebenskraft | Deine maximalen Hit Points sinken um das Fünffache deines Levels. | beliebig oft |", "| Seele | Deine maximalen Soul HP sinken um 5 — und damit auch dein Yōki-Höchstwert. | beliebig oft |", "## Stufen-Pakte — wenn der Pate eine ausgebaute Rasse ist", "Vier der sieben Paten unten (Tengu, Oni, Kitsune, Yuki-onna) gehören zu Yokai-Rassen, die längst eine eigene Stufen-Fortschreibung von 1 bis 20 haben (siehe 2_Fuer-Spieler/Rassen). Für diese vier gilt eine eigene Regel statt der festen Drei-Fähigkeiten-Liste:", "Der Reihe nach, keine Lücken: Ein Pakt mit einem dieser vier Paten schaltet die Fähigkeiten seiner Rassen-Fortschreibung in der dort gedruckten Reihenfolge frei — du kannst keine einzelne späte Fähigkeit herauspicken, ohne die früheren derselben Reihe zu besitzen. Das ist keine Einschränkung um ihrer selbst willen: Viele späte Fähigkeiten setzen frühere ausdrücklich voraus (Kitsunes Flammenmeisterung nennt zum Beispiel Fuchsfeuer namentlich) — ohne die Reihenfolge hinge die Fähigkeit in der Luft.", "| Pakt-Tiefe | Reichweite in der Rassen-Fortschreibung |", "| 1 | Alles bis einschließlich der Fähigkeit auf Stufe 7 |", "| 2 | Alles bis einschließlich der Fähigkeit auf Stufe 13 |", "| 3 | Die gesamte Fortschreibung bis Stufe 20 |", "Level-Gate: Eine freigeschaltete Fähigkeit darfst du erst einsetzen, sobald deine eigene Charakterstufe die Stufe erreicht, auf der sie in der Rassen-Fortschreibung steht — unabhängig davon, wie weit deine Pakt-Tiefe schon reicht. Du kannst dich also früh in eine mächtige, späte Fähigkeit einkaufen und musst dann warten, bis du sie dir verdient hast.", "Eigene Nutzungsregel: Jede so erhaltene Fähigkeit behält die Nutzungsbeschränkung, die in ihrer Rassen-Fortschreibung steht (Long Rest, Short Rest, passiv, an eine andere Fähigkeit gebunden, …). Sie kostet KEIN Yōki, außer die Fortschreibung sagt selbst etwas anderes."]}, {"h": "Pakt-Archetypen", "body": ["Zwei verschiedene Systeme, je nachdem, ob der Pate zu einer Rasse mit eigener Stufen-Fortschreibung gehört.", "## Stufen-Pakte: Tengu, Oni, Kitsune, Yuki-onna", "Was jede Pakt-Tiefe an Fähigkeiten enthält, nach Namen — volle Wirkung im jeweiligen Rassen-Dokument (siehe „Stufen-Pakte\" oben für Regeln zu Reihenfolge und Level-Gate).", "| Pakt & Pate | Dauerhafte Eigenschaft | Tiefe 1 (bis Stufe 7) | Tiefe 2 (bis Stufe 13) | Tiefe 3 (bis Stufe 20) |", "| Tengu Sōjōbō | Fällt nie schneller als 60 ft./Runde, kein Falling Damage. | Schüler der Waffen, Federschlag, Schule der Gerechten | + Waffengelehrter, Krieger der Lüfte, Scharfsinniger Blick | + Master Flyer, Meister der Berge, Waffenmeister, Schwingenmeister |", "| Oni Shuten-dōji | Trageleistung verdoppelt; Advantage gegen Grappled und Zu-Boden-Werfen. | Monströse Stärke, Wutangriff, Mountain Strength | + Monströse Wut, Strength of Many, Oni Clobbering | + Oni Trajectory, Oni Ascendence, Oni Madness, Kapstein (Stufe 20) |", "| Kitsune Tamamo-no-Mae | Advantage auf Deception und auf Saving Throws gegen Illusionen. | Zwillingstrugbild (Stufe 4) — mehr nicht, siehe Deckel unten | — (Deckel gilt weiter) | — (Deckel gilt weiter) |", "| Yuki-onna O-Yuki | Immun gegen Kälte; hinterlässt keine Spuren im Schnee. | Eismagie, Lawinenruf, Schneeillusion | + Eiswaffe, Snowgrave, Eisige Gegenwart | + Schneemonstrosität, Eisernes Herz, Der eisige Schwur, Königin der Berge |", "## Feste Pakte: Jorōgumo, Nue, Daija", "Diese drei Paten gehören zu keiner Rasse mit eigener Stufen-Fortschreibung. Sie behalten das ursprüngliche System: drei feste Fähigkeiten mit Yōki-Kosten, die nacheinander mit den Pakt-Tiefen freischalten.", "| Pakt & Pate | Dauerhafte Eigenschaft | Fähigkeiten (Yōki-Kosten) |", "| Jorōgumo Die Spinne vom Jōren-Wasserfall | Du kannst an Wänden und Decken klettern, ohne zu würfeln. | Fangfaden (1): Ein Ziel in 30 ft. macht einen DEX-Saving Throw oder ist restrained. · Gift (2): Dein nächster Treffer macht +4d6 Poison Damage, CON-Saving Throw oder poisoned. · Netzfeld (4): 20-ft-Radius wird zu Difficult Terrain; wer darin endet, wird restrained. |", "| Nue Der Nue vom Kaiserpalast | Du kannst deine Stimme und deinen Umriss verzerren; Advantage auf Intimidation. | Schrei (2): Alle Gegner in 30 ft. machen einen WIS-Saving Throw oder sind 1 Minute lang frightened. · Fremde Glieder (3): Bis zum Ende deines nächsten Zuges erhältst du einen zusätzlichen Klauenangriff pro Zug. · Ungestalt (5): 1 Minute lang haben Angriffe gegen dich Disadvantage, weil niemand sagen kann, wo du endest. |", "| Daija Kiyohime | Du kannst deinen Kiefer ausrenken und dich durch jede Öffnung zwängen, durch die dein Kopf passt; Advantage auf Saving Throws gegen Gift. | Umschlingen (2): Ein Ziel in Reichweite macht einen STR-Saving Throw oder wird restrained und erleidet zu Beginn jedes seiner Züge 3d8 Bludgeoning Damage. · Häutung (3): Du streifst deine Haut ab — entferne alle Conditions und Krankheiten von dir und heile 4d8 Hit Points. · Schlangenleib (4): 1 Minute lang wirst du zu einer großen Schlange: Kletter- und Schwimmrate 40 ft., +5 ft. Reichweite, und dein Biss verursacht zusätzlich 3d6 Poison Damage. |", "## Die legendären Paten", "Jeder Pakt wird mit dem gefährlichsten Vertreter seiner Art geschlossen — nicht mit irgendeinem Yokai. Damit steht jede Jagd von Anfang an fest, und jede ist eine eigene Sage.", "| Pate | Wer er ist und was ihn gefährlich macht |", "| Sōjōbō | König der Tengu, Großer Tengu vom Berg Kurama. Er lehrte Minamoto no Yoshitsune das Schwert und soll die Kraft von tausend Tengu besitzen. Wer ihn stellt, kämpft gegen den Lehrmeister aller Fechter. |", "| Shuten-dōji | Der mächtigste Oni der Überlieferung, Herr der Dämonen vom Ōe-Berg. Minamoto no Raikō bezwang ihn nur, indem er ihn mit poisonedem Sake betrunken machte — offen war er nicht zu schlagen. |", "| Tamamo-no-Mae | Die Neunschwänzige, die in Menschengestalt den Hof betörte, bis Abe no Yasunari sie entlarvte. Nach ihrem Tod wurde sie zum Sesshō-seki, dem Tötenden Stein, der alles poisonede, was ihn berührte. |", "| Die Spinne vom Jōren-Wasserfall | Sie legt ihre Fäden um die Knöchel derer, die zu nahe ans Wasser treten, und zieht sie hinab. Wer ihren Namen kennt und ihn ausspricht, gehört ihr. |", "| O-Yuki | Die Schneefrau, die einen jungen Holzfäller verschonte und ihn Jahre später als Ehefrau wiederfand — unter der Bedingung, dass er nie erzählt, was er in jener Nacht sah. Sie hält Wort, solange man Wort hält. |", "| Der Nue vom Kaiserpalast | Affenkopf, Tanukileib, Schlangenschwanz, Tigerpranken. Er hockte als schwarze Wolke über dem Palast und ließ den Kaiser erkranken, bis Minamoto no Yorimasa ihn im Dunkeln herabschoss. |", "| Kiyohime | Aus Eifersucht auf den Mönch Anchin wurde sie zur großen Schlange, verfolgte ihn bis zum Dōjō-ji und verbrannte ihn in der Glocke, unter der er sich versteckte. Liebe, die nicht loslässt. |"]}, {"h": "Der Yokai-Grad", "body": ["Die Uhr braucht keine eigene Mechanik: Dein Yokai-Grad ist die Zahl deiner OFFENEN Pakte — jener, deren Yokai noch lebt und noch ein Stück von dir hält.", "| Offene Pakte | Wirkung |", "| 1 | Deine Augen spiegeln im Dunkeln. Du siehst 60 ft. weit in Dunkelheit. |", "| 2 | Deine Zähne und Klauen wachsen sichtbar. +1 auf Damage Rolls mit natürlichen Waffen. Menschen weichen dir aus; Disadvantage auf Persuasion gegenüber Fremden. |", "| 3 | Dein Yokai-Blut siegt sichtbar. +2 auf Damage Rolls, du benötigst keine Nahrung mehr — aber Schreinpriester und Yokai Hunter erkennen dich als Yokai, und geweihter Boden brennt unter deinen Füßen (1d6 pro Runde). |", "| 4 | Du bist kaum noch Mensch. +3 auf Damage Rolls, Resistenz gegen Necrotic Damage — und wenn deine Soul HP in diesem Condition jemals auf 0 fallen, übernimmt der Spielleiter deinen Charakter dauerhaft als Yokai. |", "## Zurückgeforderte Pakte", "Eine zweite, unabhängige Zählung neben den offenen Pakten: Wie viele deiner Paten hast du bereits erschlagen und dir zurückgeholt, was du ihnen gabst? Offene und zurückgeforderte Pakte wirken gleichzeitig — ein Hanyō mit zwei offenen und einem zurückgeforderten Pakt hat die Wirkung von „2 offene Pakte\" UND „1 zurückgeforderter Pakt\" zugleich.", "| Zurückgeforderte Pakte | Wirkung |", "| 1 | Du hast bewiesen, dass du zurücknehmen kannst, was dir gehört. Einmal pro Long Rest darfst du einen misslungenen Saving Throw gegen frightened oder charmed wiederholen. |", "| 2 | +1 auf einen Ability Score deiner Wahl, dauerhaft (bis zum Maximum von 20). Das kommt zusätzlich zu deinen regulären Ability Score Improvements. |", "| 3 | Bei einem Short Rest darfst du zusätzlich einen Hit Die auswürfeln, ohne einen deiner eigenen Hit Dice dafür auszugeben, und die Hit Points sofort gutschreiben. |", "| 4 | Kein sichtbares Yokai-Zeichen mehr, gleich wie viele Pakte du je offen hattest oder noch hast — du siehst vollständig menschlich aus. Das nimmt die Erkennungs- und Brand-Klauseln der Offene-Pakte-Tabelle für die Außenwirkung, ändert aber nichts an tatsächlich noch offenen Pakten selbst. |"]}, {"h": "Kapstein (Stufe 20)", "body": ["Was du auf Stufe 20 bist, hängt davon ab, wie du gespielt hast — nicht davon, was du gewählt hast.", "Ganz und doch nicht (alle vier Pakte zurückgefordert): Du bist wieder vollständig und behältst jede geliehene Macht. Du kannst nicht mehr unfreiwillig zum Yokai werden. Deine Yōki-Aufladung verdoppelt sich, und du darfst Corruption abstoßen, ohne deinen Vorrat zu verlieren.", "Was übrig blieb (drei oder mehr Pakte offen): Du hast zu viel von dir weggegeben. Dein Yōki-Höchstwert verdoppelt sich, und du erhältst einen weiteren Klauenangriff pro Zug — aber du kannst Corruption nicht mehr abstoßen. Was du bist, bist du für immer."]}], "intro": [], "onlyRace": "mensch"}, {"id": "biwahoshi", "name": "Biwa hōshi", "kanji": "琵琶法師", "hd": 8, "saves": ["wis", "cha"], "skills": {"n": 3, "from": ["Deception", "History", "Insight", "Perception", "Performance", "Persuasion", "Religion"]}, "basics": {"Ressourcen": "Namen (dauerhafte Sammlung), Soul HP (Preis für Beschwörungen), Strophen (Kampfressource).", "Primärattribut": "Charisma bestimmt den Saving Throw DC und die Stärke seiner Rezitationen.", "Hit Die": "1d8", "Saving Throws": "WIS, CHA", "Weapon Proficiencies": "Simple", "Armor Proficiencies": "Keine", "Skills": "3 aus: Deception, History, Insight, Perception, Performance, Persuasion, Religion", "Tools": "Musical Instrument (Biwa)", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Blindheit": "Ein Biwa hōshi ist traditionell blind. Er erhält Blindsight 30 ft. und kann nicht blinded werden; außerhalb dieser Reichweite ist er auf Gehör und die Beschreibungen anderer angewiesen. Die Blindheit ist optional — ein sehender Spieler verzichtet auf Blindsight und Blindheitsimmunität."}, "start": [{"k": "Waffe", "v": "Ein Bō als Wanderstab (siehe Waffen-der-Inseln.docx) — improvisierte Nahkampfwaffe, kein Kampfwerkzeug."}, {"k": "Rüstung", "v": "Keine."}, {"k": "Zusätzlich", "v": "Eine Biwa (dein Instrument), dein leeres Epos für Strophen."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Namen sammeln; Namensrezitation; zwei Strophen deiner Wahl; Blindsight", "2": "Heimkehr möglich (Segen und Fusionen)", "3": "Namen der Ungehörten", "4": "Ability Score Improvement", "5": "Trostlied; eine weitere Strophe deiner Wahl", "6": "Rezitation reicht 60 ft.", "7": "Widerhall rufen", "8": "Ability Score Improvement", "9": "Rezitation gibt doppelten CHA-Modifikator; eine weitere Strophe ODER ein Widerhall-Rang", "10": "Zwei Strophen gleichzeitig halten", "11": "Widerhall bis CR gleich halber Stufe", "12": "Ability Score Improvement", "13": "Widerhall hält 5 Runden; eine weitere Strophe ODER ein Widerhall-Rang", "14": "Zwei Fusionen im Epos gleichzeitig möglich", "15": "Namen der Ungehörten wirkt auch auf Wesen ohne bekannten Namen, wenn du ihre Geschichte kennst", "16": "Ability Score Improvement", "17": "Rezitation gibt dreifachen CHA-Modifikator; eine weitere Strophe ODER ein Widerhall-Rang", "18": "Du darfst einen Widerhall und eine Fusion gleichzeitig gerufen haben", "19": "Ability Score Improvement", "20": "Unvergessen: Widerhalle verbrauchen keine Namen mehr"}, "msnotes": [], "rules": [{"h": "Säule 1 — Namen", "body": ["Der Biwa hōshi sammelt Namen und die Geschichten, die daran hängen.", "Einen Namen erwerben: Du erfährst den Namen eines toten oder verlorenen Wesens UND ein Stück seiner Geschichte — von einem Zeugen, aus einer Inschrift, aus einer Vision, von einem Geist selbst oder aus dem Mund des Wesens, als es noch lebte. Beides zusammen macht den Namen brauchbar; ein Name ohne Geschichte ist nur Klang.", "Aufzeichnen: Du trägst ihn als Strophe in dein Epos ein. Das Epos ist ein echtes Dokument am Tisch — führe es.", "Anzahl: Unbegrenzt. Du darfst so viele Namen sammeln, wie du findest.", "## Rezitieren", "Namensrezitation (Action): Du sprichst einen Namen aus deinem Epos. Wähle eine Kreatur in 30 ft.: Sie gewinnt Soul HP in Höhe deines Charisma Modifiers zurück (Stufe 9: doppelt, Stufe 17: dreifach). Der Name wird dabei nicht verbraucht.", "Häufigkeit: Proficiency Bonus-mal pro Long Rest.", "Trostlied (Stufe 5): Statt einer einzelnen Kreatur erreichst du alle Verbündeten in 30 ft. — jeder gewinnt Soul HP in Höhe der Hälfte deines Charisma Modifiers (aufgerundet).", "Namen der Ungehörten (Stufe 3): Du kannst einem Geist, einem Onryō oder einem verdorbenen Wesen seinen eigenen Namen zurückgeben, wenn du ihn kennst. Es macht einen WIS-Saving Throw gegen deinen DC; bei Misserfolg hört es auf zu kämpfen und hört dir zu. Gegen Wesen, die aus Trauer oder gebrochenem Schwur handeln, hat es Disadvantage auf diesen Wurf."]}, {"h": "Säule 2 — Widerhalle", "body": ["Widerhall rufen (Action, ab Stufe 7): Du gibst einen Namen aus deinem Epos auf und zahlst Soul HP. Eine geistige Kopie dieses Wesens erscheint in 30 ft.", "Kosten: Soul HP gleich der Hälfte des Challenge Ratinges des Wesens, aufgerundet, mindestens 1. Ein Wesen mit CR 8 kostet also 4 Soul HP.", "Der Name ist danach fort: Die Strophe erlischt. Du kannst dieses Wesen nicht erneut rufen und seinen Namen nicht mehr rezitieren, bis du ihn wieder erwirbst.", "Grenze: Ein Widerhall zur Zeit. Der Challenge Rating des Wesens darf höchstens deine halbe Stufe betragen (abgerundet).", "## Wie ein Widerhall funktioniert", "| Regel | Wirkung |", "| Keine Hit Points | Ein Widerhall hat keine Hit Points und kann nicht verletzt, charmed, frightened oder getötet werden. Er kann nicht Ziel von Angriffen sein. Nichts daran ist zu verwalten. |", "| Dauer | 3 Runden (ab Stufe 13: 5 Runden). Danach verblasst er ohne Rest. |", "| Handeln | Er handelt auf deiner Initiative unter deiner Kontrolle. Er nutzt die Angriffe und Fähigkeiten des Wesens, dessen Erinnerung er ist — aber keine Legendary Actions, keine Beschwörungen und nichts, was Hit Points oder Ressourcen verlangt. |", "| Kein Körper | Er kann nicht tragen, nicht heben, keine Türen öffnen und keine Gegenstände benutzen, die nicht Teil seiner Erinnerung sind. Seine Angriffe wirken dennoch. |", "| Blockiert nicht | Er nimmt keinen Raum ein und gewährt keine Deckung. Kreaturen bewegen sich durch ihn hindurch. |", "## Widerhall-Rang", "Ab Stufe 9 entscheidet er, wie weit er gehen will: mehr Lieder — oder mehr und stärkere Erinnerungen, die auf seinen Ruf antworten. Auf den Stufen 9, 13 und 17 darf er statt einer neuen Strophe (siehe Säule 4) einen Widerhall-Rang wählen.", "| Rang-Option | Wirkung |", "| Mehr Widerhalle | Die Grenze gleichzeitig aktiver Widerhalle steigt um 1. Höchstens zweimal wählbar (macht insgesamt höchstens drei gleichzeitig). |", "| Mächtigere Widerhalle | Die CR-Grenze deiner Widerhalle und Fusionen steigt um 2 zusätzlich zur sonst geltenden Grenze, und ihre Dauer steigt um 1 Runde. Beliebig oft wählbar. |", "## Unvergessen (Stufe 20)", "Wirkung: Ein Widerhall verbraucht den Namen nicht mehr. Du kannst jedes Wesen in deinem Epos beliebig oft rufen — die Soul-HP-Kosten bleiben."]}, {"h": "Säule 3 — Heimkehr", "body": ["Eine Heimkehr vollziehen: Du bringst den Namen und die Geschichte eines verlorenen Wesens zu einer Kreatur, der dieses Wesen wichtig war — einem Hinterbliebenen, einem Gefährten, einem Wächter, einem Feind, der es geliebt hat. Du erzählst. Das kostet keine Ressource, nur Zeit und die Reise dorthin.", "Belohnung: Du erhältst dauerhaft einen Segen, der von dem Wesen abhängt, dessen Name heimgekehrt ist. Und du erhältst eine Fusion.", "## Fusionen", "Was es ist: Beide Namen — der des Verlorenen und der des Hinterbliebenen — verschmelzen in deinem Epos zu einer einzigen Strophe. Du kannst die Fusion als Widerhall rufen: ein Wesen, das beide zugleich ist.", "Dauerhaft: Eine Fusion verbraucht keinen Namen, auch vor Stufe 20 nicht. Sie ist für immer Teil deines Epos.", "Stärker: Eine Fusion darf einen Challenge Rating bis zu deiner vollen Stufe haben (statt der Hälfte) und hält doppelt so lange wie ein normaler Widerhall. Sie darf die stärkste Form beider Wesen annehmen, auch eine, die im Leben nur einmal erschienen ist.", "Grenze: Auch von Fusionen ist nur eine zur Zeit gerufen. Die Soul-HP-Kosten richten sich nach ihrem Challenge Rating wie üblich.", "## Segen nach Wesen — Vorlage", "Der Segen richtet sich nach dem, was das heimgekehrte Wesen war. Die folgende Tabelle ist eine Vorlage; der Spielleiter trägt die konkreten Wesen seiner Kampagne ein und wählt den passenden Segen.", "| Wesen war … | Segen |", "| ein Wächter | Verbündete in 30 ft. erhalten +1 auf die Armor Class, solange du bei Bewusstsein bist. |", "| ein Krieger | Einmal pro Kampf darfst du einem Verbündeten als Reaction einen zusätzlichen Waffenangriff gewähren. |", "| ein Heiler oder Priester | Deine Namensrezitation gibt zusätzlich Hit Points in gleicher Höhe wie Soul HP. |", "| ein Verratener oder Ermordeter | Du hast Advantage auf Würfe, um Lügen zu erkennen, und einmal pro Long Rest darfst du eine Kreatur in 30 ft. zu einem CHA-Saving Throw gegen deinen DC zwingen; bei Misserfolg beantwortet sie eine Frage wahrheitsgemäß. |", "| ein Liebender oder Trauernder | Deine Rezitationen wirken auch auf Kreaturen, die dich nicht hören können, und du gewinnst eine zusätzliche Nutzung pro Long Rest. |", "| ein Verlorener oder Wanderer | Du kennst stets den Weg zum nächsten Schrein und spürst, ob er verdorben ist. |", "| ein Gelehrter oder Erzähler | Du darfst einen Namen erwerben, indem du eine Stunde in einem Archiv oder an einem Grab verbringst, ohne einen Zeugen zu brauchen. |"]}, {"h": "Säule 4 — Strophen im Kampf", "body": ["Spielen (Bonus Action): Du beginnst eine Strophe. Solange du sie hältst (Concentration), wirkt sie. Du darfst dich bewegen und rezitieren, aber keine Waffe führen.", "Lernen: Auf Stufe 1 wählst du zwei Strophen aus der Liste unten, auf Stufe 5 eine weitere. Auf den Stufen 9, 13 und 17 wählst du entweder eine weitere Strophe ODER einen Widerhall-Rang (siehe Säule 2) — nicht jeder Biwa hōshi kennt am Ende dieselben Lieder.", "| Strophe | Mindeststufe | Wirkung, solange du spielst |", "| Die Klage | 1 | Verbündete in 30 ft. erhalten +1d4 auf Saving Throws. |", "| Das Heldenlied | 1 | Verbündete in 30 ft. erhalten +1d4 auf Attack Rolls. |", "| Das Wanderlied | 1 | Verbündete in 30 ft. ignorieren Difficult Terrain und erhalten +10 ft. Speed. |", "| Das Erinnerungslied | 1 | Verbündete in 30 ft. haben Advantage auf Checks, die Wissen, Geschichte oder Erinnerung betreffen. |", "| Das Mahnlied | 5 | Ein Gegner deiner Wahl in 60 ft. macht einen WIS-Saving Throw; bei Misserfolg hat er Disadvantage auf Angriffe gegen jeden außer dir. |", "| Das Spottlied | 5 | Ein Gegner deiner Wahl in 30 ft. macht zu Beginn deines Zuges einen WIS-Saving Throw; bei Misserfolg muss er in seinem nächsten Zug dich angreifen, wenn er kann. |", "| Das Totenlied | 9 | Untote und Yomi-Wesen in 30 ft. erleiden zu Beginn deines Zuges 2d8 Radiant Damage. |", "| Das stille Lied | 13 | Verbündete in 30 ft. verlieren durch Corruption keine Soul HP, solange du spielst. Entfernt sie nicht. |", "| Das Schlaflied | 13 | Zu Beginn deines Zuges macht ein Gegner deiner Wahl in 30 ft. einen WIS-Saving Throw oder ist bis zum Ende seines nächsten Zuges incapacitated. |", "| Das letzte Lied | 17 | Fällt ein Verbündeter in 30 ft. auf 0 Hit Points, darf er sofort mit 1 Trefferpunkt aufstehen. Einmal pro Kampf. |"]}], "intro": []}, {"id": "ninja", "name": "Ninja", "kanji": "忍者", "hd": 10, "saves": ["dex"], "skills": {"n": 0, "fixed": ["Acrobatics", "Sleight of Hand", "Stealth"]}, "basics": {"Konzept": "Der Umgang mit abgelenkten Gegnern — solange du ungesehen bleibst.", "Primärattribut": "Dexterity. Vielleicht Charisma als Alternative, wegen Performance im Way of the Mist.", "Hit Die": "1d10", "Saving Throws": "DEX", "Weapon Proficiencies": "Wähle 2 aus: Improvised, Versatile, Simple, Martial Weapons", "Armor Proficiencies": "Light", "Skills": "Acrobatics, Sleight of Hand, Stealth", "Tools": "Disguise Kit, Thieves' Tools, Gaming Set", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1."}, "start": [{"k": "Waffen", "v": "Wähle eine Versatile-Waffe als Startwaffe: Katana oder Bō (Werte siehe Waffen-der-Inseln). Weitere Ninja-Waffen: Kunai, Wurfstern und Jitte."}, {"k": "Rüstung", "v": "Hara-ate (Light Armor, AC 11 + DEX-Modifier, siehe Ruestung-der-Inseln)."}, {"k": "Spezialitem", "v": "Wähle eins: Disguise Kit, Thieves' Tools oder Gaming Set."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Proficiencies: 2 aus Improvised, Versatile, Simple und Martial Weapons; DEX-Saving Throw, Acrobatics, Sleight of Hand, Stealth, Light Armor", "2": "Cunning Action (vom Rogue)", "3": "Wähle deinen Weg (erste Fähigkeit des Wegs)", "4": "Ability Score Improvement", "5": "Zweite Fähigkeit des Wegs", "6": "Uncanny Dodge (vom Rogue)", "7": "Verbesserung der ersten Fähigkeit des Wegs", "8": "Ability Score Improvement", "9": "Evasion (vom Rogue) — wirklich wichtiges Feature", "10": "Verbesserung der zweiten Fähigkeit des Wegs", "11": "Zusätzliche Reaction pro Runde (allgemeine Fähigkeit)", "12": "Ability Score Improvement", "13": "Dritte Fähigkeit des Wegs", "14": "(allgemeine Fähigkeit) In deinem Zug darfst du mit einer Bonus Action eine Action vorbereiten (Ready)", "15": "Erste und zweite Fähigkeit des Wegs skalieren", "16": "Ability Score Improvement", "17": "(allgemeine Fähigkeit skaliert) insgesamt 2 zusätzliche Reactions pro Runde", "18": "Alle Fähigkeiten des Wegs skalieren", "19": "Ability Score Improvement", "20": "Meisterfähigkeit des W em 10-ft-Radius um ihn stehen. — Dies ist die permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Kampfrausch (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Beschwört Hachimans Klinge (1 Minute): gilt als magisch und verursacht +1d10 Radiant Damage."}, {"r": 5, "cost": "1 DP", "t": "Markiere einen Gegner: Er zählt als 4 Gegner, solange er sich in 10 ft. vom Kami-kagari befindet."}, {"r": 6, "cost": "1 DP", "t": "Beschwört Hachimans Arm, der ein Ziel in 60 ft. angreift: 4d6 Schaden. Der Kami-kagari erleidet 1d4 Rückstoßschaden."}, {"r": 7, "cost": "2 DP", "t": "Schwertsturm: ein Angriff gegen jeden Gegner in 10 ft."}, {"r": 8, "cost": "passiv", "t": "Blutzoll: Bringt der Kami-kagari einen Gegner auf 0 TP, erhält er 1 Divinity Point zurück (1×/Runde, nur im Kampf, nie über das Maximum)."}, {"r": 9, "cost": "3 DP", "t": "Rüstung des Kriegsgottes (1 Minute): temporäre Hit Points, Resistenz gegen nichtmagischen Schaden, seine Angriffe gelten als magisch."}, {"r": 10, "cost": "alle DP", "t": "Beschwört Hachiman für X Runden auf das Schlachtfeld, wobei X = Anzahl der ausgegebenen Divinity Points."}]}, "Raijin": {"tabu": "Zögern — eine Runde verstreichen lassen, ohne anzugreifen (Bereithalten, Ausweichen, Nichtstun).", "ranks": [{"r": 1, "cost": "1 DP", "t": "Blitzschlag: Dein nächster Angriff verursacht +2d8 Lightning Damage; das Ziel kann bis zu deinem nächsten Zug keine Reactions nutzen."}, {"r": 2, "cost": "passiv (permanent)", "t": "Sturmschritt: +10 ft. Bewegung; du wirst durch Difficult Terrain nicht verlangsamt. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Blitzschlag (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Raijins Trommeln (1 Min.): Immer wenn du triffst, schlägt ein Donner für 1d6 Schaden auf einen weiteren Gegner in 10 ft. des Ziels."}, {"r": 5, "cost": "1 DP", "t": "Kettenblitz: Ein Blitz springt vom Ziel auf bis zu 2 weitere Gegner in 15 ft. — je 2d8 Lightning Damage (DEX-Saving Throw halbiert)."}, {"r": 6, "cost": "1 DP", "t": "Donnerfaust: 4d6 Schaden, Ziel wird 10 ft. zurückgeschleudert und fällt (STR-Saving Throw). Du bist bis zu deinem nächsten Zug taub."}, {"r": 7, "cost": "2 DP", "t": "Gewitter: Blitzeinschlag auf jeden Gegner in 20-ft-Radius, 3d8 Lightning Damage (DEX-Saving Throw halbiert)."}, {"r": 8, "cost": "passiv", "t": "Aufgeladen (Reaction): Wird dir Schaden zugefügt, teleportierst du dich blitzschnell bis zu 15 ft. weit (1×/Runde)."}, {"r": 9, "cost": "3 DP", "t": "Blitzgestalt (1 Min.): Resistenz gegen alle Schadenstypen außer Kraft, Teleport bis 30 ft. als Bonus Action, Angriffe +1d8 Blitz."}, {"r": 10, "cost": "alle DP", "t": "Raijins Zorn (X Runden, X = ausgegebene DP): Zu Beginn jedes deiner Züge schlägt ein Blitz auf einen sichtbaren Gegner (5d8 Blitz, DEX-Saving Throw halbiert)."}]}, "Fūjin": {"tabu": "Stillstand — der Kami-kagari darf nicht zwei Runden in Folge auf demselben Fleck bleiben; er muss sich jede Runde bewegen.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Windstoß: Dein nächster Angriff stößt das Ziel bis 15 ft. zurück (STR-Saving Throw); danach bewegst du dich 10 ft. ohne Opportunity Attacks."}, {"r": 2, "cost": "passiv (permanent)", "t": "Federleicht: Du löst keine Opportunity Attacks aus; Falling Damage halbiert. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Windstoß (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Fūjins Sichel (1 Min.): Reichweite deiner Melee Attacke +5 ft., +1d8 Bludgeoning Damage."}, {"r": 5, "cost": "1 DP", "t": "Wirbelwind: Alle Gegner in 15 ft. machen einen STR-Saving Throw oder werden 10 ft. weggeschleudert und fallen."}, {"r": 6, "cost": "1 DP", "t": "Orkanstoß: 30-ft-Kegel, 4d6 Bludgeoning Damage, Gegner werden zurückgestoßen (STR-Saving Throw halbiert, kein Stoß bei Erfolg)."}, {"r": 7, "cost": "2 DP", "t": "Sturmwand (1 Min.): Eine bis 60 ft. lange Windwand blockiert Fernangriffe; wer hindurch will, erleidet 2d8 Schaden."}, {"r": 8, "cost": "passiv", "t": "Rückenwind: Du und Verbündete in 10 ft. habt +10 ft. Bewegung und Advantage auf DEX-Saving Throws."}, {"r": 9, "cost": "3 DP", "t": "Windgestalt (1 Min.): Flugrate 60 ft., Angriffe gegen dich haben Disadvantage, du ziehst durch Kreaturenräume."}, {"r": 10, "cost": "alle DP", "t": "Der große Sturm (X Runden, X = DP): Zu Beginn jedes deiner Züge werden alle Gegner in 30 ft. 15 ft. weit bewegt (deine Wahl) und erleiden 3d8 Bludgeoning Damage (STR-Saving Throw halbiert)."}]}, "Suijin": {"tabu": "Er darf keinen Verbündeten sterben lassen, den er hätte retten können.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Wasserklinge: Dein nächster Angriff macht +2d8 Bludgeoning Damage (Wasserdruck) und ignoriert Deckung."}, {"r": 2, "cost": "passiv (permanent)", "t": "Fließen: Du atmest unter Wasser, bewegst dich ungehindert durch Wasser, Resistenz gegen Feuer. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Wasserklinge (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Heilende Quelle (1 Min.): Erschaffe eine Quelle (10-ft-Radius); Verbündete, die darin ihren Zug beginnen, heilen 1d8 TP."}, {"r": 5, "cost": "1 DP", "t": "Flutwelle: 30-ft-Linie, 2d8 Schaden; Gegner machen STR-Saving Throw oder fallen und werden 10 ft. weggespült."}, {"r": 6, "cost": "1 DP", "t": "Ertränken: 4d6 Schaden; das Ziel kann bis zum Ende seines nächsten Zuges nicht atmen oder sprechen (CON-Saving Throw)."}, {"r": 7, "cost": "2 DP", "t": "Reinigende Flut: Verbündete in 20 ft. heilen 2d8 TP und erhalten Advantage auf ihren nächsten Corruption-Saving Throw (entfernt keine Corruption)."}, {"r": 8, "cost": "passiv", "t": "Anpassung: Zu Beginn deines Zuges wählst du einen Schadenstyp; dagegen bist du bis zu deinem nächsten Zug resistent."}, {"r": 9, "cost": "3 DP", "t": "Wassergestalt (1 Min.): Angriffe gegen dich haben Disadvantage, du fließt durch Spalten und Kreaturenräume, immun gegen Grappled und Fesseln."}, {"r": 10, "cost": "alle DP", "t": "Der große Strom (X Runden, X = DP): Das Gelände wird für Gegner zu schwierigem Wasser; zu Beginn jedes deiner Züge heilen Verbündete in 30 ft. 2d8 und Gegner erleiden 3d8 Wasserschaden."}]}, "Inari": {"tabu": "Undankbarkeit — eine empfangene Gabe oder Hilfe nicht zu erwidern.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Fuchsfeuer: Dein nächster Angriff macht +2d8 Fire Damage; das Ziel hat Disadvantage auf seinen nächsten Angriff (Trugfeuer blendet)."}, {"r": 2, "cost": "passiv (permanent)", "t": "Fuchsglück: Einmal pro Runde darfst du einen deiner Würfe (Angriff, Saving Throw, Fertigkeit) neu würfeln. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Fuchsfeuer (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Kitsune-Maske (1 Min.): Ein Trugbild deiner selbst; Angriffe gegen dich treffen zu 50% das Duplikat, das halbe Melee Attacke machen kann."}, {"r": 5, "cost": "1 DP", "t": "Trugbild: Ein Gegner macht einen WIS-Saving Throw oder greift in seinem nächsten Zug einen Verbündeten seiner Wahl an."}, {"r": 6, "cost": "1 DP", "t": "Neunschwänziger Schlag: Neun Fuchsfeuer-Stöße treffen ein Ziel in 60 ft., 4d6 Fire Damage."}, {"r": 7, "cost": "2 DP", "t": "Feld der Täuschung (1 Min.): 20-ft-Illusionsnebel; Gegner darin gelten als blinded (WIS-Saving Throw je Zug), Verbündete sehen normal."}, {"r": 8, "cost": "passiv", "t": "Fuchslist: Advantage auf Deception und Persuasion; einmal pro Kampf darfst du einen gegnerischen Attack Roll gegen dich neu würfeln lassen."}, {"r": 9, "cost": "3 DP", "t": "Kitsune-Gestalt (1 Min.): +20 ft. Bewegung, als Bonus Action invisible (bis du angreifst), Angriffe +1d8 Fuchsfeuer."}, {"r": 10, "cost": "alle DP", "t": "Inaris tausend Füchse (X Runden, X = DP): Zu Beginn jedes deiner Züge stürmt ein Geisterfuchs-Rudel einen Gegner (4d6 Feuer); Angriffe gegen dich haben Disadvantage (Illusion vieler Orte)."}]}, "Amaterasu": {"tabu": "Aus dem Verborgenen angreifen — sie ist das Licht. Ihr Diener trifft niemanden, der ihn nicht kommen sieht.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Das Auge des Vaters: Für den Rest des Kampfes siehst du jeden Gegner, auch außerhalb deiner Sichtlinie, und bist immun gegen hinterhältige Angriffe (Sneak Attacks)."}, {"r": 2, "cost": "passiv (permanent)", "t": "Vergeltendes Licht: Bestehst du einen Saving Throw gegen den Angriff eines Gegners, erleidet dieser 1d6 Radiant Damage. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Das Auge des Vaters (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Amaterasus Weber: Aus deinen Fingern wachsen Fäden, die auf Befehl so scharf werden wie eine Katana-Schneide. Für den Rest des Kampfes: Als Action greifst du eine Kreatur in 30 ft. (DEX-Saving Throw gegen deinen DC); sie erleidet zu Beginn jedes ihrer Züge 1d10 Schaden, solange sie festgehalten wird. Du kannst höchstens drei Kreaturen gleichzeitig halten. Du kannst die Fäden auch als Falle auslegen: Wer sie nicht mit einem Perceptionswurf gegen DC 15 bemerkt, kann für den Rest der Runde keine Handlung ausführen, die Bewegung erfordert."}, {"r": 5, "cost": "1 DP", "t": "Amaterasus Kinder: Für jedes Pfund Perlen und jedes Pfund Reis, das du bei dir trägst (je höchstens 10 Pfund), verursachst du einem Gegner X Radiant Damage — X ist die Summe beider Gewichte. Die Waren werden nicht verbraucht."}, {"r": 6, "cost": "3 DP", "t": "Licht gegen die Finsternis: Für den Rest des Kampfes können Verbündete keine neue Corruption erhalten. Wer sie bereits trägt, verliert durch sie für die nächsten zwei Züge keine Soul HP. Corruption wird unterdrückt, nicht entfernt."}, {"r": 7, "cost": "4 DP", "t": "Streit mit Susanoo: Aus Fäden, Reis und Perlen erschaffst du ein Simulacrum deiner selbst mit 1 Trefferpunkt und 3 Divinity Points. Es handelt auf deiner Initiative unter deiner Kontrolle und kann alle Amaterasu-Fähigkeiten nutzen, die dir offenstehen — muss deren Kosten aber aus seinen eigenen 3 Punkten zahlen. Es verschwindet am Ende des Kampfes."}, {"r": 8, "cost": "passiv", "t": "Reiche Ernte: Das Höchstgewicht in Rang 5 steigt um je 10 Pfund (auf je 20)."}, {"r": 9, "cost": "passiv", "t": "Unentrinnbare Fäden: Den Fäden aus Rang 4 kann nicht mehr ausgewichen werden — Griff und Falle wirken automatisch."}, {"r": 10, "cost": "alle DP", "t": "Amaterasus Rückzug: Du verschwindest für 2 Züge vollständig aus dem Kampf, wie sie sich in der Felsenhöhle verbarg. Danach kehrst du mit 0 Soul HP zurück und darfst für X Züge (X = ausgegebene Divinity Points) je X-mal alle Fähigkeiten außer Amaterasus Rückzug einsetzen, ohne Divinity Points zu zahlen."}]}, "Tsukuyomi": {"tabu": "Ein gefälltes Urteil zurücknehmen — wen er einmal verurteilt hat, darf er nicht rehabilitieren.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Kaltes Mondlicht: Dein nächster Angriff verursacht zusätzlich Cold Damage. Vollmond 4d6 · Halbmond 2d6 · Neumond keine Wirkung."}, {"r": 2, "cost": "passiv (permanent)", "t": "Der Zähler der Monde: Du kennst Datum, Stunde und Mondphase stets genau und sagst Gezeiten und Finsternisse voraus. Vollmond +5 auf Initiative und Advantage auf Perception · Halbmond +2 auf Initiative · Neumond keine Wirkung. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Kaltes Mondlicht (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Die Gezeiten: Der Mond zieht. Alle Gegner in 30 ft. machen einen STR-Saving Throw und werden zu dir gezogen oder von dir weggeschoben (deine Wahl). Vollmond 20 ft., bei Misserfolg zusätzlich prone · Halbmond 10 ft. · Neumond keine Wirkung."}, {"r": 5, "cost": "2 DP", "t": "Der Mord an Uke Mochi: Ein Ziel macht einen CON-Saving Throw. Bei Misserfolg kann es keine Hit Points zurückgewinnen, und Heilung, die es anderen gibt, ist halbiert. Vollmond 1 Minute und sofort 4d8 Necrotic Damage · Halbmond 3 Runden und 2d8 · Neumond keine Wirkung."}, {"r": 6, "cost": "2 DP", "t": "Mantel des Mondlichts: 1 Minute lang hüllt dich Mondlicht ein. Vollmond: Angriffe gegen dich haben Disadvantage, und du hast Resistenz gegen Frost- und Necrotic Damage · Halbmond: der erste Angriff gegen dich in jeder Runde hat Disadvantage · Neumond keine Wirkung."}, {"r": 7, "cost": "3 DP", "t": "Mondfinsternis: 30-ft-Radius, CON-Saving Throw halbiert. Vollmond 6d8 Cold Damage, bei Misserfolg zusätzlich blinded bis zum Ende des nächsten Zuges · Halbmond 3d8 Cold Damage · Neumond keine Wirkung."}, {"r": 8, "cost": "passiv", "t": "Der Verstoßene: Solange sich kein Verbündeter in 30 ft. von dir befindet, wächst die Kraft des Verbannten. Vollmond +4 auf Angriffs- und Damage Rolls · Halbmond +2 · Neumond keine Wirkung."}, {"r": 9, "cost": "passiv", "t": "Ewiger Vollmond: Du stehst immer unter dem Vollmond, unabhängig von der wirklichen Phase."}, {"r": 10, "cost": "passiv", "t": "Herr der drei Phasen: Als Bonus Action wählst du, unter welcher Phase du stehst. Alle drei geben nun einen vollen Buff, und der Schadenstyp aller deiner Tsukuyomi-Fähigkeiten wechselt mit — Vollmond: Radiant, und deine Fähigkeiten enthüllen verborgene und invisiblee Kreaturen in ihrem Wirkungsbereich · Halbmond: Frost, und getroffene Ziele haben bis zum Ende ihres nächsten Zuges halbierte Speed · Neumond: Necrotic, und du gewinnst Hit Points in Höhe der Hälfte des verursachten Schadens zurück."}]}, "Susanoo": {"tabu": "Sich einem Befehl fügen, den er nicht selbst gewählt hat.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Der Anfang der Böen: Susanoos Macht durchdringt deinen nächsten Angriff. Das Ziel erleidet zusätzlich 1d8 Windschaden; alle Gegner in einem 30-ft-Kegel hinter dem Ziel erleiden denselben Schaden."}, {"r": 2, "cost": "passiv (permanent)", "t": "Führung der Winde: Die Winde weisen dir den Weg. Weißt du nicht, wie es weitergeht, weht ein Wind in eine Richtung. Boote, auf denen du fährst, segeln deutlich schneller. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Der Anfang der Böen (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Susanoos Unfug: Solange du dich konzentrierst (bis zu 1 Minute), sind alle Gegner in 30 ft. stunned. Am Ende jedes seiner Züge darf ein Betroffener einen STR-Saving Throw machen, um sich aus dem Sturm loszureißen."}, {"r": 5, "cost": "2 DP", "t": "Acht Fässer Sake: Wie Susanoo Orochi überlistete statt überwältigte. Alle Gegner in 30 ft. machen einen CON-Saving Throw oder sind 1 Minute lang poisoned. Ein poisoneder Gegner hat Disadvantage auf den STR-Saving Throw gegen Susanoos Unfug."}, {"r": 6, "cost": "2 DP", "t": "Kusanagi: Beschwöre für 1 Minute das Schwert aus Orochis Schweif. Es gilt als magisch, verursacht +1d10 Schaden, und deine Angriffe damit ignorieren Deckung — der Grasmäher schneidet, was zwischen dir und dem Ziel steht."}, {"r": 7, "cost": "3 DP", "t": "Der Sturm vertreibt die Seuche: Ein reinigender Sturm in 30 ft. Radius für 1 Minute. Verbündete darin können keine neue Corruption erhalten, und bestehende Corruption tickt nicht. Sie wird unterdrückt, nicht entfernt."}, {"r": 8, "cost": "4 DP", "t": "Amoklauf im Himmel: Susanoos Zerstörungswut bricht los. Drei Runden lang tobt ein Sturm in 60 ft. Radius um dich. Zu Beginn jedes deiner Züge erleidet jedes Wesen darin — auch Verbündete — 3d8 Windschaden (DEX-Saving Throw halbiert). Das Gelände wird verwüstet und gilt danach als schwierig."}, {"r": 9, "cost": "passiv", "t": "Herr der Stürme: Du bist immun gegen Windeffekte und erhältst eine Flugbewegungsrate von 60 ft. — der Sturm trägt dich. Deine Windschadens-Fähigkeiten ignorieren Resistenz gegen Bludgeoning Damage."}, {"r": 10, "cost": "alle DP", "t": "Yamata-no-Orochi: Beschwöre die achtköpfige Schlange, die Susanoo erschlug, für X Runden als deinen Diener (X = ausgegebene Divinity Points). Was er bezwang, gehorcht dir."}]}, "Ame-no-Minakanushi": {"tabu": "Absichtliche Unwissenheit — sich bewusst gegen eine Wahrheit zu verschließen.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Das Mysterium: Ein kurzer Blick auf den Lauf der Zeit, das Wachsen des Universums, den Zufall, die Musik, die Evolution und alles Wissen. Du musst dafür auf deinen Angriff verzichten — sonst wirkt es nicht. Bis zu deinem nächsten Zug weichst du jedem Angriff gegen dich automatisch aus."}, {"r": 2, "cost": "passiv (permanent)", "t": "Der Blick in die Domäne: Du darfst dem DM Fragen stellen. Die Antworten sind das, was dein Charakter in Ame-no-Minakanushis Domäne erfahren hat — nicht jede davon muss wahr sein. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Das Mysterium (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Domäne der Musik: Du spielst. Für 1 Minute erhalten alle Verbündeten Inspiration und +1d10 auf ihre Attack Rolls."}, {"r": 5, "cost": "4 DP", "t": "Domäne des Zufalls: Du änderst einen Würfelwurf auf sein Maximum."}, {"r": 6, "cost": "alle DP", "t": "Domäne der Evolution: Erhöhe für den Kampf die Stufe eines Verbündeten temporär auf 20 — Hit Points wie auf Stufe 20, Proficiency Bonus +6, verbrauchte Ressourcen füllen sich auf Stufe-20-Niveau. Er erlernt keine neuen Fähigkeiten und kann keine neuen Götter erlangen."}, {"r": 7, "cost": "alle DP", "t": "Domäne des Wissens: Stelle dem DM eine Frage, die er wahrheitsgemäß beantworten muss. Sie darf nichts mit den Charakteren der Gruppe zu tun haben. Nur ein einziges Mal in der gesamten Kampagne einsetzbar."}, {"r": 8, "cost": "5 DP", "t": "Domäne der Zeit: Wie der Zauber Time Stop — die Zeit steht still, du handelst 1d4 + 1 Runden lang allein."}, {"r": 9, "cost": "alle DP", "t": "Domäne des Universums: Du ziehst die Macht eines Sterns herab. Ein Ziel in bis zu 120 ft. erleidet 12d10 Radiant Damage."}, {"r": 10, "cost": "passiv", "t": "Der Jester: Du behältst alle Fähigkeiten Ame-no-Minakanushis und wählst zusätzlich einen weiteren Gott aus der Stufe der Domänen-Kami. Du darfst diesen zweiten Gott gleichzeitig neben Ame-no-Minakanushi kanalisieren."}]}, "Kukurihime": {"tabu": "Eine Seite verurteilen, ohne beide gehört zu haben.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Die Liebeswächterin: Als Brücke zwischen den Elterngöttern hält sie deren Liebe am Leben. Erschaffe für 1 Minute ein magisches Feld in 60 ft. Radius: Jede Kreatur, die darin einen Angriff ausführt, erleidet 1d6 Psychic Damage — und einmal pro Runde zusätzlich 1d6 Soul-HP-Verlust. Das Feld trifft Freund wie Feind, dich eingeschlossen."}, {"r": 2, "cost": "passiv (permanent)", "t": "Botin der Liebe: Alle Verbündeten in 30 ft. heilen zu Beginn jeder Runde 1d4 Hit Points. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Die Liebeswächterin (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Band der Gefährten: Binde zwei willige Kreaturen in 30 ft. für 1 Minute aneinander. Schaden, den eine von beiden erleidet, wird zu gleichen Teilen auf beide verteilt."}, {"r": 5, "cost": "2 DP", "t": "Fessel des Zorns: Binde einen Gegner an dich (WIS-Saving Throw). Für 1 Minute kann er sich nicht weiter als 10 ft. von dir entfernen; versucht er es, endet seine Bewegung."}, {"r": 6, "cost": "2 DP", "t": "Geteiltes Leid: Als Reaction, wenn ein Verbündeter in 30 ft. Schaden erleiden würde, bindest du die Wunde an dich — du nimmst den Schaden statt seiner. Bei einem Condition statt Schaden: Du übernimmst den Zustand."}, {"r": 7, "cost": "3 DP", "t": "Seelenband: Binde deine Soul HP für 1 Minute mit denen eines Verbündeten. Ihr teilt euch einen gemeinsamen Pool aus beiden Vorräten; Verluste treffen zuerst den größeren Anteil. Corruption, die einen von euch befällt, tickt nur einmal für beide."}, {"r": 8, "cost": "4 DP", "t": "Bindung des Streits: Zwei Kreaturen deiner Wahl in 60 ft. machen je einen WIS-Saving Throw. Wer scheitert, kann für 1 Minute die jeweils andere nicht angreifen und keine Fähigkeit gegen sie richten. Sie ist erst frei, wenn eine von beiden anderweitig Schaden von der anderen erleidet."}, {"r": 9, "cost": "passiv", "t": "Die Bindende: Deine Bindungen brechen nicht mehr von selbst. Alle deine aktiven Bindungen (Ränge 4, 5, 7, 8) halten, bis du sie löst, du unconscious wirst oder das Ziel stirbt — statt bis zum Ablauf ihrer Dauer."}, {"r": 10, "cost": "alle DP", "t": "Das unbekannte Wort: Du sprichst die Worte, die den Streit der Elterngötter beendeten — die Worte, die niemand aufgeschrieben hat. Der DM entscheidet, was sie in diesem Augenblick bewirken. Sie beenden immer einen Konflikt; auf welche Weise, steht nicht fest."}]}, "Ōkamuzumi": {"tabu": "Einem Hilfsbedürftigen die Hilfe verweigern — und ein Wesen niederstrecken, das den Corruption-Debuff trägt, ihn aber nicht als Waffe einsetzt. Opfer sind zu retten, nicht zu erschlagen.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Eid der Jägerin: Dein nächster Angriff verursacht +1d6 Schaden. Gegen einen Corruption Hunter verdoppelt sich dieser Bonus (+2d6)."}, {"r": 2, "cost": "passiv (permanent)", "t": "Jagdinstinkt: Du spürst, wenn sich ein Corruption Hunter in 60 ft. Umkreis befindet. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Eid der Jägerin (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Die Jagd hat begonnen: Markiere einen Corruption Hunter für 1 Minute. Deine Angriffe gegen ihn haben Advantage und verursachen +4d4 Schaden."}, {"r": 5, "cost": "3 DP", "t": "Kein Entkommen: Betäube einen Corruption Hunter in bis zu 120 ft. — auch in der Luft. Stürzt er dabei ab, erleidet er Falling Damage. Einmal pro Kreatur und Kampf."}, {"r": 6, "cost": "2 DP", "t": "Schrecken des Jägers: Alle Corruption Hunter in 60 ft. erstarren vor der Frucht, die sie einst vertrieb — sie sind bis zum Ende deines nächsten Zuges stunned."}, {"r": 7, "cost": "passiv", "t": "Lohn der Jagd: Immer wenn du einen Corruption Hunter tötest, erhältst du 1 Divinity Point zurück."}, {"r": 8, "cost": "passiv", "t": "Beute aller Art: Einmal pro Kampf darfst du bei einer Fähigkeit Ōkamuzumis „Corruption Hunter\" durch „jeder nichtmenschliche Gegner\" ersetzen. Diese eine Anwendung wirkt dann gegen dieses Ziel wie gegen einen Corruption Hunter."}, {"r": 9, "cost": "passiv", "t": "Flug der Jägerin: Dir wachsen Flügel. Du erhältst eine Flugbewegungsrate von 120 ft."}, {"r": 10, "cost": "alle DP", "t": "Strafe: Jedes Wesen, das du sehen kannst und das absichtlich Corruption einsetzt, erleidet XW6 Radiant Damage (X = ausgegebene Divinity Points). Dieser Schaden kann einen Sleeper Agent nicht treffen."}]}, "Chigaeshi-no-Ōkami": {"tabu": "Fliehen oder eine Schwelle preisgeben, die er zu halten geschworen hat.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Göttlicher Wall: Alle Gegner in 100 ft. machen einen WIS-Saving Throw oder müssen dich bis zu deinem nächsten Zug angreifen. Deine AC steigt bis dahin um 4."}, {"r": 2, "cost": "passiv (permanent)", "t": "Der unbewegliche Geist: Du bist immun gegen Grappled und kannst nicht zu Boden geworfen werden. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Göttlicher Wall (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "passiv", "t": "Heiliges Symbol: Für jeden Social-Link-Rang, den du über alle Götter hinweg besitzt, +1 maximale Hit Points. Für jeden Talisman, auf den du eingestimmt bist, +1 maximale Soul HP."}, {"r": 5, "cost": "2 DP", "t": "Der gefallene Wall: Hast du im letzten Zug Schaden erlitten, füge dem Verursacher Schaden in Höhe des erlittenen Schadens zu."}, {"r": 6, "cost": "passiv", "t": "Gescheiterter Gott: Immer wenn du den Corruption-Debuff erhältst, erhältst du einen gefallenen Divinity Point."}, {"r": 7, "cost": "1 gef. DP", "t": "Quelle der Tragödie: Du verlierst 3d6 Hit Points. Alle Verbündeten in 100 ft. erhalten Inspiration für den Rest des Kampfes, verlieren aber 1d10 Soul HP."}, {"r": 8, "cost": "2 gef. DP", "t": "Abstieg in den Wahnsinn: Deine Hit Points fallen auf 1. Du führst 7 Angriffe aus. Danach bist du 3 Runden lang stunned."}, {"r": 9, "cost": "1 DP + 1 gef. DP", "t": "Annahme: Chigaeshi lernt, sein Versagen anzunehmen. Verbanne einen Gegner nach Yomi, dem Land der Toten. Das Ziel darf einen CON-Saving Throw gegen DC 18 machen; Bosse und legendäre Wesen haben dabei Advantage."}, {"r": 10, "cost": "alle DP + alle gef. DP", "t": "Das Große Siegel: Versiegle ein beliebiges Wesen dauerhaft — auch Izanami selbst, ohne Saving Throw. Dein Charakter WIRD das Siegel: Er scheidet endgültig aus dem Spiel aus, kann nicht wiederbelebt werden und existiert fort als die Tür, die geschlossen bleibt."}]}, "Kagutsuchi": {"tabu": "Vergebung — er darf niemandem vergeben, der ihm oder seinen Verbündeten Unrecht getan hat.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Flammen des Schicksals: 3d6 Fire Damage an allen Gegnern in 30 ft. (DEX-Saving Throw halbiert)."}, {"r": 2, "cost": "passiv (permanent)", "t": "Helle Flamme: Du kannst nach Belieben Licht ausstrahlen und siehst 60 ft. weit in völliger Dunkelheit. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Flammen des Schicksals (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Flammen des Todes: Entzünde ein Wesen in bis zu 120 ft.: 6d6 Fire Damage, das Ziel macht einen DEX-Saving Throw oder stürzt vor Schmerz zu Boden (prone)."}, {"r": 5, "cost": "passiv", "t": "Entehrter Sohn: Du erhältst zusätzlich gefallene Divinity Points — in derselben Höhe wie deine normalen. Du führst beide Pools gleichzeitig, und diese gefallenen Punkte verderben dich NICHT."}, {"r": 6, "cost": "3 DP + 3 gef. DP", "t": "Hass: Kagutsuchis Trauer und Zorn entladen sich. 10d6 Schaden an JEDEM Wesen in 60 ft. — auch Verbündeten (DEX-Saving Throw halbiert). Du selbst erleidest 10d4."}, {"r": 7, "cost": "6 DP + 6 gef. DP", "t": "Versagen: Der Zwiespalt in Kagutsuchis Herz erfasst dich — Zorn auf den Vater, Trauer über die eigene Schuld. Du wirst ein feuerelementarartiges Wesen; deine Hit Points und Soul HP verschmelzen zu einem Pool. Immun gegen Feuer, Resistenz gegen nichtmagischen Schaden, deine Angriffe verursachen zusätzlich Fire Damage. Die Form endet, wenn der Pool 0 erreicht oder der Kampf endet. Danach werden deine Soul HP auf 0 gesetzt."}, {"r": 8, "cost": "5 DP + 10 gef. DP", "t": "Flamme des Muts: Der Mut, der Kagutsuchi im Kampf gegen seinen Vater durchströmte, erfüllt dich. Für den Rest des Kampfes kannst du nicht frightened werden, und deine Angriffe verursachen zusätzlich 3d6 Fire Damage. Jeder Angriff kostet dich 2 Soul HP; kannst du sie nicht zahlen, wird der Schaden des Angriffs stattdessen um 2d10 reduziert."}, {"r": 9, "cost": "passiv", "t": "Sturz: Einmal pro Runde darfst du eine Fähigkeit Kagutsuchis einsetzen, ohne ihre Kosten zu zahlen. Dafür sinken deine maximalen Soul HP dauerhaft auf 10, solange Kagutsuchi kanalisiert ist."}, {"r": 10, "cost": "passiv", "t": "Genesis: Wie Kagutsuchis Tod neues Leben schuf, gibt er dir eine zweite Chance. Stirbst du zum ersten Mal im Kampf, wirst du sofort mit vollen Hit Points und vollen Soul HP wiederbelebt. Dies lädt sich erst wieder auf, wenn du einen Schrein besuchst."}]}, "Izanagi": {"tabu": "Verfall verbreiten — eine Leiche berühren oder Corruption auf andere übertragen. Die Verderbnis im eigenen Leib zu verbrennen ist erlaubt; sie weiterzugeben nicht.", "ranks": [{"r": 1, "cost": "1 DP", "t": "Klinge der Schöpfung: Dein nächster Angriff verursacht +4d8 Schaden."}, {"r": 2, "cost": "passiv (permanent)", "t": "Izanagis Segen: Advantage auf Saving Throws gegen Corruption und +2 AC. Gegen Izanamis sonst garantierte Corruption (Aura/Nähe) darfst du einen CON-Saving Throw gegen DC 18 machen — gegen Izanami selbst DC 20+. — Permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Klinge der Schöpfung (Rang 1) kostet keinen Divinity Point mehr."}, {"r": 4, "cost": "2 DP", "t": "Izanagis Schnitt: Entferne den Corruption-Debuff von dir und beliebig vielen Verbündeten in Reichweite. Du verlierst dabei 2d10 Soul HP."}, {"r": 5, "cost": "passiv", "t": "Domäne der Schöpfung: Wann immer geschmiedet wird oder Talismane hergestellt werden, 50% Chance auf die doppelte Menge."}, {"r": 6, "cost": "2 DP", "t": "Schwur der Schöpfung: Versetze dich und einen Gegner in eine Domäne aus Izanagis Überfluss. Sie endet, wenn einer von euch besiegt ist. Du hast Advantage auf alle Würfe darin. Mächtige Gegner (legendär) dürfen einen WIS-Saving Throw machen, um nicht mitgezogen zu werden."}, {"r": 7, "cost": "3 DP", "t": "Izanagis Zorn: Kanalisiere die Corruption in dir in deine Klinge — Verfall und Schöpfung vermischt. Dein nächster Angriff macht zusätzlich XW4 + XW6 Schaden, X = fehlende Soul HP (höchstens dein Proficiency Bonus). Nach dem Angriff bist du stunned."}, {"r": 8, "cost": "3 DP", "t": "Magatsu Mandala: Ein Mandala aus Licht entfaltet sich. Alle Gegner in 20 ft. erleiden 4d8 Force Damage (ignoriert Resistenzen) und machen einen WIS-Saving Throw oder sind bis zum Ende ihres nächsten Zuges frightened."}, {"r": 9, "cost": "passiv", "t": "Izanagis Entschlossenheit: Gegen Yokai hast du +3 AC und verursachst +1d10 zusätzlichen Schaden bei jedem Angriff."}, {"r": 10, "cost": "alle DP", "t": "Myriad Truths: Eine Welle der Wahrheit; alle Gegner in 60 ft. erleiden XW6 Force Damage (X = ausgegebene DP, ignoriert Resistenzen) und verlieren alle Buffs und temporären Boni. Zusätzlich permanent: Du kannst die Fähigkeiten aller Götter nutzen, mit denen du Social-Link-Rang 10 erreicht hast — deren DP-Kosten zahlst du weiterhin. Und: In der Runde, in der du Myriad Truths einsetzt, sowie in der darauffolgenden, wirken Izanamis Illusionen nicht — kein Nebel, keine Trugbilder, keine Prüfung des Blicks. Ihr Mann ist der Einzige, der sie je wirklich gesehen hat."}]}, "Izanami": {"tabu": "Reinigung — ihr Diener darf keine Corruption entfernen und keinen sauberen Schrein ehren.", "ranks": [{"r": 1, "cost": "1 gef. DP", "t": "Klinge der Korruption: Dein nächster Angriff verursacht zusätzlich 3d6 Seelenschaden und 3d6 Schaden."}, {"r": 2, "cost": "passiv (permanent)", "t": "Kind der Toten: Immun gegen Corruption aus verdorbenen Orten und deren Aura. — Dies ist die permanente erste Passive."}, {"r": 3, "cost": "—", "t": "Klinge der Korruption (Rang 1) kostet keinen gefallenen Divinity Point mehr."}, {"r": 4, "cost": "2 gef. DP", "t": "Korruptionsschild (ganzer Kampf): +5 AC. Gegner, die ihren Zug in 10 ft. beginnen, machen einen CON-Saving Throw oder werden von Corruption befallen."}, {"r": 5, "cost": "1 gef. DP", "t": "Todesmarke: Ein Ziel macht einen CON-Saving Throw (wie gegen Corruption) oder wird von Corruption befallen und ist bis zum Ende deines nächsten Zuges stunned. Stirbt das markierte Ziel, erntest du seine Seele."}, {"r": 6, "cost": "2 gef. DP + 1 Seele", "t": "Beschwöre das Wesen, dessen Seele verbraucht wurde, als Diener für den Kampf."}, {"r": 7, "cost": "2 gef. DP + Seelen", "t": "Verbrauche Seelen (höchstens so viele wie dein Social-Link-Rang): XW6 Schaden an allen Gegnern in 50 ft., X = Seelen. Du erleidest XW4 Rückstoßschaden."}, {"r": 8, "cost": "passiv", "t": "Corruption Feast: Tötest du einen verdorbenen Gegner, erhältst du eine zusätzliche Seele. Du kannst Seelen verzehren für je 1d4 temporäre Hit Points und 1d4 temporäre Soul HP."}, {"r": 9, "cost": "3 gef. DP", "t": "Wesen der Korruption: Deine max. TP werden zu Soul HP, du verlierst deinen Körper und wirst ein Korruptions-Elementar. Corruption erhöht in dieser Form deine Soul HP; fallen sie auf 0, endet die Form. Endet am Ende deines nächsten Zuges."}, {"r": 10, "cost": "alle gef. DP", "t": "Verdirb alle Götter, die du je kanalisiert hast, und nutze all ihre Fähigkeiten ohne Divinity-Point-Kosten für X Runden (X = ausgegebene gefallene DP). Ausnahme: Ame-no-Minakanushi (Der Jester) und der über sein Rang 10 gleichzeitig kanalisierte Domänen-Kami bleiben unverdorben — ihre Fähigkeiten kosten in diesem Fenster weiterhin normale Divinity Points."}]}}, "talisText": {"Bannsiegel": "Ein Yokai in 30 ft. macht einen WIS-Saving Throw oder ist bis zum Ende deines nächsten Zuges stunned.", "Spürsiegel": "Spürt Richtung und ungefähre Entfernung aller Yokai und Corruption in 60 ft. für 10 Minuten.", "Salz-Ofuda": "1 Ladung: Advantage auf den nächsten Corruption-Saving Throw des Trägers, dann zerstört.", "Panzersiegel": "Passiv: +1 auf die Armor Class des Trägers (Attunement).", "Siegel des Geschicks": "Passiv: Advantage auf Würfe einer bei Herstellung gewählten Fertigkeit (Attunement).", "Genesungs-Ofuda": "1 Ladung: Action, heilt 2d4 + 2 Hit Points, dann zerstört. Ersatz für einen Heiltrank.", "Talisman of Warding": "Aktiviert: Disadvantage auf den nächsten Angriff gegen den Träger (Leiter bis dauerhaft-passiv).", "Siegel der sicheren Hand": "Aktiviert: Advantage auf den nächsten Attack Roll des Trägers (Leiter bis dauerhaft-passiv).", "Seelenschutz-Siegel": "Gewährt temporäre Soul HP (+2). Verhalten wie temporäre TP: zuerst verloren, kein Stapeln, verfallen bei Rast.", "Fesselsiegel": "Ein Yokai in 30 ft. macht einen STR-Saving Throw oder ist restrained; Saving Throw am Ende jedes seiner Züge.", "Stillesiegel": "Unterdrückt die Spezialfähigkeit oder Aura eines Yokai für 1 Minute (WIS-Saving Throw).", "Spiegelsiegel": "Reaction: Wirft die Hälfte erlittenen Seelenschadens auf den Angreifer zurück.", "Verbannungssiegel": "Bannt einen Yokai für bis zu 1 Minute aus dem Kampf (Concentration, WIS-Saving Throw).", "Wächter-Ofuda": "Platziert bei einem Verbündeten; greift automatisch den ersten Feind an, der auf 5 ft. herankommt (Seelenschaden).", "Feuersiegel": "Platziert; wer das Feld überquert, erleidet verdorbenen Flammenschaden (Feuer/Necrotic).", "Großes Schutzsiegel": "Fläche: Verbündete im Umkreis erhalten +1 AC oder Advantage auf Saving Throws (bei Herstellung gewählt).", "Seelensiegel": "Platziert; jeder Geist oder Yokai, der es überquert, erleidet Seelenschaden.", "Siegel des stillen Schreins": "Unterdrückt Corruption in weitem Umkreis (wie das Ofuda, aber als Fläche) — kein Corruption-Tick darin.", "Siegel der Stille": "Auf einen Boss oder legendären Yokai gesetzt: Er verschwindet für eine Runde vollständig aus dem Kampf (kein Zug, keine Reactions, keine Legendary Actions) und kehrt am Ende deines nächsten Zuges zurück.", "Große Barriere": "Eine Wand aus Shimenawa und Ofuda, bis 60 ft. lang. Kein Yokai kann sie überschreiten, solange sie steht (TP wie ein Siegel). Yomi-Wesen, die es versuchen, erleiden Seelenschaden.", "Berstendes Ofuda": "Auf ein Siegel oder eine Barriere gelegt. Wird das Trägersiegel zerstört, explodiert es: 6d8 Radiant Damage in 20 ft. und alle Yokai darin erleiden Seelenschaden."}, "griffText": {"Aus dem Dickicht": "Dein erster Angriff gegen die Beute, während sie dich nicht bemerkt hat: Er trifft automatisch und gilt als kritischer Treffer.", "Auf Sicht": "Dein erster Angriff gegen die Beute in einem Kampf verursacht +3d8 Schaden.", "Gestellt": "Wenn du die Beute markierst, macht sie einen WIS-Saving Throw gegen deinen DC oder ist bis zum Ende ihres nächsten Zuges frightened und kann sich nicht von dir wegbewegen.", "Der Köder": "Wenn du die Beute markierst, darfst du sofort eine Reaction nutzen, ohne sie zu verbrauchen — etwa um eine Falle auszulösen oder ein Gegenmittel zu geben.", "Nachsetzen": "Bewegt sich deine Beute, darfst du dich als Reaction um bis zu deine halbe Speed mitbewegen, ohne Opportunity Attacks auszulösen.", "Ausbluten": "Trifft dein Angriff die Beute, erleidet sie zu Beginn jedes ihrer Züge 2d6 Schaden, bis sie einen CON-Saving Throw gegen deinen DC besteht.", "Wildwechsel": "Verfehlst du deine Beute, darfst du einen weiteren Angriff gegen sie ausführen. Verfehlst du auch diesen, ist der Griff verbraucht.", "Allein im Wald": "Ist kein Verbündeter innerhalb von 30 ft. von dir, hast du Advantage auf Angriffe gegen deine Beute und sie hat Disadvantage gegen dich.", "Rudeljagd": "Flankierst du deine Beute im Nahkampf gemeinsam mit einer verbündeten Kreatur (siehe Kampagne-Das-gebrochene-Siegel.docx, „Neue Mechanik: Flanking\"), verursacht dein nächster Treffer gegen sie zusätzlich +1d6 Schaden vom Schadenstyp deiner Waffe.", "Kehlschnitt": "Sinkt deine Beute unter ein Viertel i
