auf 0, endet die Form. Endet am Ende deines nächsten Zuges. |", "| 10 | alle gef. DP | Verdirb alle Götter, die du je kanalisiert hast, und nutze all ihre Fähigkeiten ohne Divinity-Point-Kosten für X Runden (X = ausgegebene gefallene DP). Ausnahme: Ame-no-Minakanushi (Der Jester) und der über sein Rang 10 gleichzeitig kanalisierte Domänen-Kami bleiben unverdorben — ihre Fähigkeiten kosten in diesem Fenster weiterhin normale Divinity Points. |"]}], "intro": []}, {"id": "onmyoji", "name": "Onmyōji", "kanji": "陰陽師", "hd": 6, "saves": ["int", "wis"], "skills": {"n": 2, "from": ["Arcana", "History", "Insight", "Investigation", "Nature", "Religion"]}, "basics": {"Ressourcen": "Das Rad (was er gerade wirken kann), Fluss (Belohnung fürs Folgen), Siegel (Notgroschen für alles andere).", "Primärattribut": "Intelligenz. Sie bestimmt den DC seiner Formeln und die Zahl seiner Siegel.", "Hit Die": "1d6", "Saving Throws": "INT, WIS", "Weapon Proficiencies": "Simple", "Armor Proficiencies": "Keine", "Skills": "2 aus: Arcana, History, Insight, Investigation, Nature, Religion", "Tools": "Calligrapher's Supplies, Divinationswerkzeug", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Formel-DC": "8 + Proficiency Bonus + INT-Modifier."}, "start": [{"k": "Waffe", "v": "Ein Bō (siehe Waffen-der-Inseln.docx) — der Rokkan no Shakujō ist kein Startgegenstand, den verdienst du dir erst."}, {"k": "Rüstung", "v": "Keine."}, {"k": "Zusätzlich", "v": "Ofuda (Papierstreifen) und Tusche für deine Formeln, ein Divinationswerkzeug."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Das Rad (drei Züge); Formeln aller sechs Elemente; Siegel; Fluss bis 2", "2": "Shikigami falten", "3": "Fluss bis 3", "4": "Ability Score Improvement", "5": "Formeln steigen: alle Schadenswürfel +1d (z. B. Flammenwurf 6d6)", "6": "Späher: Shikigami-Reichweite 1 Meile", "7": "Fluss bis 4", "8": "Ability Score Improvement", "9": "Formeln steigen: alle Schadenswürfel +1d", "10": "Zweiter Zug: Einmal pro Kampf darfst du den Zeiger ein zweites Mal bewegen (auch ein Sprung — dann fällt der Fluss)", "11": "Fluss bis 5 (Vollendeter Kreis)", "12": "Ability Score Improvement", "13": "Formeln steigen: alle Schadenswürfel +1d", "14": "Doppelte Shikigami; sie erhalten Hit Points gleich deinem doppelten Level", "15": "Der Kreislauf gibt 2 Fluss statt 1, wenn du dreimal in Folge gefolgt bist", "16": "Ability Score Improvement", "17": "Formeln steigen: alle Schadenswürfel +1d", "18": "Siegel kehren auch bei einer Short Rest zur Hälfte zurück; Corruption sperrt deine Gegenüber-Sprünge nicht mehr", "19": "Ability Score Improvement", "20": "Das stille Rad: Einmal pro Long Rest darfst du in deinem Zug NICHT ziehen. Dein Fluss bleibt bestehen, und du wirkst dein aktuelles Element ein zweites Mal."}, "msnotes": [], "rules": [{"h": "Säule 1 — Das Rad", "body": ["Sechs Elemente stehen im Kreis: Chi (Erde), Sui (Wasser), Ka (Feuer), Fū (Wind), Kū (Leere), Shiki (Form) — und wieder Chi. Ein Zeiger steht auf einem davon. Zu Beginn deines ersten Kampfzuges steht er auf Kū, der Leere, aus der alles hervorgeht.", "## Ziehen", "Pflicht: Zu Beginn jedes deiner Züge MUSST du den Zeiger bewegen. Stehenbleiben ist nicht möglich.", "Drei Ziele: Von jedem Element aus stehen dir genau drei Felder offen.", "| Zug | Bewegung | Von Chi aus | Von Fū aus |", "| Kreislauf | ein Feld weiter | Sui | Kū |", "| Gegenüber | drei Felder | Fū | Chi |", "| Dreieck | zwei Felder zurück | Kū | Sui |", "Vollständig: Kreislauf Chi → Sui → Ka → Fū → Kū → Shiki → Chi. Gegenüber: Chi↔Fū, Sui↔Kū, Ka↔Shiki. Dreiecke: Chi–Kū–Ka und Sui–Shiki–Fū (jeweils zwei Felder zurück).", "Das Godai-Rad: graue Ringlinien sind der Kreislauf, violette Linien die Gegenüber, gestrichelte grüne die Dreiecke.", "## Corruption bricht das Rad", "Verdorbene Mitte: Solange du den Corruption-Debuff trägst, sind die Gegenüber-Sprünge gesperrt. Ihre Linien laufen durch die Mitte des Rades, und die ist unrein. Dir bleiben Kreislauf und Dreieck.", "Gerissener Fluss: Trifft dich ein Angriff, der Corruption überträgt, machst du wie üblich deinen CON-Saving Throw. Misslingt er, fällt dein Fluss zusätzlich sofort auf 0.", "## Wirken", "Auf deinem Feld: Die Formeln des Elements, auf dem der Zeiger steht, wirkst du frei — so oft du Actions dafür hast.", "Abseits: Eine Formel eines anderen Elements kostet 1 Siegel. Der Zeiger bleibt dabei stehen, wo er ist.", "Siegel: Du hast INT-Modifier + halbes Level (abgerundet) Siegel, mindestens 1. Sie kehren beim Long Rest zurück."]}, {"h": "Säule 2 — Fluss", "body": ["Gewinnen: Ziehst du im Kreislauf (ein Feld weiter), gewinnst du 1 Fluss.", "Verlieren: Ziehst du einen Sprung — Gegenüber oder Dreieck —, fällt dein Fluss sofort auf 0.", "Höchstwert: 5 — also fünf Kreislauf-Züge in Folge, ohne dazwischen zu springen.", "| Fluss | Nachhall |", "| 1 | Deine Formeln verursachen +1 Schaden je Würfel. |", "| 2 | Der DC deiner Formeln steigt um 1. |", "| 3 | Einmal pro Runde wirkst du eine Formel eines anderen Elements ohne Siegel. |", "| 4 | Deine Formeln ignorieren Resistance gegen ihren Schadenstyp. |", "| 5 | Vollendeter Kreis: Einmal, während du auf 5 stehst, wirkst du in einem Zug je eine Formel ALLER sechs Elemente als eine einzige Action. Danach fällt dein Fluss auf 0. |"]}, {"h": "Eine andere Schule: Der Wheelbreaker", "body": ["Diese Wahl triffst du EINMAL, auf Stufe 1, und für immer: Der Wheelbreaker ersetzt Säule 1 (Das Rad) und Säule 2 (Fluss) vollständig. Alles andere — Formel-DC, Startausrüstung, die sechs Elemente selbst und ihr Wachstum auf den Stufen 5/9/13/17 — bleibt unverändert.", "## Ressourcen", "Spell Slots: Du hast eine Anzahl Spell Slots gleich deinem Charakterlevel. Sie kehren bei einem Long Rest vollständig zurück.", "Voller Zugriff: Du kennst und kannst jede der achtzehn Formeln aller sechs Elemente wirken — kein Rad, kein Feld, keine Pflicht zu ziehen. Shikigami falten und befehligen kannst du jederzeit, nicht nur auf einem bestimmten Feld.", "## Wirken auf gut Glück", "Wirkst du eine Formel, zahlst du 1 Spell Slot und würfelst sofort 1d100.", "| Wurf | Ergebnis |", "| 1–20 | Fehlschlag. Die Formel verpufft wirkungslos. Der Spell Slot ist trotzdem verbraucht. |", "| 21–40 | Falscher Griff. Statt deiner Formel wirkt eine zufällige — würfle 1d6 für das Element (1 Chi, 2 Sui, 3 Ka, 4 Fū, 5 Kū, 6 Shiki) und 1d3 für welche der drei Formeln darin (in der Reihenfolge aus der Tabelle „Die sechs Elemente\"). |", "| 41–60 | Die Formel wirkt genau wie beabsichtigt. |", "| 61–80 | Überschuss. Die Formel wirkt wie beabsichtigt, und du darfst im selben Zug sofort eine zweite Formel deiner Wahl wirken, ohne einen weiteren Spell Slot zu zahlen — das kostet dich keine zusätzliche Action, genau wie beim Vollendeten Kreis, der ebenfalls mehrere Formeln als eine einzige Action zählt. |", "| 81–99 | Vollgriff. Die Formel wirkt, als hättest du vier Kreislauf-Züge in Folge gemacht: +1 Schaden je Würfel, DC +1, und sie ignoriert Resistance gegen ihren Schadenstyp (siehe Fluss-Tabelle oben, Stufen 1, 2 und 4). |", "| 100 | Vollkommener Zufall. Wie 61–80 und 81–99 zusammen: Du wirkst deine Formel plus zwei weitere Formeln deiner Wahl, ohne weitere Spell Slots zu zahlen — und alle drei wirken als Vollgriff. |", "## Fremde Zauber", "Von den acht Stufen, an denen die Stufenübersicht ihm nichts gibt (1, 3, 7, 10, 11, 15, 18, 20), macht der Wheelbreaker etwas Eigenes: An jeder davon darfst du wählen, einen zusätzlichen Zauber aus der offiziellen D&D-Zauberliste zu lernen — vorausgesetzt, der Spielleiter erlaubt ihn in dieser Kampagnenwelt.", "| Stufe | Höchster Zaubergrad |", "| 1 | 1. Grad |", "| 3 | 1. Grad |", "| 7 | 2. Grad |", "| 10 | 3. Grad |", "| 11 | 3. Grad |", "| 15 | 4. Grad |", "| 18 | 5. Grad |", "| 20 | 6. Grad |", "Wirken: Ein gelernter Zauber kostet wie jede Formel 1 Spell Slot und durchläuft dieselbe Wirken-auf-gut-Glück-Tabelle oben — auch ein geliehener Zauber ist eine Wette, kein sicherer Griff.", "## Schmieden auf gut Glück", "Einmal pro Long Rest, während ein Gegenstand geschmiedet wird (siehe Handwerk-und-Sammeln.docx, „Vertiefungen\"), darfst du versuchen, ihn zu verzaubern — ohne dass der Spielleiter dafür zusätzliches Material verlangt, aber mit demselben Risiko wie jede deiner Formeln. Würfle 1d100.", "| Wurf | Ergebnis |", "| 1–20 | Fluch. Statt einer Verzauberung erhält der Gegenstand einen Fluch — der Spielleiter würfelt oder legt fest, welchen (Sesshō-seki, 8_Items/Wondrous Item/Legendaere-Artefakte/, ist das Vorbild für einen Fluchgegenstand in dieser Welt). |", "| 21–40 | Fehlgriff. Der Gegenstand erhält einen zufälligen, unpassenden Wondrous Effect oder nur einen +1 Enhancement Bonus — der Spielleiter entscheidet, was aus der Absicht geworden ist, unabhängig davon, was du eigentlich wolltest. |", "| 41–60 | Die Verzauberung gelingt genau wie mit dem Spielleiter abgesprochen (Enhancement Bonus oder Wondrous Effect). |", "| 61–80 | Überschuss. Die Verzauberung gelingt wie abgesprochen, und der Gegenstand erhält zusätzlich einen +1 Enhancement Bonus obendrauf. |", "| 81–99 | Vollgriff. Die Verzauberung gelingt in doppelter Stärke — ein Enhancement Bonus fällt um 1 höher aus, ein Wondrous Effect wirkt, als wäre er eine Stufe mächtiger. |", "| 100 | Vollkommener Zufall. Der Gegenstand erhält sowohl einen kräftigen Enhancement Bonus als auch einen mächtigen Wondrous Effect — die stärkste Verzauberung, die dieses Projekt kennt. |"]}, {"h": "Eine dritte Schule: Der Enchanter", "body": ["Ein Enchanter bleibt beim Rad — Säule 1 und Säule 2 gelten für ihn unverändert wie bei jedem Onmyōji. Der Unterschied zeigt sich erst auf Stufe 5, und dann bei jeder weiteren „Formeln steigen\"-Stufe (9, 13, 17): Statt seine eigenen Formeln stärker zu machen, legt er diese Kraft in die Gegenstände anderer.", "Die Wahl: Auf jeder dieser vier Stufen entscheidest du dich neu: den normalen +1d-Schadenswürfel-Bonus behalten, oder ihn gegen die passende Verzauberungsstufe unten eintauschen.", "| Stufe | Verzauberung statt +1d Schaden |", "| 5 | Ein Gegenstand, der gerade während eines Long Rests geschmiedet wird (siehe Handwerk-und-Sammeln.docx, „Vertiefungen\"), erhält einen +1 Enhancement Bonus, ohne dass der Spielleiter dafür zusätzliches Material verlangt. |", "| 9 | Wie Stufe 5, aber +2 Enhancement Bonus ODER ein einfacher Wondrous Effect nach Wahl des Spielleiters. |", "| 13 | Wie Stufe 5, aber +3 Enhancement Bonus ODER ein stärkerer Wondrous Effect nach Wahl des Spielleiters. |", "| 17 | Derselbe Gegenstand erhält einen +3 Enhancement Bonus UND einen Wondrous Effect gleichzeitig — was auf Stufe 9 und 13 noch eine Wahl war, ist jetzt beides zugleich. |", "Häufigkeit: Einmal pro Long Rest — dieselbe Grenze, die Handwerk-und-Sammeln.docx ohnehin fürs Schmieden setzt: ein Gegenstand pro Long Rest."]}, {"h": "Die sechs Elemente", "body": ["Die folgenden Formeln sind der Bestand, aus dem der Onmyōji schöpft; auf höheren Stufen werden sie stärker (siehe Stufentabelle).", "| Element | Wesen | Formeln |", "| 地 Chi — Erde | Standhalten, versperren, festhalten | Steinwall (Aktion): Eine Wand aus Erde, 30 ft. lang, 10 ft. hoch, blockiert Sicht und Bewegung, 1 Minute. · Wurzelgriff (Aktion): Ein Ziel in 60 ft. macht einen STR-Saving Throw oder ist restrained. · Standfest (Reaction): Du oder ein Verbündeter in 30 ft. kann nicht bewegt oder prone geworfen werden. |", "| 水 Sui — Wasser | Fließen, lösen, kühlen | Flutstoß (Aktion): 30-ft-Linie, 4d6 Bludgeoning Damage, DEX-Saving Throw halbiert, bei Misserfolg 10 ft. weggeschoben. · Lösende Woge (Aktion): Entferne eine Condition von einem Verbündeten in 30 ft. · Frostgriff (Aktion): 3d8 Cold Damage auf ein Ziel in 60 ft., halbierte Speed bis zum Ende seines nächsten Zuges. |", "| 火 Ka — Feuer | Verzehren, treiben, vernichten | Flammenwurf (Aktion): 20-ft-Kegel, 5d6 Fire Damage, DEX-Saving Throw halbiert. · Zündung (Aktion): Ein Ziel in 60 ft. macht einen DEX-Saving Throw oder brennt: 2d6 Fire Damage zu Beginn jedes seiner Züge, bis es die Flammen löscht. · Aschesicht (Bonus Action): Du siehst durch Rauch, Nebel und Dunkelheit auf 60 ft. |", "| 風 Fū — Wind | Bewegen, verschieben, tragen | Sturmstoß (Aktion): Alle Gegner in 15 ft. machen einen STR-Saving Throw oder werden 15 ft. weggeschleudert. · Windschritt (Bonus Action): Du bewegst dich bis zu 30 ft., ohne Opportunity Attacks auszulösen. · Tragende Böe (Aktion): Ein Verbündeter in 30 ft. erhält für 1 Minute eine Flugbewegungsrate von 30 ft. |", "| 空 Kū — Leere | Auflösen, verneinen, entleeren | Verneinung (Reaction): Eine Formel oder ein Zauber, den du siehst, wird aufgehoben, wenn sein Grad höchstens dein halbes Level beträgt. · Leerer Griff (Aktion): Ein Ziel in 60 ft. macht einen WIS-Saving Throw oder verliert Soul HP in Höhe deines INT-Modifiers. · Ungeschehen (Aktion): Ein Effekt in 30 ft., der eine Fläche belegt, endet. |", "| 式 Shiki — Form | Binden, befehlen, deuten | Shikigami falten (Aktion): siehe unten. · Bannkreis (Aktion): Ein 15-ft-Ring; Yokai und Untote müssen einen WIS-Saving Throw bestehen, um ihn zu betreten. · Die nächste Stunde lesen (Aktion, außerhalb des Kampfes): Der Spielleiter nennt dir eine Gefahr, die in der nächsten Stunde eintreten wird — nicht ihre Ursache und nicht ihren Ausgang. |", "## Shikigami", "Papierdiener, gefaltet und mit einem Namen beschriftet. Nur auf dem Feld Shiki kann er sie falten und befehligen.", "Falten: Aktion auf dem Feld Shiki. Du erschaffst einen Shikigami, der 1 Stunde besteht oder bis er zerstört wird. Du kannst gleichzeitig so viele haben, wie dein INT-Modifier beträgt (mindestens 1).", "Werte: AC 13, Hit Points gleich deinem Level, Speed 30 ft. (fliegend). Er handelt auf deiner Initiative. Angriff: +deinen Formel-Angriffsbonus, 1d6 + INT-Modifier Slashing Damage (Papierschnitt).", "Befehlen: Auf dem Feld Shiki befehligst du alle Shikigami frei. Auf jedem anderen Feld führen sie nur den letzten Befehl weiter aus.", "Späher: Ein Shikigami kann statt zu kämpfen bis zu 1 Meile weit auskundschaften. Du siehst und hörst durch ihn, während du dich nicht bewegst."]}], "intro": []}, {"id": "hanyo", "name": "Hanyō", "kanji": "半妖", "hd": 8, "saves": ["con", "dex"], "skills": {"n": 2, "from": ["Acrobatics", "Athletics", "Deception", "Intimidation", "Perception", "Stealth", "Survival"]}, "basics": {"Ressourcen": "Yōki (Kampfressource), Pakte (dauerhafte Macht gegen Opfer), Corruption als Treibstoff.", "Primärattribut": "Konstitution (bestimmt den Saving Throw DC seiner Fähigkeiten). Klauenangriffe nutzen Strength oder Dexterity.", "Hit Die": "1d8", "Saving Throws": "CON, DEX", "Weapon Proficiencies": "Simple, natürliche Waffen (Klauen und Biss)", "Armor Proficiencies": "Light oder keine (deine Wahl), sofern sie die Klauen nicht behindert", "Skills": "2 aus: Acrobatics, Athletics, Deception, Intimidation, Perception, Stealth, Survival", "Tools": "Keine", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Rasse": "NUR MENSCH. Ein Yokai kann kein Hanyō sein — er hätte nichts zu leihen, was er nicht schon besitzt. Diese Klasse ist der Weg eines Menschen, der Stücke von sich verkauft und dadurch wird, was er handelt.", "Izanamis Ruf": "Als Mensch geboren erreicht dich Izanamis Ruf zunächst nicht. Ab Yokai-Grad 3 — wenn geweihter Boden unter dir brennt und Priester dich als Yokai erkennen — kann er dich in deinen Träumen erreichen. Du bist der einzige Charakter am Tisch, der im Lauf der Kampagne verdächtig WIRD."}, "start": [{"k": "Waffen", "v": "Keine nötig — Klauen und Biss sind immer verfügbar. Optional ein Tantō, um als Mensch unauffällig bewaffnet zu wirken."}, {"k": "Rüstung", "v": "Keine oder leichte Rüstung, sofern sie die Klauen nicht behindert."}, {"k": "Zusätzlich", "v": "Unauffällige Alltagskleidung, um als Mensch durchzugehen."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Yōki; Verderbnis annehmen; Klauen und Zähne (1d6); Erster Pakt-Platz", "2": "Verderbnis abstoßen", "3": "Witterung; Yokai-Grad beginnt zu wirken", "4": "Ability Score Improvement", "5": "Klauen 1d8", "6": "Zweiter Pakt-Platz; Zäher Leib", "7": "—", "8": "Ability Score Improvement", "9": "Zusätzlicher Klauenangriff pro Zug", "10": "Yōki-Aufladung steigt um 1 pro Zug", "11": "Dritter Pakt-Platz; Klauen 1d10", "12": "Ability Score Improvement", "13": "—", "14": "Zäher Leib heilt doppelten Proficiency Bonus", "15": "—", "16": "Vierter Pakt-Platz; Ability Score Improvement", "17": "Klauen 2d6", "18": "Witterung reicht 300 ft. und du erkennst die Art des Yokai", "19": "Ability Score Improvement", "20": "Kapstein (siehe oben)"}, "msnotes": [], "rules": [{"h": "Yōki — die Maschine", "body": ["Pool: Dein Yōki-Höchstwert entspricht deinen maximalen Soul HP.", "Verderbnis annehmen (Bonus Action): Du nimmst den Corruption-Debuff willentlich an — überall, jederzeit, ohne Quelle. Du trägst deine eigene Verdammnis mit dir.", "Aufladen: Solange du Corruption trägst, gewinnst du zu Beginn jedes deiner Züge im Kampf Yōki in genau der Höhe, die dich der Debuff sonst an Soul HP gekostet hätte (ein Viertel deines Maximums, aufgerundet). Du verlierst dabei keine Soul HP.", "Überlauf: Ist dein Pool voll und du gewinnst weiter Yōki, schlägt der Überschuss doch auf deine Soul HP durch. Wer randvoll ist, blutet wie alle anderen.", "Abstoßen (Action): Du wirfst den Corruption-Debuff ab — als Einziger im Spiel ohne Schrein und ohne Talisman. Dabei verlierst du deinen gesamten Yōki-Vorrat."]}, {"h": "Klauen und Zähne", "body": ["Seine Grundausstattung, immer verfügbar, ohne Yōki-Kosten.", "Natürliche Waffen: Klauen und Biss gelten als magische Waffen. Klauen 1d6 Slashing Damage (Stufe 5: 1d8, Stufe 11: 1d10, Stufe 17: 2d6), Biss 1d8 Piercing Damage.", "Zäher Leib (ab Stufe 6): Solange du Corruption trägst, gewinnst du zu Beginn deines Zuges Hit Points in Höhe deines Proficiency Bonus zurück, sofern du über 0 TP bist.", "Witterung (ab Stufe 3): Du riechst Corruption. Du spürst verdorbene Wesen und Orte im Umkreis von 60 ft."]}, {"h": "Die Pakte", "body": ["Er bietet einem Yokai ein Stück von sich an — ein Auge, einen Arm, seine Stimme, seinen Schatten. Er erhält dessen Macht dauerhaft und trägt dafür einen dauerhaften Malus. Tötet er später genau diesen Yokai, bekommt er das Stück zurück: Der Malus fällt weg, die Macht bleibt.", "Pakt-Plätze: Vier insgesamt, freigeschaltet auf den Stufen 1, 6, 11 und 16.", "Pakt schließen: Erfordert einen willigen Yokai und eine Stunde. Der Spielleiter setzt diesen Yokai als benannte Kreatur in die Welt — er existiert, er hat einen Namen, und er trägt ein Stück deines Körpers.", "Zurückfordern: Tötest du den Yokai, mit dem du den Pakt geschlossen hast, bekommst du ALLES zurück, was du ihm je gezahlt hast — Körperteile, Hit Points, Seele. Die Fähigkeiten dieses Pakts behältst du für immer. Der Pakt-Platz wird NICHT frei; die Macht bleibt gebunden, nur der Preis entfällt.", "## Pakt-Tiefen", "Du zahlst dich Stufe für Stufe hinein — jede Tiefe kostet ein weiteres Opfer an denselben Yokai.", "| Tiefe | Gesamtkosten | Was du erhältst |", "| 1 | ein Opfer | Die dauerhafte Eigenschaft des Yokai und seine erste Fähigkeit. |", "| 2 | ein weiteres Opfer | Zusätzlich seine zweite Fähigkeit. |", "| 3 | ein weiteres Opfer | Zusätzlich seine dritte Fähigkeit. |", "## Womit du bezahlst", "Jedes Opfer zählt gleich viel — aber Körperteile sind endlich, Lebenskraft und Seele nicht.", "| Opfer | Malus, bis du ihn zurückholst | Wiederholbar |", "| Ein Auge | Disadvantage auf Ranged Attacks und auf Perception, die auf Sehen beruht. | zweimal |", "| Ein Arm | Du kannst keine zweihändigen Waffen führen und hast Disadvantage auf Athletics und Griffe. | zweimal |", "| Deine Stimme | Du kannst nicht sprechen — keine verbalen Komponenten und keine Charisma-Würfe, die Sprache erfordern (Deception, Persuasion, verbale Intimidation). Wortlose Einschüchterung, Performance ohne Worte und Schrift bleiben dir. | einmal |", "| Dein Schatten | Du kannst dich nicht verstecken; Stealth misslingt automatisch, solange du gesehen werden könntest. | einmal |", "| Dein Schmerzempfinden | Du bemerkst nicht, wie schwer du verletzt bist: Der Spielleiter führt deine Hit Points verdeckt. | einmal |", "| Lebenskraft | Deine maximalen Hit Points sinken um das Fünffache deines Levels. | beliebig oft |", "| Seele | Deine maximalen Soul HP sinken um 5 — und damit auch dein Yōki-Höchstwert. | beliebig oft |", "## Stufen-Pakte — wenn der Pate eine ausgebaute Rasse ist", "Vier der sieben Paten unten (Tengu, Oni, Kitsune, Yuki-onna) gehören zu Yokai-Rassen, die längst eine eigene Stufen-Fortschreibung von 1 bis 20 haben (siehe 2_Fuer-Spieler/Rassen). Für diese vier gilt eine eigene Regel statt der festen Drei-Fähigkeiten-Liste:", "Der Reihe nach, keine Lücken: Ein Pakt mit einem dieser vier Paten schaltet die Fähigkeiten seiner Rassen-Fortschreibung in der dort gedruckten Reihenfolge frei — du kannst keine einzelne späte Fähigkeit herauspicken, ohne die früheren derselben Reihe zu besitzen. Das ist keine Einschränkung um ihrer selbst willen: Viele späte Fähigkeiten setzen frühere ausdrücklich voraus (Kitsunes Flammenmeisterung nennt zum Beispiel Fuchsfeuer namentlich) — ohne die Reihenfolge hinge die Fähigkeit in der Luft.", "| Pakt-Tiefe | Reichweite in der Rassen-Fortschreibung |", "| 1 | Alles bis einschließlich der Fähigkeit auf Stufe 7 |", "| 2 | Alles bis einschließlich der Fähigkeit auf Stufe 13 |", "| 3 | Die gesamte Fortschreibung bis Stufe 20 |", "Level-Gate: Eine freigeschaltete Fähigkeit darfst du erst einsetzen, sobald deine eigene Charakterstufe die Stufe erreicht, auf der sie in der Rassen-Fortschreibung steht — unabhängig davon, wie weit deine Pakt-Tiefe schon reicht. Du kannst dich also früh in eine mächtige, späte Fähigkeit einkaufen und musst dann warten, bis du sie dir verdient hast.", "Eigene Nutzungsregel: Jede so erhaltene Fähigkeit behält die Nutzungsbeschränkung, die in ihrer Rassen-Fortschreibung steht (Long Rest, Short Rest, passiv, an eine andere Fähigkeit gebunden, …). Sie kostet KEIN Yōki, außer die Fortschreibung sagt selbst etwas anderes."]}, {"h": "Pakt-Archetypen", "body": ["Zwei verschiedene Systeme, je nachdem, ob der Pate zu einer Rasse mit eigener Stufen-Fortschreibung gehört.", "## Stufen-Pakte: Tengu, Oni, Kitsune, Yuki-onna", "Was jede Pakt-Tiefe an Fähigkeiten enthält, nach Namen — volle Wirkung im jeweiligen Rassen-Dokument (siehe „Stufen-Pakte\" oben für Regeln zu Reihenfolge und Level-Gate).", "| Pakt & Pate | Dauerhafte Eigenschaft | Tiefe 1 (bis Stufe 7) | Tiefe 2 (bis Stufe 13) | Tiefe 3 (bis Stufe 20) |", "| Tengu Sōjōbō | Fällt nie schneller als 60 ft./Runde, kein Falling Damage. | Schüler der Waffen, Federschlag, Schule der Gerechten | + Waffengelehrter, Krieger der Lüfte, Scharfsinniger Blick | + Master Flyer, Meister der Berge, Waffenmeister, Schwingenmeister |", "| Oni Shuten-dōji | Trageleistung verdoppelt; Advantage gegen Grappled und Zu-Boden-Werfen. | Monströse Stärke, Wutangriff, Mountain Strength | + Monströse Wut, Strength of Many, Oni Clobbering | + Oni Trajectory, Oni Ascendence, Oni Madness, Kapstein (Stufe 20) |", "| Kitsune Tamamo-no-Mae | Advantage auf Deception und auf Saving Throws gegen Illusionen. | Zwillingstrugbild (Stufe 4) — mehr nicht, siehe Deckel unten | — (Deckel gilt weiter) | — (Deckel gilt weiter) |", "| Yuki-onna O-Yuki | Immun gegen Kälte; hinterlässt keine Spuren im Schnee. | Eismagie, Lawinenruf, Schneeillusion | + Eiswaffe, Snowgrave, Eisige Gegenwart | + Schneemonstrosität, Eisernes Herz, Der eisige Schwur, Königin der Berge |", "## Feste Pakte: Jorōgumo, Nue, Daija", "Diese drei Paten gehören zu keiner Rasse mit eigener Stufen-Fortschreibung. Sie behalten das ursprüngliche System: drei feste Fähigkeiten mit Yōki-Kosten, die nacheinander mit den Pakt-Tiefen freischalten.", "| Pakt & Pate | Dauerhafte Eigenschaft | Fähigkeiten (Yōki-Kosten) |", "| Jorōgumo Die Spinne vom Jōren-Wasserfall | Du kannst an Wänden und Decken klettern, ohne zu würfeln. | Fangfaden (1): Ein Ziel in 30 ft. macht einen DEX-Saving Throw oder ist restrained. · Gift (2): Dein nächster Treffer macht +4d6 Poison Damage, CON-Saving Throw oder poisoned. · Netzfeld (4): 20-ft-Radius wird zu Difficult Terrain; wer darin endet, wird restrained. |", "| Nue Der Nue vom Kaiserpalast | Du kannst deine Stimme und deinen Umriss verzerren; Advantage auf Intimidation. | Schrei (2): Alle Gegner in 30 ft. machen einen WIS-Saving Throw oder sind 1 Minute lang frightened. · Fremde Glieder (3): Bis zum Ende deines nächsten Zuges erhältst du einen zusätzlichen Klauenangriff pro Zug. · Ungestalt (5): 1 Minute lang haben Angriffe gegen dich Disadvantage, weil niemand sagen kann, wo du endest. |", "| Daija Kiyohime | Du kannst deinen Kiefer ausrenken und dich durch jede Öffnung zwängen, durch die dein Kopf passt; Advantage auf Saving Throws gegen Gift. | Umschlingen (2): Ein Ziel in Reichweite macht einen STR-Saving Throw oder wird restrained und erleidet zu Beginn jedes seiner Züge 3d8 Bludgeoning Damage. · Häutung (3): Du streifst deine Haut ab — entferne alle Conditions und Krankheiten von dir und heile 4d8 Hit Points. · Schlangenleib (4): 1 Minute lang wirst du zu einer großen Schlange: Kletter- und Schwimmrate 40 ft., +5 ft. Reichweite, und dein Biss verursacht zusätzlich 3d6 Poison Damage. |", "## Die legendären Paten", "Jeder Pakt wird mit dem gefährlichsten Vertreter seiner Art geschlossen — nicht mit irgendeinem Yokai. Damit steht jede Jagd von Anfang an fest, und jede ist eine eigene Sage.", "| Pate | Wer er ist und was ihn gefährlich macht |", "| Sōjōbō | König der Tengu, Großer Tengu vom Berg Kurama. Er lehrte Minamoto no Yoshitsune das Schwert und soll die Kraft von tausend Tengu besitzen. Wer ihn stellt, kämpft gegen den Lehrmeister aller Fechter. |", "| Shuten-dōji | Der mächtigste Oni der Überlieferung, Herr der Dämonen vom Ōe-Berg. Minamoto no Raikō bezwang ihn nur, indem er ihn mit poisonedem Sake betrunken machte — offen war er nicht zu schlagen. |", "| Tamamo-no-Mae | Die Neunschwänzige, die in Menschengestalt den Hof betörte, bis Abe no Yasunari sie entlarvte. Nach ihrem Tod wurde sie zum Sesshō-seki, dem Tötenden Stein, der alles poisonede, was ihn berührte. |", "| Die Spinne vom Jōren-Wasserfall | Sie legt ihre Fäden um die Knöchel derer, die zu nahe ans Wasser treten, und zieht sie hinab. Wer ihren Namen kennt und ihn ausspricht, gehört ihr. |", "| O-Yuki | Die Schneefrau, die einen jungen Holzfäller verschonte und ihn Jahre später als Ehefrau wiederfand — unter der Bedingung, dass er nie erzählt, was er in jener Nacht sah. Sie hält Wort, solange man Wort hält. |", "| Der Nue vom Kaiserpalast | Affenkopf, Tanukileib, Schlangenschwanz, Tigerpranken. Er hockte als schwarze Wolke über dem Palast und ließ den Kaiser erkranken, bis Minamoto no Yorimasa ihn im Dunkeln herabschoss. |", "| Kiyohime | Aus Eifersucht auf den Mönch Anchin wurde sie zur großen Schlange, verfolgte ihn bis zum Dōjō-ji und verbrannte ihn in der Glocke, unter der er sich versteckte. Liebe, die nicht loslässt. |"]}, {"h": "Der Yokai-Grad", "body": ["Die Uhr braucht keine eigene Mechanik: Dein Yokai-Grad ist die Zahl deiner OFFENEN Pakte — jener, deren Yokai noch lebt und noch ein Stück von dir hält.", "| Offene Pakte | Wirkung |", "| 1 | Deine Augen spiegeln im Dunkeln. Du siehst 60 ft. weit in Dunkelheit. |", "| 2 | Deine Zähne und Klauen wachsen sichtbar. +1 auf Damage Rolls mit natürlichen Waffen. Menschen weichen dir aus; Disadvantage auf Persuasion gegenüber Fremden. |", "| 3 | Dein Yokai-Blut siegt sichtbar. +2 auf Damage Rolls, du benötigst keine Nahrung mehr — aber Schreinpriester und Yokai Hunter erkennen dich als Yokai, und geweihter Boden brennt unter deinen Füßen (1d6 pro Runde). |", "| 4 | Du bist kaum noch Mensch. +3 auf Damage Rolls, Resistenz gegen Necrotic Damage — und wenn deine Soul HP in diesem Condition jemals auf 0 fallen, übernimmt der Spielleiter deinen Charakter dauerhaft als Yokai. |", "## Zurückgeforderte Pakte", "Eine zweite, unabhängige Zählung neben den offenen Pakten: Wie viele deiner Paten hast du bereits erschlagen und dir zurückgeholt, was du ihnen gabst? Offene und zurückgeforderte Pakte wirken gleichzeitig — ein Hanyō mit zwei offenen und einem zurückgeforderten Pakt hat die Wirkung von „2 offene Pakte\" UND „1 zurückgeforderter Pakt\" zugleich.", "| Zurückgeforderte Pakte | Wirkung |", "| 1 | Du hast bewiesen, dass du zurücknehmen kannst, was dir gehört. Einmal pro Long Rest darfst du einen misslungenen Saving Throw gegen frightened oder charmed wiederholen. |", "| 2 | +1 auf einen Ability Score deiner Wahl, dauerhaft (bis zum Maximum von 20). Das kommt zusätzlich zu deinen regulären Ability Score Improvements. |", "| 3 | Bei einem Short Rest darfst du zusätzlich einen Hit Die auswürfeln, ohne einen deiner eigenen Hit Dice dafür auszugeben, und die Hit Points sofort gutschreiben. |", "| 4 | Kein sichtbares Yokai-Zeichen mehr, gleich wie viele Pakte du je offen hattest oder noch hast — du siehst vollständig menschlich aus. Das nimmt die Erkennungs- und Brand-Klauseln der Offene-Pakte-Tabelle für die Außenwirkung, ändert aber nichts an tatsächlich noch offenen Pakten selbst. |"]}, {"h": "Kapstein (Stufe 20)", "body": ["Was du auf Stufe 20 bist, hängt davon ab, wie du gespielt hast — nicht davon, was du gewählt hast.", "Ganz und doch nicht (alle vier Pakte zurückgefordert): Du bist wieder vollständig und behältst jede geliehene Macht. Du kannst nicht mehr unfreiwillig zum Yokai werden. Deine Yōki-Aufladung verdoppelt sich, und du darfst Corruption abstoßen, ohne deinen Vorrat zu verlieren.", "Was übrig blieb (drei oder mehr Pakte offen): Du hast zu viel von dir weggegeben. Dein Yōki-Höchstwert verdoppelt sich, und du erhältst einen weiteren Klauenangriff pro Zug — aber du kannst Corruption nicht mehr abstoßen. Was du bist, bist du für immer."]}], "intro": [], "onlyRace": "mensch"}, {"id": "biwahoshi", "name": "Biwa hōshi", "kanji": "琵琶法師", "hd": 8, "saves": ["wis", "cha"], "skills": {"n": 3, "from": ["Deception", "History", "Insight", "Perception", "Performance", "Persuasion", "Religion"]}, "basics": {"Ressourcen": "Namen (dauerhafte Sammlung), Soul HP (Preis für Beschwörungen), Strophen (Kampfressource).", "Primärattribut": "Charisma bestimmt den Saving Throw DC und die Stärke seiner Rezitationen.", "Hit Die": "1d8", "Saving Throws": "WIS, CHA", "Weapon Proficiencies": "Simple", "Armor Proficiencies": "Keine", "Skills": "3 aus: Deception, History, Insight, Perception, Performance, Persuasion, Religion", "Tools": "Musical Instrument (Biwa)", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Blindheit": "Ein Biwa hōshi ist traditionell blind. Er erhält Blindsight 30 ft. und kann nicht blinded werden; außerhalb dieser Reichweite ist er auf Gehör und die Beschreibungen anderer angewiesen. Die Blindheit ist optional — ein sehender Spieler verzichtet auf Blindsight und Blindheitsimmunität."}, "start": [{"k": "Waffe", "v": "Ein Bō als Wanderstab (siehe Waffen-der-Inseln.docx) — improvisierte Nahkampfwaffe, kein Kampfwerkzeug."}, {"k": "Rüstung", "v": "Keine."}, {"k": "Zusätzlich", "v": "Eine Biwa (dein Instrument), dein leeres Epos für Strophen."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Namen sammeln; Namensrezitation; zwei Strophen deiner Wahl; Blindsight", "2": "Heimkehr möglich (Segen und Fusionen)", "3": "Namen der Ungehörten", "4": "Ability Score Improvement", "5": "Trostlied; eine weitere Strophe deiner Wahl", "6": "Rezitation reicht 60 ft.", "7": "Widerhall rufen", "8": "Ability Score Improvement", "9": "Rezitation gibt doppelten CHA-Modifikator; eine weitere Strophe ODER ein Widerhall-Rang", "10": "Zwei Strophen gleichzeitig halten", "11": "Widerhall bis CR gleich halber Stufe", "12": "Ability Score Improvement", "13": "Widerhall hält 5 Runden; eine weitere Strophe ODER ein Widerhall-Rang", "14": "Zwei Fusionen im Epos gleichzeitig möglich", "15": "Namen der Ungehörten wirkt auch auf Wesen ohne bekannten Namen, wenn du ihre Geschichte kennst", "16": "Ability Score Improvement", "17": "Rezitation gibt dreifachen CHA-Modifikator; eine weitere Strophe ODER ein Widerhall-Rang", "18": "Du darfst einen Widerhall und eine Fusion gleichzeitig gerufen haben", "19": "Ability Score Improvement", "20": "Unvergessen: Widerhalle verbrauchen keine Namen mehr"}, "msnotes": [], "rules": [{"h": "Säule 1 — Namen", "body": ["Der Biwa hōshi sammelt Namen und die Geschichten, die daran hängen.", "Einen Namen erwerben: Du erfährst den Namen eines toten oder verlorenen Wesens UND ein Stück seiner Geschichte — von einem Zeugen, aus einer Inschrift, aus einer Vision, von einem Geist selbst oder aus dem Mund des Wesens, als es noch lebte. Beides zusammen macht den Namen brauchbar; ein Name ohne Geschichte ist nur Klang.", "Aufzeichnen: Du trägst ihn als Strophe in dein Epos ein. Das Epos ist ein echtes Dokument am Tisch — führe es.", "Anzahl: Unbegrenzt. Du darfst so viele Namen sammeln, wie du findest.", "## Rezitieren", "Namensrezitation (Action): Du sprichst einen Namen aus deinem Epos. Wähle eine Kreatur in 30 ft.: Sie gewinnt Soul HP in Höhe deines Charisma Modifiers zurück (Stufe 9: doppelt, Stufe 17: dreifach). Der Name wird dabei nicht verbraucht.", "Häufigkeit: Proficiency Bonus-mal pro Long Rest.", "Trostlied (Stufe 5): Statt einer einzelnen Kreatur erreichst du alle Verbündeten in 30 ft. — jeder gewinnt Soul HP in Höhe der Hälfte deines Charisma Modifiers (aufgerundet).", "Namen der Ungehörten (Stufe 3): Du kannst einem Geist, einem Onryō oder einem verdorbenen Wesen seinen eigenen Namen zurückgeben, wenn du ihn kennst. Es macht einen WIS-Saving Throw gegen deinen DC; bei Misserfolg hört es auf zu kämpfen und hört dir zu. Gegen Wesen, die aus Trauer oder gebrochenem Schwur handeln, hat es Disadvantage auf diesen Wurf."]}, {"h": "Säule 2 — Widerhalle", "body": ["Widerhall rufen (Action, ab Stufe 7): Du gibst einen Namen aus deinem Epos auf und zahlst Soul HP. Eine geistige Kopie dieses Wesens erscheint in 30 ft.", "Kosten: Soul HP gleich der Hälfte des Challenge Ratinges des Wesens, aufgerundet, mindestens 1. Ein Wesen mit CR 8 kostet also 4 Soul HP.", "Der Name ist danach fort: Die Strophe erlischt. Du kannst dieses Wesen nicht erneut rufen und seinen Namen nicht mehr rezitieren, bis du ihn wieder erwirbst.", "Grenze: Ein Widerhall zur Zeit. Der Challenge Rating des Wesens darf höchstens deine halbe Stufe betragen (abgerundet).", "## Wie ein Widerhall funktioniert", "| Regel | Wirkung |", "| Keine Hit Points | Ein Widerhall hat keine Hit Points und kann nicht verletzt, charmed, frightened oder getötet werden. Er kann nicht Ziel von Angriffen sein. Nichts daran ist zu verwalten. |", "| Dauer | 3 Runden (ab Stufe 13: 5 Runden). Danach verblasst er ohne Rest. |", "| Handeln | Er handelt auf deiner Initiative unter deiner Kontrolle. Er nutzt die Angriffe und Fähigkeiten des Wesens, dessen Erinnerung er ist — aber keine Legendary Actions, keine Beschwörungen und nichts, was Hit Points oder Ressourcen verlangt. |", "| Kein Körper | Er kann nicht tragen, nicht heben, keine Türen öffnen und keine Gegenstände benutzen, die nicht Teil seiner Erinnerung sind. Seine Angriffe wirken dennoch. |", "| Blockiert nicht | Er nimmt keinen Raum ein und gewährt keine Deckung. Kreaturen bewegen sich durch ihn hindurch. |", "## Widerhall-Rang", "Ab Stufe 9 entscheidet er, wie weit er gehen will: mehr Lieder — oder mehr und stärkere Erinnerungen, die auf seinen Ruf antworten. Auf den Stufen 9, 13 und 17 darf er statt einer neuen Strophe (siehe Säule 4) einen Widerhall-Rang wählen.", "| Rang-Option | Wirkung |", "| Mehr Widerhalle | Die Grenze gleichzeitig aktiver Widerhalle steigt um 1. Höchstens zweimal wählbar (macht insgesamt höchstens drei gleichzeitig). |", "| Mächtigere Widerhalle | Die CR-Grenze deiner Widerhalle und Fusionen steigt um 2 zusätzlich zur sonst geltenden Grenze, und ihre Dauer steigt um 1 Runde. Beliebig oft wählbar. |", "## Unvergessen (Stufe 20)", "Wirkung: Ein Widerhall verbraucht den Namen nicht mehr. Du kannst jedes Wesen in deinem Epos beliebig oft rufen — die Soul-HP-Kosten bleiben."]}, {"h": "Säule 3 — Heimkehr", "body": ["Eine Heimkehr vollziehen: Du bringst den Namen und die Geschichte eines verlorenen Wesens zu einer Kreatur, der dieses Wesen wichtig war — einem Hinterbliebenen, einem Gefährten, einem Wächter, einem Feind, der es geliebt hat. Du erzählst. Das kostet keine Ressource, nur Zeit und die Reise dorthin.", "Belohnung: Du erhältst dauerhaft einen Segen, der von dem Wesen abhängt, dessen Name heimgekehrt ist. Und du erhältst eine Fusion.", "## Fusionen", "Was es ist: Beide Namen — der des Verlorenen und der des Hinterbliebenen — verschmelzen in deinem Epos zu einer einzigen Strophe. Du kannst die Fusion als Widerhall rufen: ein Wesen, das beide zugleich ist.", "Dauerhaft: Eine Fusion verbraucht keinen Namen, auch vor Stufe 20 nicht. Sie ist für immer Teil deines Epos.", "Stärker: Eine Fusion darf einen Challenge Rating bis zu deiner vollen Stufe haben (statt der Hälfte) und hält doppelt so lange wie ein normaler Widerhall. Sie darf die stärkste Form beider Wesen annehmen, auch eine, die im Leben nur einmal erschienen ist.", "Grenze: Auch von Fusionen ist nur eine zur Zeit gerufen. Die Soul-HP-Kosten richten sich nach ihrem Challenge Rating wie üblich.", "## Segen nach Wesen — Vorlage", "Der Segen richtet sich nach dem, was das heimgekehrte Wesen war. Die folgende Tabelle ist eine Vorlage; der Spielleiter trägt die konkreten Wesen seiner Kampagne ein und wählt den passenden Segen.", "| Wesen war … | Segen |", "| ein Wächter | Verbündete in 30 ft. erhalten +1 auf die Armor Class, solange du bei Bewusstsein bist. |", "| ein Krieger | Einmal pro Kampf darfst du einem Verbündeten als Reaction einen zusätzlichen Waffenangriff gewähren. |", "| ein Heiler oder Priester | Deine Namensrezitation gibt zusätzlich Hit Points in gleicher Höhe wie Soul HP. |", "| ein Verratener oder Ermordeter | Du hast Advantage auf Würfe, um Lügen zu erkennen, und einmal pro Long Rest darfst du eine Kreatur in 30 ft. zu einem CHA-Saving Throw gegen deinen DC zwingen; bei Misserfolg beantwortet sie eine Frage wahrheitsgemäß. |", "| ein Liebender oder Trauernder | Deine Rezitationen wirken auch auf Kreaturen, die dich nicht hören können, und du gewinnst eine zusätzliche Nutzung pro Long Rest. |", "| ein Verlorener oder Wanderer | Du kennst stets den Weg zum nächsten Schrein und spürst, ob er verdorben ist. |", "| ein Gelehrter oder Erzähler | Du darfst einen Namen erwerben, indem du eine Stunde in einem Archiv oder an einem Grab verbringst, ohne einen Zeugen zu brauchen. |"]}, {"h": "Säule 4 — Strophen im Kampf", "body": ["Spielen (Bonus Action): Du beginnst eine Strophe. Solange du sie hältst (Concentration), wirkt sie. Du darfst dich bewegen und rezitieren, aber keine Waffe führen.", "Lernen: Auf Stufe 1 wählst du zwei Strophen aus der Liste unten, auf Stufe 5 eine weitere. Auf den Stufen 9, 13 und 17 wählst du entweder eine weitere Strophe ODER einen Widerhall-Rang (siehe Säule 2) — nicht jeder Biwa hōshi kennt am Ende dieselben Lieder.", "| Strophe | Mindeststufe | Wirkung, solange du spielst |", "| Die Klage | 1 | Verbündete in 30 ft. erhalten +1d4 auf Saving Throws. |", "| Das Heldenlied | 1 | Verbündete in 30 ft. erhalten +1d4 auf Attack Rolls. |", "| Das Wanderlied | 1 | Verbündete in 30 ft. ignorieren Difficult Terrain und erhalten +10 ft. Speed. |", "| Das Erinnerungslied | 1 | Verbündete in 30 ft. haben Advantage auf Checks, die Wissen, Geschichte oder Erinnerung betreffen. |", "| Das Mahnlied | 5 | Ein Gegner deiner Wahl in 60 ft. macht einen WIS-Saving Throw; bei Misserfolg hat er Disadvantage auf Angriffe gegen jeden außer dir. |", "| Das Spottlied | 5 | Ein Gegner deiner Wahl in 30 ft. macht zu Beginn deines Zuges einen WIS-Saving Throw; bei Misserfolg muss er in seinem nächsten Zug dich angreifen, wenn er kann. |", "| Das Totenlied | 9 | Untote und Yomi-Wesen in 30 ft. erleiden zu Beginn deines Zuges 2d8 Radiant Damage. |", "| Das stille Lied | 13 | Verbündete in 30 ft. verlieren durch Corruption keine Soul HP, solange du spielst. Entfernt sie nicht. |", "| Das Schlaflied | 13 | Zu Beginn deines Zuges macht ein Gegner deiner Wahl in 30 ft. einen WIS-Saving Throw oder ist bis zum Ende seines nächsten Zuges incapacitated. |", "| Das letzte Lied | 17 | Fällt ein Verbündeter in 30 ft. auf 0 Hit Points, darf er sofort mit 1 Trefferpunkt aufstehen. Einmal pro Kampf. |"]}], "intro": []}, {"id": "ninja", "name": "Ninja", "kanji": "忍者", "hd": 10, "saves": ["dex"], "skills": {"n": 0, "fixed": ["Acrobatics", "Sleight of Hand", "Stealth"]}, "basics": {"Konzept": "Der Umgang mit abgelenkten Gegnern — solange du ungesehen bleibst.", "Primärattribut": "Dexterity. Vielleicht Charisma als Alternative, wegen Performance im Way of the Mist.", "Hit Die": "1d10", "Saving Throws": "DEX", "Weapon Proficiencies": "Wähle 2 aus: Improvised, Versatile, Simple, Martial Weapons", "Armor Proficiencies": "Light", "Skills": "Acrobatics, Sleight of Hand, Stealth", "Tools": "Disguise Kit, Thieves' Tools, Gaming Set", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1."}, "start": [{"k": "Waffen", "v": "Wähle eine Versatile-Waffe als Startwaffe: Katana oder Bō (Werte siehe Waffen-der-Inseln). Weitere Ninja-Waffen: Kunai, Wurfstern und Jitte."}, {"k": "Rüstung", "v": "Hara-ate (Light Armor, AC 11 + DEX-Modifier, siehe Ruestung-der-Inseln)."}, {"k": "Spezialitem", "v": "Wähle eins: Disguise Kit, Thieves' Tools oder Gaming Set."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Proficiencies: 2 aus Improvised, Versatile, Simple und Martial Weapons; DEX-Saving Throw, Acrobatics, Sleight of Hand, Stealth, Light Armor", "2": "Cunning Action (vom Rogue)", "3": "Wähle deinen Weg (erste Fähigkeit des Wegs)", "4": "Ability Score Improvement", "5": "Zweite Fähigkeit des Wegs", "6": "Uncanny Dodge (vom Rogue)", "7": "Verbesserung der ersten Fähigkeit des Wegs", "8": "Ability Score Improvement", "9": "Evasion (vom Rogue) — wirklich wichtiges Feature", "10": "Verbesserung der zweiten Fähigkeit des Wegs", "11": "Zusätzliche Reaction pro Runde (allgemeine Fähigkeit)", "12": "Ability Score Improvement", "13": "Dritte Fähigkeit des Wegs", "14": "(allgemeine Fähigkeit) In deinem Zug darfst du mit einer Bonus Action eine Action vorbereiten (Ready)", "15": "Erste und zweite Fähigkeit des Wegs skalieren", "16": "Ability Score Improvement", "17": "(allgemeine Fähigkeit skaliert) insgesamt 2 zusätzliche Reactions pro Runde", "18": "Alle Fähigkeiten des Wegs skalieren", "19": "Ability Score Improvement", "20": "Meisterfähigkeit des Wegs; Legendary Actions"}, "msnotes": [], "rules": [{"h": "Die drei Wege", "body": ["Auf Stufe 3 wählst du deinen Weg. Jeder Weg hat drei Fähigkeiten und eine Meisterfähigkeit (Stufe 20).", "## Way of the Shadow", "Der Teil des Ninja, der darauf trainiert ist, im Dunkeln und gegen mehrere Ziele zugleich zu kämpfen. Gegner werden unterschieden in oblivious und nicht oblivious.", "1. Gegen oblivious Gegner hast du Advantage und verursachst Bonusschaden (skaliert).", "2. [ ]", "3. [ ]", "Meisterfähigkeit: Flash Bang (auf hoher Stufe).", "## Way of the Mist", "Nine Cut Technique: Die Anzahl gleichzeitiger Siegel steigt mit dem Level.", "Onmyōdō → Wuxing: Elementarer Fernkampf mit dem zerstörenden und dem erzeugenden Zyklus. Möglich als herstellbare Munition: Es wird angenommen, dass du alle Materialien hast; sie kostet nur ein paar Kupfer- oder Silberstücke.", "1. [ ]", "2. [ ]", "3. [ ]", "Meisterfähigkeit: + Nine Cut Technique", "## Way of the Sand", "Fallen. Auf höheren Stufen tragbare Fallen — durch Magie etwas, das du vorher vorbereitest und dann praktisch sofort einsetzen kannst, etwa tragbare Fallgruben.", "1. [ ]", "2. [ ]", "3. [ ]", "Meisterfähigkeit: (?) Sofortfallen: X-mal pro Long Rest erschaffst du Fallen aus dem Nichts, ohne sie herstellen zu müssen und ohne Materialien."]}, {"h": "Allgemeine Fähigkeiten", "body": ["Improvised Crafts: zum Beispiel Caltrops.", "Zusätzliche Reaction: Eine zusätzliche Reaction pro Runde (Stufe 11), insgesamt zwei (Stufe 17).", "Legendary Actions (Stufe 20): Du hast 3 Legendary Actions. Angriff kostet 1, Bewegung kostet 1. Idee: Die Meisterfähigkeiten der anderen Wege könnten als Legendary Actions oder normale Actions nutzbar sein, mit Recharge, und kosten 2."]}], "intro": []}], "weapons": [{"n": "Katana", "d": "1d8 Slashing, versatile (1d10)", "p": "Versatile, Finesse"}, {"n": "Wakizashi", "d": "1d6 Slashing", "p": "Finesse"}, {"n": "Naginata", "d": "1d10 Slashing", "p": "Reach 10 ft."}, {"n": "Daikyū (Yumi)", "d": "1d8 Piercing", "p": "Ammunition 150/600, Heavy, Two-Handed"}, {"n": "Yari", "d": "1d6 Piercing", "p": "Reach 10 ft."}, {"n": "Hankyū", "d": "1d8 Piercing", "p": "Ammunition 120/480, Two-Handed"}, {"n": "Azusa-yumi", "d": "1d4 Bludgeoning", "p": "40 ft., Two-Handed, ohne Munition"}, {"n": "Kanabō", "d": "1d12 + 1d6 Bludgeoning", "p": "Heavy, Two-Handed, Disadvantage vs. klein"}, {"n": "Tantō", "d": "1d4 Piercing", "p": "Finesse, Light"}, {"n": "Kama", "d": "1d6 Slashing", "p": "Finesse, Light"}, {"n": " <script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const AB=['str','dex','con','int','wis','cha'];
const ABN={str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const ABK={str:'力',dex:'敏',con:'体',int:'知',wis:'賢',cha:'魅'};
const SKILLAB={'Acrobatics':'dex','Animal Handling':'wis','Arcana':'int','Athletics':'str','Deception':'cha','History':'int','Insight':'wis','Intimidation':'cha','Investigation':'int','Medicine':'wis','Nature':'int','Perception':'wis','Performance':'cha','Persuasion':'cha','Religion':'int','Sleight of Hand':'dex','Stealth':'dex','Survival':'wis'};
const R=Object.fromEntries(DATA.races.map(r=>[r.id,r]));
const C=Object.fromEntries(DATA.classes.map(c=>[c.id,c]));
const $=s=>document.querySelector(s);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const mod=s=>Math.floor((s-10)/2);
const sgn=n=>(n>=0?'+':'')+n;
const prof=l=>2+Math.floor((l-1)/4);

/* ---------- state ---------- */
let S={chars:[],sel:null,tab:'sheet',party:false};
let store={mode:'local',db:null,user:null,uid:null,ref:null,writing:false,dirty:false,timer:null,others:{}};

function score(c,a){let s=(+c.base[a]||0)+(R[c.raceId].bonus[a]||0);if((c.raceChoice||[]).includes(a))s+=1;for(const L of c.levels||[])s+=(L.asi&&L.asi[a])||0;return s}
function mods(c){return Object.fromEntries(AB.map(a=>[a,mod(score(c,a))]))}
function lehren(c){return (c.bonds||[]).map(b=>b.lehre).filter(Boolean)}
function hpMax(c){const cl=C[c.classId];const m=mods(c).con;let hp=cl.hd;for(const L of c.levels||[])hp+=+L.hp||0;hp+=c.level*m;if(c.raceId==='mensch')hp+=c.level;if(lehren(c).includes('Der ungebrochene Leib'))hp+=2*c.level;return Math.max(1,hp)}
function soulMax(c){const m=mods(c);return Math.max(1,2+c.level+AB.reduce((t,a)=>t+m[a],0))}
function acOf(c){const d=mods(c).dex;const eq=(c.inv||[]).filter(i=>i.equipped&&i.armor);let body=eq.find(i=>['light','medium','heavy'].includes(i.armor.type));let ac;
  if(body){const a=body.armor;ac=a.type==='light'?a.base+d:a.type==='medium'?a.base+Math.min(d,2):a.base}
  else if(eq.find(i=>i.armor.type==='clothes'))ac=11+d;else ac=10+d;
  if(eq.find(i=>i.armor.type==='shield'))ac+=2;return ac}
function isYokai(c){return c.raceId!=='mensch'}

/* ---------- persistence ---------- */
function setStatus(t){$('#status').innerHTML=t}
function lsLoad(){try{const v=localStorage.getItem('siegelrolle');return v?JSON.parse(v):[]}catch(e){return[]}}
function lsSave(){try{localStorage.setItem('siegelrolle',JSON.stringify(S.chars))}catch(e){}}
function save(){lsSave();if(store.mode!=='db')return;store.dirty=true;clearTimeout(store.timer);store.timer=setTimeout(flush,700);setStatus('Speichert …')}
async function flush(){if(store.writing||!store.dirty)return;store.writing=true;store.dirty=false;
  try{await store.ref.set({chars:JSON.parse(JSON.stringify(S.chars)),updated:Date.now()});setStatus('<b>Gespeichert</b> · für dich und deine Gruppe sichtbar')}
  catch(e){if(e&&e.code==='invalid_argument'){store.mode='local';setStatus('Nur in diesem Browser gespeichert: du hast keine Schreibrechte für die Rolle. Bitte den Spielleiter, dich als Contributor einzuladen.')}else if(e&&e.code==='quota_exceeded'){setStatus('<span class="warn">Speicher voll.</span> Lösche alte Charaktere.')}else{setStatus('Speichern fehlgeschlagen, neuer Versuch …');store.dirty=true;setTimeout(flush,1500+Math.random()*1000)}}
  finally{store.writing=false;if(store.dirty)flush()}}
async function initStore(){
  S.chars=lsLoad();if(S.chars.length)S.sel=S.chars[0].id;render();
  const api=window.claude;if(!api||!api.use){setStatus('Gespeichert in diesem Browser.');return}
  const [db,user]=await Promise.all([api.use('db'),api.use('user')]);
  store.db=db;store.user=user;store.uid=user?await user.id():null;
  if(!db||!store.uid){setStatus('Gespeichert nur in diesem Browser (nicht angemeldet).');return}
  store.ref=db.doc('characters/'+store.uid);store.mode='db';
  let got=false;const t=setTimeout(()=>{if(!got)setStatus('Die gemeinsame Rolle antwortet noch nicht. Änderungen bleiben vorerst in diesem Browser.')},10000);
  store.ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(t)}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.exists?snap.data():null;
    if(d&&Array.isArray(d.chars)){if(!store.dirty&&!store.writing){S.chars=JSON.parse(JSON.stringify(d.chars));if(!S.chars.find(c=>c.id===S.sel))S.sel=S.chars[0]?.id||null;lsSave();render()}}
    else if(!snap.metadata.fromCache&&S.chars.length){store.dirty=true;flush()}
    if(!snap.metadata.fromCache)setStatus('<b>Verbunden</b> · Charaktere werden für die Gruppe gespeichert');
  },e=>{clearTimeout(t);store.mode='local';setStatus('Gemeinsame Rolle nicht erreichbar. Gespeichert in diesem Browser.')});
  db.collection('characters').onSnapshot(snap=>{store.others={};for(const d of snap.docs){const v=d.data();if(v&&Array.isArray(v.chars))store.others[d.id]=v.chars}if(S.party)render()},()=>{});
}

/* ---------- text rendering of doc lines ---------- */
function renderLines(lines){const out=h('div',{class:'txt'});let tb=null;
  for(const raw of lines){const l=raw.trim();if(!l)continue;
    if(l.startsWith('|')){const cells=l.replace(/^\||\|$/g,'').split(' | ').map(s=>s.replace(/\\\*/g,'').trim());if(!tb){tb=h('table');out.append(h('div',{class:'tblw'},tb));const tr=h('tr');cells.forEach(c=>tr.append(h('th',{},c)));tb.append(tr)}else{const tr=h('tr');cells.forEach(c=>tr.append(h('td',{},c)));tb.append(tr)}continue}
    tb=null;
    if(l.startsWith('## ')){out.append(h('h4',{},l.slice(3)));continue}
    const m=l.match(/^([^.:!?]{2,48}?)([.:]) (.+)$/);
    if(m&&!/\d$/.test(m[1])&&m[1].split(' ').length<=5&&!/^(Du|Dein|Deine|Er|Sie|Es|Wenn|Als|Wer|Ein|Eine|Der|Die|Das|Jede|Jeder|Bei|Auf|Im|In|Solange|Nur|Mit|Für|Nach|Kein|Keine)\b/.test(m[1])){out.append(h('p',{},h('b',{},m[1]+m[2]+' '),m[3]))}else out.append(h('p',{},l))}
  return out}

function classStepValid(st){const D=st.dec;switch(st.classId){
  case 'samurai':return D.haltung&&['Auftakt','Verbindung','Abschluss'].every(a=>(D.moves||{})[a]);

  case 'biwahoshi':return (D.strophen||[]).length===2;case 'ninja':return (D.nprof||[]).length===2;default:return true}}

  case 'samurai':Object.assign(o,{haltung:D.haltung,schule:D.schule||'',bewegungen:['Auftakt','Verbindung','Abschluss'].map(a=>D.moves[a])});break;

  case 'sohei':if(D.weg==='Option B')o.optB=1;else o.weg=[D.weg];break;
