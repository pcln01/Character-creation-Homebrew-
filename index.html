hrer Hit Points, verursacht dein nächster Treffer gegen sie doppelten Schaden.", "Der letzte Atem": "Bringst du deine Beute auf 0 Hit Points, darfst du sofort eine neue Beute markieren und einen Angriff gegen sie ausführen.", "Zerlegen": "Tötest du deine Beute, gewinnst du Yokai-Teile für zwei zusätzliche Gegenmittel und trägst ihren Sieg doppelt in dein Jagdbuch ein (zwei statt einem).", "Trophäe": "Tötest du deine Beute, erhältst du bis zum Ende des Kampfes einen Bonus in Höhe deines Wisdom Modifiers auf Angriffs- und Damage Rolls gegen alle Kreaturen ihrer Art."}, "gegenmittel": [{"n": "Salzsud", "t": "Der Trinkende hat Advantage auf seinen nächsten Corruption-Saving Throw."}, {"n": "Aschebalsam", "t": "Unterdrückt bestehende Corruption für 1 Stunde — kein Soul-HP-Verlust in dieser Zeit. Entfernt sie nicht."}, {"n": "Artgift", "t": "Bei der Herstellung wählst du eine Art aus deinem Buch. Die nächste Waffe, auf die es gestrichen wird, verursacht gegen diese Art +2d10 Schaden."}, {"n": "Wachsalbe", "t": "Der Trinkende kann 1 Stunde lang nicht charmed, frightened oder in Schlaf versetzt werden."}, {"n": "Blutstiller", "t": "Als Reaction einem Verbündeten gegeben, der auf 0 Hit Points fällt: Er stabilisiert sich sofort und steht mit 1 Trefferpunkt wieder auf."}], "tiefen": [{"n": "I — Gesehen", "besiegt": 1, "lv": 1, "t": "+2 auf Attack Rolls gegen diese Art; Advantage auf Saving Throws gegen ihre Fähigkeiten."}, {"n": "II — Verstanden", "besiegt": 2, "lv": 5, "t": "Zusätzlich +1d8 Schaden; du kennst ihre Hit Points, Immunitäten und Verwundbarkeiten, ohne zu würfeln."}, {"n": "III — Gemeistert", "besiegt": 3, "lv": 15, "t": "Zusätzlich ignorierst du ihre Resistenzen und Immunitäten gegen nichtmagischen Schaden; einmal pro Kampf machst du einen ihrer Angriffe oder Effekte zunichte (Reaction). Ein Mal brennt sich in deine Haut."}], "moveText": {"Ziehen": "Du ziehst und schlägst in einer Bewegung: ein Waffenangriff, und du gewinnst 1 Ruhe.", "Wurzel": "Du stehst fest. Bis zur nächsten Kata kannst du nicht bewegt oder zu Boden geworfen werden; du gewinnst 1 Ruhe.", "Lauern": "Du wartest ab. Der nächste Angriff gegen dich hat Disadvantage, und dein nächster Angriff gegen diese Kreatur hat Advantage.", "Wende": "Du bewegst dich bis zu deiner Speed, ohne Opportunity Attacks auszulösen.", "Durchzug": "Ein Waffenangriff; bei einem Treffer darfst du dich 10 ft. bewegen.", "Bindung": "Ein Waffenangriff; bei einem Treffer hat das Ziel Disadvantage auf seinen nächsten Angriff.", "Atem": "Du sammelst dich: Du gewinnst 2 Ruhe statt 1, ohne die Kata zu unterbrechen.", "Schnitt": "Ein Waffenangriff mit +1d10 Schaden je vorangegangener Verbindung.", "Stich": "Ein Waffenangriff, der Rüstungsboni auf die AC ignoriert, mit +1d8 Schaden je Verbindung.", "Fall": "Ein Waffenangriff mit +1d8 Schaden je Verbindung; das Ziel macht einen STR-Saving Throw oder wird zu Boden geworfen.", "Zangenschritt": "Du bewegst dich bis zu deiner Speed, ohne Opportunity Attacks auszulösen. Beendest du die Bewegung so, dass du gemeinsam mit einer verbündeten Kreatur eine dritte Kreatur flankierst, gewinnst du 1 Ruhe."}, "eidText": [{"n": "Klein", "segen": "+2 AC; Advantage gegen Effekte, die dich bewegen wollen.", "preis": "2 Soul HP"}, {"n": "Groß", "segen": "+2d8 Schaden gegen dieses Ziel.", "preis": "5 Soul HP"}, {"n": "Todeseid", "segen": "Advantage auf alle Würfe gegen das Ziel des Eids.", "preis": "Soul HP auf 0 und Kegare"}], "strophenText": {"Die Klage": "Verbündete in 30 ft. erhalten +1d4 auf Saving Throws.", "Das Heldenlied": "Verbündete in 30 ft. erhalten +1d4 auf Attack Rolls.", "Das Wanderlied": "Verbündete in 30 ft. ignorieren Difficult Terrain und erhalten +10 ft. Speed.", "Das Erinnerungslied": "Verbündete in 30 ft. haben Advantage auf Checks, die Wissen, Geschichte oder Erinnerung betreffen.", "Das Mahnlied": "Ein Gegner deiner Wahl in 60 ft. macht einen WIS-Saving Throw; bei Misserfolg hat er Disadvantage auf Angriffe gegen jeden außer dir.", "Das Spottlied": "Ein Gegner deiner Wahl in 30 ft. macht zu Beginn deines Zuges einen WIS-Saving Throw; bei Misserfolg muss er in seinem nächsten Zug dich angreifen, wenn er kann.", "Das Totenlied": "Untote und Yomi-Wesen in 30 ft. erleiden zu Beginn deines Zuges 2d8 Radiant Damage.", "Das stille Lied": "Verbündete in 30 ft. verlieren durch Corruption keine Soul HP, solange du spielst. Entfernt sie nicht.", "Das Schlaflied": "Zu Beginn deines Zuges macht ein Gegner deiner Wahl in 30 ft. einen WIS-Saving Throw oder ist bis zum Ende seines nächsten Zuges incapacitated.", "Das letzte Lied": "Fällt ein Verbündeter in 30 ft. auf 0 Hit Points, darf er sofort mit 1 Trefferpunkt aufstehen. Einmal pro Kampf."}, "festePakte": {"Jorōgumo Die Spinne vom Jōren-Wasserfall": {"eig": "Du kannst an Wänden und Decken klettern, ohne zu würfeln.", "abil": [{"n": "Fangfaden", "cost": 1, "t": "Ein Ziel in 30 ft. macht einen DEX-Saving Throw oder ist restrained."}, {"n": "Gift", "cost": 2, "t": "Dein nächster Treffer macht +4d6 Poison Damage, CON-Saving Throw oder poisoned."}, {"n": "Netzfeld", "cost": 4, "t": "20-ft-Radius wird zu Difficult Terrain; wer darin endet, wird restrained."}]}, "Nue Der Nue vom Kaiserpalast": {"eig": "Du kannst deine Stimme und deinen Umriss verzerren; Advantage auf Intimidation.", "abil": [{"n": "Schrei", "cost": 2, "t": "Alle Gegner in 30 ft. machen einen WIS-Saving Throw oder sind 1 Minute lang frightened."}, {"n": "Fremde Glieder", "cost": 3, "t": "Bis zum Ende deines nächsten Zuges erhältst du einen zusätzlichen Klauenangriff pro Zug."}, {"n": "Ungestalt", "cost": 5, "t": "1 Minute lang haben Angriffe gegen dich Disadvantage, weil niemand sagen kann, wo du endest."}]}, "Daija Kiyohime": {"eig": "Du kannst deinen Kiefer ausrenken und dich durch jede Öffnung zwängen, durch die dein Kopf passt; Advantage auf Saving Throws gegen Gift.", "abil": [{"n": "Umschlingen", "cost": 2, "t": "Ein Ziel in Reichweite macht einen STR-Saving Throw oder wird restrained und erleidet zu Beginn jedes seiner Züge 3d8 Bludgeoning Damage."}, {"n": "Häutung", "cost": 3, "t": "Du streifst deine Haut ab — entferne alle Conditions und Krankheiten von dir und heile 4d8 Hit Points."}, {"n": "Schlangenleib", "cost": 4, "t": "1 Minute lang wirst du zu einer großen Schlange: Kletter- und Schwimmrate 40 ft., +5 ft. Reichweite, und dein Biss verursacht zusätzlich 3d6 Poison Damage."}]}}, "stufenPakte": {"Tengu Sōjōbō": {"eig": "Fällt nie schneller als 60 ft./Runde, kein Falling Damage.", "t": ["Schüler der Waffen, Federschlag, Schule der Gerechten", "+ Waffengelehrter, Krieger der Lüfte, Scharfsinniger Blick", "+ Master Flyer, Meister der Berge, Waffenmeister, Schwingenmeister"]}, "Oni Shuten-dōji": {"eig": "Trageleistung verdoppelt; Advantage gegen Grappled und Zu-Boden-Werfen.", "t": ["Monströse Stärke, Wutangriff, Mountain Strength", "+ Monströse Wut, Strength of Many, Oni Clobbering", "+ Oni Trajectory, Oni Ascendence, Oni Madness, Kapstein (Stufe 20)"]}, "Kitsune Tamamo-no-Mae": {"eig": "Advantage auf Deception und auf Saving Throws gegen Illusionen.", "t": ["Zwillingstrugbild (Stufe 4) — mehr nicht, siehe Deckel unten", "— (Deckel gilt weiter)", "— (Deckel gilt weiter)"]}, "Yuki-onna O-Yuki": {"eig": "Immun gegen Kälte; hinterlässt keine Spuren im Schnee.", "t": ["Eismagie, Lawinenruf, Schneeillusion", "+ Eiswaffe, Snowgrave, Eisige Gegenwart", "+ Schneemonstrosität, Eisernes Herz, Der eisige Schwur, Königin der Berge"]}}, "formeln": {"Chi": {"wesen": "Standhalten, versperren, festhalten", "f": [{"n": "Steinwall", "a": "Aktion", "t": "Eine Wand aus Erde, 30 ft. lang, 10 ft. hoch, blockiert Sicht und Bewegung, 1 Minute."}, {"n": "Wurzelgriff", "a": "Aktion", "t": "Ein Ziel in 60 ft. macht einen STR-Saving Throw oder ist restrained."}, {"n": "Standfest", "a": "Reaction", "t": "Du oder ein Verbündeter in 30 ft. kann nicht bewegt oder prone geworfen werden."}]}, "Sui": {"wesen": "Fließen, lösen, kühlen", "f": [{"n": "Flutstoß", "a": "Aktion", "t": "30-ft-Linie, 4d6 Bludgeoning Damage, DEX-Saving Throw halbiert, bei Misserfolg 10 ft. weggeschoben."}, {"n": "Lösende Woge", "a": "Aktion", "t": "Entferne eine Condition von einem Verbündeten in 30 ft."}, {"n": "Frostgriff", "a": "Aktion", "t": "3d8 Cold Damage auf ein Ziel in 60 ft., halbierte Speed bis zum Ende seines nächsten Zuges."}]}, "Ka": {"wesen": "Verzehren, treiben, vernichten", "f": [{"n": "Flammenwurf", "a": "Aktion", "t": "20-ft-Kegel, 5d6 Fire Damage, DEX-Saving Throw halbiert."}, {"n": "Zündung", "a": "Aktion", "t": "Ein Ziel in 60 ft. macht einen DEX-Saving Throw oder brennt: 2d6 Fire Damage zu Beginn jedes seiner Züge, bis es die Flammen löscht."}, {"n": "Aschesicht", "a": "Bonus Action", "t": "Du siehst durch Rauch, Nebel und Dunkelheit auf 60 ft."}]}, "Fū": {"wesen": "Bewegen, verschieben, tragen", "f": [{"n": "Sturmstoß", "a": "Aktion", "t": "Alle Gegner in 15 ft. machen einen STR-Saving Throw oder werden 15 ft. weggeschleudert."}, {"n": "Windschritt", "a": "Bonus Action", "t": "Du bewegst dich bis zu 30 ft., ohne Opportunity Attacks auszulösen."}, {"n": "Tragende Böe", "a": "Aktion", "t": "Ein Verbündeter in 30 ft. erhält für 1 Minute eine Flugbewegungsrate von 30 ft."}]}, "Kū": {"wesen": "Auflösen, verneinen, entleeren", "f": [{"n": "Verneinung", "a": "Reaction", "t": "Eine Formel oder ein Zauber, den du siehst, wird aufgehoben, wenn sein Grad höchstens dein halbes Level beträgt."}, {"n": "Leerer Griff", "a": "Aktion", "t": "Ein Ziel in 60 ft. macht einen WIS-Saving Throw oder verliert Soul HP in Höhe deines INT-Modifiers."}, {"n": "Ungeschehen", "a": "Aktion", "t": "Ein Effekt in 30 ft., der eine Fläche belegt, endet."}]}, "Shiki": {"wesen": "Binden, befehlen, deuten", "f": [{"n": "Shikigami falten", "a": "Aktion", "t": "siehe unten."}, {"n": "Bannkreis", "a": "Aktion", "t": "Ein 15-ft-Ring; Yokai und Untote müssen einen WIS-Saving Throw bestehen, um ihn zu betreten."}, {"n": "Die nächste Stunde lesen", "a": "Aktion, außerhalb des Kampfes", "t": "Der Spielleiter nennt dir eine Gefahr, die in der nächsten Stunde eintreten wird — nicht ihre Ursache und nicht ihren Ausgang."}]}}, "wb": [{"r": "1–20", "t": "Fehlschlag. Die Formel verpufft wirkungslos. Der Spell Slot ist trotzdem verbraucht."}, {"r": "21–40", "t": "Falscher Griff. Statt deiner Formel wirkt eine zufällige — würfle 1d6 für das Element (1 Chi, 2 Sui, 3 Ka, 4 Fū, 5 Kū, 6 Shiki) und 1d3 für welche der drei Formeln darin (in der Reihenfolge aus der Tabelle „Die sechs Elemente\")."}, {"r": "41–60", "t": "Die Formel wirkt genau wie beabsichtigt."}, {"r": "61–80", "t": "Überschuss. Die Formel wirkt wie beabsichtigt, und du darfst im selben Zug sofort eine zweite Formel deiner Wahl wirken, ohne einen weiteren Spell Slot zu zahlen — das kostet dich keine zusätzliche Action, genau wie beim Vollendeten Kreis, der ebenfalls mehrere Formeln als eine einzige Action zählt."}, {"r": "81–99", "t": "Vollgriff. Die Formel wirkt, als hättest du vier Kreislauf-Züge in Folge gemacht: +1 Schaden je Würfel, DC +1, und sie ignoriert Resistance gegen ihren Schadenstyp (siehe Fluss-Tabelle oben, Stufen 1, 2 und 4)."}, {"r": "100", "t": "Vollkommener Zufall. Wie 61–80 und 81–99 zusammen: Du wirkst deine Formel plus zwei weitere Formeln deiner Wahl, ohne weitere Spell Slots zu zahlen — und alle drei wirken als Vollgriff."}], "flussText": ["Deine Formeln verursachen +1 Schaden je Würfel.", "Der DC deiner Formeln steigt um 1.", "Einmal pro Runde wirkst du eine Formel eines anderen Elements ohne Siegel.", "Deine Formeln ignorieren Resistance gegen ihren Schadenstyp.", "Vollendeter Kreis: Einmal, während du auf 5 stehst, wirkst du in einem Zug je eine Formel ALLER sechs Elemente als eine einzige Action. Danach fällt dein Fluss auf 0."], "spells": [["Acid Splash", 0, "Evocation", "Action", "60 feet", "Instantaneous", "V, S", "1d6", "Acid", "", "You create an acidic bubble at a point within range, where it explodes in a 5-foot-radius Sphere. Each creature in that Sphere must succeed on a Dexterity saving throw or take 1d6 Acid damage.\n  Cantrip Upgrade. The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).", ["Sorcerer", "Wizard"]], ["Chill Touch", 0, "Necromancy", "Action", "Touch", "Instantaneous", "V, S", "1d10", "Necrotic", "melee", "Channeling the chill of the grave, make a melee spell attack against a target within reach. On a hit, the target takes 1d10 Necrotic damage, and it can't regain Hit Points until the end of your next turn.\n  Cantrip Upgrade. The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).", ["Sorcerer", "Warlock", "Wizard"]], ["Dancing Lights", 0, "Illusion", "Action", "120 feet", "up to 1 minute (Concentration)", "V, S, M (a bit of phosphorus)", "", "", "", " You create up to four torch-size lights within range, making them appear as torches, lanterns, or glowing orbs that hover for the duration. Alternatively, you combine the four lights into one glowing Medium form that is vaguely humanlike. Whichever form you choose, each light sheds Dim Light in a 10foot radius.\n  As a Bonus Action, you can move the lights up to 60 feet to a space within range. A light must be within 20 feet of another light created by this spell, and a light vanishes if it exceeds the spell's range.", ["Bard", "Sorcerer", "Wizard"]], ["Druidcraft", 0, "Transmutation", "Action", "30 feet", "Instantaneous", "V, S", "", "", "", "Whispering to the spirits of nature, you create one of the following effects within range.\n  Weather Sensor. You create a Tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round.\n  Bloom. You instantly make a flower blossom, a seed pod open, or a leaf bud bloom.\n  Sensory Effect. You create a harmless sensory effect, such as falling leaves, spectral dancing fairies, a gentle breeze, the sound of an animal, or the faint odor of skunk. The effect must fit in a 5-foot Cube.\n  Fire Play. You light or snuff out a candle, a torch, or a campfire.", ["Druid"]], ["Eldritch Blast", 0, "Evocation", "Action", "120 feet", "Instantaneous", "V, S", "1d10", "Force", "ranged", "You hurl a beam of crackling energy. Make a ranged spell attack against one creature or object in range. On a hit, the target takes 1d10 Force damage.\n  Cantrip Upgrade. The spell creates two beams at level 5, three beams at level 11, and four beams at level 17. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.", ["Warlock"]], ["Elementalism", 0, "Transmutation", "Action", "30 feet", "Instantaneous", "V, S", "", "", "", "You exert control over the elements, creating one of the following effects within range.\n  Beckon Air. You create a breeze strong enough to ripple cloth, stir dust, rustle leaves, and close open doors and shutters, all in a 5-foot Cube. Doors and shutters being held open by someone or something aren't affected.\n  Beckon Earth. You create a thin shroud of dust or sand that covers surfaces in a 5-foot-square area, or you cause a single word to appear in your handwriting in a patch of dirt or sand.\n  Beckon Fire. You create a thin cloud of harmless embers and colored, scented smoke in a 5-foot Cube. You choose the color and scent, and the embers can light candles, torches, or lamps in that area. The smoke's scent lingers for 1 minute.\n  Beckon Water. You create a spray of cool mist that lightly dampens creatures and objects in a 5-foot Cube. Alternatively, you create 1 cup of clean water either in an open container or on a surface, and the water evaporates in 1 minute.\n  Sculpt Element. You cause dirt, sand, fire, smoke, mist, or water that can fit in a 1-foot Cube to assume a crude shape (such as that of a creature) for 1 hour.", ["Druid", "Sorcerer", "Wizard"]], ["Fire Bolt", 0, "Evocation", "Action", "120 feet", "Instantaneous", "V, S", "1d10", "Fire", "ranged", "You hurl a mote of fire at a creature or an object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Fire damage. A flammable object hit by this spell starts burning if it isn't being worn or carried.\n  Cantrip Upgrade. The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10).", ["Sorcerer", "Wizard"]], ["Guidance", 0, "Divination", "Action", "Touch Component: V, S", "up to 1 minute (Concentration)", "", "", "", "", "You touch a willing creature and choose a skill. Until the spell ends, the creature adds 1d4 to any ability check using the chosen skill.", ["Cleric", "Druid"]], ["Light", 0, "Evocation", "Action", "Touch", "1 hour", "V, M (a firefly or phosphorescent moss)", "", "", "", "You touch one Large or smaller object that isn't being worn or carried by someone else. Until the spell ends, the object sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The light can be colored as you like.\n  Covering the object with something opaque blocks the light. The spell ends if you cast it again.", ["Bard", "Cleric", "Sorcerer", "Wizard"]], ["Mage Hand", 0, "Conjuration", "Action", "30 feet", "1 minute", "V, S", "", "", "", "A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again.\n  When you cast the spell, you can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial.\n  As a Magic action on your later turns, you can control the hand thus again. As part of that action, you can move the hand up to 30 feet.\n  The hand can't attack, activate magic items, or carry more than 10 pounds.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Mending", 0, "Transmutation", "1 minute", "Touch", "Instantaneous", "V, S, M (two lodestones)", "", "", "", "This spell repairs a single break or tear in an object you touch, such as a broken chain link, two halves of a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no larger than 1 foot in any dimension, you mend it, leaving no trace of the former damage.\n  This spell can physically repair a magic item, but it can't restore magic to such an object.", ["Bard", "Cleric", "Druid", "Sorcerer", "Wizard"]], ["Message", 0, "Transmutation", "Action", "120 feet", "1 round", "S, M (a copper wire)", "", "", "", " You point toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear.\n  You can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence; 1 foot of stone, metal, or wood; or a thin sheet of lead blocks the spell.", ["Bard", "Druid", "Sorcerer", "Wizard"]], ["Minor Illusion", 0, "Illusion", "Action", "30 feet", "1 minute", "S, M (a bit of fleece)", "", "", "", "You create a sound or an image of an object within range that lasts for the duration. See the descriptions below for the effects of each. The illusion ends if you cast this spell again.\n  If a creature takes a Study action to examine the sound or image, the creature can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the illusion becomes faint to the creature.\n  Sound. If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else's voice, a lion's roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends.\n  Image. If you create an image of an object-such as a chair, muddy footprints, or a small chest-it must be no larger than a 5-foot Cube. The image can't create sound, light, smell, or any other sensory effect. Physical interaction with the image reveals it to be an illusion, since things can pass through it.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Poison Spray", 0, "Necromancy", "Action", "30 feet", "Instantaneous", "V, S", "1d12", "Poison", "ranged", "You spray toxic mist at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d12 Poison damage.\n  Cantrip Upgrade. The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12).", ["Druid", "Sorcerer", "Warlock", "Wizard"]], ["Prestidigitation", 0, "Transmutation", "Action", "10 feet", "Up to 1 hour", "V, S", "", "", "", "You create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time.\n  Sensory Effect. You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor.\n  Fire Play. You instantaneously light or snuff out a candle, a torch, or a small campfire.\n  Clean or Soil. You instantaneously clean or soil an object no larger than 1 cubic foot.\n  Minor Sensation. You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour.\n  Magic Mark. You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour.\n  Minor Creation. You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Produce Flame", 0, "Conjuration", "Bonus Action", "Self", "10 minutes", "V, S", "1d8", "Fire", "ranged", "A flickering flame appears in your hand and remains there for the duration. While there, the flame emits no heat and ignites nothing, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. The spell ends if you cast it again.\n  Until the spell ends, you can take a Magic action to hurl fire at a creature or an object within 60 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 Fire damage.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Druid"]], ["Ray of Frost", 0, "Evocation", "Action", "60 feet", "Instantaneous", "V, S", "1d8", "Cold", "ranged", "A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 Cold damage, and its Speed is reduced by 10 feet until the start of your next turn.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Sorcerer", "Wizard"]], ["Resistance", 0, "Abjuration", "Action", "Touch Component: V, S", "up to 1 minute (Concentration)", "", "", "", "", "You touch a willing creature and choose a damage type: Acid, Bludgeoning, Cold, Fire, Lightning, Necrotic, Piercing, Poison, Radiant, Slashing, or Thunder. When the creature takes damage of the chosen type before the spell ends, the creature reduces the total damage taken by 1d4. A creature can benefit from this spell only once per turn.", ["Cleric", "Druid"]], ["Sacred Flame", 0, "Evocation", "Action", "60 feet", "Instantaneous", "V, S", "1d8", "Radiant", "", "Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from Half Cover or Three-Quarters Cover for this save.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Cleric"]], ["Shillelagh", 0, "Transmutation", "Bonus Action", "Self", "1 minute", "V, S, M (mistletoe)", "", "", "", "A Club or Quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. If the attack deals damage, it can be Force damage or the weapon's normal damage type (your choice).\n  The spell ends early if you cast it again or if you let go of the weapon.\n  Cantrip Upgrade. The damage die changes when you reach levels 5 (d10), 11 (d12), and 17 (2d6).", ["Druid"]], ["Shocking Grasp", 0, "Evocation", "Action", "Touch", "Instantaneous", "V, S", "1d8", "Lightning", "melee", "Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can't make Opportunity Attacks until the start of its next turn.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Sorcerer", "Wizard"]], ["Sorcerous Burst", 0, "Evocation", "Action", "120 feet Component: V, S", "Instantaneous", "", "", "", "ranged", "You cast sorcerous energy at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 damage of a type you choose: Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder.\n  If you roll an 8 on a d8 for this spell, you can roll another d8, and add it to the damage. When you cast this spell, the maximum number of these d8s you can add to the spell's damage equals your spellcasting ability modifier.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Sorcerer"]], ["Spare the Dying", 0, "Necromancy", "Action", "15 feet", "Instantaneous", "V, S", "", "", "", "Choose a creature within range that has 0 Hit Points and isn't dead. The creature becomes Stable.\n  Cantrip Upgrade. The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).", ["Cleric", "Druid"]], ["Starry Wisp", 0, "Evocation", "Action", "60 feet", "Instantaneous", "V, S", "1d8", "Radiant", "ranged", "You launch a mote of light at one creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d8 Radiant damage, and until the end of your next turn, it emits Dim Light in a 10-foot radius and can't benefit from the Invisible condition.\n  Cantrip Upgrade. The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).", ["Bard", "Druid"]], ["Thaumaturgy", 0, "Transmutation", "Action", "30 feet", "Up to 1 minute", "V", "", "", "", "You manifest a minor wonder within range. You create one of the effects below within range. If you cast this spell multiple times, you can have up to three of its 1-minute effects active at a time.\n  Altered Eyes. You alter the appearance of your eyes for 1 minute.\n  Booming Voice. Your voice booms up to three times as loud as normal for 1 minute. For the duration, you have Advantage on Charisma (Intimidation) checks.\n  Fire Play. You cause flames to flicker, brighten, dim, or change color for 1 minute.\n  Invisible Hand. You instantaneously cause an unlocked door or window to fly open or slam shut.\n  Phantom Sound. You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers.\n  Tremors. You cause harmless tremors in the ground for 1 minute.", ["Cleric"]], ["True Strike", 0, "Divination", "Action", "Self", "Instantaneous", "S, M (a weapon with which you have proficiency and that is worth 1+ CP)", "", "", "", "Guided by a flash of magical insight, you make one attack with the weapon used in the spell's casting. The attack uses your spellcasting ability for the attack and damage rolls instead of using Strength or Dexterity. If the attack deals damage, it can be Radiant damage or the weapon's normal damage type (your choice).\n  Cantrip Upgrade. Whether you deal Radiant damage or the weapon's normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6).", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Vicious Mockery", 0, "Enchantment", "Action", "60 feet", "Instantaneous", "V", "1d6", "Psychic", "", "You unleash a string of insults laced with subtle enchantments at one creature you can see or hear within range. The target must succeed on a Wisdom saving throw or take 1d6 Psychic damage and have Disadvantage on the next attack roll it makes before the end of its next turn.\n  Cantrip Upgrade. The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).", ["Bard"]], ["Alarm", 1, "Abjuration", "1 minute", "30 feet", "8 hours", "V, S, M (a bell and silver wire)", "", "", "", "You set an alarm against intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot Cube. Until the spell ends, an alarm alerts you whenever a creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is audible or mental: Audible Alarm. The alarm produces the sound of a handbell for 10 seconds within 60 feet of the warded area. Mental Alarm. You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you're asleep.", ["Ranger", "Wizard"]], ["Animal Friendship", 1, "Enchantment", "Action", "30 feet", "24 hours", "V, S, M (a morsel of food)", "", "", "", "Target a Beast that you can see within range. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. If you or one of your allies deals damage to the target, the spells ends.\n\nHöherer Grad: You can target one additional Beast for each spell slot level above 1.", ["Bard", "Druid", "Ranger"]], ["Bane", 1, "Enchantment", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a drop of blood)", "", "", "", "Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Bard", "Cleric", "Warlock"]], ["Bless", 1, "Enchantment", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a Holy Symbol worth 5+ GP)", "", "", "", "You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Cleric", "Paladin"]], ["Burning Hands", 1, "Evocation", "Action", "Self", "Instantaneous", "V, S", "3d6", "Fire", "", "A thin sheet of flames shoots forth from you. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one.\n  Flammable objects in the Cone that aren't being worn or carried start burning.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 1.", ["Sorcerer", "Wizard"]], ["Charm Person", 1, "Enchantment", "Action", "30 feet", "1 hour", "V, S", "", "", "", "One Humanoid you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Bard", "Druid", "Sorcerer", "Warlock", "Wizard"]], ["Chromatic Orb", 1, "Evocation", "Action", "90 feet", "Instantaneous", "V, S, M (a diamond worth 50+ GP)", "", "", "ranged", "You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type.\n  If you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can't leap again unless you cast the spell with a level 2+ spell slot.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell.", ["Sorcerer", "Wizard"]], ["Color Spray", 1, "Illusion", "Action", "Self", "Instantaneous", "V, S, M (a pinch of colorful sand)", "", "", "", "You launch a dazzling array of flashing, colorful light. Each creature in a 15-foot Cone originating from you must succeed on a Constitution saving throw or have the Blinded condition until the end of your next turn.", ["Bard", "Sorcerer", "Wizard"]], ["Command", 1, "Enchantment", "Action", "60 feet", "Instantaneous", "V", "", "", "", "You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options: Approach. The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you. Drop. The target drops whatever it is holding and then ends its turn. Flee. The target spends its turn moving away from you by the fastest available means. Grovel. The target has the Prone condition and then ends its turn. Halt. On its turn, the target doesn't move and takes no action or Bonus Action.\n\nHöherer Grad: You can affect one additional creature for each spell slot level above 1.", ["Bard", "Cleric", "Paladin"]], ["Comprehend Languages", 1, "Divination", "Action", "Self", "1 hour", "V, S, M (a pinch of soot and salt)", "", "", "", "For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode symbols or secret messages.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Create or Destroy Water", 1, "Transmutation", "Action", "30 feet", "Instantaneous", "V, S, M (a mix of water and sand)", "", "", "", "You do one of the following: Create Water. You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there. Destroy Water. You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range.\n\nHöherer Grad: You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1.", ["Cleric", "Druid"]], ["Cure Wounds", 1, "Abjuration", "Action", "Touch", "Instantaneous", "V, S", "", "", "", "A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier. Using a Higher-Level Spell Slot. The healing increases by 2d8 for each spell slot level above 1.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger"]], ["Detect Evil and Good", 1, "Divination", "Action", "Self", "up to 10 minutes (Concentration)", "V, S", "", "", "", "For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the Hallow spell is active there and, if so, where.\n  The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", ["Cleric", "Paladin"]], ["Detect Magic", 1, "Divination", "Action", "Self", "up to 10 minutes (Concentration)", "V, S", "", "", "", "For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's school of magic.\n  The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger", "Sorcerer", "Warlock", "Wizard"]], ["Detect Poison and Disease", 1, "Divination", "Action", "Self", "up to 10 minutes (Concentration)", "V, S, M (a yew leaf)", "", "", "", "For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case.\n  The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.", ["Cleric", "Druid", "Paladin", "Ranger"]], ["Disguise Self", 1, "Illusion", "Action", "Self", "1 hour", "V, S", "", "", "", "You make yourself-including your clothing, armor, weapons, and other belongings on your personlook different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you.\n  The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing.\n  To discern that you are disguised, a creature must take the Study action to inspect your appearance and succeed on an Intelligence (Investigation) check against your spell save DC.", ["Bard", "Sorcerer", "Wizard"]], ["Dissonant Whispers", 1, "Enchantment", "Action", "60 feet", "Instantaneous", "V", "3d6", "Psychic", "", "One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 1.", ["Bard"]], ["Divine Favor", 1, "Transmutation", "Bonus Action", "Self", "1 minute", "V, S", "1d4", "Radiant", "", "Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit.", ["Paladin"]], ["Divine Smite", 1, "Evocation", "Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike", "Self Component: V", "Instantaneous", "", "2d8", "Radiant", "", "The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 1.", ["Paladin"]], ["Ensnaring Strike", 1, "Conjuration", "Bonus Action, which you take immediately after hitting a creature with a weapon", "Self", "up to 1 minute (Concentration)", "V", "1d6", "Piercing", "", "As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.\n  While Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 1.", ["Ranger"]], ["Entangle", 1, "Conjuration", "Action", "90 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends.\n  Each creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them.", ["Druid", "Ranger"]], ["Expeditious Retreat", 1, "Transmutation", "Bonus Action", "Self", "up to 10 minutes (Concentration)", "V, S", "", "", "", "You take the Dash action, and until the spell ends, you can take that action again as a Bonus Action.", ["Sorcerer", "Warlock", "Wizard"]], ["Faerie Fire", 1, "Evocation", "Action", "60 feet", "up to 1 minute (Concentration)", "V", "", "", "", "Objects in a 20-foot Cube within range are outlined in blue, green, or violet light (your choice). Each creature in the Cube is also outlined if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed Dim Light in a 10-foot radius and can't benefit from the Invisible condition.\n  Attack rolls against an affected creature or object have Advantage if the attacker can see it.", ["Bard", "Druid"]], ["False Life", 1, "Necromancy", "Action", "Self", "Instantaneous", "V, S, M (a drop of alcohol)", "", "", "", "You gain 2d4 + 4 Temporary Hit Points.\n\nHöherer Grad: You gain 5 additional Temporary Hit Points for each spell slot level above 1.", ["Sorcerer", "Wizard"]], ["Feather Fall", 1, "Transmutation", "Reaction, which you take when you or a creature you can see within 60 feet of you falls", "60 feet", "1 minute", "V, M (a small feather or piece of down)", "", "", "", "Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.", ["Bard", "Sorcerer", "Wizard"]], ["Find Familiar", 1, "Conjuration", "1 hour", "10 feet", "Instantaneous", "V, S, M (burning incense worth 10+ GP, which the spell consumes)", "", "", "", "You gain the service of a familiar, a spirit that takes an animal form you choose: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel, or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form (see \"Monsters\"), though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands.\n  Telepathic Connection. While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has.\n  Finally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell.\n  Combat. The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal.\n  Disappearance of the Familiar. When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying.\n  One Familiar Only. You can't have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.", ["Wizard"]], ["Floating Disk", 1, "Conjuration", "Action", "30 feet", "1 hour", "V, S, M (a drop of mercury)", "", "", "", "This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground.\n  The disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can't cross an elevation change of 10 feet or more. For example, the disk can't move across a 10-foot-deep pit, nor could it leave such a pit if it was created at the bottom.\n  If you move more than 100 feet from the disk (typically because it can't move around an obstacle to follow you), the spell ends.", ["Wizard"]], ["Fog Cloud", 1, "Conjuration", "Action", "120 feet", "up to 1 hour (Concentration)", "V, S", "", "", "", "You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by Gust of Wind) disperses it.\n\nHöherer Grad: The fog's radius increases by 20 feet for each spell slot level above 1.", ["Druid", "Ranger", "Sorcerer", "Wizard"]], ["Goodberry", 1, "Conjuration", "Action", "Self", "24 hours", "V, S, M (a sprig of mistletoe)", "", "", "", "Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day. Uneaten berries disappear when the spell ends.", ["Druid", "Ranger"]], ["Grease", 1, "Conjuration", "Action", "60 feet", "1 minute", "V, S, M (a bit of pork rind or butter)", "", "", "", "Nonflammable grease covers the ground in a 10foot square centered on a point within range and turns it into Difficult Terrain for the duration.\n  When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone.", ["Sorcerer", "Wizard"]], ["Guiding Bolt", 1, "Evocation", "Action", "120 feet", "1 round", "V, S", "4d6", "Radiant", "ranged", "You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 1.", ["Cleric"]], ["Healing Word", 1, "Abjuration", "Bonus Action", "60 feet", "Instantaneous", "V", "", "", "", "A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier.\n\nHöherer Grad: The healing increases by 2d4 for each spell slot level above 1.", ["Bard", "Cleric", "Druid"]], ["Hellish Rebuke", 1, "Evocation", "Reaction, which you take in response to taking damage from a creature that you can see within 60 feet of yourself", "60 feet", "Instantaneous", "V, S", "2d10", "Fire", "", "The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one.\n\nHöherer Grad: The damage increases by 1d10 for each spell slot level above 1.", ["Warlock"]], ["Heroism", 1, "Enchantment", "Action", "Touch", "up to 1 minute (Concentration)", "V, S", "", "", "", "A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to your spellcasting ability modifier at the start of each of its turns.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Bard", "Paladin"]], ["Hex", 1, "Enchantment", "Bonus Action", "90 feet", "up to 1 hour (Concentration)", "V, S, M (the petrified eye of a newt)", "1d6", "Necrotic", "", "You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has Disadvantage on ability checks made with the chosen ability.\n  If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action on a later turn to curse a new creature.\n\nHöherer Grad: Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours).", ["Warlock"]], ["Hideous Laughter", 1, "Enchantment", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a tart and a feather)", "", "", "", "One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the Prone and Incapacitated conditions for the duration. During that time, it laughs uncontrollably if it's capable of laughter, and it can't end the Prone condition on itself.\n  At the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has Advantage on the save if the save is triggered by damage. On a successful save, the spell ends.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Bard", "Warlock", "Wizard"]], ["Hunter's Mark", 1, "Divination", "Bonus Action", "90 feet", "up to 1 hour (Concentration)", "V", "1d6", "Force", "", "You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it.\n   If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range.\n\nHöherer Grad: Your Concentration can last longer with a spell slot of level 3-4 (up to 8 hours) or 5+ (up to 24 hours).", ["Ranger"]], ["Ice Knife", 1, "Conjuration", "Action", "60 feet", "Instantaneous", "S, M (a drop of water or a piece of ice)", "1d10", "Piercing", "ranged", "You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage.\n\nHöherer Grad: The Cold damage increases by 1d6 for each spell slot level above 1.", ["Druid", "Sorcerer", "Wizard"]], ["Identify", 1, "Divination", "1 minute", "Touch", "Instantaneous", "V, S, M (a pearl worth 100+ GP)", "", "", "", "You touch an object throughout the spell's casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires Attunement, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell's name.\n  If you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it.", ["Bard", "Wizard"]], ["Illusory Script", 1, "Illusion", "1 minute", "Touch", "10 days", "S, M (ink worth 10+ GP, which the spell consumes)", "", "", "", "You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know.\n  If the spell is dispelled, the original script and the illusion both disappear.\n  A creature that has Truesight can read the hidden message.", ["Bard", "Warlock", "Wizard"]], ["Inflict Wounds", 1, "Necromancy", "Action", "Touch", "Instantaneous", "V, S", "2d10", "Necrotic", "", "A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.\n\nHöherer Grad: The damage increases by 1d10 for each spell slot level above 1.", ["Cleric"]], ["Jump", 1, "Transmutation", "Bonus Action", "Touch", "1 minute", "V, S, M (a grasshopper's hind leg)", "", "", "", "You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Druid", "Ranger", "Sorcerer", "Wizard"]], ["Longstrider", 1, "Transmutation", "Action", "Touch", "1 hour", "V, S, M (a pinch of dirt)", "", "", "", "You touch a creature. The target's Speed increases by 10 feet until the spell ends.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 1.", ["Bard", "Druid", "Ranger", "Wizard"]], ["Mage Armor", 1, "Abjuration", "Action", "Touch", "8 hours", "V, S, M (a piece of cured leather)", "", "", "", "You touch a willing creature who isn't wearing armor. Until the spell ends, the target's base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.", ["Sorcerer", "Wizard"]], ["Magic Missile", 1, "Evocation", "Action", "120 feet", "Instantaneous", "V, S", "", "", "", "You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.\n\nHöherer Grad: The spell creates one more dart for each spell slot level above 1.", ["Sorcerer", "Wizard"]], ["Protection from Evil and Good", 1, "Abjuration", "Action", "Touch", "Concentration up to 10 minutes", "V, S, M (a flask of Holy Water worth 25+, GP, which the spell consumes)", "", "", "", "Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can't be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.", ["Cleric", "Druid", "Paladin", "Warlock", "Wizard"]], ["Purify Food and Drink", 1, "Transmutation", "Action", "10 feet", "Instantaneous", "V, S", "", "", "", "You remove poison and rot from nonmagical food and drink in a 5-foot-radius Sphere centered on a point within range.", ["Cleric", "Druid", "Paladin"]], ["Ray of Sickness", 1, "Necromancy", "Action", "60 feet", "Instantaneous", "V, S", "2d8", "Poison", "ranged", "You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.", ["Sorcerer", "Wizard"]], ["Sanctuary", 1, "Abjuration", "Bonus Action", "30 feet", "1 minute", "V, S, M (a shard of glass from a mirror)", "", "", "", "You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect. The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.", ["Cleric"]], ["Searing Smite", 1, "Evocation", "Bonus Action, which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike", "Self Component: V", "1 minute", "", "1d6", "Fire", "", "As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.\n\nHöherer Grad: All the damage increases by 1d6 for each spell slot level above 1.", ["Paladin"]], ["Shield", 1, "Abjuration", "Reaction, which you take when you are hit by an attack roll or targeted by the Magic Missile spell", "Self", "1 round", "V, S", "", "", "", "An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.", ["Sorcerer", "Wizard"]], ["Shield of Faith", 1, "Abjuration", "Bonus Action", "60 feet", "up to 10 minutes (Concentration)", "V, S, M (a prayer scroll)", "", "", "", "A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.", ["Cleric", "Paladin"]], ["Silent Image", 1, "Illusion", "Action", "60 feet", "up to 10 minutes (Concentration)", "V, S, M (a bit of fleece)", "", "", "", "You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects.\n  As a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking.\n  Physical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.", ["Bard", "Sorcerer", "Wizard"]], ["Sleep", 1, "Enchantment", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S, M (a pinch of sand or rose petals)", "", "", "", "Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect.\n  Creatures that don't sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell.", ["Bard", "Sorcerer", "Wizard"]], ["Speak with Animals", 1, "Divination", "Action", "Self", "10 minutes", "V, S", "", "", "", "For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action's skill options with them.\n  Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.", ["Bard", "Druid", "Ranger", "Warlock"]], ["Thunderwave", 1, "Evocation", "Action", "Self", "Instantaneous", "V, S", "2d8", "Thunder", "", "You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only.\n  In addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet.   Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.", ["Bard", "Druid", "Sorcerer", "Wizard"]], ["Unseen Servant", 1, "Conjuration", "Action", "60 feet", "1 hour", "V, S, M (a bit of string and of wood)", "", "", "", "This spell creates an Invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 Hit Point, and a Strength of 2, and it can't attack. If it drops to 0 Hit Points, the spell ends.\n  Once on each of your turns as a Bonus Action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command.\n  If you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.", ["Bard", "Warlock", "Wizard"]], ["Acid Arrow", 2, "Evocation", "Action", "90 feet", "Instantaneous", "V, S, M (powdered rhubarb leaf)", "4d4", "Acid", "ranged", "A shimmering green arrow streaks toward a target within range and bursts in a spray of acid. Make a ranged spell attack against the target. On a hit, the target takes 4d4 Acid damage and 2d4 Acid damage at the end of its next turn. On a miss, the arrow splashes the target with acid for half as much of the initial damage only.\n\nHöherer Grad: The damage (both initial and later) increases by 1d4 for each spell slot level above 2.", ["Wizard"]], ["Aid", 2, "Abjuration", "Action", "30 feet", "8 hours", "V, S, M (a strip of white cloth)", "", "", "", "Choose up to three creatures within range. Each target's Hit Point maximum and current Hit Points increase by 5 for the duration.\n\nHöherer Grad: Each target's Hit Points increase by 5 for each spell slot level above 2.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger"]], ["Alter Self", 2, "Transmutation", "Action", "Self", "up to 1 hour (Concentration)", "V, S", "", "", "", "You alter your physical form. Choose one of the following options. Its effects last for the duration, during which you can take a Magic action to replace the option you chose with a different one.\n  Aquatic Adaptation. You sprout gills and grow webs between your fingers. You can breathe underwater and gain a Swim Speed equal to your Speed.\n  Change Appearance. You alter your appearance. You decide what you look like, including your height, weight, facial features, sound of your voice, hair length, coloration, and other distinguishing characteristics. You can make yourself appear as a member of another species, though none of your statistics change. You can't appear as a creature of a different size, and your basic shape stays the same; if you're bipedal, you can't use this spell to become quadrupedal, for instance. For the duration, you can take a Magic action to change your appearance in this way again.\n  Natural Weapons. You grow claws (Slashing), fangs (Piercing), horns (Piercing), or hooves (Bludgeoning). When you use your Unarmed Strike to deal damage with that new growth, it deals 1d6 damage of the type in parentheses instead of dealing the normal damage for your Unarmed Strike, and you use your spellcasting ability modifier for the attack and damage rolls rather than using Strength.", ["Sorcerer", "Wizard"]], ["Animal Messenger", 2, "Enchantment", "Action", "30 feet", "24 hours", "V, S, M (a morsel of food)", "", "", "", "A Tiny Beast of your choice that you can see within range must succeed on a Charisma saving throw, or it attempts to deliver a message for you (if the target's Challenge Rating isn't 0, it automatically succeeds). You specify a location you have visited and a recipient who matches a general description, such as \"a person dressed in the uniform of the town guard\" or \"a red-haired dwarf wearing a pointed hat.\" You also communicate a message of up to twenty-five words. The Beast travels for the duration toward the specified location, covering about 25 miles per 24 hours or 50 miles if the Beast can fly.\n  When the Beast arrives, it delivers your message to the creature that you described, mimicking your communication. If the Beast doesn't reach its destination before the spell ends, the message is lost, and the Beast returns to where you cast the spell.\n\nHöherer Grad: The spell's duration increases by 48 hours for each spell slot level above 2.", ["Bard", "Druid", "Ranger"]], ["Arcane Lock", 2, "Abjuration", "Action", "Touch", "Until dispelled", "V, S, M ((gold dust worth 25+ GP, which the spell consumes)", "", "", "", "You touch a closed door, window, gate, container, or hatch and magically lock it for the duration. This lock can't be unlocked by any nonmagical means. You and any creatures you designate when you cast the spell can open and close the object despite the lock. You can also set a password that, when spoken within 5 feet of the object, unlocks it for 1 minute.", ["Wizard"]], ["Arcanist's Magic Aura", 2, "Illusion", "Action", "Touch", "24 hours", "V, S, M (a small square of silk)", "", "", "", "With a touch, you place an illusion on a willing creature or an object that isn't being worn or carried. A creature gains the Mask effect below, and an object gains the False Aura effect below. The effect lasts for the duration. If you cast the spell on the same target every day for 30 days, the illusion lasts until dispelled.\n  Mask (Creature). Choose a creature type other than the target's actual type. Spells and other magical effects treat the target as if it were a creature of the chosen type.\n  False Aura (Object). You change the way the target appears to spells and magical effects that detect magical auras, such as Detect Magic. You can make a nonmagical object appear magical, make a magic item appear nonmagical, or change the object's aura so that it appears to belong to a school of magic you choose.", ["Wizard"]], ["Augury", 2, "Divination", "1 minute", "Self", "Instantaneous", "V, S, M ((specially marked sticks, bones, cards, or other divinatory tokens worth 25+ GP)", "", "", "", "You receive an omen from an otherworldly entity about the results of a course of action that you plan to take within the next 30 minutes. The GM chooses the omen from the Omens table. Omens Omen    For Results That Will Be ... Woe    Bad  Weal and woe    Good and bad     Indifference    Neither good nor bad The spell doesn't account for circumstances, such as other spells, that might change the results.\n  If you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.", ["Cleric", "Druid", "Wizard"]], ["Barkskin", 2, "Transmutation", "Bonus Action", "Touch", "1 hour", "V, S, M (a handful of bark)", "", "", "", "You touch a willing creature. Until the spell ends, the target's skin assumes a bark-like appearance, and the target has an Armor Class of 17 if its AC is lower than that.", ["Druid", "Ranger"]], ["Blindness/Deafness", 2, "Transmutation", "Action", "120 feet", "1 minute", "V", "", "", "", "One creature that you can see within range must succeed on a Constitution saving throw, or it has the Blinded or Deafened condition (your choice) for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 2.", ["Bard", "Cleric", "Sorcerer", "Wizard"]], ["Blur", 2, "Illusion", "Action", "Self", "up to 1 minute (Concentration)", "V", "", "", "", "Your body becomes blurred. For the duration, any creature has Disadvantage on attack rolls against you. An attacker is immune to this effect if it perceives you with Blindsight or Truesight.", ["Sorcerer", "Wizard"]], ["Calm Emotions", 2, "Enchantment", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "Each Humanoid in a 20-foot-radius Sphere centered on a point you choose within range must succeed on a Charisma saving throw or be affected by one of the following effects (choose for each creature): • The creature has Immunity to the Charmed and Frightened conditions until the spell ends. If the creature was already Charmed or Frightened, those conditions are suppressed for the duration. • The creature becomes Indifferent about creatures of your choice that it's Hostile toward. This indifference ends if the target takes damage or witnesses its allies taking damage. When the spell ends, the creature's attitude returns to normal.", ["Bard", "Cleric"]], ["Continual Flame", 2, "Evocation", "Action", "Touch", "Until dispelled", "V, S, M (ruby dust worth 50+ GP, which, the spell consumes)", "", "", "", "A flame springs from an object that you touch. The effect casts Bright Light in a 20-foot radius and Dim Light for an additional 20 feet. It looks like a regular flame, but it creates no heat and consumes no fuel. The flame can be covered or hidden but not smothered or quenched.", ["Cleric", "Druid", "Wizard"]], ["Darkness", 2, "Evocation", "Action", "60 feet", "up to 10 minutes (Concentration)", "V, M (bat fur and a piece of coal)", "", "", "", "For the duration, magical Darkness spreads from a point within range and fills a 15-foot-radius Sphere. Darkvision can't see through it, and nonmagical light can't illuminate it.\n  Alternatively, you cast the spell on an object that isn't being worn or carried, causing the Darkness to fill a 15-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the Darkness.\n  If any of this spell's area overlaps with an area of Bright Light or Dim Light created by a spell of level 2 or lower, that other spell is dispelled.", ["Sorcerer", "Warlock", "Wizard"]], ["Darkvision", 2, "Transmutation", "Action", "Touch", "8 hours", "V, S, M (a dried carrot)", "", "", "", "For the duration, a willing creature you touch has Darkvision with a range of 150 feet.", ["Druid", "Ranger", "Sorcerer", "Wizard"]], ["Detect Thoughts", 2, "Divination", "Action", "Self", "up to 1 minute (Concentration)", "V, S, M (1 Copper Piece)", "", "", "", "You activate one of the effects below. Until the spell ends, you can activate either effect as a Magic action on your later turns.\n  Sense Thoughts. You sense the presence of thoughts within 30 feet of yourself that belong to creatures that know languages or are telepathic. You don't read the thoughts, but you know that a thinking creature is present.\n  The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.\n  Read Thoughts. Target one creature you can see within 30 feet of yourself or one creature within 30 feet of yourself that you detected with the Sense Thoughts option. You learn what is most on the target's mind right now. If the target doesn't know any languages and isn't telepathic, you learn nothing.\n  As a Magic action on your next turn, you can try to probe deeper into the target's mind. If you probe deeper, the target makes a Wisdom saving throw. On a failed save, you discern the target's reasoning, emotions, and something that looms large in its mind (such as a worry, love, or hate). On a successful save, the spell ends. Either way, the target knows that you are probing into its mind, and until you shift your attention away from the target's mind, the target can take an action on its turn to make an Intelligence (Arcana) check against your spell save DC, ending the spell on a success.", ["Bard", "Sorcerer", "Wizard"]], ["Dragon's Breath", 2, "Transmutation", "Bonus Action", "Touch", "up to 1 minute (Concentration)", "V, S, M (a hot pepper)", "", "", "", "You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a Magic action to exhale a 15-foot Cone. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one.   Using a Higher-Level Spell Slot. The damage increases by 1d6 for each spell slot level above 2.", ["Sorcerer", "Wizard"]], ["Enhance Ability", 2, "Transmutation", "Action", "Touch", "up to 1 hour (Concentration)", "V, S, M (fur or a feather)", "", "", "", "You touch a creature and choose Strength, Dexterity, Intelligence, Wisdom, or Charisma. For the duration, the target has Advantage on ability checks using the chosen ability.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 2. You can choose a different ability for each target.", ["Bard", "Cleric", "Druid", "Ranger", "Sorcerer", "Wizard"]], ["Enlarge/Reduce", 2, "Transmutation", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a pinch of powdered iron)", "", "", "", "For the duration, the spell enlarges or reduces a creature or an object you can see within range (see the chosen effect below). A targeted object must be neither worn nor carried. If the target is an unwilling creature, it can make a Constitution saving throw. On a successful save, the spell has no effect.\n  Everything that a targeted creature is wearing and carrying changes size with it. Any item it drops returns to normal size at once. A thrown weapon or piece of ammunition returns to normal size immediately after it hits or misses a target.\n  Enlarge. The target's size increases by one category-from Medium to Large, for example. The target also has Advantage on Strength checks and Strength saving throws. The target's attacks with its enlarged weapons or Unarmed Strikes deal an extra 1d4 damage on a hit.\n  Reduce. The target's size decreases by one category-from Medium to Small, for example. The target also has Disadvantage on Strength checks and Strength saving throws. The target's attacks with its reduced weapons or Unarmed Strikes deal 1d4 less damage on a hit (this can't reduce the damage below 1).", ["Bard", "Druid", "Sorcerer", "Wizard"]], ["Enthrall", 2, "Enchantment", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a -10 penalty to Wisdom (Perception) checks and Passive Perception until the spell ends.", ["Bard", "Warlock"]], ["Find Steed", 2, "Conjuration", "Action", "30 feet Component: V, S", "Instantaneous", "", "", "", "", "You summon an otherworldly being that appears as a loyal steed in an unoccupied space of your choice within range. This creature uses the Otherworldly Steed stat block. If you already have a steed from this spell, the steed is replaced by the new one.\n  The steed resembles a Large, rideable animal of your choice, such as a horse, a camel, a dire wolf, or an elk. Whenever you cast the spell, choose the steed's creature type-Celestial, Fey, or Fiendwhich determines certain traits in the stat block.\n  Combat. The steed is an ally to you and your allies. In combat, it shares your Initiative count, and it functions as a controlled mount while you ride it (as defined in the rules on mounted combat). If you have the Incapacitated condition, the steed takes its turn immediately after yours and acts independently, focusing on protecting you.\n  Disappearance of the Steed. The steed disappears if it drops to 0 Hit Points or if you die. When it disappears, it leaves behind anything it was wearing or carrying. If you cast this spell again, you decide whether you summon the steed that disappeared or a different one.\n\nHöherer Grad: Use the spell slot's level for the spell's level in the stat block. Large Celestial, Fey, or Fiend (Your Choice), Neutral AC 10 + 1 per spell level HP 5 + 10 per spell level (the steed has a number of Hit Dice [d10s] equal to the spell's level) Speed 60 ft., Fly 60 ft. (requires level 4+ spell) MOD SAVE    MOD SAVE    MOD SAVE Str 18 +4 +4 dex 12 +1 +1 con 14 +2 +2 int 6 -2 -2 WiS 12 +1 +1 chA 8 -1 -1 Senses Passive Perception 11 Languages Telepathy 1 mile (works only with you) CR None (XP 0; PB equals your Proficiency Bonus) Traits     Life Bond. When you regain Hit Points from a level 1+ spell, the steed regains the same number of Hit Points if you're within 5 feet of it. Actions     Otherworldly Slam. Melee Attack Roll: Bonus equals your spell attack modifier, reach 5 ft. Hit: 1d8 plus the spell's level of Radiant (Celestial), Psychic (Fey), or Necrotic (Fiend) damage. Bonus Actions     Fell Glare (Fiend Only; Recharges after a Long Rest). Wisdom Saving Throw: DC equals your spell save DC, one creature within 60 feet the steed can see. Failure: The target has the Frightened condition until the end of your next turn. Fey Step (Fey Only; Recharges after a Long Rest). The steed teleports, along with its rider, to an unoccupied space of your choice up to 60 feet away from itself. Healing Touch (Celestial Only; Recharges after a Long Rest). One creature within 5 feet of the steed regains a number of Hit Points equal to 2d8 plus the spell's level.", ["Paladin"]], ["Find Traps", 2, "Divination", "Action", "120 feet", "Instantaneous", "V, S", "", "", "", "You sense any trap within range that is within line of sight. A trap, for the purpose of this spell, includes any object or mechanism that was created to cause damage or other danger. Thus, the spell would sense the Alarm or Glyph of Warding spell or a mechanical pit trap, but it wouldn't reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole.\n  This spell reveals that a trap is present but not its location. You do learn the general nature of the danger posed by a trap you sense.", ["Cleric", "Druid", "Ranger"]], ["Flame Blade", 2, "Evocation", "Bonus Action", "Self", "up to 10 minutes (Concentration)", "V, S, M (a sumac leaf)", "", "", "melee", " You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke it again as a Bonus Action.\n  As a Magic action, you can make a melee spell attack with the fiery blade. On a hit, the target takes Fire damage equal to 3d6 plus your spellcasting ability modifier.\n  The flaming blade sheds Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 2.", ["Druid", "Sorcerer"]], ["Flaming Sphere", 2, "Conjuration", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S, M (a ball of wax)", "2d6", "Fire", "", "You create a 5-foot-diameter sphere of fire in an unoccupied space on the ground within range. It lasts for the duration. Any creature that ends its t
