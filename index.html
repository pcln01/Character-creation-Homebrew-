, "| Wehr | Bei vollem Vorrat: Mu-shin (siehe unten). | Wakizashi-Parade (Reaction): +3 auf die Armor Class gegen einen Angriff. Kostet 1 Ruhe. |", "| Angriffe | Wie üblich. | Als Bonus Action ein zusätzlicher Angriff mit dem Wakizashi (siehe „Zwei Klingen führen\"). |", "Mu-shin (無心), ab Stufe 5: Bei vollem Ruhe-Vorrat handelst du ohne Gedanken: Du kannst nicht überrascht werden und darfst einmal pro Runde reagieren, ohne deine Reaction zu verbrauchen. Gilt in beiden Haltungen.", "## Zwei Klingen führen", "| Regel | Wirkung |", "| Bewaffnung | Katana in der Haupthand, Wakizashi in der Nebenhand. Beide gelten als Finesse-Waffen — du darfst Strength oder Dexterity nutzen, musst dich aber für beide Klingen auf dasselbe Attribut festlegen. |", "| Damage Rollsl | Katana 1d10, einhändig geführt jedoch 1d8. Wakizashi 1d6. Beide verursachen Slashing Damage. |", "| Zweiter Angriff | Als Bonus Action greifst du mit dem Wakizashi an. Anders als beim üblichen Kampf mit zwei Waffen addierst du dabei deinen Ability Modifier auf den Schaden — das ist der Advantage einer echten Schule gegenüber bloßer Beidhändigkeit. |", "| Kein Schild | Beide Hände sind belegt. Du kannst in Nitō keinen Schild führen und nichts halten, was eine freie Hand verlangt. |", "| Kein Iaijutsu | Beide Klingen sind gezogen. Es gibt keine Scheide, aus der du ziehen könntest — Iaijutsu steht dir in dieser Haltung nicht offen. |", "| Klinge verloren | Verlierst du eine der beiden Klingen, fällst du sofort auf Ittō-Regeln zurück. Iaijutsu kannst du erst wieder nutzen, wenn du deine verbliebene Klinge einsteckst — das kostet eine Action. |", "| Wechseln | Zwischen Ittō und Nitō wechselst du bei einer kurzen oder langen Rast frei. Im Kampf kostet der Wechsel eine Action (Wegstecken, Scheide richten oder zweite Klinge ziehen). |"]}, {"h": "Säule 3 — Deine Schwertkunst", "body": ["## Bewegungen und Katas", "Bewegungen: Die Grundbausteine. Es gibt drei Arten: Auftakt, Verbindung und Abschluss. Du kennst zu Beginn drei Bewegungen (eine je Art) und lernst mit den Stufen weitere dazu.", "Kata: Eine Folge aus einem Auftakt, beliebig vielen Verbindungen und einem Abschluss — je eine pro Zug, in aufeinanderfolgenden Zügen. Du benennst deine Katas selbst und trägst sie in dein Schulbuch ein.", "Der Abschluss zahlt: Je mehr Verbindungen du vor dem Abschluss ausgeführt hast, desto stärker wirkt er. Jede Verbindung heißt eine Stufe mehr Wirkung.", "Bruch: Führst du in einem Zug etwas aus, das nicht zur Kata gehört, oder wirst du kampfunfähig, bricht die Kata ab. Die gesammelten Verbindungen verfallen.", "## Die Grundbausteine", "| Art | Bewegung | Wirkung |", "| Auftakt | Ziehen | Du ziehst und schlägst in einer Bewegung: ein Waffenangriff, und du gewinnst 1 Ruhe. |", "| Auftakt | Wurzel | Du stehst fest. Bis zur nächsten Kata kannst du nicht bewegt oder zu Boden geworfen werden; du gewinnst 1 Ruhe. |", "| Auftakt | Lauern | Du wartest ab. Der nächste Angriff gegen dich hat Disadvantage, und dein nächster Angriff gegen diese Kreatur hat Advantage. |", "| Verbindung | Wende | Du bewegst dich bis zu deiner Speed, ohne Opportunity Attacks auszulösen. |", "| Verbindung | Durchzug | Ein Waffenangriff; bei einem Treffer darfst du dich 10 ft. bewegen. |", "| Verbindung | Bindung | Ein Waffenangriff; bei einem Treffer hat das Ziel Disadvantage auf seinen nächsten Angriff. |", "| Verbindung | Atem | Du sammelst dich: Du gewinnst 2 Ruhe statt 1, ohne die Kata zu unterbrechen. |", "| Abschluss | Schnitt | Ein Waffenangriff mit +1d10 Schaden je vorangegangener Verbindung. |", "| Abschluss | Stich | Ein Waffenangriff, der Rüstungsboni auf die AC ignoriert, mit +1d8 Schaden je Verbindung. |", "| Abschluss | Fall | Ein Waffenangriff mit +1d8 Schaden je Verbindung; das Ziel macht einen STR-Saving Throw oder wird zu Boden geworfen. |", "| Verbindung | Zangenschritt | Du bewegst dich bis zu deiner Speed, ohne Opportunity Attacks auszulösen. Beendest du die Bewegung so, dass du gemeinsam mit einer verbündeten Kreatur eine dritte Kreatur flankierst, gewinnst du 1 Ruhe. |", "## Deine Schule benennen", "Auf Stufe 1 gründest du deine Schule oder erbst sie. Sie bekommt einen Namen, und jede Kata, die du zusammenstellst, ebenfalls.", "## Eigene Bewegungen", "Selbst erschaffen: Du bist nicht auf die Grundbausteine beschränkt. Mit deinen Fähigkeiten — Klassen-Features wie Rassenfähigkeiten — und deinen Items kannst du eigene Bewegungen für deine Katas erschaffen, als Auftakt, Verbindung oder Abschluss. Voraussetzung ist, dass du dem DM ausführlich beschreiben kannst, wie du es machen willst. Bevor du eine eigene Bewegung einsetzen kannst, musst du sie über mehrere Long Rests ausprobieren und erforschen. Wie viele es sind, legt der DM fest — oder die Würfel.", "Beispiele: Ein Kitsune-Samurai legt als Auftakt sein Fuchsfeuer auf die Waffe und lädt sie so mit Fire oder Psychic Damage auf. Ein menschlicher Samurai nutzt ein Schutz-Ofuda — einen selbst erschaffenen Talisman, den es nicht in der Liste gibt —, um seine Klinge mit der reinigenden Kraft dieses Ofudas aufzuladen."]}, {"h": "Seiten-ryū — der Klare Himmel", "body": ["Erlernen: Nicht wählbar bei der Charaktererschaffung. Der Samurai muss den Grabwächter finden und bezwingen — oder sein Schulbuch. Danach stehen ihm die drei Techniken offen.", "| Technik | Art | Wirkung |", "| Ōshike — Schwerer Sturm | Abschluss | Ein gerader, ungeheurer Hieb: +2d10 Schaden je vorangegangener Verbindung. Er kommt geradeaus — das Ziel darf ihn mit einer Reaction parieren und den Schaden halbieren, wenn es eine Waffe führt. |", "| Tenkiyohō — Nachtgebrüll des Himmelsdämons | Abschluss | Eine breite Schockwelle in einem 30-ft-Kegel: 4d10 Schaden je Verbindung, DEX-Saving Throw halbiert. Sie durchdringt Rüstung — Resistenzen gegen nichtmagischen Schaden gelten nicht. |", "## Meistertechnik", "Seiten Taisei — Klarer Himmel, Große Eroberung. Du gibst deine gesamte Ruhe aus. Für die nächsten 3 Runden führst du in jedem deiner Züge eine vollständige Kata aus — Auftakt, alle Verbindungen und Abschluss in einer einzigen Action, mit drei Verbindungen gewertet. Danach fällst du auf 0 Ruhe und kannst eine Runde lang keine Kata beginnen."]}, {"h": "Niten Ichi-ryū — Zwei Himmel als einer", "body": ["Erlernen: Nicht wählbar bei der Charaktererschaffung. Der Samurai muss Musashi finden und ihn im Duell beeindrucken — oder ihn höflich fragen und zeigen, dass er etwas vom Weg versteht. Beides führt zum Buch.", "Voraussetzung: Alle Techniken dieser Schule setzen die Haltung Nitō voraus. Wer nur eine Klinge führt, kann sie lesen, aber nicht ausführen.", "| Technik | Art | Wirkung |", "| 地 Chi no Kata — Erde | Auftakt | Du fasst Stand. Bis zur nächsten Kata kannst du nicht bewegt oder zu Boden geworfen werden, deine Armor Class steigt um 2, und du gewinnst 2 Ruhe statt 1. |", "| 水 Sui no Kata — Wasser | Verbindung | Du fließt zwischen den Gegnern. Bewege dich bis zu deiner Speed ohne Opportunity Attacks und führe dabei je einen Angriff gegen bis zu drei verschiedene Kreaturen aus, an denen du vorbeikommst. |", "| 火 Ka no Kata — Feuer | Abschluss | Beide Klingen zugleich. Du führst zwei Angriffe gegen dasselbe Ziel aus; jeder verursacht +1d10 Schaden je vorangegangener Verbindung. Treffen beide, wird das Ziel bis zum Ende seines nächsten Zuges zu Boden geworfen. |", "| 風 Fū no Kata — Wind | Verbindung | Du liest die Schule deines Gegners. Wähle eine Kreatur: Bis zum Ende deines nächsten Zuges hast du Advantage auf Angriffe gegen sie, und ihre Angriffe gegen dich haben Disadvantage. Du kannst je Kata nur eine Kreatur so lesen. |", "## Meistertechnik", "空 Kū no Kata — Leere. Du hörst auf zu denken. In diesem Zug tust du nichts: kein Angriff, keine Bewegung, keine Bonus Action. Alle Angriffe gegen dich haben bis zu deinem nächsten Zug Disadvantage. Zu Beginn deines nächsten Zuges führst du deine gesamte Kata in einer einzigen Action aus — Auftakt, alle Verbindungen und den Abschluss, mit drei Verbindungen gewertet — und deine Ruhe ist danach voll."]}], "intro": []}, {"id": "yokaihunter", "name": "Yokai Hunter", "kanji": "妖怪狩り", "hd": 10, "saves": ["dex", "wis"], "skills": {"n": 3, "from": ["Animal Handling", "Athletics", "Investigation", "Nature", "Perception", "Stealth", "Survival"]}, "basics": {"Ressourcen": "Das Jagdbuch (dauerhaftes Wissen), die Beute (Kampffokus), der Jagdstil (Handschrift), Gegenmittel (Verbrauchsgüter).", "Primärattribut": "Geschicklichkeit oder Stärke für die Waffe; Weisheit bestimmt den Saving Throw DC seiner Gegenmittel und Fallen.", "Hit Die": "1d10", "Saving Throws": "DEX, WIS", "Weapon Proficiencies": "Simple, Martial", "Armor Proficiencies": "Light", "Skills": "3 aus: Animal Handling, Athletics, Investigation, Nature, Perception, Stealth, Survival", "Tools": "Herbalism Kit", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Waffenfokus": "Auf Stufe 1 wählt er Bogen oder Klinge. Beides steht ihm offen, aber seine Fokuswaffe erhält auf den Stufen 5, 11 und 17 zusätzliche Angriffe bzw. Damage Rollsl."}, "start": [{"k": "Waffen", "v": "Passend zu deinem Waffenfokus: ein Hankyū mit 20 Pfeilen und ein Tantō (Bogen) — oder ein Katana und ein Wakizashi (Klinge). Siehe Waffen-der-Inseln.docx."}, {"k": "Rüstung", "v": "Leichte Rüstung."}, {"k": "Zusätzlich", "v": "Dein Jagdbuch (leer), ein Satz Zutaten für Gegenmittel, Fallenausrüstung."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Jagdbuch (unbegrenzte Einträge, Tiefe I nach 1 Sieg); Beute markieren; Jagdstil gründen (3 Griffe); Standhaft; Waffenfokus wählen", "2": "Gegenmittel brauen", "3": "Unbeirrt", "4": "Ability Score Improvement", "5": "Jagdbuch Tiefe II möglich (2 erlegte Wesen je Art); Waffenfokus: zusätzlicher Angriff bzw. +1d6 Schaden", "6": "Vierter Griff; zwei Gegenmittel gleichzeitig verabreichen", "7": "Abgehärtet (keine Corruption mehr durch Orte)", "8": "Ability Score Improvement", "9": "Zweite Fährte", "10": "Gegenmittel halten bis zum übernächsten Long Rest", "11": "Fünfter Griff; Waffenfokus verbessert", "12": "Ability Score Improvement", "13": "Kein Entkommen", "14": "Du kannst eine Art aus dem Buch am Geruch erkennen, bevor du sie siehst (120 ft.)", "15": "Jagdbuch Tiefe III möglich (3 erlegte Wesen je Art); Male und Binden", "16": "Ability Score Improvement", "17": "Sechster Griff; Waffenfokus verbessert", "18": "Deine Gegenmittel wirken auch auf Verbündete in 30 ft., ohne sie zu verbrauchen (1×/Long Rest)", "19": "Ability Score Improvement", "20": "Der Blick des Jägers"}, "msnotes": [], "rules": [{"h": "Säule 1 — Das Jagdbuch", "body": ["Er trägt jede Yokai-Art ein, die er studiert hat — nicht das einzelne Wesen, sondern die Art: Oni, Tengu, Kappa, Jorōgumo, Corruption Hunter. Das Buch ist dauerhaft und wächst über die gesamte Kampagne.", "Eintragen: 10 Minuten am Kadaver, oder eine Stunde Recherche an alten Aufzeichnungen, oder eine überlebte Begegnung, die er gründlich beobachten konnte.", "Anzahl: Unbegrenzt, ab Stufe 1. Er darf so viele Arten eintragen, wie er studieren kann — auch den Corruption Hunter.", "Tiefe: Ein Eintrag wächst durch Siege — und dein Level begrenzt, wie weit er wachsen kann. Beides muss erfüllt sein: die nötige Zahl besiegter Wesen dieser Art UND die nötige Stufe.", "| Tiefe | Besiegt | Ab Stufe | Was du gegen diese Art gewinnst |", "| I — Gesehen | 1 | 1 | +2 auf Attack Rolls gegen diese Art; Advantage auf Saving Throws gegen ihre Fähigkeiten. |", "| II — Verstanden | 2 | 5 | Zusätzlich +1d8 Schaden; du kennst ihre Hit Points, Immunitäten und Verwundbarkeiten, ohne zu würfeln. |", "| III — Gemeistert | 3 | 15 | Zusätzlich ignorierst du ihre Resistenzen und Immunitäten gegen nichtmagischen Schaden; einmal pro Kampf machst du einen ihrer Angriffe oder Effekte zunichte (Reaction). Ein Mal brennt sich in deine Haut. |", "## Die Male", "Ist ein Eintrag vollständig — Tiefe III, also drei erlegte Wesen dieser Art und Stufe 15 —, brennt sich ein Mal in die Haut des Jägers.", "Binden (Action): Du berührst dein Mal und sprichst den Namen der Art. Alle Kreaturen dieser Art, die du sehen kannst, sind für die Dauer des Kampfes gebunden: Sie können nicht fliehen. Sie können sich nicht teleportieren, nicht auf eine andere Ebene wechseln, nicht invisible entkommen und den Kampfort nicht verlassen. Ein Saving Throw steht ihnen nicht zu — das Mal ist kein Zauber, sondern ein Urteil.", "Gleichzeitig: Du kannst so viele Male gleichzeitig gebunden halten, wie dein Wisdom Modifier beträgt (mindestens eines). Bindest du ein weiteres, erlischt das älteste.", "Dauer: Bis zum Ende des Kampfes oder bis du das Mal löst (Bonus Action).", "## Was zählt als Art?", "Der Spielleiter entscheidet, aber als Faustregel: Was denselben Namen trägt und dieselbe Herkunft hat, ist eine Art. Ein Karasu-Tengu und ein Daitengu sind dieselbe Art. Ein Oni und ein Shuten-dōji ebenfalls — aber benannte Wesen (Bosse, legendäre Yokai) sind eigene Einträge und müssen gesondert studiert werden."]}, {"h": "Säule 2 — Die Beute", "body": ["Markieren (Bonus Action): Du bestimmst eine sichtbare Kreatur zu deiner Beute. Die Markierung hält, bis sie stirbt, du sie aufgibst (Bonus Action) oder du eine neue markierst.", "Gegen die Beute: Alle Boni aus deinem Jagdbuch wirken doppelt, wenn ihre Art eingetragen ist. Du kennst stets ihre Richtung und ungefähre Entfernung, solange sie auf derselben Ebene ist.", "Der Preis: Solange eine Beute markiert ist, hast du Disadvantage auf Angriffe gegen jede andere Kreatur.", "## Weitere Beute-Fähigkeiten", "Unbeirrt (Stufe 3): Opportunity Attacks deiner Beute gegen dich haben Disadvantage, und du kannst dich durch ihren Raum bewegen.", "Zweite Fährte (Stufe 9): Du darfst zwei Kreaturen gleichzeitig als Beute markieren. Der Disadvantage gegen alles Übrige bleibt.", "Kein Entkommen (Stufe 13): Deine Beute kann sich nicht invisible machen, teleportieren oder auf eine andere Ebene wechseln, um dir zu entkommen — sie muss dafür einen WIS-Saving Throw gegen deinen DC bestehen."]}, {"h": "Säule 3 — Dein Jagdstil", "body": ["Aufbau: Ein Jagdstil besteht aus drei Griffen — einem Anschlag, einer Hetze und einem Riss. Du wählst je einen auf Stufe 1 und benennst deinen Stil selbst.", "Auslösen: Griffe kosten keine Action. Sie greifen automatisch, sobald ihre Bedingung erfüllt ist, und wirken nur gegen deine markierte Beute. Jeder Griff wirkt einmal pro Beute — markierst du eine neue, laden alle drei wieder auf.", "Erweitern: Auf den Stufen 6, 11 und 17 lernst du je einen weiteren Griff einer Art deiner Wahl. Du darfst beim Markieren entscheiden, welchen du gegen diese Beute nutzt — dein Stil bleibt derselbe, aber du passt ihn dem Wild an.", "## Eigene Griffe", "Selbst erschaffen: Du bist nicht auf die Griffe unten beschränkt. Mit deinen Fähigkeiten — Klassen-Features wie Rassenfähigkeiten — und deinen Items kannst du eigene Griffe für deinen Jagdstil erschaffen, als Anschlag, Hetze oder Riss. Voraussetzung ist, dass du dem DM ausführlich beschreiben kannst, wie du es machen willst. Bevor du einen eigenen Griff einsetzen kannst, musst du ihn über mehrere Long Rests ausprobieren und erforschen. Wie viele es sind, legt der DM fest — oder die Würfel.", "## Anschlag — wie du beginnst", "| Griff | Bedingung und Wirkung |", "| Aus dem Dickicht | Dein erster Angriff gegen die Beute, während sie dich nicht bemerkt hat: Er trifft automatisch und gilt als kritischer Treffer. |", "| Auf Sicht | Dein erster Angriff gegen die Beute in einem Kampf verursacht +3d8 Schaden. |", "| Gestellt | Wenn du die Beute markierst, macht sie einen WIS-Saving Throw gegen deinen DC oder ist bis zum Ende ihres nächsten Zuges frightened und kann sich nicht von dir wegbewegen. |", "| Der Köder | Wenn du die Beute markierst, darfst du sofort eine Reaction nutzen, ohne sie zu verbrauchen — etwa um eine Falle auszulösen oder ein Gegenmittel zu geben. |", "## Hetze — wie du dranbleibst", "| Griff | Bedingung und Wirkung |", "| Nachsetzen | Bewegt sich deine Beute, darfst du dich als Reaction um bis zu deine halbe Speed mitbewegen, ohne Opportunity Attacks auszulösen. |", "| Ausbluten | Trifft dein Angriff die Beute, erleidet sie zu Beginn jedes ihrer Züge 2d6 Schaden, bis sie einen CON-Saving Throw gegen deinen DC besteht. |", "| Wildwechsel | Verfehlst du deine Beute, darfst du einen weiteren Angriff gegen sie ausführen. Verfehlst du auch diesen, ist der Griff verbraucht. |", "| Allein im Wald | Ist kein Verbündeter innerhalb von 30 ft. von dir, hast du Advantage auf Angriffe gegen deine Beute und sie hat Disadvantage gegen dich. |", "| Rudeljagd | Flankierst du deine Beute im Nahkampf gemeinsam mit einer verbündeten Kreatur (siehe Kampagne-Das-gebrochene-Siegel.docx, „Neue Mechanik: Flanking\"), verursacht dein nächster Treffer gegen sie zusätzlich +1d6 Schaden vom Schadenstyp deiner Waffe. |", "## Riss — wie du beendest", "| Griff | Bedingung und Wirkung |", "| Kehlschnitt | Sinkt deine Beute unter ein Viertel ihrer Hit Points, verursacht dein nächster Treffer gegen sie doppelten Schaden. |", "| Der letzte Atem | Bringst du deine Beute auf 0 Hit Points, darfst du sofort eine neue Beute markieren und einen Angriff gegen sie ausführen. |", "| Zerlegen | Tötest du deine Beute, gewinnst du Yokai-Teile für zwei zusätzliche Gegenmittel und trägst ihren Sieg doppelt in dein Jagdbuch ein (zwei statt einem). |", "| Trophäe | Tötest du deine Beute, erhältst du bis zum Ende des Kampfes einen Bonus in Höhe deines Wisdom Modifiers auf Angriffs- und Damage Rolls gegen alle Kreaturen ihrer Art. |"]}, {"h": "Säule 4 — Gegenmittel", "body": ["Standhaft (Stufe 1): Du hast Advantage auf alle Saving Throws gegen Corruption.", "Brauen: Bei einem Long Rest stellst du eine Anzahl Gegenmittel gleich deinem Proficiency Bonus her, sofern du Yokai-Teile bei dir hast. Sie verderben beim nächsten Long Rest.", "Abgehärtet (Stufe 7): Du kannst keine Corruption mehr durch ORTE erhalten — nur noch durch Angriffe. Verseuchtes Gebiet ist für dich sicher.", "Verteilen: Ein Gegenmittel als Action einzunehmen oder einem Verbündeten in Reichweite zu geben.", "| Gegenmittel | Wirkung |", "| Salzsud | Der Trinkende hat Advantage auf seinen nächsten Corruption-Saving Throw. |", "| Aschebalsam | Unterdrückt bestehende Corruption für 1 Stunde — kein Soul-HP-Verlust in dieser Zeit. Entfernt sie nicht. |", "| Artgift | Bei der Herstellung wählst du eine Art aus deinem Buch. Die nächste Waffe, auf die es gestrichen wird, verursacht gegen diese Art +2d10 Schaden. |", "| Wachsalbe | Der Trinkende kann 1 Stunde lang nicht charmed, frightened oder in Schlaf versetzt werden. |", "| Blutstiller | Als Reaction einem Verbündeten gegeben, der auf 0 Hit Points fällt: Er stabilisiert sich sofort und steht mit 1 Trefferpunkt wieder auf. |"]}, {"h": "Was die Jagd hinterlässt", "body": ["„Yokai-Teile\" ist bewusst ein Sammelbegriff — für Zerlegen, das Brauen von Gegenmitteln und den Ausgangsstoff von Artgift reicht ein beliebiges Teil derselben Art. Welches Material jede Art konkret liefert, steht in einem eigenen Dokument, weil die Liste über alle Rassen und Bestiarium-Einträge hinweg gilt, nicht nur über diese Klasse."]}, {"h": "Kapstein (Stufe 20)", "body": ["## Der Blick des Jägers", "Wirkung: Erblickst du eine Kreatur, deren Art nicht in deinem Buch steht, trägst du sie augenblicklich ein — und zwar sofort auf voller Tiefe III. Du musst sie nicht dreimal erlegen und nicht einmal berühren. Alle Boni aus Gesehen, Verstanden und Gemeistert wirken ab dem ersten Blick, und das Mal brennt sich im selben Augenblick ein.", "Rückwirkend: Alle Einträge, die noch nicht auf Tiefe III stehen, werden es sofort. Dein Buch ist mit einem Schlag vollständig, und dein Körper trägt jedes Zeichen."]}], "intro": []}, {"id": "sohei", "name": "Sōhei", "kanji": "僧兵", "hd": 12, "saves": ["str", "con"], "skills": {"n": 2, "from": ["Athletics", "Insight", "Intimidation", "Medicine", "Religion"]}, "basics": {"Ressourcen": "Bürde (steigt durch das, was er trägt, und bezahlt seine Fähigkeiten), eigene Hit Points (sein Treibstoff), die Niō-Gestalt (Kapazität gegen Wehrlosigkeit).", "Corruption": "Er ist der Einzige, der sie ohne Schrein von sich selbst nehmen kann — indem er sie in Bürde umwandelt.", "Primärattribut": "Konstitution. Sie bestimmt seine Kapazität und den DC seiner Fähigkeiten.", "Hit Die": "1d12", "Saving Throws": "STR, CON", "Weapon Proficiencies": "Simple, Martial", "Armor Proficiencies": "Heavy, Shields", "Skills": "2 aus: Athletics, Insight, Intimidation, Medicine, Religion", "Tools": "Keine", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Ausrüstung": "Naginata (1d10 Slashing Damage, Reach 10 ft. — volle Waffenwerte in Naginata.docx, 8_Items/Weapon), schwere Rüstung, Schild. Er ist kein Zauberwirker."}, "start": [{"k": "Waffen und Rüstung", "v": "Naginata, schwere Rüstung, Schild — wie oben in den Grundlagen festgelegt."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Bürde (Schildwall, Deckung); Kegare tragen; Zurückgeben; Wuchtschlag; Naginata Reach 10 ft.; Der eigene Weg (1. Wahl)", "2": "Wegsperre; Standhaft", "3": "Abschütteln; Zorn tragen; Der eigene Weg (2. Wahl)", "4": "Ability Score Improvement", "5": "Unverrückt; zwei Angriffe; Der eigene Weg (3. Wahl)", "6": "Naginata Reach 15 ft.", "7": "Niō-Gestalt; Der eigene Weg (4. Wahl)", "8": "Ability Score Improvement", "9": "Der Berg schweigt; Der eigene Weg (5. Wahl)", "10": "Deckung gibt volle Deckung (+5) statt halber", "11": "Läuterung; Der eigene Weg (6. Wahl)", "12": "Ability Score Improvement", "13": "Schildwall reicht 60 ft.; Der eigene Weg (7. Wahl)", "14": "Zurückgeben als Teil derselben Bonus Action an zwei Verbündete", "15": "Drei Angriffe; Der eigene Weg (8. Wahl)", "16": "Ability Score Improvement", "17": "Letzte Wache; Der eigene Weg (9. Wahl)", "18": "Zurückgeben und Läuterung kosten die Hälfte der Hit Points", "19": "Ability Score Improvement; Der eigene Weg (10. Wahl)", "20": "Niō-Gestalt zweimal pro Schreinbesuch; beim Zusammenbruch stehst du am Ende deines nächsten Zuges mit der Hälfte deiner Hit Points wieder auf (einmal pro Long Rest)"}, "msnotes": [], "rules": [{"h": "Säule 1 — Bürde", "body": ["Bürde ist kein Schaden. Sie ist das Gewicht dessen, was er anderen abgenommen hat, und zugleich der Preis seiner Fähigkeiten: Was er für andere trägt, gibt er für sie wieder aus. Abschütteln oder zurückgeben kann er sie nicht.", "## Aufnehmen", "Schildwall (passiv): Würde ein Verbündeter in 30 ft. Schaden erleiden, kannst du ihn stattdessen auf dich nehmen. Du erleidest keinen Schaden — du erhältst Bürde in gleicher Höhe. Das kostet keine Action und ist nicht begrenzt.", "Deckung (Reaction): Ein Verbündeter in 30 ft. erhält gegen einen Angriff halbe Deckung (+2 auf Armor Class und DEX-Saving Throws). Einmal pro Runde.", "Zorn tragen (passiv, ab Stufe 3): Sooft du mit einem Waffenangriff triffst, darfst du die Hälfte des verursachten Schadens (aufgerundet) als Bürde aufnehmen. Kostet keine Action und ist nicht begrenzt.", "Schaden gegen dich selbst: Angriffe, die dir gelten, treffen deine Hit Points ganz normal. Bürde entsteht nur aus dem, was du für andere trägst.", "## Kegare tragen", "Kegare tragen (Action): Entferne den Corruption-Debuff von dir selbst. Du erhältst dafür 10 Bürde. Die volle Action ist nötig — du kannst in diesem Zug nichts anderes tun.", "Nur bei dir: Du kannst Corruption ausschließlich von dir selbst nehmen, nicht von Verbündeten. Was du trägst, trägst du für dich.", "## Die Obergrenze", "Kapazität: Deine maximalen Hit Points plus deine maximalen Soul HP.", "Überlauf: Übersteigt deine Bürde deine Kapazität, fallen deine Hit Points sofort auf 0.", "Der Fall: Fallen deine Hit Points auf 0 — gleich aus welchem Grund, ob durch Überlauf, durch Angriffe oder weil du zu viel für andere bezahlt hast —, fällt deine Bürde auf 0 und jede aktive Niō-Gestalt verfällt. Du bist unconscious und würfelst Death Saving Throws wie üblich.", "Kein Abbau: Solange du stehst, sinkt deine Bürde nur, wenn du sie für eine Bürde-Fähigkeit ausgibst. Nicht durch Rasten, nicht durch Heilung, nicht an einem Schrein. Der Fall setzt sie auf 0 zurück.", "## Was er stattdessen gibt", "Jede dieser Fähigkeiten kostet X Bürde und 2X Hit Points. Du brauchst genug Bürde, um sie zu bezahlen, und der Verlust an Hit Points lässt sich nicht durch Bürde ausgleichen.", "| Fähigkeit | Kosten | Wirkung |", "| Zurückgeben | X Bürde + 2X Hit Points | Bonus Action: Heile einen Verbündeten in 30 ft. um X. Höchstens dein doppelter Proficiency Bonus je Nutzung. |", "| Wuchtschlag | 5 Bürde + 10 Hit Points | Dein nächster Treffer mit der Naginata verursacht zusätzlich 2d10 Bludgeoning Damage. |", "| Abschütteln | 8 Bürde + 16 Hit Points | Bonus Action: Entferne eine Condition von dir oder einem Verbündeten in 30 ft. (nicht unconscious). |", "| Läuterung | 10 Bürde + 20 Hit Points | Action, ab Stufe 11: Ein Verbündeter in 30 ft. gewinnt Soul HP in Höhe deines CON-Modifiers zurück. |", "| Standhaft | — | Reaction, ab Stufe 2: Würdest du auf 0 Hit Points fallen, bleibst du stattdessen bei 1 stehen. Einmal pro Long Rest. |", "## Der eigene Weg", "Auf jeder ungeraden Stufe (1, 3, 5 … 19) triffst du eine Wahl — eine weitere Bürde-Nutzung erlernen oder deine Kapazität ausbauen.", "Option A — Neue Bürde-Nutzung: Erlerne eine Fähigkeit aus der folgenden Liste. Jede lässt sich nur einmal erlernen.", "| Fähigkeit | Kosten | Wirkung |", "| Rachedurst | X Bürde + 2X Hit Points | Bonus Action: Dein nächster Treffer in diesem Zug verursacht zusätzlich X Schaden vom Schadenstyp deiner Naginata. |", "| Segen des Blutes | X Bürde + 2X Hit Points | Bonus Action: Ein Verbündeter in 30 ft. erhält temporäre Hit Points in Höhe von X. |", "| Geteilter Schmerz | X Bürde + 2X Hit Points | Bonus Action: Bis zu drei Verbündete in 30 ft. heilen je die Hälfte von X, aufgerundet. |", "| Blutopfer | X Bürde + 2X Hit Points | Action: Ein Verbündeter in 30 ft. gewinnt Soul HP in Höhe der Hälfte von X, aufgerundet, zurück. |", "| Unbeugsamer Wille | 10 Bürde + 20 Hit Points | Reaction: Du oder ein Verbündeter in 30 ft. wiederholt einen fehlgeschlagenen Saving Throw und behält das zweite Ergebnis. |", "| Eiserner Schild | — | Passiv: Nimmt dein Schildwall Schaden auf, hast du bis zum Ende deines nächsten Zuges Resistance gegen diesen Schadenstyp. |", "| Feldschmiede | 6 Bürde + 12 Hit Points | Passiv: Du hast Proficiency mit Schmiedewerkzeug — bislang hat keine Klasse das. Action, jederzeit außerhalb eines Long Rests: Repariere eine gebrochene Spitzhacke, Angel oder Sichel in deiner Hand vollständig (volle Haltbarkeit zurück), sofern du 1 Einheit Eisen bei dir trägst — kein Amboss und kein Long Rest nötig, nur dein eigenes Blut statt Feuer und Zeit. |", "Eigene Bürde-Nutzung: Du musst dich nicht an die Liste halten und auch nicht auf den Stufenaufstieg warten. Jederzeit im Abenteuer darfst du eine neue Nutzung deiner Bürde finden, indem du den DM überzeugst, dass sie ein guter Nutzen ist. Je nach Art der Nutzung kostet sie Hit Points oder Soul HP. Beispiel: Du nutzt deine Bürde, um beim Trösten oder beim Zeigen von Mitleid Advantage auf Charisma-Würfe zu bekommen.", "Option B — Mehr Kapazität: Deine Kapazität steigt dauerhaft um 5, zusätzlich zu Hit Points und Soul HP. Beliebig oft wiederholbar."]}, {"h": "Säule 2 — Die Niō-Gestalt", "body": ["Aktivieren (Bonus Action): Deine maximalen Hit Points und deine maximalen Soul HP verdoppeln sich. Die zusätzlichen Punkte sind sofort gefüllt.", "Häufigkeit: Einmal pro Schreinbesuch. Erst wenn du einen nicht verdorbenen Schrein aufsuchst, kannst du es erneut einsetzen.", "Dauer: Unbegrenzt. Die Gestalt hält über Kämpfe und Long Rests hinweg, bis sie verbraucht ist.", "Verbrauch: Verlierst du zwischen zwei Long Rests so viele Hit Points, wie der Bonus groß war, verfällt die Gestalt. Solange auch nur ein Punkt davon übrig ist, bleibt sie bestehen, und du kannst den Zusatz beliebig oft wieder vollheilen. Fällst du auf 0 Hit Points, verfallen alle Stufen auf einmal.", "Der Preis: Solange die Niō-Gestalt aktiv ist, beträgt deine Armor Class 0. Jeder Angriff gegen dich trifft, sofern er nicht eine natürliche 1 würfelt.", "Stapeln: Aktivierst du die Gestalt erneut, während sie noch besteht, verdoppelt sich der bereits erhöhte Wert abermals.", "## Ein Beispiel", "| Zustand | Max Hit Points | Max Soul HP | Kapazität | Armor Class |", "| Normal | 36 | 18 | 54 | 18 |", "| Niō, einfach | 72 | 36 | 108 | 0 |", "| Niō, zweifach | 144 | 72 | 216 | 0 |"]}, {"h": "Säule 3 — Naginata und Stand", "body": ["Reach: Deine Naginata hat 10 ft. Reach. Auf Stufe 6 steigt sie auf 15 ft.", "Wegsperre (Stufe 2): Kreaturen, die deinen Reach betreten, lösen einen Opportunity Attack aus — auch wenn sie sich nur hineinbewegen und dort stehen bleiben. Einmal pro Kreatur und Runde.", "Unverrückt (Stufe 5): Du kannst nicht gegen deinen Willen bewegt oder prone geworfen werden, solange du bei Bewusstsein bist.", "Zwei Angriffe (Stufe 5): Du greifst zweimal an, wenn du die Attack Action nutzt. Auf Stufe 15 dreimal.", "Der Berg schweigt (Stufe 9): Solange deine Bürde mindestens deinem Level entspricht, hast du Resistance gegen Bludgeoning, Piercing und Slashing Damage. Was du trägst, härtet dich.", "Letzte Wache (Stufe 17): Wenn du zusammenbrichst, bleibt dein Schildwall bis zum Ende deines nächsten Zuges bestehen — der Schaden, den Verbündete in dieser Zeit erleiden würden, verpufft. Danach bist du unconscious wie üblich."]}], "intro": []}, {"id": "schreinpriester", "name": "Schreinpriester", "kanji": "神主", "hd": 6, "saves": ["wis", "cha"], "skills": {"n": 2, "from": ["History", "Insight", "Medicine", "Nature", "Persuasion", "Religion"]}, "basics": {"Ressourcen": "Seelenrituale (Proficiency Bonus-mal pro Long Rest), Talismane (Bereitschaft), feste Schrein-Features.", "Primärattribut": "Weisheit.", "Hit Die": "1d6", "Saving Throws": "WIS, CHA", "Weapon Proficiencies": "Simple, Azusa-yumi", "Armor Proficiencies": "Light oder keine (deine Wahl)", "Skills": "2 aus: History, Insight, Medicine, Nature, Persuasion, Religion", "Tools": "Calligrapher's Supplies", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Forschen": "Automatische Proficiency auf beide Checks der Research-Handlung (Perception und Arcana, siehe Handwerk-und-Sammeln.docx, 1_Kampagne/), unabhängig von allen sonstigen Proficiencies — wer Siegel und Geisternamen liest, liest auch fremde Gegenstände."}, "start": [{"k": "Waffen", "v": "Ein Azusa-yumi (ritueller Bogen, siehe Waffen-der-Inseln.docx) — oder ein Bō und ein Tantō, wenn du lieber im Nahkampf ritualisierst."}, {"k": "Rüstung", "v": "Keine oder leichte Rüstung."}, {"k": "Zusätzlich", "v": "Talisman-Werkzeug (Papierstreifen, Tusche, Pinsel), Priestergewand deines Schreins."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Talisman-Handwerk & Bereitschaft; Bannsiegel-Grundlage; Seelenritual (1d4); Tier 1 verfügbar; Talisman-Wahl", "2": "—", "3": "Talisman-Wahl", "4": "Ability Score Improvement", "5": "Seelenritual (1d6); Tier 2 verfügbar; Talisman-Wahl", "6": "Geisterruf (festes Feature)", "7": "Talisman-Wahl", "8": "Ability Score Improvement", "9": "Seelenritual (2d4); Tier 3 verfügbar; Talisman-Wahl", "10": "Wanderschrein (festes Feature)", "11": "Talisman-Wahl", "12": "Ability Score Improvement", "13": "Seelenritual (2d6); Tier 4 verfügbar; Talisman-Wahl", "14": "Größere Geister (CR bis 5, zweimal pro Long Rest)", "15": "Talisman-Wahl", "16": "Ability Score Improvement", "17": "Seelenritual (4d4); Tier 5 verfügbar; Seelenbruch & Säule des Feuers (Kapstein-Rituale); Talisman-Wahl", "18": "Geisterschar (CR bis 9, zwei Geister gleichzeitig, 1 Stunde)", "19": "Ability Score Improvement; Talisman-Wahl", "20": "Reinigungstalisman-Herstellung & Schrein-Erweckung (feste Features)"}, "msnotes": ["Zusätzlich zu den Meilensteinen unten: auf jeder UNGERADEN Stufe eine Talisman-Wahl (neuen erlernen oder einen verbessern). ASI-Stufen sind 4, 8, 12, 16 und 19."], "rules": [{"h": "Die zwei Säulen", "body": ["Säule 1 — Rituale: Seine aktive Magie. Fest und automatisch mit dem Level skalierend. Umfasst die Seelenrituale und, als Kapstein, ein großes Feuerritual.", "Säule 2 — Talismane: Seine Objekte. Eine Pick-Liste, aus der er auf jeder ungeraden Stufe wählt — Siegel sind Objekte, keine Angriffe."]}, {"h": "Säule 1 — Rituale", "body": ["## Seelenrituale", "Der Priester zielt auf eine Kreatur, die er sehen kann, in 60 ft.; sie wirft einen WIS-Saving Throw (DC 8 + Proficiency Bonus + WIS). Bei Misserfolg voller Seelenschaden, bei Erfolg die Hälfte. Der Schaden ignoriert Armor Class, Hit Points und Resistenzen vollständig — er trifft die Seele direkt.", "Gegen Geisterwesen und Yokai: Sie bestehen aus Seelenstoff. Erreicht ihr Seelenpool 0, werden sie ausgelöscht oder gebannt. Der Priester ist damit der geistige Anti-Yokai-Spezialist — die Ergänzung zum physischen Yokai Hunter.", "Gegen Menschen: Auch sie haben Soul HP. Bei 0 sterben sie nicht — sie erhalten Kegare (Disadvantage auf alles) und brechen. Der Priester zerschlägt Willen, statt zu schlachten.", "Nutzungen: Proficiency Bonus-mal pro Long Rest.", "Sichtbare Wirkung: Zusätzlich zum Seelenschaden erleidet das Ziel Radiant Damage auf seine Hit Points in doppelter Höhe des gewürfelten Seelenschadens. Die Seele bricht, und der Leib zeichnet es mit.", "Der Seelenschaden ist am Seelenpool gemessen, nicht an Hit Points — kleine Würfel, weil der Pool klein ist:", "| Charakterstufe | Seelenschaden pro Ritual |", "| 1–4 | 1d4 |", "| 5–8 | 1d6 |", "| 9–12 | 2d4 |", "| 13–16 | 2d6 |", "| 17–20 | 4d4 |", "## Seelenbruch (Kapstein-Ritual, Stufe 17)", "Einmal pro Long Rest zwingt der Priester eine Kreatur, die er sehen kann, in 60 ft. zu einem WIS-Saving Throw. Bei Misserfolg fallen ihre Soul HP sofort auf 0 — bei einem Menschen ein garantierter Rout, bei einem Yokai eine Bannung.", "## Säule des Feuers (Kapstein-Ritual, Stufe 17)", "Der große Wurf, getrennt vom Seelensystem: eine Säule geweihter Flamme, 10d6 + WIS Radiant Damage gegen Hit Points (nicht Soul HP), WIS-Saving Throw für die Hälfte, einmal pro Long Rest."]}, {"h": "Säule 2 — Talismane", "body": ["## Die Wahl auf ungeraden Stufen", "Auf jeder ungeraden Stufe (1, 3, 5 … 19) trifft der Priester eine Wahl: einen neuen Talisman erlernen (Breite) oder die Herstellung eines bereits bekannten verbessern (Tiefe).", "Eigener Talisman: Statt einen der vorgefertigten Talismane zu wählen, darfst du bei einer Talisman-Wahl einen neuen Talisman erschaffen, den es noch nicht gibt. Der DM legt fest, wie schwer das ist (DC) und wie lange du brauchst, um den ersten zu entwickeln. Ein selbst erschaffener Talisman hat zunächst keinen festen Tier. Sobald du die erste Fassung hast, kannst du bei Long Rests versuchen, ihn auszubauen. Je weiter du ihn ausbaust, desto mehr Ränge bekommt er. Beispiel: Du erschaffst einen Talisman, der bei Nutzung 2d6 Cold Damage verursacht, und baust ihn weiter aus, bis der Nutzer damit Ray of Frost wirken kann — der Talisman hat dann Ränge. Wer direkt auf die Ray-of-Frost-Fassung zielt, braucht deutlich länger, als erst die 2d6-Fassung und darauf aufbauend die Ray-of-Frost-Fassung zu bauen.", "Bereitschaft: Er hat gleichzeitig eine Zahl aktiver Talismane bereit gleich WIS-Modifikator + halbem Level (abgerundet), mindestens 1, aufgefrischt beim Long Rest.", "Tausch: Beim Aufstieg darf er einen bekannten Talisman gegen einen anderen tauschen — keine toten Picks.", "Verbesserte Talismane: Können nur vom Spieler-Priester hergestellt werden. NPC-Priester bauen nur Basisversionen — deine Tier-5-Siegel sind einzigartig.", "Passive Talismane: Ein Talisman auf seiner höchsten (passiven) Stufe wirkt nur, wenn der Träger auf ihn eingestimmt ist. Über die drei Standard-Attunement-Slots reguliert sich, wie viele passive Siegel eine Person gleichzeitig trägt.", "## Die Verbesserungs-Leiter (Beispiel: Talisman of Warding)", "Stufe 1 (erlernt): Bei Nutzung erhält der nächste Angriff gegen den Träger Disadvantage.", "+1: Disadvantage für den ganzen Kampf.", "+1: Bis zur nächsten Short Rest.", "+1: Bis zur nächsten Long Rest.", "+1: Passiv, solange der Träger den Talisman im Inventar hat (Attunement nötig).", "## Alle Talismane", "Die vollständige Liste. Tier gibt an, ab welcher Stufe der Talisman wählbar ist; \"Leiter\" markiert die, die sich über mehrere Verbesserungen hochziehen lassen. Tier-Zuordnung ist ein Vorschlag und lässt sich anpassen.", "| Name | Tier | Fähigkeit | Leiter |", "| Bannsiegel | 1 | Ein Yokai in 30 ft. macht einen WIS-Saving Throw oder ist bis zum Ende deines nächsten Zuges stunned. | ja |", "| Spürsiegel | 1 | Spürt Richtung und ungefähre Entfernung aller Yokai und Corruption in 60 ft. für 10 Minuten. | nein |", "| Salz-Ofuda | 1 | 1 Ladung: Advantage auf den nächsten Corruption-Saving Throw des Trägers, dann zerstört. | nein |", "| Panzersiegel | 1 | Passiv: +1 auf die Armor Class des Trägers (Attunement). | nein |", "| Siegel des Geschicks | 1 | Passiv: Advantage auf Würfe einer bei Herstellung gewählten Fertigkeit (Attunement). | nein |", "| Genesungs-Ofuda | 1 | 1 Ladung: Action, heilt 2d4 + 2 Hit Points, dann zerstört. Ersatz für einen Heiltrank. | nein |", "| Talisman of Warding | 1 | Aktiviert: Disadvantage auf den nächsten Angriff gegen den Träger (Leiter bis dauerhaft-passiv). | ja |", "| Siegel der sicheren Hand | 2 | Aktiviert: Advantage auf den nächsten Attack Roll des Trägers (Leiter bis dauerhaft-passiv). | ja |", "| Seelenschutz-Siegel | 2 | Gewährt temporäre Soul HP (+2). Verhalten wie temporäre TP: zuerst verloren, kein Stapeln, verfallen bei Rast. | ja (+4/+6) |", "| Fesselsiegel | 2 | Ein Yokai in 30 ft. macht einen STR-Saving Throw oder ist restrained; Saving Throw am Ende jedes seiner Züge. | ja |", "| Stillesiegel | 2 | Unterdrückt die Spezialfähigkeit oder Aura eines Yokai für 1 Minute (WIS-Saving Throw). | nein |", "| Spiegelsiegel | 2 | Reaction: Wirft die Hälfte erlittenen Seelenschadens auf den Angreifer zurück. | nein |", "| Verbannungssiegel | 3 | Bannt einen Yokai für bis zu 1 Minute aus dem Kampf (Concentration, WIS-Saving Throw). | nein |", "| Wächter-Ofuda | 3 | Platziert bei einem Verbündeten; greift automatisch den ersten Feind an, der auf 5 ft. herankommt (Seelenschaden). | nein |", "| Feuersiegel | 3 | Platziert; wer das Feld überquert, erleidet verdorbenen Flammenschaden (Feuer/Necrotic). | ja |", "| Großes Schutzsiegel | 4 | Fläche: Verbündete im Umkreis erhalten +1 AC oder Advantage auf Saving Throws (bei Herstellung gewählt). | nein |", "| Seelensiegel | 4 | Platziert; jeder Geist oder Yokai, der es überquert, erleidet Seelenschaden. | ja |", "| Siegel des stillen Schreins | 5 | Unterdrückt Corruption in weitem Umkreis (wie das Ofuda, aber als Fläche) — kein Corruption-Tick darin. | nein |", "| Siegel der Stille | 5 | Auf einen Boss oder legendären Yokai gesetzt: Er verschwindet für eine Runde vollständig aus dem Kampf (kein Zug, keine Reactions, keine Legendary Actions) und kehrt am Ende deines nächsten Zuges zurück. | nein |", "| Große Barriere | 5 | Eine Wand aus Shimenawa und Ofuda, bis 60 ft. lang. Kein Yokai kann sie überschreiten, solange sie steht (TP wie ein Siegel). Yomi-Wesen, die es versuchen, erleiden Seelenschaden. | nein |", "| Berstendes Ofuda | 4 | Auf ein Siegel oder eine Barriere gelegt. Wird das Trägersiegel zerstört, explodiert es: 6d8 Radiant Damage in 20 ft. und alle Yokai darin erleiden Seelenschaden. | ja |"]}, {"h": "Feste Features", "body": ["Diese Signatur-Fähigkeiten werden garantiert vergeben, nicht gewählt", "## Geisterruf (Stufe 6)", "Namen sammeln: Vollzieht der Priester an einem nicht verdorbenen Schrein einen Riten von einer Stunde (mit Opfergabe), nennt ihm der dortige Geist seinen Namen. Er notiert ihn dauerhaft. Jeder Schrein gibt genau einen Geist, passend zu seinem Gott.", "Rufen: Als Action rufst du einen Geist, dessen Namen du kennst. Er erscheint in 30 ft., handelt auf deiner Initiative unter deiner Kontrolle und bleibt 10 Minuten oder bis er auf 0 Hit Points fällt. Einmal pro Long Rest.", "Grenze: Höchstens ein Geist gleichzeitig. Der Challenge Rating des Geistes darf höchstens 1 betragen.", "## Größere Geister (Stufe 14)", "Erweiterung: Der Challenge Rating gerufener Geister steigt auf höchstens 5. Du darfst zweimal pro Long Rest rufen.", "## Geisterschar (Stufe 18)", "Erweiterung: Der Challenge Rating steigt auf höchstens 9, und du darfst zwei Geister gleichzeitig gerufen haben. Die Dauer steigt auf 1 Stunde.", "## Beispiel-Geister nach Schrein", "Welcher Geist an einem Schrein wohnt, richtet sich nach seinem Gott:", "| Schrein | Geist | Rolle |", "| Hachiman (Krieg) | Kriegergeist | Nahkampf, hält die Linie, schützt Verbündete in 5 ft. |", "| Inari (Fuchs, Fülle) | Kitsune-Geist | Beweglich, Illusionen, Ablenkung, Fuchsfeuer |", "| Amaterasu (Sonne) | Miko-Geist | Heilung, Licht, entfernt Conditions von Verbündeten |", "| Jeder Schrein (Torwächter) | Komainu-Geist | Wächter, provoziert Gegner, hoher AC, schwer zu umgehen |", "| Bergschrein | Karasu-Tengu-Geist | Flug, Aufklärung, Fernkampf |", "| Suijin (Wasser) | Quellengeist | Löscht Feuer, reinigt Gelände, Advantage auf Corruption-Saving Throws im Umkreis |", "| Verlassener Schrein | Geist eines alten Priesters | Kennt Rituale und Ortsgeschichte, kann ein Siegel für dich setzen |", "## Wanderschrein (Stufe 10)", "Funktion: Ein temporärer Mini-Schrein als Safe-Zone. In verschmutzten Gebieten aufgestellt, verhindert er, dass ein Charakter während eines Long Rests von Corruption befallen wird, gibt Soul-HP-Regeneration bei einer Rast darin und Advantage auf Corruption-Saving Throws im Umkreis.", "Grenze: Er unterdrückt und schützt, aber entfernt bestehende Corruption NICHT. Volle Reinigung bleibt echten Schreinen und dem Reinigungstalisman vorbehalten.", "Kosten: Ein Satz Weihmaterial (Räucherwerk, Salz, Shimenawa) im Wert von ~50 Gold pro Errichtung, zehn Minuten Aufbau, hält bis zur nächsten Rast.", "## Reinigungstalisman-Herstellung (Stufe 20)", "Funktion: Der Priester kann Reinigungstalismane selbst herstellen — er wird zur Quelle und erspart der Gruppe die Suche nach einem fremden Meisterpriester.", "Kosten: Weiterhin die vollen 300–1000 Gold an Material, acht Stunden Ritualarbeit, und nur an einem intakten Schrein herstellbar.", "## Schrein-Erweckung (Stufe 20)", "Voraussetzung: Der Schrein muss frei von Yomi-Wesen sein — die Gruppe muss ihn erst zurückerobern.", "Ritual: Acht Stunden ununterbrochene Riten und Opfergaben im Wert von etwa 500 Goldstücken.", "Wirkung: Für 1d10 + 10 Tage gilt der Schrein in jeder Hinsicht als nicht verdorbener Schrein: Niemand erhält dort Corruption, Reinigung ist dort möglich, ein Kami-kagari kann dort seine Divinity Points auffüllen und Social Links steigern, und Geisternamen lassen sich dort sammeln.", "Danach: Läuft die Zeit ab, kriecht die Verderbnis zurück. Der Priester kann das Ritual vorher erneut vollziehen und die Frist neu setzen — zu den vollen Kosten."]}], "intro": []}, {"id": "kamikagari", "name": "Kami-kagari", "kanji": "神懸り", "hd": 10, "saves": ["con", "cha"], "skills": {"n": 2, "from": ["Athletics", "History", "Insight", "Performance", "Persuasion", "Religion"]}, "basics": {"Ressourcen": "Divinity Points (nur am Schrein auffüllbar), Social Links je Gott, Soul HP als Notventil.", "Primärattribut": "Charisma (Kraft, mit der er die Götter an sich bindet). Anpassbar.", "Hit Die": "1d10", "Saving Throws": "CON, CHA", "Weapon Proficiencies": "Simple, Martial", "Armor Proficiencies": "Medium, Shields", "Skills": "2 aus: Athletics, History, Insight, Performance, Persuasion, Religion", "Tools": "Keine", "Soul HP": "Wie alle Charaktere: 2 + Level + Summe aller sechs Ability Modifier, Minimum 1.", "Divinity Points": "Sein Ressourcenpool, gleich seinem Level. Füllt sich NICHT beim Long Rest, sondern nur an einem Schrein. Notventil: Über den Pool hinaus zahlt er Anrufungen direkt mit Soul HP — die kehren normal beim Long Rest zurück, aber der Preis ist echt, weil er in derselben Ressource blutet, die ihn im Kampf am Leben hält."}, "start": [{"k": "Waffen", "v": "Ein Yari oder ein Katana, deine Wahl, dazu ein Tantō."}, {"k": "Rüstung", "v": "Mittlere Rüstung und ein Schild."}, {"k": "Zusätzlich", "v": "Ein geschnitzter Talisman deines ersten Gottes."}, {"k": "Gemeinsame Ausrüstung", "v": "Ein Rucksack, eine Schlafrolle, ein Wasserschlauch, 50 ft. Seil, ein Zunderkasten, Rationen für 5 Tage, und Kleidung passend zu deinem Clan. Zusätzlich 10 Goldstücke."}], "milestones": {"1": "Erster Gott: ein Domänen-Kami; Social Link: max. Rang 1; Divinity Points: 1", "2": "Divinity Points: 2", "3": "Divinity Points: 3", "4": "Social Link: max. Rang 2; Divinity Points: 4", "5": "Neuer Gott: eines der drei edlen Kinder; Divinity Points: 5", "6": "Social Link: max. Rang 3; Divinity Points: 6", "7": "Divinity Points: 7", "8": "Social Link: max. Rang 4; Divinity Points: 8", "9": "Divinity Points: 9", "10": "Neuer Gott: ein Urgott oder Großer der Schwelle; Social Link: max. Rang 5; Divinity Points: 10", "11": "Divinity Points: 11", "12": "Social Link: max. Rang 6; Divinity Points: 12", "13": "Divinity Points: 13", "14": "Social Link: max. Rang 7; Divinity Points: 14", "15": "Neuer Gott: schöpfungsnah; Divinity Points: 15", "16": "Social Link: max. Rang 8; Divinity Points: 16", "17": "Divinity Points: 17", "18": "Social Link: max. Rang 9; Divinity Points: 18", "19": "Divinity Points: 19", "20": "Neuer Gott: die Eltern (Izanagi oder Izanami); Social Link: max. Rang 10; Divinity Points: 20"}, "msnotes": ["Abgeleitet aus „Götter anhäufen“ und der Rang-Tabelle unter „Social Links“; Divinity Points = Level."], "rules": [{"h": "Götter anhäufen", "body": ["Auf bestimmten Stufen gewinnt der Kami-kagari einen neuen Gott — jedes Mal aus einer höheren Machtstufe. Er ersetzt seine bisherigen nicht, er sammelt sie.", "| Stufe | Machtstufe | Beispiele |", "| 1 | Domänen-Kami | Hachiman (Krieg), Raijin (Blitz), Fūjin (Wind), Suijin (Wasser), Inari (Fülle) |", "| 5 | Die drei edlen Kinder | Amaterasu (Sonne), Tsukuyomi (Mond), Susanoo (Sturm) |", "| 10 | Urgötter (Kotoamatsukami) und Große der Schwelle | Ame-no-Minakanushi u. a. — die ersten Kami · Kukurihime (die Vermittlerin, die am Rand von Yomi zwischen Izanagi und Izanami sprach) · Ōkamuzumi (der Pfirsich-Gott, der die Yomotsu-shikome vertrieb und beauftragt ist, allen in Not beizustehen) |", "| 15 | Schöpfungsnah | Chigaeshi-no-Ōkami (der vergöttlichte Fels, der die Tür zu Yomi versperrt — das Siegel selbst) · Kagutsuchi (der Feuergott, dessen Geburt Izanami tötete — die Ursache von allem) |", "| 20 | Die Eltern | Izanagi ODER Izanami |", "## Kanalisieren", "Der Kami-kagari legt die Kraft EINES Gottes zur Zeit an (Wechsel als Bonus Action). Nur das Kit des kanalisierten Gottes ist aktiv — mit einer Ausnahme:", "Die erste passive Fähigkeit jedes Gottes ist permanent und wirkt auch, wenn ein anderer Gott kanalisiert wird. Alle übrigen Ränge wirken nur, während dieser Gott kanalisiert ist."]}, {"h": "Social Links", "body": ["Jeder Gott hat einen Social Link (Rang 1–10). Je höher der Rang, desto mehr des göttlichen Kits ist freigeschaltet. Ränge lassen sich NUR an einem nicht-corrupteden Schrein steigern, und dabei höchstens 2× insgesamt pro Aufenthalt (frei auf Götter aufteilbar).", "Das Level deckelt den erreichbaren Höchstrang:", "| Kami-kagari-Stufe | Max. Rang |", "| 1–3 | 1 |", "| 4–5 | 2 |", "| 6–7 | 3 |", "| 8–9 | 4 |", "| 10–11 | 5 |", "| 12–13 | 6 |", "| 14–15 | 7 |", "| 16–17 | 8 |", "| 18–19 | 9 |", "| 20 | 10 |"]}, {"h": "Tabus", "body": ["Jeder Gott stellt eine Regel. Bricht der Kami-kagari das Tabu eines Gottes, sinkt oder friert dessen Social Link — der beleidigte Gott zieht seine Gunst zurück, bis der Kami-kagari sich an einem Schrein rehabilitiert."]}, {"h": "Vorlage-Gott: Hachiman", "body": ["Tabu: Das Verschonen von Feinden.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Kampfrausch: Der Kami-kagari erhält 3 Angriffe in seinem nächsten Zug. |", "| 2 | passiv (permanent) | Advantage auf Angriffe, wenn 4 oder mehr Gegner in einem 10-ft-Radius um ihn stehen. — Dies ist die permanente erste Passive. |", "| 3 | — | Kampfrausch (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Beschwört Hachimans Klinge (1 Minute): gilt als magisch und verursacht +1d10 Radiant Damage. |", "| 5 | 1 DP | Markiere einen Gegner: Er zählt als 4 Gegner, solange er sich in 10 ft. vom Kami-kagari befindet. |", "| 6 | 1 DP | Beschwört Hachimans Arm, der ein Ziel in 60 ft. angreift: 4d6 Schaden. Der Kami-kagari erleidet 1d4 Rückstoßschaden. |", "| 7 | 2 DP | Schwertsturm: ein Angriff gegen jeden Gegner in 10 ft. |", "| 8 | passiv | Blutzoll: Bringt der Kami-kagari einen Gegner auf 0 TP, erhält er 1 Divinity Point zurück (1×/Runde, nur im Kampf, nie über das Maximum). |", "| 9 | 3 DP | Rüstung des Kriegsgottes (1 Minute): temporäre Hit Points, Resistenz gegen nichtmagischen Schaden, seine Angriffe gelten als magisch. |", "| 10 | alle DP | Beschwört Hachiman für X Runden auf das Schlachtfeld, wobei X = Anzahl der ausgegebenen Divinity Points. |", "## Rang 10 — Beschworener Hachiman (kompakt)", "Handelt als verbündete Kreatur auf der Initiative des Kami-kagari und verschwindet nach X Runden. Grobe Werte, bei Bedarf als voller Statblock ausbaubar:", "AC 18 · TP 90 · Bewegung 40 ft.", "Multiattack zwei Naginata-Hiebe, +9 auf den Angriff, je 2d10 + 5 Radiant Damage.", "Kriegsherr Verbündete in 10 ft. erhalten +1d4 auf Attack Rolls."]}, {"h": "Domänen-Kami: Raijin (Blitz)", "body": ["Tabu: Zögern — eine Runde verstreichen lassen, ohne anzugreifen (Bereithalten, Ausweichen, Nichtstun).", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Blitzschlag: Dein nächster Angriff verursacht +2d8 Lightning Damage; das Ziel kann bis zu deinem nächsten Zug keine Reactions nutzen. |", "| 2 | passiv (permanent) | Sturmschritt: +10 ft. Bewegung; du wirst durch Difficult Terrain nicht verlangsamt. — Permanente erste Passive. |", "| 3 | — | Blitzschlag (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Raijins Trommeln (1 Min.): Immer wenn du triffst, schlägt ein Donner für 1d6 Schaden auf einen weiteren Gegner in 10 ft. des Ziels. |", "| 5 | 1 DP | Kettenblitz: Ein Blitz springt vom Ziel auf bis zu 2 weitere Gegner in 15 ft. — je 2d8 Lightning Damage (DEX-Saving Throw halbiert). |", "| 6 | 1 DP | Donnerfaust: 4d6 Schaden, Ziel wird 10 ft. zurückgeschleudert und fällt (STR-Saving Throw). Du bist bis zu deinem nächsten Zug taub. |", "| 7 | 2 DP | Gewitter: Blitzeinschlag auf jeden Gegner in 20-ft-Radius, 3d8 Lightning Damage (DEX-Saving Throw halbiert). |", "| 8 | passiv | Aufgeladen (Reaction): Wird dir Schaden zugefügt, teleportierst du dich blitzschnell bis zu 15 ft. weit (1×/Runde). |", "| 9 | 3 DP | Blitzgestalt (1 Min.): Resistenz gegen alle Schadenstypen außer Kraft, Teleport bis 30 ft. als Bonus Action, Angriffe +1d8 Blitz. |", "| 10 | alle DP | Raijins Zorn (X Runden, X = ausgegebene DP): Zu Beginn jedes deiner Züge schlägt ein Blitz auf einen sichtbaren Gegner (5d8 Blitz, DEX-Saving Throw halbiert). |"]}, {"h": "Domänen-Kami: Fūjin (Wind)", "body": ["Tabu: Stillstand — der Kami-kagari darf nicht zwei Runden in Folge auf demselben Fleck bleiben; er muss sich jede Runde bewegen.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Windstoß: Dein nächster Angriff stößt das Ziel bis 15 ft. zurück (STR-Saving Throw); danach bewegst du dich 10 ft. ohne Opportunity Attacks. |", "| 2 | passiv (permanent) | Federleicht: Du löst keine Opportunity Attacks aus; Falling Damage halbiert. — Permanente erste Passive. |", "| 3 | — | Windstoß (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Fūjins Sichel (1 Min.): Reichweite deiner Melee Attacke +5 ft., +1d8 Bludgeoning Damage. |", "| 5 | 1 DP | Wirbelwind: Alle Gegner in 15 ft. machen einen STR-Saving Throw oder werden 10 ft. weggeschleudert und fallen. |", "| 6 | 1 DP | Orkanstoß: 30-ft-Kegel, 4d6 Bludgeoning Damage, Gegner werden zurückgestoßen (STR-Saving Throw halbiert, kein Stoß bei Erfolg). |", "| 7 | 2 DP | Sturmwand (1 Min.): Eine bis 60 ft. lange Windwand blockiert Fernangriffe; wer hindurch will, erleidet 2d8 Schaden. |", "| 8 | passiv | Rückenwind: Du und Verbündete in 10 ft. habt +10 ft. Bewegung und Advantage auf DEX-Saving Throws. |", "| 9 | 3 DP | Windgestalt (1 Min.): Flugrate 60 ft., Angriffe gegen dich haben Disadvantage, du ziehst durch Kreaturenräume. |", "| 10 | alle DP | Der große Sturm (X Runden, X = DP): Zu Beginn jedes deiner Züge werden alle Gegner in 30 ft. 15 ft. weit bewegt (deine Wahl) und erleiden 3d8 Bludgeoning Damage (STR-Saving Throw halbiert). |"]}, {"h": "Domänen-Kami: Suijin (Wasser)", "body": ["Tabu: Er darf keinen Verbündeten sterben lassen, den er hätte retten können.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Wasserklinge: Dein nächster Angriff macht +2d8 Bludgeoning Damage (Wasserdruck) und ignoriert Deckung. |", "| 2 | passiv (permanent) | Fließen: Du atmest unter Wasser, bewegst dich ungehindert durch Wasser, Resistenz gegen Feuer. — Permanente erste Passive. |", "| 3 | — | Wasserklinge (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Heilende Quelle (1 Min.): Erschaffe eine Quelle (10-ft-Radius); Verbündete, die darin ihren Zug beginnen, heilen 1d8 TP. |", "| 5 | 1 DP | Flutwelle: 30-ft-Linie, 2d8 Schaden; Gegner machen STR-Saving Throw oder fallen und werden 10 ft. weggespült. |", "| 6 | 1 DP | Ertränken: 4d6 Schaden; das Ziel kann bis zum Ende seines nächsten Zuges nicht atmen oder sprechen (CON-Saving Throw). |", "| 7 | 2 DP | Reinigende Flut: Verbündete in 20 ft. heilen 2d8 TP und erhalten Advantage auf ihren nächsten Corruption-Saving Throw (entfernt keine Corruption). |", "| 8 | passiv | Anpassung: Zu Beginn deines Zuges wählst du einen Schadenstyp; dagegen bist du bis zu deinem nächsten Zug resistent. |", "| 9 | 3 DP | Wassergestalt (1 Min.): Angriffe gegen dich haben Disadvantage, du fließt durch Spalten und Kreaturenräume, immun gegen Grappled und Fesseln. |", "| 10 | alle DP | Der große Strom (X Runden, X = DP): Das Gelände wird für Gegner zu schwierigem Wasser; zu Beginn jedes deiner Züge heilen Verbündete in 30 ft. 2d8 und Gegner erleiden 3d8 Wasserschaden. |"]}, {"h": "Domänen-Kami: Inari (Fuchs & Fülle)", "body": ["Tabu: Undankbarkeit — eine empfangene Gabe oder Hilfe nicht zu erwidern.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Fuchsfeuer: Dein nächster Angriff macht +2d8 Fire Damage; das Ziel hat Disadvantage auf seinen nächsten Angriff (Trugfeuer blendet). |", "| 2 | passiv (permanent) | Fuchsglück: Einmal pro Runde darfst du einen deiner Würfe (Angriff, Saving Throw, Fertigkeit) neu würfeln. — Permanente erste Passive. |", "| 3 | — | Fuchsfeuer (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Kitsune-Maske (1 Min.): Ein Trugbild deiner selbst; Angriffe gegen dich treffen zu 50% das Duplikat, das halbe Melee Attacke machen kann. |", "| 5 | 1 DP | Trugbild: Ein Gegner macht einen WIS-Saving Throw oder greift in seinem nächsten Zug einen Verbündeten seiner Wahl an. |", "| 6 | 1 DP | Neunschwänziger Schlag: Neun Fuchsfeuer-Stöße treffen ein Ziel in 60 ft., 4d6 Fire Damage. |", "| 7 | 2 DP | Feld der Täuschung (1 Min.): 20-ft-Illusionsnebel; Gegner darin gelten als blinded (WIS-Saving Throw je Zug), Verbündete sehen normal. |", "| 8 | passiv | Fuchslist: Advantage auf Deception und Persuasion; einmal pro Kampf darfst du einen gegnerischen Attack Roll gegen dich neu würfeln lassen. |", "| 9 | 3 DP | Kitsune-Gestalt (1 Min.): +20 ft. Bewegung, als Bonus Action invisible (bis du angreifst), Angriffe +1d8 Fuchsfeuer. |", "| 10 | alle DP | Inaris tausend Füchse (X Runden, X = DP): Zu Beginn jedes deiner Züge stürmt ein Geisterfuchs-Rudel einen Gegner (4d6 Feuer); Angriffe gegen dich haben Disadvantage (Illusion vieler Orte). |"]}, {"h": "Edles Kind: Amaterasu", "body": ["Erwerb: Ab Stufe 5 (die drei edlen Kinder).", "Tabu: Aus dem Verborgenen angreifen — sie ist das Licht. Ihr Diener trifft niemanden, der ihn nicht kommen sieht.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Das Auge des Vaters: Für den Rest des Kampfes siehst du jeden Gegner, auch außerhalb deiner Sichtlinie, und bist immun gegen hinterhältige Angriffe (Sneak Attacks). |", "| 2 | passiv (permanent) | Vergeltendes Licht: Bestehst du einen Saving Throw gegen den Angriff eines Gegners, erleidet dieser 1d6 Radiant Damage. — Permanente erste Passive. |", "| 3 | — | Das Auge des Vaters (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Amaterasus Weber: Aus deinen Fingern wachsen Fäden, die auf Befehl so scharf werden wie eine Katana-Schneide. Für den Rest des Kampfes: Als Action greifst du eine Kreatur in 30 ft. (DEX-Saving Throw gegen deinen DC); sie erleidet zu Beginn jedes ihrer Züge 1d10 Schaden, solange sie festgehalten wird. Du kannst höchstens drei Kreaturen gleichzeitig halten. Du kannst die Fäden auch als Falle auslegen: Wer sie nicht mit einem Perceptionswurf gegen DC 15 bemerkt, kann für den Rest der Runde keine Handlung ausführen, die Bewegung erfordert. |", "| 5 | 1 DP | Amaterasus Kinder: Für jedes Pfund Perlen und jedes Pfund Reis, das du bei dir trägst (je höchstens 10 Pfund), verursachst du einem Gegner X Radiant Damage — X ist die Summe beider Gewichte. Die Waren werden nicht verbraucht. |", "| 6 | 3 DP | Licht gegen die Finsternis: Für den Rest des Kampfes können Verbündete keine neue Corruption erhalten. Wer sie bereits trägt, verliert durch sie für die nächsten zwei Züge keine Soul HP. Corruption wird unterdrückt, nicht entfernt. |", "| 7 | 4 DP | Streit mit Susanoo: Aus Fäden, Reis und Perlen erschaffst du ein Simulacrum deiner selbst mit 1 Trefferpunkt und 3 Divinity Points. Es handelt auf deiner Initiative unter deiner Kontrolle und kann alle Amaterasu-Fähigkeiten nutzen, die dir offenstehen — muss deren Kosten aber aus seinen eigenen 3 Punkten zahlen. Es verschwindet am Ende des Kampfes. |", "| 8 | passiv | Reiche Ernte: Das Höchstgewicht in Rang 5 steigt um je 10 Pfund (auf je 20). |", "| 9 | passiv | Unentrinnbare Fäden: Den Fäden aus Rang 4 kann nicht mehr ausgewichen werden — Griff und Falle wirken automatisch. |", "| 10 | alle DP | Amaterasus Rückzug: Du verschwindest für 2 Züge vollständig aus dem Kampf, wie sie sich in der Felsenhöhle verbarg. Danach kehrst du mit 0 Soul HP zurück und darfst für X Züge (X = ausgegebene Divinity Points) je X-mal alle Fähigkeiten außer Amaterasus Rückzug einsetzen, ohne Divinity Points zu zahlen. |"]}, {"h": "Edles Kind: Tsukuyomi", "body": ["Erwerb: Ab Stufe 5 (die drei edlen Kinder).", "Tabu: Ein gefälltes Urteil zurücknehmen — wen er einmal verurteilt hat, darf er nicht rehabilitieren.", "## Die Mondphasen", "Jede Fähigkeit Tsukuyomis richtet sich nach der Mondphase. Drei Conditions:", "Vollmond: voller Wert.", "Halbmond (zu- oder abnehmend): etwa die Hälfte.", "Neumond: keine Wirkung — bis Rang 9 und 10 das ändern.", "Tracking: 30-Tage-Zyklus mit 3 Nächten Vollmond, 3 Nächten Neumond, der Rest Halbmond. Die Phase zählt immer, auch tagsüber und unter der Erde — der Mond steht so oder so am Himmel; sonst wäre Tsukuyomi in jedem Dungeon wirkungslos.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Kaltes Mondlicht: Dein nächster Angriff verursacht zusätzlich Cold Damage. Vollmond 4d6 · Halbmond 2d6 · Neumond keine Wirkung. |", "| 2 | passiv (permanent) | Der Zähler der Monde: Du kennst Datum, Stunde und Mondphase stets genau und sagst Gezeiten und Finsternisse voraus. Vollmond +5 auf Initiative und Advantage auf Perception · Halbmond +2 auf Initiative · Neumond keine Wirkung. — Permanente erste Passive. |", "| 3 | — | Kaltes Mondlicht (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Die Gezeiten: Der Mond zieht. Alle Gegner in 30 ft. machen einen STR-Saving Throw und werden zu dir gezogen oder von dir weggeschoben (deine Wahl). Vollmond 20 ft., bei Misserfolg zusätzlich prone · Halbmond 10 ft. · Neumond keine Wirkung. |", "| 5 | 2 DP | Der Mord an Uke Mochi: Ein Ziel macht einen CON-Saving Throw. Bei Misserfolg kann es keine Hit Points zurückgewinnen, und Heilung, die es anderen gibt, ist halbiert. Vollmond 1 Minute und sofort 4d8 Necrotic Damage · Halbmond 3 Runden und 2d8 · Neumond keine Wirkung. |", "| 6 | 2 DP | Mantel des Mondlichts: 1 Minute lang hüllt dich Mondlicht ein. Vollmond: Angriffe gegen dich haben Disadvantage, und du hast Resistenz gegen Frost- und Necrotic Damage · Halbmond: der erste Angriff gegen dich in jeder Runde hat Disadvantage · Neumond keine Wirkung. |", "| 7 | 3 DP | Mondfinsternis: 30-ft-Radius, CON-Saving Throw halbiert. Vollmond 6d8 Cold Damage, bei Misserfolg zusätzlich blinded bis zum Ende des nächsten Zuges · Halbmond 3d8 Cold Damage · Neumond keine Wirkung. |", "| 8 | passiv | Der Verstoßene: Solange sich kein Verbündeter in 30 ft. von dir befindet, wächst die Kraft des Verbannten. Vollmond +4 auf Angriffs- und Damage Rolls · Halbmond +2 · Neumond keine Wirkung. |", "| 9 | passiv | Ewiger Vollmond: Du stehst immer unter dem Vollmond, unabhängig von der wirklichen Phase. |", "| 10 | passiv | Herr der drei Phasen: Als Bonus Action wählst du, unter welcher Phase du stehst. Alle drei geben nun einen vollen Buff, und der Schadenstyp aller deiner Tsukuyomi-Fähigkeiten wechselt mit — Vollmond: Radiant, und deine Fähigkeiten enthüllen verborgene und invisiblee Kreaturen in ihrem Wirkungsbereich · Halbmond: Frost, und getroffene Ziele haben bis zum Ende ihres nächsten Zuges halbierte Speed · Neumond: Necrotic, und du gewinnst Hit Points in Höhe der Hälfte des verursachten Schadens zurück. |"]}, {"h": "Edles Kind: Susanoo", "body": ["Erwerb: Ab Stufe 5 (die drei edlen Kinder).", "Tabu: Sich einem Befehl fügen, den er nicht selbst gewählt hat.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Der Anfang der Böen: Susanoos Macht durchdringt deinen nächsten Angriff. Das Ziel erleidet zusätzlich 1d8 Windschaden; alle Gegner in einem 30-ft-Kegel hinter dem Ziel erleiden denselben Schaden. |", "| 2 | passiv (permanent) | Führung der Winde: Die Winde weisen dir den Weg. Weißt du nicht, wie es weitergeht, weht ein Wind in eine Richtung. Boote, auf denen du fährst, segeln deutlich schneller. — Permanente erste Passive. |", "| 3 | — | Der Anfang der Böen (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Susanoos Unfug: Solange du dich konzentrierst (bis zu 1 Minute), sind alle Gegner in 30 ft. stunned. Am Ende jedes seiner Züge darf ein Betroffener einen STR-Saving Throw machen, um sich aus dem Sturm loszureißen. |", "| 5 | 2 DP | Acht Fässer Sake: Wie Susanoo Orochi überlistete statt überwältigte. Alle Gegner in 30 ft. machen einen CON-Saving Throw oder sind 1 Minute lang poisoned. Ein poisoneder Gegner hat Disadvantage auf den STR-Saving Throw gegen Susanoos Unfug. |", "| 6 | 2 DP | Kusanagi: Beschwöre für 1 Minute das Schwert aus Orochis Schweif. Es gilt als magisch, verursacht +1d10 Schaden, und deine Angriffe damit ignorieren Deckung — der Grasmäher schneidet, was zwischen dir und dem Ziel steht. |", "| 7 | 3 DP | Der Sturm vertreibt die Seuche: Ein reinigender Sturm in 30 ft. Radius für 1 Minute. Verbündete darin können keine neue Corruption erhalten, und bestehende Corruption tickt nicht. Sie wird unterdrückt, nicht entfernt. |", "| 8 | 4 DP | Amoklauf im Himmel: Susanoos Zerstörungswut bricht los. Drei Runden lang tobt ein Sturm in 60 ft. Radius um dich. Zu Beginn jedes deiner Züge erleidet jedes Wesen darin — auch Verbündete — 3d8 Windschaden (DEX-Saving Throw halbiert). Das Gelände wird verwüstet und gilt danach als schwierig. |", "| 9 | passiv | Herr der Stürme: Du bist immun gegen Windeffekte und erhältst eine Flugbewegungsrate von 60 ft. — der Sturm trägt dich. Deine Windschadens-Fähigkeiten ignorieren Resistenz gegen Bludgeoning Damage. |", "| 10 | alle DP | Yamata-no-Orochi: Beschwöre die achtköpfige Schlange, die Susanoo erschlug, für X Runden als deinen Diener (X = ausgegebene Divinity Points). Was er bezwang, gehorcht dir. |", "## Rang 10 — Beschworener Yamata-no-Orochi (kompakt)", "Handelt als verbündete Kreatur auf deiner Initiative und verschwindet nach X Runden. Grobe Werte, bei Bedarf als voller Statblock ausbaubar:", "AC 16 · TP 150 · Bewegung 40 ft. · Riesig", "Acht Häupter Acht Bisse pro Runde, +8 auf den Angriff, je 1d10 + 4 Piercing Damage. Jeder Kopf kann ein anderes Ziel wählen.", "Vielköpfig Advantage auf Saving Throws gegen Charmed, Frightened, Stunned und Bewusstlos."]}, {"h": "Urgott: Ame-no-Minakanushi (Der Jester)", "body": ["Erwerb: Ab Stufe 10 (Urgötter-Machtstufe).", "Tabu: Absichtliche Unwissenheit — sich bewusst gegen eine Wahrheit zu verschließen.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Das Mysterium: Ein kurzer Blick auf den Lauf der Zeit, das Wachsen des Universums, den Zufall, die Musik, die Evolution und alles Wissen. Du musst dafür auf deinen Angriff verzichten — sonst wirkt es nicht. Bis zu deinem nächsten Zug weichst du jedem Angriff gegen dich automatisch aus. |", "| 2 | passiv (permanent) | Der Blick in die Domäne: Du darfst dem DM Fragen stellen. Die Antworten sind das, was dein Charakter in Ame-no-Minakanushis Domäne erfahren hat — nicht jede davon muss wahr sein. — Permanente erste Passive. |", "| 3 | — | Das Mysterium (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Domäne der Musik: Du spielst. Für 1 Minute erhalten alle Verbündeten Inspiration und +1d10 auf ihre Attack Rolls. |", "| 5 | 4 DP | Domäne des Zufalls: Du änderst einen Würfelwurf auf sein Maximum. |", "| 6 | alle DP | Domäne der Evolution: Erhöhe für den Kampf die Stufe eines Verbündeten temporär auf 20 — Hit Points wie auf Stufe 20, Proficiency Bonus +6, verbrauchte Ressourcen füllen sich auf Stufe-20-Niveau. Er erlernt keine neuen Fähigkeiten und kann keine neuen Götter erlangen. |", "| 7 | alle DP | Domäne des Wissens: Stelle dem DM eine Frage, die er wahrheitsgemäß beantworten muss. Sie darf nichts mit den Charakteren der Gruppe zu tun haben. Nur ein einziges Mal in der gesamten Kampagne einsetzbar. |", "| 8 | 5 DP | Domäne der Zeit: Wie der Zauber Time Stop — die Zeit steht still, du handelst 1d4 + 1 Runden lang allein. |", "| 9 | alle DP | Domäne des Universums: Du ziehst die Macht eines Sterns herab. Ein Ziel in bis zu 120 ft. erleidet 12d10 Radiant Damage. |", "| 10 | passiv | Der Jester: Du behältst alle Fähigkeiten Ame-no-Minakanushis und wählst zusätzlich einen weiteren Gott aus der Stufe der Domänen-Kami. Du darfst diesen zweiten Gott gleichzeitig neben Ame-no-Minakanushi kanalisieren. |"]}, {"h": "Urgott: Kukurihime", "body": ["Erwerb: Ab Stufe 10 (Urgötter-Machtstufe).", "Tabu: Eine Seite verurteilen, ohne beide gehört zu haben.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Die Liebeswächterin: Als Brücke zwischen den Elterngöttern hält sie deren Liebe am Leben. Erschaffe für 1 Minute ein magisches Feld in 60 ft. Radius: Jede Kreatur, die darin einen Angriff ausführt, erleidet 1d6 Psychic Damage — und einmal pro Runde zusätzlich 1d6 Soul-HP-Verlust. Das Feld trifft Freund wie Feind, dich eingeschlossen. |", "| 2 | passiv (permanent) | Botin der Liebe: Alle Verbündeten in 30 ft. heilen zu Beginn jeder Runde 1d4 Hit Points. — Permanente erste Passive. |", "| 3 | — | Die Liebeswächterin (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Band der Gefährten: Binde zwei willige Kreaturen in 30 ft. für 1 Minute aneinander. Schaden, den eine von beiden erleidet, wird zu gleichen Teilen auf beide verteilt. |", "| 5 | 2 DP | Fessel des Zorns: Binde einen Gegner an dich (WIS-Saving Throw). Für 1 Minute kann er sich nicht weiter als 10 ft. von dir entfernen; versucht er es, endet seine Bewegung. |", "| 6 | 2 DP | Geteiltes Leid: Als Reaction, wenn ein Verbündeter in 30 ft. Schaden erleiden würde, bindest du die Wunde an dich — du nimmst den Schaden statt seiner. Bei einem Condition statt Schaden: Du übernimmst den Zustand. |", "| 7 | 3 DP | Seelenband: Binde deine Soul HP für 1 Minute mit denen eines Verbündeten. Ihr teilt euch einen gemeinsamen Pool aus beiden Vorräten; Verluste treffen zuerst den größeren Anteil. Corruption, die einen von euch befällt, tickt nur einmal für beide. |", "| 8 | 4 DP | Bindung des Streits: Zwei Kreaturen deiner Wahl in 60 ft. machen je einen WIS-Saving Throw. Wer scheitert, kann für 1 Minute die jeweils andere nicht angreifen und keine Fähigkeit gegen sie richten. Sie ist erst frei, wenn eine von beiden anderweitig Schaden von der anderen erleidet. |", "| 9 | passiv | Die Bindende: Deine Bindungen brechen nicht mehr von selbst. Alle deine aktiven Bindungen (Ränge 4, 5, 7, 8) halten, bis du sie löst, du unconscious wirst oder das Ziel stirbt — statt bis zum Ablauf ihrer Dauer. |", "| 10 | alle DP | Das unbekannte Wort: Du sprichst die Worte, die den Streit der Elterngötter beendeten — die Worte, die niemand aufgeschrieben hat. Der DM entscheidet, was sie in diesem Augenblick bewirken. Sie beenden immer einen Konflikt; auf welche Weise, steht nicht fest. |"]}, {"h": "Urgott: Ōkamuzumi", "body": ["Erwerb: Ab Stufe 10 (Urgötter-Machtstufe).", "Tabu: Einem Hilfsbedürftigen die Hilfe verweigern — und ein Wesen niederstrecken, das den Corruption-Debuff trägt, ihn aber nicht als Waffe einsetzt. Opfer sind zu retten, nicht zu erschlagen.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Eid der Jägerin: Dein nächster Angriff verursacht +1d6 Schaden. Gegen einen Corruption Hunter verdoppelt sich dieser Bonus (+2d6). |", "| 2 | passiv (permanent) | Jagdinstinkt: Du spürst, wenn sich ein Corruption Hunter in 60 ft. Umkreis befindet. — Permanente erste Passive. |", "| 3 | — | Eid der Jägerin (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Die Jagd hat begonnen: Markiere einen Corruption Hunter für 1 Minute. Deine Angriffe gegen ihn haben Advantage und verursachen +4d4 Schaden. |", "| 5 | 3 DP | Kein Entkommen: Betäube einen Corruption Hunter in bis zu 120 ft. — auch in der Luft. Stürzt er dabei ab, erleidet er Falling Damage. Einmal pro Kreatur und Kampf. |", "| 6 | 2 DP | Schrecken des Jägers: Alle Corruption Hunter in 60 ft. erstarren vor der Frucht, die sie einst vertrieb — sie sind bis zum Ende deines nächsten Zuges stunned. |", "| 7 | passiv | Lohn der Jagd: Immer wenn du einen Corruption Hunter tötest, erhältst du 1 Divinity Point zurück. |", "| 8 | passiv | Beute aller Art: Einmal pro Kampf darfst du bei einer Fähigkeit Ōkamuzumis „Corruption Hunter\" durch „jeder nichtmenschliche Gegner\" ersetzen. Diese eine Anwendung wirkt dann gegen dieses Ziel wie gegen einen Corruption Hunter. |", "| 9 | passiv | Flug der Jägerin: Dir wachsen Flügel. Du erhältst eine Flugbewegungsrate von 120 ft. |", "| 10 | alle DP | Strafe: Jedes Wesen, das du sehen kannst und das absichtlich Corruption einsetzt, erleidet XW6 Radiant Damage (X = ausgegebene Divinity Points). Dieser Schaden kann einen Sleeper Agent nicht treffen. |"]}, {"h": "Schöpfungsnah: Chigaeshi-no-Ōkami", "body": ["Erwerb: Ab Stufe 15 (schöpfungsnahe Machtstufe).", "Tabu: Fliehen oder eine Schwelle preisgeben, die er zu halten geschworen hat.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Göttlicher Wall: Alle Gegner in 100 ft. machen einen WIS-Saving Throw oder müssen dich bis zu deinem nächsten Zug angreifen. Deine AC steigt bis dahin um 4. |", "| 2 | passiv (permanent) | Der unbewegliche Geist: Du bist immun gegen Grappled und kannst nicht zu Boden geworfen werden. — Permanente erste Passive. |", "| 3 | — | Göttlicher Wall (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | passiv | Heiliges Symbol: Für jeden Social-Link-Rang, den du über alle Götter hinweg besitzt, +1 maximale Hit Points. Für jeden Talisman, auf den du eingestimmt bist, +1 maximale Soul HP. |", "| 5 | 2 DP | Der gefallene Wall: Hast du im letzten Zug Schaden erlitten, füge dem Verursacher Schaden in Höhe des erlittenen Schadens zu. |", "| 6 | passiv | Gescheiterter Gott: Immer wenn du den Corruption-Debuff erhältst, erhältst du einen gefallenen Divinity Point. |", "| 7 | 1 gef. DP | Quelle der Tragödie: Du verlierst 3d6 Hit Points. Alle Verbündeten in 100 ft. erhalten Inspiration für den Rest des Kampfes, verlieren aber 1d10 Soul HP. |", "| 8 | 2 gef. DP | Abstieg in den Wahnsinn: Deine Hit Points fallen auf 1. Du führst 7 Angriffe aus. Danach bist du 3 Runden lang stunned. |", "| 9 | 1 DP + 1 gef. DP | Annahme: Chigaeshi lernt, sein Versagen anzunehmen. Verbanne einen Gegner nach Yomi, dem Land der Toten. Das Ziel darf einen CON-Saving Throw gegen DC 18 machen; Bosse und legendäre Wesen haben dabei Advantage. |", "| 10 | alle DP + alle gef. DP | Das Große Siegel: Versiegle ein beliebiges Wesen dauerhaft — auch Izanami selbst, ohne Saving Throw. Dein Charakter WIRD das Siegel: Er scheidet endgültig aus dem Spiel aus, kann nicht wiederbelebt werden und existiert fort als die Tür, die geschlossen bleibt. |"]}, {"h": "Schöpfungsnah: Kagutsuchi", "body": ["Erwerb: Ab Stufe 15 (schöpfungsnahe Machtstufe).", "Tabu: Vergebung — er darf niemandem vergeben, der ihm oder seinen Verbündeten Unrecht getan hat.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Flammen des Schicksals: 3d6 Fire Damage an allen Gegnern in 30 ft. (DEX-Saving Throw halbiert). |", "| 2 | passiv (permanent) | Helle Flamme: Du kannst nach Belieben Licht ausstrahlen und siehst 60 ft. weit in völliger Dunkelheit. — Permanente erste Passive. |", "| 3 | — | Flammen des Schicksals (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Flammen des Todes: Entzünde ein Wesen in bis zu 120 ft.: 6d6 Fire Damage, das Ziel macht einen DEX-Saving Throw oder stürzt vor Schmerz zu Boden (prone). |", "| 5 | passiv | Entehrter Sohn: Du erhältst zusätzlich gefallene Divinity Points — in derselben Höhe wie deine normalen. Du führst beide Pools gleichzeitig, und diese gefallenen Punkte verderben dich NICHT. |", "| 6 | 3 DP + 3 gef. DP | Hass: Kagutsuchis Trauer und Zorn entladen sich. 10d6 Schaden an JEDEM Wesen in 60 ft. — auch Verbündeten (DEX-Saving Throw halbiert). Du selbst erleidest 10d4. |", "| 7 | 6 DP + 6 gef. DP | Versagen: Der Zwiespalt in Kagutsuchis Herz erfasst dich — Zorn auf den Vater, Trauer über die eigene Schuld. Du wirst ein feuerelementarartiges Wesen; deine Hit Points und Soul HP verschmelzen zu einem Pool. Immun gegen Feuer, Resistenz gegen nichtmagischen Schaden, deine Angriffe verursachen zusätzlich Fire Damage. Die Form endet, wenn der Pool 0 erreicht oder der Kampf endet. Danach werden deine Soul HP auf 0 gesetzt. |", "| 8 | 5 DP + 10 gef. DP | Flamme des Muts: Der Mut, der Kagutsuchi im Kampf gegen seinen Vater durchströmte, erfüllt dich. Für den Rest des Kampfes kannst du nicht frightened werden, und deine Angriffe verursachen zusätzlich 3d6 Fire Damage. Jeder Angriff kostet dich 2 Soul HP; kannst du sie nicht zahlen, wird der Schaden des Angriffs stattdessen um 2d10 reduziert. |", "| 9 | passiv | Sturz: Einmal pro Runde darfst du eine Fähigkeit Kagutsuchis einsetzen, ohne ihre Kosten zu zahlen. Dafür sinken deine maximalen Soul HP dauerhaft auf 10, solange Kagutsuchi kanalisiert ist. |", "| 10 | passiv | Genesis: Wie Kagutsuchis Tod neues Leben schuf, gibt er dir eine zweite Chance. Stirbst du zum ersten Mal im Kampf, wirst du sofort mit vollen Hit Points und vollen Soul HP wiederbelebt. Dies lädt sich erst wieder auf, wenn du einen Schrein besuchst. |"]}, {"h": "Heller Gott: Izanagi", "body": ["Erwerb: Nur auf Stufe 20, anstelle von Izanami.", "Tabu: Verfall verbreiten — eine Leiche berühren oder Corruption auf andere übertragen. Die Verderbnis im eigenen Leib zu verbrennen ist erlaubt; sie weiterzugeben nicht.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 DP | Klinge der Schöpfung: Dein nächster Angriff verursacht +4d8 Schaden. |", "| 2 | passiv (permanent) | Izanagis Segen: Advantage auf Saving Throws gegen Corruption und +2 AC. Gegen Izanamis sonst garantierte Corruption (Aura/Nähe) darfst du einen CON-Saving Throw gegen DC 18 machen — gegen Izanami selbst DC 20+. — Permanente erste Passive. |", "| 3 | — | Klinge der Schöpfung (Rang 1) kostet keinen Divinity Point mehr. |", "| 4 | 2 DP | Izanagis Schnitt: Entferne den Corruption-Debuff von dir und beliebig vielen Verbündeten in Reichweite. Du verlierst dabei 2d10 Soul HP. |", "| 5 | passiv | Domäne der Schöpfung: Wann immer geschmiedet wird oder Talismane hergestellt werden, 50% Chance auf die doppelte Menge. |", "| 6 | 2 DP | Schwur der Schöpfung: Versetze dich und einen Gegner in eine Domäne aus Izanagis Überfluss. Sie endet, wenn einer von euch besiegt ist. Du hast Advantage auf alle Würfe darin. Mächtige Gegner (legendär) dürfen einen WIS-Saving Throw machen, um nicht mitgezogen zu werden. |", "| 7 | 3 DP | Izanagis Zorn: Kanalisiere die Corruption in dir in deine Klinge — Verfall und Schöpfung vermischt. Dein nächster Angriff macht zusätzlich XW4 + XW6 Schaden, X = fehlende Soul HP (höchstens dein Proficiency Bonus). Nach dem Angriff bist du stunned. |", "| 8 | 3 DP | Magatsu Mandala: Ein Mandala aus Licht entfaltet sich. Alle Gegner in 20 ft. erleiden 4d8 Force Damage (ignoriert Resistenzen) und machen einen WIS-Saving Throw oder sind bis zum Ende ihres nächsten Zuges frightened. |", "| 9 | passiv | Izanagis Entschlossenheit: Gegen Yokai hast du +3 AC und verursachst +1d10 zusätzlichen Schaden bei jedem Angriff. |", "| 10 | alle DP | Myriad Truths: Eine Welle der Wahrheit; alle Gegner in 60 ft. erleiden XW6 Force Damage (X = ausgegebene DP, ignoriert Resistenzen) und verlieren alle Buffs und temporären Boni. Zusätzlich permanent: Du kannst die Fähigkeiten aller Götter nutzen, mit denen du Social-Link-Rang 10 erreicht hast — deren DP-Kosten zahlst du weiterhin. Und: In der Runde, in der du Myriad Truths einsetzt, sowie in der darauffolgenden, wirken Izanamis Illusionen nicht — kein Nebel, keine Trugbilder, keine Prüfung des Blicks. Ihr Mann ist der Einzige, der sie je wirklich gesehen hat. |"]}, {"h": "Dunkler Gott: Izanami", "body": ["Erwerb: Nur auf Stufe 20, anstelle von Izanagi.", "Social Link: Steigt NUR an verdorbenen Orten (Umkehrung aller anderen Götter).", "Gefallene Divinity Points: Wird Izanami kanalisiert, ersetzen gefallene Divinity Points die normalen. Sie füllen sich an jedem verdorbenen Ort wieder auf, nicht am Schrein. Jede Nutzung gefallener Divinity Points macht den Kami-kagari selbst corrupted.", "Tabu: Reinigung — ihr Diener darf keine Corruption entfernen und keinen sauberen Schrein ehren.", "| Rang | Kosten | Fähigkeit |", "| 1 | 1 gef. DP | Klinge der Korruption: Dein nächster Angriff verursacht zusätzlich 3d6 Seelenschaden und 3d6 Schaden. |", "| 2 | passiv (permanent) | Kind der Toten: Immun gegen Corruption aus verdorbenen Orten und deren Aura. — Dies ist die permanente erste Passive. |", "| 3 | — | Klinge der Korruption (Rang 1) kostet keinen gefallenen Divinity Point mehr. |", "| 4 | 2 gef. DP | Korruptionsschild (ganzer Kampf): +5 AC. Gegner, die ihren Zug in 10 ft. beginnen, machen einen CON-Saving Throw oder werden von Corruption befallen. |", "| 5 | 1 gef. DP | Todesmarke: Ein Ziel macht einen CON-Saving Throw (wie gegen Corruption) oder wird von Corruption befallen und ist bis zum Ende deines nächsten Zuges stunned. Stirbt das markierte Ziel, erntest du seine Seele. |", "| 6 | 2 gef. DP + 1 Seele | Beschwöre das Wesen, dessen Seele verbraucht wurde, als Diener für den Kampf. |", "| 7 | 2 gef. DP + Seelen | Verbrauche Seelen (höchstens so viele wie dein Soci
