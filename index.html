urn within 5 feet of the sphere makes a Dexterity saving throw, taking 2d6 Fire damage on a failed save or half as much damage on a successful one.\n  As a Bonus Action, you can move the sphere up to 30 feet, rolling it along the ground. If you move the sphere into a creature's space, that creature makes the save against the sphere, and the sphere stops moving for the turn.\n  When you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. Flammable objects that aren't being worn or carried start burning if touched by the sphere, and it sheds Bright Light in a 20-foot radius and Dim Light for an additional 20 feet.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 2.", ["Druid", "Sorcerer", "Wizard"]], ["Gentle Repose", 2, "Necromancy", "Action", "Touch", "10 days", "V, S, M (2 Copper Pieces, which the spell consumes)", "", "", "", "You touch a corpse or other remains. For the duration, the target is protected from decay and can't become Undead.\n  The spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don't count against the time limit of spells such as Raise Dead.", ["Cleric", "Paladin", "Wizard"]], ["Gust of Wind", 2, "Evocation", "Action", "Self", "up to 1 minute (Concentration)", "V, S, M (a legume seed)", "", "", "", "A Line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the duration. Each creature in the Line must succeed on a Strength saving throw or be pushed 15 feet away from you in a direction following the Line. A creature that ends its turn in the Line must make the same save.\n  Any creature in the Line must spend 2 feet of movement for every 1 foot it moves when moving closer to you.\n  The gust disperses gas or vapor, and it extinguishes candles and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them.\n  As a Bonus Action on your later turns, you can change the direction in which the Line blasts from you.", ["Druid", "Ranger", "Sorcerer", "Wizard"]], ["Heat Metal", 2, "Transmutation", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S, M (a piece of iron and a flame)", "2d8", "Fire", "", " Choose a manufactured metal object, such as a metal weapon or a suit of Heavy or Medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 Fire damage when you cast the spell. Until the spell ends, you can take a Bonus Action on each of your later turns to deal this damage again if the object is within range.\n  If a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a Constitution saving throw or drop the object if it can. If it doesn't drop the object, it has Disadvantage on attack rolls and ability checks until the start of your next turn.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 2.", ["Bard", "Druid"]], ["Hold Person", 2, "Enchantment", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S, M (a straight piece of iron)", "", "", "", "Choose a Humanoid that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.\n\nHöherer Grad: You can target one additional Humanoid for each spell slot level above 2.", ["Bard", "Cleric", "Druid", "Sorcerer", "Warlock", "Wizard"]], ["Invisibility", 2, "Illusion", "Action", "Touch", "up to 1 hour (Concentration)", "V, S, M (an eyelash in gum arabic)", "", "", "", "A creature you touch has the Invisible condition until the spell ends. The spell ends early immediately after the target makes an attack roll, deals damage, or casts a spell.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 2.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Knock", 2, "Transmutation", "Action", "60 feet", "Instantaneous", "V", "", "", "", " Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access.\n  A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked.\n  If the target is held shut by Arcane Lock, that spell is suppressed for 10 minutes, during which time the target can be opened and closed.\n  When you cast the spell, a loud knock, audible up to 300 feet away, emanates from the target.", ["Bard", "Sorcerer", "Wizard"]], ["Lesser Restoration", 2, "Abjuration", "Bonus Action", "Touch", "Instantaneous", "V, S", "", "", "", "You touch a creature and end one condition on it: Blinded, Deafened, Paralyzed, or Poisoned.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger"]], ["Levitate", 2, "Transmutation", "Action", "60 feet", "up to 10 minutes (Concentration)", "V, S, M (a metal spring)", "", "", "", "One creature or loose object of your choice that you can see within range rises vertically up to 20 feet and remains suspended there for the duration. The spell can levitate an object that weighs up to 500 pounds. An unwilling creature that succeeds on a Constitution saving throw is unaffected.\n  The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target's altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can take a Magic action to move the target, which must remain within the spell's range.\n  When the spell ends, the target floats gently to the ground if it is still aloft.", ["Sorcerer", "Wizard"]], ["Locate Animals or Plants", 2, "Divination", "Action", "Self", "Instantaneous", "V, S, M (fur from a bloodhound)", "", "", "", "Describe or name a specific kind of Beast, Plant creature, or nonmagical plant. You learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present.", ["Bard", "Druid", "Ranger"]], ["Locate Object", 2, "Divination", "Action", "Self", "up to 10 minutes (Concentration)", "V, S, M (a forked twig)", "", "", "", "Describe or name an object that is familiar to you. You sense the direction to the object's location if that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement.\n  The spell can locate a specific object known to you if you have seen it up close-within 30 feet-at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon.\n  This spell can't locate an object if any thickness of lead blocks a direct path between you and the object.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger", "Wizard"]], ["Magic Mouth", 2, "Illusion", "1 minute", "30 feet", "Until dispelled", "V, S, M (jade dust worth 10+ GP, which the spell consumes)", "", "", "", "You implant a message within an object in range-a message that is uttered when a trigger condition is met. Choose an object that you can see and that isn't being worn or carried by another creature. Then speak the message, which must be 25 words or fewer, though it can be delivered over as long as 10 minutes. Finally, determine the circumstance that will trigger the spell to deliver your message.\n  When that trigger occurs, a magical mouth appears on the object and recites the message in your voice and at the same volume you spoke. If the object you chose has a mouth or something that looks like a mouth (for example, the mouth of a statue), the magical mouth appears there, so the words appear to come from the object's mouth. When you cast this spell, you can have the spell end after it delivers its message, or it can remain and repeat its message whenever the trigger occurs.\n  The trigger can be as general or as detailed as you like, though it must be based on visual or audible conditions that occur within 30 feet of the object. For example, you could instruct the mouth to speak when any creature moves within 30 feet of the object or when a silver bell rings within 30 feet of it.", ["Bard", "Wizard"]], ["Magic Weapon", 2, "Transmutation", "Bonus Action", "Touch", "1 hour", "V, S", "", "", "", "You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls. The spell ends early if you cast it again.\n\nHöherer Grad: The bonus increases to +2 with a level 3-5 spell slot. The bonus increases to +3 with a level 6+ spell slot.", ["Paladin", "Ranger", "Sorcerer", "Wizard"]], ["Mind Spike", 2, "Divination", "Action", "120 feet", "up to 1 hour (Concentration)", "S", "3d8", "Psychic", "", "You drive a spike of psionic energy into the mind of one creature you can see within range. The target makes a Wisdom saving throw, taking 3d8 Psychic damage on a failed save or half as much damage on a successful one. On a failed save, you also always know the target's location until the spell ends, but only while the two of you are on the same plane of existence. While you have this knowledge, the target can't become hidden from you, and if it has the Invisible condition, it gains no benefit from that condition against you.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 2.", ["Sorcerer", "Warlock", "Wizard"]], ["Mirror Image", 2, "Illusion", "Action", "Self", "1 minute", "V, S", "", "", "", "Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real.\n  Each time a creature hits you with an attack roll during the spell's duration, roll a d6 for each of your remaining duplicates. If any of the d6s rolls a 3 or higher, one of the duplicates is hit instead of you, and the duplicate is destroyed. The duplicates otherwise ignore all other damage and effects. The spell ends when all three duplicates are destroyed. A creature is unaffected by this spell if it has the Blinded condition, Blindsight, or Truesight.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Misty Step", 2, "Conjuration", "Bonus Action", "Self", "Instantaneous", "V", "", "", "", " Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see.", ["Sorcerer", "Warlock", "Wizard"]], ["Moonbeam", 2, "Evocation", "Action", "120 feet", "up to 1 minute (Concentration)", "V, S, M (a moonseed leaf)", "2d10", "Radiant", "", " A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet.\n  When the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the Polymorph spell, for example), it reverts to its true form and can't shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.\n\nHöherer Grad: The damage increases by 1d10 for each spell slot level above 2.", ["Druid"]], ["Pass without Trace", 2, "Abjuration", "Action", "Self", "up to 1 hour (Concentration)", "V, S, M (ashes from burned mistletoe)", "", "", "", "You radiate a concealing aura in a 30-foot Emanation for the duration. While in the aura, you and each creature you choose have a +10 bonus to Dexterity (Stealth) checks and leave no tracks.", ["Druid", "Ranger"]], ["Phantasmal Force", 2, "Illusion", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S, M (a bit of fleece)", "2d8", "Psychic", "", "You attempt to craft an illusion in the mind of a creature you can see within range. The target makes an Intelligence saving throw. On a failed save, you create a phantasmal object, creature, or other phenomenon that is no larger than a 10-foot Cube and that is perceivable only to the target for the duration. The phantasm includes sound, temperature, and other stimuli.\n  The target can take a Study action to examine the phantasm with an Intelligence (Investigation) check against your spell save DC. If the check succeeds, the target realizes that the phantasm is an illusion, and the spell ends.\n  While affected by the spell, the target treats the phantasm as if it were real and rationalizes any illogical outcomes from interacting with it. For example, if the target steps through a phantasmal bridge and survives the fall, it believes the bridge exists and something else caused it to fall.\n  An affected target can even take damage from the illusion if the phantasm represents a dangerous creature or hazard. On each of your turns, such a phantasm can deal 2d8 Psychic damage to the target if it is in the phantasm's area or within 5 feet of the phantasm. The target perceives the damage as a type appropriate to the illusion.", ["Bard", "Sorcerer", "Wizard"]], ["Prayer of Healing", 2, "Abjuration", "10 minutes", "30 feet", "Instantaneous", "V", "", "", "", "Up to five creatures of your choice who remain within range for the spell's entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can't be affected by this spell again until that creature finishes a Long Rest.   Using a Higher-Level Spell Slot. The healing increases by 1d8 for each spell slot level above 2.", ["Cleric", "Paladin"]], ["Protection from Poison", 2, "Abjuration", "Action", "Touch", "1 hour", "V, S", "", "", "", "You touch a creature and end the Poisoned condition on it. For the duration, the target has Advantage on saving throws to avoid or end the Poisoned condition, and it has Resistance to Poison damage.", ["Cleric", "Druid", "Paladin", "Ranger"]], ["Ray of Enfeeblement", 2, "Necromancy", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "A beam of enervating energy shoots from you toward a creature within range. The target must make a Constitution saving throw. On a successful save, the target has Disadvantage on the next attack roll it makes until the start of your next turn.\n  On a failed save, the target has Disadvantage on Strength-based D20 Tests for the duration. During that time, it also subtracts 1d8 from all its damage rolls. The target repeats the save at the end of each of its turns, ending the spell on a success.", ["Warlock", "Wizard"]], ["Rope Trick", 2, "Transmutation", "Action", "Touch", "1 hour", "V, S, M (a segment of rope)", "", "", "", " You touch a rope. One end of it hovers upward until the rope hangs perpendicular to the ground or the rope reaches a ceiling. At the rope's upper end, an Invisible 3-foot-by-5-foot portal opens to an extradimensional space that lasts until the spell ends. That space can be reached by climbing the rope, which can be pulled into or dropped out of it.\n  The space can hold up to eight Medium or smaller creatures. Attacks, spells, and other effects can't pass into or out of the space, but creatures inside it can see through the portal. Anything inside the space drops out when the spell ends.", ["Wizard"]], ["Scorching Ray", 2, "Evocation", "Action", "120 feet", "Instantaneous", "V, S", "2d6", "Fire", "ranged", "You hurl three fiery rays. You can hurl them at one target within range or at several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 Fire damage.\n\nHöherer Grad: You create one additional ray for each spell slot level above 2.", ["Sorcerer", "Wizard"]], ["See Invisibility", 2, "Divination", "Action", "Self", "1 hour", "V, S, M (a pinch of talc)", "", "", "", "For the duration, you see creatures and objects that have the Invisible condition as if they were visible, and you can see into the Ethereal Plane. Creatures and objects there appear ghostly.", ["Bard", "Sorcerer", "Wizard"]], ["Shatter", 2, "Evocation", "Action", "60 feet", "Instantaneous", "V, S, M (a chip of mica)", "3d8", "Thunder", "", "A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save.\n  A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 2.", ["Bard", "Sorcerer", "Wizard"]], ["Shining Smite", 2, "Transmutation", "Bonus Action, which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike", "Self", "up to 1 minute (Concentration)", "V", "2d6", "Radiant", "", "The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can't benefit from the Invisible condition.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 2.", ["Paladin"]], ["Silence", 2, "Illusion", "Action", "120 feet", "up to 10 minutes (Concentration)", "V, S", "", "", "", "For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.", ["Bard", "Cleric", "Ranger"]], ["Spider Climb", 2, "Transmutation", "Action", "Touch", "up to 1 hour (Concentration)", "V, S, M (a drop of bitumen and a spider)", "", "", "", "Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and along ceilings, while leaving its hands free. The target also gains a Climb Speed equal to its Speed.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 2.", ["Sorcerer", "Warlock", "Wizard"]], ["Spike Growth", 2, "Transmutation", "Action", "150 feet", "up to 10 minutes (Concentration)", "V, S, M (seven thorns)", "2d4", "Piercing", "", "The ground in a 20-foot-radius Sphere centered on a point within range sprouts hard spikes and thorns. The area becomes Difficult Terrain for the duration. When a creature moves into or within the area, it takes 2d4 Piercing damage for every 5 feet it travels.\n  The transformation of the ground is camouflaged to look natural. Any creature that can't see the area when the spell is cast must take a Search action and succeed on a Wisdom (Perception or Survival) check against your spell save DC to recognize the terrain as hazardous before entering it.", ["Druid", "Ranger"]], ["Spiritual Weapon", 2, "Evocation", "Bonus Action", "60 feet", "up to 1 minute (Concentration)", "V, S", "", "", "melee", "You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. The force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier.\n  As a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it.\n\nHöherer Grad: The damage increases by 1d8 for every slot level above 2.", ["Cleric"]], ["Suggestion", 2, "Enchantment", "Action", "30 feet", "up to 8 hours (Concentration)", "V, M (a drop of honey)", "", "", "", "You suggest a course of activity-described in no more than 25 words-to one creature you can see within range that can hear and understand you. The suggestion must sound achievable and not involve anything that would obviously deal damage to the target or its allies. For example, you could say, \"Fetch the key to the cult's treasure vault, and give the key to me.\" Or you could say, \"Stop fighting, leave this library peacefully, and don't return.\"\n  The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration or until you or your allies deal damage to the target. The Charmed target pursues the suggestion to the best of its ability. The suggested activity can continue for the entire duration, but if the suggested activity can be completed in a shorter time, the spell ends for the target upon completing it.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Warding Bond", 2, "Abjuration", "Action", "Touch", "1 hour", "V, S, M (a pair of platinum rings worth 50+ GP each, which you and the target must wear for the duration)", "", "", "", "You touch another creature that is willing and create a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has Resistance to all damage. Also, each time it takes damage, you take the same amount of damage.\n  The spell ends if you drop to 0 Hit Points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures.", ["Cleric", "Paladin"]], ["Web", 2, "Conjuration", "Action", "60 feet", "up to 1 hour (Concentration)", "V, S, M (a bit of spiderweb)", "2d4", "Fire", "", "You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured.\n  If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet.\n  The first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free.\n  A creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained.\n  The webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.", ["Sorcerer", "Wizard"]], ["Zone of Truth", 2, "Enchantment", "Action", "60 feet", "10 minutes", "V, S", "", "", "", "You create a magical zone that guards against deception in a 15-foot-radius Sphere centered on a point within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there makes a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether a creature succeeds or fails on this save.\n  An affected creature is aware of the spell and can avoid answering questions to which it would normally respond with a lie. Such a creature can be evasive yet must be truthful.", ["Bard", "Cleric", "Paladin"]], ["Animate Dead", 3, "Necromancy", "1 minute", "10 feet", "Instantaneous", "V, S, M (a drop of blood, a piece of flesh, and a pinch of bone dust)", "", "", "", "Choose a pile of bones or a corpse of a Medium or Small Humanoid within range. The target becomes an Undead creature: a Skeleton if you chose bones or a Zombie if you chose a corpse (see \"Monsters.\" for the stat blocks).\n  On each of your turns, you can take a Bonus Action to mentally command any creature you made with this spell if the creature is within 60 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). You decide what action the creature will take and where it will move on its next turn, or you can issue a general command, such as to guard a chamber or corridor. If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. Once given an order, the creature continues to follow it until its task is complete.\n  The creature is under your control for 24 hours, after which it stops obeying any command you've given it. To maintain control of the creature for another 24 hours, you must cast this spell on the creature again before the current 24-hour period ends. This use of the spell reasserts your control over up to four creatures you have animated with this spell rather than animating a new creature.\n\nHöherer Grad: You animate or reassert control over two additional Undead creatures for each spell slot level above 3. Each of the creatures must come from a different corpse or pile of bones.", ["Cleric", "Wizard"]], ["Beacon of Hope", 3, "Abjuration", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "Choose any number of creatures within range. For the duration, each target has Advantage on Wisdom saving throws and Death Saving Throws and regains the maximum number of Hit Points possible from any healing.", ["Cleric"]], ["Bestow Curse", 3, "Necromancy", "Action", "Touch", "up to 1 minute (Concentration)", "V, S", "1d8", "Necrotic", "", "You touch a creature, which must succeed on a Wisdom saving throw or become cursed for the duration. Until the curse ends, the target suffers one of the following effects of your choice: • Choose one ability. The target has Disadvantage on ability checks and saving throws made with that ability. • The target has Disadvantage on attack rolls against you. • In combat, the target must succeed on a Wisdom saving throw at the start of each of its turns or be forced to take the Dodge action on that turn. • If you deal damage to the target with an attack roll or a spell, the target takes an extra 1d8 Necrotic damage.\n\nHöherer Grad: If you cast this spell using a level 4 spell slot, you can maintain Concentration on it for up to 10 minutes. If you use a level 5+ spell slot, the spell doesn't require Concentration, and the duration becomes 8 hours (level 5-6 slot) or 24 hours (level 7-8 slot). If you use a level 9 spell slot, the spell lasts until dispelled.", ["Bard", "Cleric", "Wizard"]], ["Blink", 3, "Transmutation", "Action", "Self", "1 minute", "V, S", "", "", "", "Roll 1d6 at the end of each of your turns for the duration. On a roll of 4-6, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell ends instantly if you are already on that plane). While on the Ethereal Plane, you can perceive the plane you left, which is cast in shades of gray, but you can't see anything there more than 60 feet away. You can affect and be affected only by other creatures on the Ethereal Plane, and creatures on the other plane can't perceive you unless they have a special ability that lets them perceive things on the Ethereal Plane.\n  You return to the other plane at the start of your next turn and when the spell ends if you are on the Ethereal Plane. You return to an unoccupied space of your choice that you can see within 10 feet of the space you left. If no unoccupied space is available within that range, you appear in the nearest unoccupied space.", ["Sorcerer", "Wizard"]], ["Call Lightning", 3, "Conjuration", "Action", "120 feet", "up to 10 minutes (Concentration)", "V, S", "3d10", "Lightning", "", "A storm cloud appears at a point within range that you can see above yourself. It takes the shape of a Cylinder that is 10 feet tall with a 60-foot radius.\n  When you cast the spell, choose a point you can see under the cloud. A lightning bolt shoots from the cloud to that point. Each creature within 5 feet of that point makes a Dexterity saving throw, taking 3d10 Lightning damage on a failed save or half as much damage on a successful one.\n   Until the spell ends, you can take a Magic action to call down lightning in that way again, targeting the same point or a different one.\n  If you're outdoors in a storm when you cast this spell, the spell gives you control over that storm instead of creating a new one. Under such conditions, the spell's damage increases by 1d10.\n\nHöherer Grad: The damage increases by 1d10 for each spell slot level above 3.", ["Druid"]], ["Clairvoyance", 3, "Divination", "10 minutes", "1 mile", "up to 10 minutes (Concentration)", "V, S, M (a focus worth 100+ GP, either a jeweled horn for hearing or a glass eye for seeing)", "", "", "", "You create an Invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The intangible, invulnerable sensor remains in place for the duration.\n  When you cast the spell, choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As a Bonus Action, you can switch between seeing and hearing.\n  A creature that sees the sensor (such as a creature benefiting from See Invisibility or Truesight) sees a luminous orb about the size of your fist.", ["Bard", "Cleric", "Sorcerer", "Wizard"]], ["Conjure Animals", 3, "Conjuration", "Action", "60 feet", "up to 10 minutes (Concentration)", "V, S", "3d10", "Slashing", "", "You conjure nature spirits that appear as a Large pack of spectral, intangible animals in an unoccupied space you can see within range. The pack lasts for the duration, and you choose the spirits' animal form, such as wolves, serpents, or birds.\n  You have Advantage on Strength saving throws while you're within 5 feet of the pack, and when you move on your turn, you can also move the pack up to 30 feet to an unoccupied space you can see.\n  Whenever the pack moves within 10 feet of a creature you can see and whenever a creature you can see enters a space within 10 feet of the pack or ends its turn there, you can force that creature to make a Dexterity saving throw. On a failed save, the creature takes 3d10 Slashing damage. A creature makes this save only once per turn.\n\nHöherer Grad: The damage increases by 1d10 for each spell slot level above 3.", ["Druid", "Ranger"]], ["Counterspell", 3, "Abjuration", "Reaction, which you take when you see a creature within 60 feet of yourself casting a spell with Verbal, Somatic, or Material components", "60 feet", "Instantaneous", "S", "", "", "", "You attempt to interrupt a creature in the process of casting a spell. The creature makes a Constitution saving throw. On a failed save, the spell dissipates with no effect, and the action, Bonus Action, or Reaction used to cast it is wasted. If that spell was cast with a spell slot, the slot isn't expended.", ["Sorcerer", "Warlock", "Wizard"]], ["Create Food and Water", 3, "Conjuration", "Action", "30 feet", "Instantaneous", "V, S", "", "", "", "You create 45 pounds of food and 30 gallons of fresh water on the ground or in containers within range-both useful in fending off the hazards of malnutrition and dehydration. The food is bland but nourishing and looks like a food of your choice, and the water is clean. The food spoils after 24 hours if uneaten.", ["Cleric", "Paladin"]], ["Daylight", 3, "Evocation", "Action", "60 feet", "1 hour", "V, S", "", "", "", "For the duration, sunlight spreads from a point within range and fills a 60-foot-radius Sphere. The sunlight's area is Bright Light and sheds Dim Light for an additional 60 feet.\n  Alternatively, you cast the spell on an object that isn't being worn or carried, causing the sunlight to fill a 60-foot Emanation originating from that object. Covering that object with something opaque, such as a bowl or helm, blocks the sunlight.\n  If any of this spell's area overlaps with an area of Darkness created by a spell of level 3 or lower, that other spell is dispelled.", ["Cleric", "Druid", "Paladin", "Ranger", "Sorcerer"]], ["Dispel Magic", 3, "Abjuration", "Action", "120 feet", "Instantaneous", "V, S", "", "", "", "Choose one creature, object, or magical effect within range. Any ongoing spell of level 3 or lower on the target ends. For each ongoing spell of level 4 or higher on the target, make an ability check using your spellcasting ability (DC 10 plus that spell's level). On a successful check, the spell ends.\n\nHöherer Grad: You automatically end a spell on the target if the spell's level is equal to or less than the level of the spell slot you use.", ["Bard", "Cleric", "Druid", "Paladin", "Ranger", "Sorcerer", "Warlock", "Wizard"]], ["Fear", 3, "Illusion", "Action", "Self", "up to 1 minute (Concentration)", "V, S, M (a white feather)", "", "", "", "Each creature in a 30-foot Cone must succeed on a Wisdom saving throw or drop whatever it is holding and have the Frightened condition for the duration.\n  A Frightened creature takes the Dash action and moves away from you by the safest route on each of its turns unless there is nowhere to move. If the creature ends its turn in a space where it doesn't have line of sight to you, the creature makes a Wisdom saving throw. On a successful save, the spell ends on that creature.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Fireball", 3, "Evocation", "Action", "150 feet", "Instantaneous", "V, S, M (a ball of bat guano and sulfur)", "8d6", "Fire", "", "A bright streak flashes from you to a point you choose within range and then blossoms with a low roar into a fiery explosion. Each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw, taking 8d6 Fire damage on a failed save or half as much damage on a successful one.\n  Flammable objects in the area that aren't being worn or carried start burning.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 3.", ["Sorcerer", "Wizard"]], ["Fly", 3, "Transmutation", "Action", "Touch", "up to 10 minutes (Concentration)", "V, S, M (a feather)", "", "", "", " You touch a willing creature. For the duration, the target gains a Fly Speed of 60 feet and can hover. When the spell ends, the target falls if it is still aloft unless it can stop the fall.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 3.", ["Sorcerer", "Warlock", "Wizard"]], ["Gaseous Form", 3, "Transmutation", "Action", "Touch", "up to 1 hour (Concentration)", "V, S, M (a bit of gauze)", "", "", "", "A willing creature you touch shape-shifts, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends on the target if it drops to 0 Hit Points or if it takes a Magic action to end the spell on itself.\n  While in this form, the target's only method of movement is a Fly Speed of 10 feet, and it can hover. The target can enter and occupy the space of another creature. The target has Resistance to Bludgeoning, Piercing, and Slashing damage; it has Immunity to the Prone condition; and it has Advantage on Strength, Dexterity, and Constitution saving throws. The target can pass through narrow openings, but it treats liquids as though they were solid surfaces.\n  The target can't talk or manipulate objects, and any objects it was carrying or holding can't be dropped, used, or otherwise interacted with. Finally, the target can't attack or cast spells.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 3.", ["Sorcerer", "Warlock", "Wizard"]], ["Glyph of Warding", 3, "Abjuration", "1 hour", "Touch", "Until dispelled or triggered", "V, S, M (powdered diamond worth 200+ GP, which the spell consumes)", "", "", "", "You inscribe a glyph that later unleashes a magical effect. You inscribe it either on a surface (such as a table or a section of floor) or within an object that can be closed (such as a book or chest) to conceal the glyph. The glyph can cover an area no larger than 10 feet in diameter. If the surface or object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered.\n  The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice.\n  When you inscribe the glyph, you set its trigger and choose whether it's an explosive rune or a spell glyph, as explained below.\n  Set the Trigger. You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. Once a glyph is triggered, this spell ends.\n  You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password.\n  Explosive Rune. When triggered, the glyph erupts with magical energy in a 20-foot-radius Sphere centered on the glyph. Each creature in the area makes a Dexterity saving throw. A creature takes 5d8 Acid, Cold, Fire, Lightning, or Thunder damage (your choice when you create the glyph) on a failed save or half as much damage on a successful one.\n  Spell Glyph. You can store a prepared spell of level 3 or lower in the glyph by casting it as part of creating the glyph. The spell must target a single creature or an area. The spell being stored has no immediate effect when cast in this way.\n  When the glyph is triggered, the stored spell takes effect. If the spell has a target, it targets the creature that triggered the glyph. If the spell affects an area, the area is centered on that creature. If the spell summons Hostile creatures or creates harmful objects or traps, they appear as close as possible to the intruder and attack it. If the spell requires Concentration, it lasts until the end of its full duration.\n\nHöherer Grad: The damage of an explosive rune increases by 1d8 for each spell slot level above 3. If you create a spell glyph, you can store any spell of up to the same level as the spell slot you use for the Glyph of Warding.", ["Bard", "Cleric", "Wizard"]], ["Haste", 3, "Transmutation", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a shaving of licorice root)", "", "", "", "Choose a willing creature that you can see within range. Until the spell ends, the target's Speed is doubled, it gains a +2 bonus to Armor Class, it has Advantage on Dexterity saving throws, and it gains an additional action on each of its turns. That action can be used to take only the Attack (one attack only), Dash, Disengage, Hide, or Utilize action.\n  When the spell ends, the target is Incapacitated and has a Speed of 0 until the end of its next turn, as a wave of lethargy washes over it.", ["Sorcerer", "Wizard"]], ["Hypnotic Pattern", 3, "Illusion", "Action", "120 feet", "up to 1 minute (Concentration)", "S, M (a pinch of confetti)", "", "", "", "You create a twisting pattern of colors in a 30-foot Cube within range. The pattern appears for a moment and vanishes. Each creature in the area who can see the pattern must succeed on a Wisdom saving throw or have the Charmed condition for the duration. While Charmed, the creature has the Incapacitated condition and a Speed of 0.\n  The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Lightning Bolt", 3, "Evocation", "Action", "Self", "Instantaneous", "V, S, M (a bit of fur and a crystal rod)", "8d6", "Lightning", "", "A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 3.", ["Sorcerer", "Wizard"]], ["Magic Circle", 3, "Abjuration", "1 minute", "10 feet", "1 hour", "V, S, M (salt and powdered silver worth 100+ GP, which the spell consumes)", "", "", "", "You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the Cylinder intersects with the floor or other surface.\n  Choose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways: • The creature can't willingly enter the Cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw. • The creature has Disadvantage on attack rolls against targets within the Cylinder. • Targets within the Cylinder can't be possessed by or gain the Charmed or Frightened condition from the creature.\n  Each time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the Cylinder and protecting targets outside it.\n\nHöherer Grad: The duration increases by 1 hour for each spell slot level above 3.", ["Cleric", "Paladin", "Warlock", "Wizard"]], ["Major Image", 3, "Illusion", "Action", "120 feet", "up to 10 minutes (Concentration)", "V, S, M (a bit of fleece)", "", "", "", "You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot Cube. The image appears at a spot that you can see within range and lasts for the duration. It seems real, including sounds, smells, and temperature appropriate to the thing depicted, but it can't deal damage or cause conditions.\n  If you are within range of the illusion, you can take a Magic action to cause the image to move to any other spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Similarly, you can cause the illusion to make different sounds at different times, even making it carry on a conversation, for example.\n  Physical interaction with the image reveals it to be an illusion, for things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and its other sensory qualities become faint to the creature.\n\nHöherer Grad: The spell lasts until dispelled, without requiring Concentration, if cast with a level 4+ spell slot.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Mass Healing Word", 3, "Abjuration", "Bonus Action", "60 feet", "Instantaneous", "V", "", "", "", "Up to six creatures of your choice that you can see within range regain Hit Points equal to 2d4 plus your spellcasting ability modifier.\n\nHöherer Grad: The healing increases by 1d4 for each spell slot level above 3.", ["Bard", "Cleric"]], ["Meld into Stone", 3, "Transmutation", "Action", "Touch", "8 hours", "V, S", "6d6", "Force", "", "You step into a stone object or surface large enough to fully contain your body, merging yourself and your equipment with the stone for the duration. You must touch the stone to do so. Nothing of your presence remains visible or otherwise detectable by nonmagical senses.\n  While merged with the stone, you can't see what occurs outside it, and any Wisdom (Perception) checks you make to hear sounds outside it are made with Disadvantage. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use 5 feet of movement to leave the stone where you entered it, which ends the spell. You otherwise can't move.\n  Minor physical damage to the stone doesn't harm you, but its partial destruction or a change in its shape (to the extent that you no longer fit within it) expels you and deals 6d6 Force damage to you. The stone's complete destruction (or transmutation into a different substance) expels you and deals 50 Force damage to you. If expelled, you move into an unoccupied space closest to where you first entered and have the Prone condition.", ["Cleric", "Druid", "Ranger"]], ["Nondetection", 3, "Abjuration", "Action", "Touch", "8 hours", "V, S, M (a pinch of diamond dust worth, 25+ GP, which the spell consumes)", "", "", "", "For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any Divination spell or perceived through magical scrying sensors.", ["Bard", "Ranger", "Wizard"]], ["Phantom Steed", 3, "Illusion", "1 minute", "30 feet", "1 hour", "V, S", "", "", "", "A Large, quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, and it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed.\n  For the duration, you or a creature you choose can ride the steed. The steed uses the Riding Horse stat block (see \"Monsters\"), except it has a Speed of 100 feet and can travel 13 miles in an hour. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends early if the steed takes any damage.", ["Wizard"]], ["Plant Growth", 3, "Transmutation", "Action (Overgrowth) or 8 hours (Enrichment)", "150 feet", "Instantaneous", "V, S", "", "", "", " This spell channels vitality into plants. The casting time you use determines whether the spell has the Overgrowth or the Enrichment effect below.\n  Overgrowth. Choose a point within range. All normal plants in a 100-foot-radius Sphere centered on that point become thick and overgrown. A creature moving through that area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell's area from being affected.\n  Enrichment. All plants in a half-mile radius centered on a point within range become enriched for 365 days. The plants yield twice the normal amount of food when harvested. They can benefit from only one Plant Growth per year.", ["Bard", "Druid", "Ranger"]], ["Protection from Energy", 3, "Abjuration", "Action", "Touch", "up to 1 hour (Concentration)", "V, S", "", "", "", "For the duration, the willing creature you touch has Resistance to one damage type of your choice: Acid, Cold, Fire, Lightning, or Thunder.", ["Cleric", "Druid", "Ranger", "Sorcerer", "Wizard"]], ["Remove Curse", 3, "Abjuration", "Action", "Touch", "Instantaneous", "V, S", "", "", "", "At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's Attunement to the object so it can be removed or discarded.", ["Cleric", "Paladin", "Warlock", "Wizard"]], ["Revivify", 3, "Necromancy", "Action", "Touch", "Instantaneous", "V, S, M (a diamond worth 300+ GP, which the spell consumes)", "", "", "", "You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can't revive a creature that has died of old age, nor does it restore any missing body parts.", ["Cleric", "Druid", "Paladin", "Ranger"]], ["Sending", 3, "Divination", "Action", "Unlimited", "Instantaneous", "V, S, M (a copper wire)", "", "", "", "You send a short message of 25 words or fewer to a creature you have met or a creature described to you by someone who has met it. The target hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables targets to understand the meaning of your message.\n  You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn't arrive. You know if the delivery fails.\n  Upon receiving your message, a creature can block your ability to reach it again with this spell for 8 hours. If you try to send another message during that time, you learn that you are blocked, and the spell fails.", ["Bard", "Cleric", "Wizard"]], ["Sleet Storm", 3, "Conjuration", "Action", "150 feet", "up to 1 minute (Concentration)", "V, S, M (a miniature umbrella)", "", "", "", "Until the spell ends, sleet falls in a 40-foot-tall, 20-foot-radius Cylinder centered on a point you choose within range. The area is Heavily Obscured, and exposed flames in the area are doused.\n  Ground in the Cylinder is Difficult Terrain. When a creature enters the Cylinder for the first time on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Prone condition and lose Concentration.", ["Druid", "Sorcerer", "Wizard"]], ["Slow", 3, "Transmutation", "Action", "120 feet", "up to 1 minute (Concentration)", "V, S, M (a drop of molasses)", "", "", "", "You alter time around up to six creatures of your choice in a 40-foot Cube within range. Each target must succeed on a Wisdom saving throw or be affected by this spell for the duration.\n  An affected target's Speed is halved, it takes a -2 penalty to AC and Dexterity saving throws, and it can't take Reactions. On its turns, it can take either an action or a Bonus Action, not both, and it can make only one attack if it takes the Attack action. If it casts a spell with a Somatic component, there is a 25 percent chance the spell fails as a result of the target making the spell's gestures too slowly.\n  An affected target repeats the save at the end of each of its turns, ending the spell on itself on a success.", ["Bard", "Sorcerer", "Wizard"]], ["Speak with Dead", 3, "Necromancy", "Action", "10 feet", "10 minutes", "V, S, M (burning incense)", "", "", "", "You grant the semblance of life to a corpse of your choice within range, allowing it to answer questions you pose. The corpse must have a mouth, and this spell fails if the deceased creature was Undead when it died. The spell also fails if the corpse was the target of this spell within the past 10 days.\n  Until the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are antagonistic toward it or it recognizes you as an enemy. This spell doesn't return the creature's soul to its body, only its animating spirit. Thus, the corpse can't learn new information, doesn't comprehend anything that has happened since it died, and can't speculate about future events.", ["Bard", "Cleric", "Wizard"]], ["Speak with Plants", 3, "Transmutation", "Action", "Self", "10 minutes", "V, S", "", "", "", "You imbue plants in an immobile 30-foot Emanation with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances.\n  You can also turn Difficult Terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into Difficult Terrain that lasts for the duration.\n  The spell doesn't enable plants to uproot themselves and move about, but they can move their branches, tendrils, and stalks for you.\n  If a Plant creature is in the area, you can communicate with it as if you shared a common language.", ["Bard", "Druid", "Ranger"]], ["Spirit Guardians", 3, "Conjuration", "Action", "Self", "up to 10 minutes (Concentration)", "V, S, M (a prayer scroll)", "3d8", "Radiant", "", "Protective spirits flit around you in a 15-foot Emanation for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish.\n  When you cast this spell, you can designate creatures to be unaffected by it. Any other creature's Speed is halved in the Emanation, and whenever the Emanation enters a creature's space and whenever a creature enters the Emanation or ends its turn there, the creature must make a Wisdom saving throw. On a failed save, the creature takes 3d8 Radiant damage (if you are good or neutral) or 3d8 Necrotic damage (if you are evil). On a successful save, the creature takes half as much damage. A creature makes this save only once per turn.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 3.", ["Cleric"]], ["Stinking Cloud", 3, "Conjuration", "Action", "90 feet", "up to 1 minute (Concentration)", "V, S, M (a rotten egg)", "", "", "", "You create a 20-foot-radius Sphere of yellow, nauseating gas centered on a point within range. The cloud is Heavily Obscured. The cloud lingers in the air for the duration or until a strong wind (such as the one created by Gust of Wind) disperses it.\n   Each creature that starts its turn in the Sphere must succeed on a Constitution saving throw or have the Poisoned condition until the end of the current turn. While Poisoned in this way, the creature can't take an action or a Bonus Action.", ["Bard", "Sorcerer", "Wizard"]], ["Tiny Hut", 3, "Evocation", "1 minute", "Self", "8 hours", "V, S, M (a crystal bead)", "", "", "", "A 10-foot Emanation springs into existence around you and remains stationary for the duration. The spell fails when you cast it if the Emanation isn't big enough to fully encapsulate all creatures in its area.\n  Creatures and objects within the Emanation when you cast the spell can move through it freely. All other creatures and objects are barred from passing through it. Spells of level 3 or lower can't be cast through it, and the effects of such spells can't extend into it.\n  The atmosphere inside the Emanation is comfortable and dry, regardless of the weather outside. Until the spell ends, you can command the interior to have Dim Light or Darkness (no action required). The Emanation is opaque from the outside and of any color you choose, but it's transparent from the inside.\n  The spell ends early if you leave the Emanation or if you cast it again.", ["Bard", "Wizard"]], ["Tongues", 3, "Divination", "Action", "Touch", "1 hour", "V, M (a miniature ziggurat)", "", "", "", "This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.", ["Bard", "Cleric", "Sorcerer", "Warlock", "Wizard"]], ["Vampiric Touch", 3, "Necromancy", "Action", "Self", "up to 1 minute (Concentration)", "V, S", "3d6", "Necrotic", "melee", "The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against one creature within reach. On a hit, the target takes 3d6 Necrotic damage, and you regain Hit Points equal to half the amount of Necrotic damage dealt.\n  Until the spell ends, you can make the attack again on each of your turns as a Magic action, targeting the same creature or a different one.\n\nHöherer Grad: The damage increases by 1d6 for each spell slot level above 3.", ["Sorcerer", "Warlock", "Wizard"]], ["Water Breathing", 3, "Transmutation", "Action", "30 feet", "24 hours", "V, S, M (a short reed)", "", "", "", "This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.", ["Druid", "Ranger", "Sorcerer", "Wizard"]], ["Water Walk", 3, "Transmutation", "Action", "30 feet", "1 hour", "V, S, M (a piece of cork)", "", "", "", "This spell grants the ability to move across any liquid surface-such as water, acid, mud, snow, quicksand, or lava-as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures of your choice within range gain this ability for the duration.\n  An affected target must take a Bonus Action to pass from the liquid's surface into the liquid itself and vice versa, but if the target falls into the liquid, the target passes through the surface into the liquid below.", ["Cleric", "Druid", "Ranger", "Sorcerer"]], ["Wind Wall", 3, "Evocation", "Action", "120 feet", "up to 1 minute (Concentration)", "V, S, M (a fan and a feather)", "4d8", "Bludgeoning", "", "A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration.\n  When the wall appears, each creature in its area makes a Strength saving throw, taking 4d8 Bludgeoning damage on a failed save or half as much damage on a successful one.\n  The strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can't pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts, and other ordinary projectiles launched at targets behind the wall are deflected upward and miss automatically. Boulders hurled by Giants or siege engines, and similar projectiles, are unaffected. Creatures in gaseous form can't pass through it.", ["Druid", "Ranger"]], ["Arcane Eye", 4, "Divination", "Action", "30 feet", "up to 1 hour (Concentration)", "V, S, M (a bit of bat fur)", "", "", "", "You create an Invisible, invulnerable eye within range that hovers for the duration. You mentally receive visual information from the eye, which can see in every direction. It also has Darkvision with a range of 30 feet.\n  As a Bonus Action, you can move the eye up to 30 feet in any direction. A solid barrier blocks the eye's movement, but the eye can pass through an opening as small as 1 inch in diameter.", ["Wizard"]], ["Aura of Life", 4, "Abjuration", "Action", "Self", "up to 10 minutes (Concentration)", "V", "", "", "", "An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Necrotic damage, and your Hit Point maximums can't be reduced. If an ally with 0 Hit Points starts its turn in the aura, that ally regains 1 Hit Point.", ["Cleric", "Paladin"]], ["Banishment", 4, "Abjuration", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S, M (a pentacle)", "", "", "", "One creature that you can see within range must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the Incapacitated condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied.\n  If the target is an Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target doesn't return if the spell lasts for 1 minute. The target is instead transported to a random location on a plane (GM's choice) associated with its creature type.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 4.", ["Cleric", "Paladin", "Sorcerer", "Warlock", "Wizard"]], ["Black Tentacles", 4, "Conjuration", "Action", "90 feet", "up to 1 minute (Concentration)", "V, S, M (a tentacle)", "3d6", "Bludgeoning", "", "Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in that area into Difficult Terrain.\n  Each creature in that area makes a Strength saving throw. On a failed save, it takes 3d6 Bludgeoning damage, and it has the Restrained condition until the spell ends. A creature also makes that save if it enters the area or ends it turn there. A creature makes that save only once per turn.\n  A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC, ending the condition on itself on a success.", ["Wizard"]], ["Blight", 4, "Necromancy", "Action", "30 feet", "Instantaneous", "V, S", "8d8", "Necrotic", "", "A creature that you can see within range makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one. A Plant creature automatically fails the save.\n  Alternatively, target a nonmagical plant that isn't a creature, such as a tree or shrub. It doesn't make a save; it simply withers and dies.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 4.", ["Druid", "Sorcerer", "Warlock", "Wizard"]], ["Charm Monster", 4, "Enchantment", "Action", "30 feet", "1 hour", "V, S", "", "", "", " One creature you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 4.", ["Bard", "Druid", "Sorcerer", "Warlock", "Wizard"]], ["Compulsion", 4, "Enchantment", "Action", "30 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "Each creature of your choice that you can see within range must succeed on a Wisdom saving throw or have the Charmed condition until the spell ends.\n  For the duration, you can take a Bonus Action to designate a direction that is horizontal to you. Each Charmed target must use as much of its movement as possible to move in that direction on its next turn, taking the safest route. After moving in this way, a target repeats the save, ending the spell on itself on a success.", ["Bard"]], ["Confusion", 4, "Enchantment", "Action", "90 feet", "up to 1 minute (Concentration)", "V, S, M (three nut shells)", "", "", "", "Each creature in a 10-foot-radius Sphere centered on a point you choose within range must succeed on a Wisdom saving throw, or that target can't take Bonus Actions or Reactions and must roll 1d10 at the start of each of its turns to determine its behavior for that turn, consulting the table below. 1d10 Behavior for the Turn 2-6    The target doesn't move or take actions. 9-10  The target chooses its behavior.\n  At the end of each of its turns, an affected target repeats the save, ending the spell on itself on a success.\n\nHöherer Grad: The Sphere's radius increases by 5 feet for each spell slot level above 4.", ["Bard", "Druid", "Sorcerer", "Wizard"]], ["Conjure Minor Elementals", 4, "Conjuration", "Action", "Self", "up to 10 minutes (Concentration)", "V, S", "", "", "", "You conjure spirits from the Elemental Planes that flit around you in a 15-foot Emanation for the duration. Until the spell ends, any attack you make deals an extra 2d8 damage when you hit a creature in the Emanation. This damage is Acid, Cold, Fire, or Lightning (your choice when you make the attack).\n  In addition, the ground in the Emanation is Difficult Terrain for your enemies.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 4.", ["Druid", "Wizard"]], ["Conjure Woodland Beings", 4, "Conjuration", "Action", "Self", "up to 10 minutes (Concentration)", "V, S", "5d8", "Force", "", "You conjure nature spirits that flit around you in a 10-foot Emanation for the duration. Whenever the Emanation enters the space of a creature you can see and whenever a creature you can see enters the Emanation or ends its turn there, you can force that creature to make a Wisdom saving throw. The creature takes 5d8 Force damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn.\n  In addition, you can take the Disengage action as a Bonus Action for the spell's duration.\n\nHöherer Grad: The damage increases by 1d8 for each spell slot level above 4.", ["Druid", "Ranger"]], ["Control Water", 4, "Transmutation", "Action", "300 feet", "up to 10 minutes (Concentration)", "V, S, M (a mixture of water and dust)", "2d8", "Bludgeoning", "", "Until the spell ends, you control any water inside an area you choose that is a Cube up to 100 feet on a side, using one of the following effects. As a Magic action on your later turns, you can repeat the same effect or choose a different one.\n  Flood. You cause the water level of all standing water in the area to rise by as much as 20 feet. If you choose an area in a large body of water, you instead create a 20-foot tall wave that travels from one side of the area to the other and then crashes. Any Huge or smaller vehicles in the wave's path are carried with it to the other side. Any Huge or smaller vehicles struck by the wave have a 25 percent chance of capsizing.\n  The water level remains elevated until the spell ends or you choose a different effect. If this effect produced a wave, the wave repeats on the start of your next turn while the flood effect lasts.\n  Part Water. You part water in the area and create a trench. The trench extends across the spell's area, and the separated water forms a wall to either side. The trench remains until the spell ends or you choose a different effect. The water then slowly fills in the trench over the course of the next round until the normal water level is restored. conditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal.\n  When you change the weather conditions, find a current condition on the following tables and change its stage by one, up or down. When changing the wind, you can change its direction. Precipitation Stage | Condition\n1 | Clear | 2 | Light clouds\n3 | Overcast or ground fog | 4 | Rain, hail, or snow\n5 | Torrential rain, driving hail, or blizzard    \n  Redirect Flow. You cause flowing water in the area to move in a direction you choose, even if the water has to flow over obstacles, up walls, or in other unlikely directions. The water in the area moves as you direct it, but once it moves beyond the spell's area, it resumes its flow based on the terrain. The water continues to move in the direction you chose until the spell ends or you choose a different effect.\n  Whirlpool. You cause a whirlpool to form in the center of the area, which must be at least 50 feet. Temperature Stage | Condition\n1 | Heat wave | 2 | Hot\n3 | Warm | 4 | Cool\n5 | Cold | 6 | Freezing Counterspell Wind Stage Condition\n10 | Calm | 2 | Moderate wind\n3 | Strong wind | 4 | Gale\n5 | Storm    square and 25 feet deep. The whirlpool lasts until you choose a different effect or the spell ends. The whirlpool is 5 feet wide at the base, up to 50 feet wide at the top, and 25 feet tall. Any creature in the water and within 25 feet of the whirlpool is pulled 10 feet toward it. When a creature enters the whirl- pool for the first time on a turn or ends its turn there, it makes a Strength saving throw. On a failed save, the creature takes 2d8 Bludgeoning damage. On a successful save, the creature takes half as much damage. A creature can swim away from the whirlpool only if it first takes an action to pull away and succeeds on a Strength (Athletics) check against your spell save DC.", ["Cleric", "Druid", "Wizard"]], ["Death Ward", 4, "Abjuration", "Action", "Touch", "8 hours", "V, S", "", "", "", "You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 Hit Points before the spell ends, the target instead drops to 1 Hit Point, and the spell ends.\n  If the spell is still in effect when the target is subjected to an effect that would kill it instantly without dealing damage, that effect is negated against the target, and the spell ends.", ["Cleric", "Paladin"]], ["Dimension Door", 4, "Conjuration", "Action", "500 feet", "Instantaneous", "V", "4d6", "Force", "", "You teleport to a location within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as \"200 feet straight downward\" or \"300 feet upward to the northwest at a 45-degree angle.\"\n  You can also teleport one willing creature. The creature must be within 5 feet of you when you teleport, and it teleports to a space within 5 feet of your destination space.\n  If you, the other creature, or both would arrive in a space occupied by a creature or completely filled by one or more objects, you and any creature traveling with you each take 4d6 Force damage, and the teleportation fails.", ["Bard", "Sorcerer", "Warlock", "Wizard"]], ["Divination", 4, "Divination", "Action", "Self", "Instantaneous", "V, S, M (incense worth 25+ GP, which the, spell consumes)", "", "", "", "This spell puts you in contact with a god or a god's servants. You ask one question about a specific goal, event, or activity to occur within 7 days. The GM offers a truthful reply, which might be a short phrase or cryptic rhyme. The spell doesn't account for circumstances that might change the answer, such as the casting of other spells.\n  If you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.", ["Cleric", "Druid", "Wizard"]], ["Dominate Beast", 4, "Enchantment", "Action", "60 feet", "up to 1 minute (Concentration)", "V, S", "", "", "", "One Beast you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success.\n  You have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as \"Attack that creature,\" \"Move over there,\" or \"Fetch that object.\" The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself.\n  You can command the target to take a Reaction but must take your own Reaction to do so.\n\nHöherer Grad: Your Concentration can last longer with a spell slot of level 5 (up to 10 minutes), 6 (up to 1 hour), or 7+ (up to 8 hours).", ["Druid", "Ranger", "Sorcerer"]], ["Fabricate", 4, "Transmutation", "10 minutes", "120 feet", "Instantaneous", "V, S", "", "", "", "You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, or clothes from flax or wool.\n  Choose raw materials that you can see within range. You can fabricate a Large or smaller object (contained within a 10-foot Cube or eight connected 5-foot Cubes) given a sufficient quantity of material. If you're working with metal, stone, or another mineral substance, however, the fabricated object can be no larger than Medium (contained within a 5-foot Cube). The quality of any fabricated objects is based on the quality of the raw materials.\n   Creatures and magic items can't be created by this spell. You also can't use it to create items that require a high degree of skill-such as weapons and armor-unless you have proficiency with the type of Artisan's Tools used to craft such objects.", ["Wizard"]], ["Faithful Hound", 4, "Conjuration", "Action", "30 feet", "8 hours", "V, S, M (a silver whistle)", "4d8", "Force", "", "You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other.\n  No one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has Truesight with a range of 30 feet.\n  At the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage.\n  On your later turns, you can take a Magic action to move the hound up to 30 feet.", ["Wizard"]], ["Fire Shield", 4, "Evocation", "Action", "Self", "10 minutes", "V, S, M (a bit of phosphorus or a firefly)", "2d8", "Fire", "", "Wispy flames wreathe your body for the duration, shedding Bright Light in a 10-foot radius and Dim Light for an additional 10 feet.\n  The flames provide you with a warm shield or a chill shield, as you choose. The warm shield grants you Resistance to Cold damage, and the chill shield grants you Resistance to Fire damage.\n  In addition, whenever a creature within 5 feet of you hits you with a melee attack roll, the shield erupts with flame. The attacker takes 2d8 Fire damage from a warm shield or 2d8 Cold damage from a chill shield.", ["Druid", "Sorcerer", "Wizard"]], ["Freedom of Movement", 4, "Abjuration", "Action", "Touch", "1 hour", "V, S, M (a leather strap)", "", "", "", "You touch a willing creature. For the duration, the target's movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target's Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed. In addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it.\n\nHöherer Grad: You can target one additional creature for each spell slot level above 4.", ["Bard", "Cleric", "Druid", "Ranger"]], ["Giant Insect", 4, "Conjuration", "Action", "60 feet", "up to 10 minutes (Concentration)", "V, S", "", "", "", "You summon a giant centipede, spider, or wasp (chosen when you cast the spell). It manifests in an unoccupied space you can see within range and uses the Giant Insect stat block. The form you choose determines certain details in its stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends.\n  The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.\n\nHöherer Grad: Use the spell slot's level for the spell's level in the stat block. Large Beast, Unaligned AC 11 + the spell's level HP 30 + 10 for each spell level above 4 Speed 40 ft., Climb 40 ft., Fly 40 ft. (Wasp only) MOD SAVE    MOD SAVE    MOD SAVE Str 17 +3 +3 dex 13 +1 +1 con 15 +2 +2 int 4 -3 -3 WiS 14 +2 +2 chA 3 -4 -4 Senses Darkvision 60 ft.; Passive Perception 12 Languages Understands the languages you know CR None (XP 0; PB equals your Proficiency Bonus) Traits     Spider Climb. The insect can climb difficult surfaces, including along ceilings, without needing to make an ability check. Actions     Multiattack. The insect makes a number of attacks equal to half this spell's level (round down). Poison Jab. Melee Attack Roll: Bonus equals your spell attack modifier, reach 10 ft. Hit: 1d6 + 3 plus the spell's level Piercing damage plus 1d4 Poison damage. Web Bolt (Spider Only). Ranged Attack Roll: Bonus equals your spell attack modifier, range 60 ft. Hit: 1d10 + 3 plus the spell's level Bludgeoning damage, and the target's Speed is reduced to 0 until the start of the insect's next turn. Bonus Actions     Venomous Spew (Centipede Only). Constitution Saving Throw: Your spell save DC, one creature the insect can see within 10 feet. Failure: The target has the Poisoned condition until the start of the insect's next turn.", ["Druid"]], ["Greater Invisibility", 4, "Illusion", "Action", "Touch", "up to 1 minute (Concentration)", "V, S", "", "", "", " A creature you touch has the Invisible condition until the spell ends.", ["Bard", "Sorcerer", "Wizard"]], ["Guardian of Faith", 4, "Conjuration", "Action", "30 feet", "8 hours", "V", "", "", "", "A Large spectral guardian appears and hovers for the duration in an unoccupied space that you can see within range. The guardian occupies that space and is invulnerable, and it appears in a form appropriate for your deity or pantheon.\n  Any enemy that moves to a space within 10 feet of the guardian for the first time on a turn or starts its turn there makes a Dexterity saving throw, taking 20 Radiant damage on a failed save or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.", ["Cleric"]], ["Hallucinatory Terrain", 4, "Illusion", "10 minutes", "300 feet", "24 hours", "V, S, M (a mushroom)", "", "", "", "You make natural terrain in a 150-foot Cube in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed.\n  The tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn't obvious by touch, a creature examining the illusion can take the Study action to make an Intelligence (Investigation) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.", ["Bard", "Druid", "Warlock", "Wizard"]], ["Ice Storm", 4, "Evocation", "Action", "300 feet", "Instantaneous", "V, S, M (a mitten)", "2d10", "Bludgeoning", "", "Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a point within range. Each creature in the Cylinder makes a Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one.\n  Hailstones turn ground in the Cylinder into Difficult Terrain until the end of your next turn.\n\nHöherer Grad: The Bludgeoning damage increases by 1d10 for each spell slot level above 4.", ["Druid", "Sorcerer", "Wizard"]], ["Locate Creature", 4, "Divination", "Action", "Self", "up to 1 hour (Concentration)", "V, S, M (fur from a bloodhound)", "", "", "", "Describe or name a creature that is familiar to you. You sense the direction to the creature's location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement.\n  The spell can locate a specific creature known to you or the nearest creature of a sp
